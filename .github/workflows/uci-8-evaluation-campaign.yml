name: UCI-8 Evaluation Campaign

on:
  pull_request:
    branches:
      - feat/uci-7-agi-evidence-protocol-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uci8-red:
    name: uci8 / evaluation-campaign-red
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_PARENT_SHA: 1aa405975e2b3f3c1b1c0022a6b75e0b21d395ec
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact stacked lineage
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          if [[ -n "$PR_BASE_SHA" ]]; then
            test "$PR_BASE_SHA" = "$EXPECTED_PARENT_SHA"
          fi
          echo "UCI8_CANDIDATE_SHA=$actual"
          echo "UCI8_EXPECTED_PARENT_SHA=$EXPECTED_PARENT_SHA"
          echo "UCI8_EXACT_LINEAGE=PASS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5 jsonschema==4.23.0

      - name: Run preregistered UCI-8 behavioral falsifiers
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_evaluation_campaign.py -q | tee "$RUNNER_TEMP/uci8-behavior.log"
          grep -Eq '10 passed' "$RUNNER_TEMP/uci8-behavior.log"
          echo "UCI8_BEHAVIOR_10=PASS"

      - name: Run preregistered UCI-8 schema falsifiers
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_evaluation_campaign_schemas.py -q | tee "$RUNNER_TEMP/uci8-schema.log"
          grep -Eq '2 passed' "$RUNNER_TEMP/uci8-schema.log"
          echo "UCI8_SCHEMA_2=PASS"

      - name: Validate repetition manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_repetition_manifest.py -q | tee "$RUNNER_TEMP/uci8-repetition.log"

      - name: Validate checker issuance provenance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_checker_provenance.py -q | tee "$RUNNER_TEMP/uci8-checker-provenance.log"

      - name: Validate portable checker HMAC replay
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_portable_checker_attestation.py -q | tee "$RUNNER_TEMP/uci8-portable-checker.log"

      - name: Validate portable checker serialization boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_portable_attestation_schemas.py -q | tee "$RUNNER_TEMP/uci8-portable-schema.log"

      - name: Validate baseline selection integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_baseline_selection_integrity.py -q | tee "$RUNNER_TEMP/uci8-baseline-selection.log"

      - name: Validate published metric comparability
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_published_comparability.py -q | tee "$RUNNER_TEMP/uci8-published-comparability.log"

      - name: Validate descriptive measurement resolution
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_measurement_resolution.py -q | tee "$RUNNER_TEMP/uci8-measurement-resolution.log"

      - name: Validate measurement resolution serialization
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_measurement_resolution_schema.py -q | tee "$RUNNER_TEMP/uci8-measurement-resolution-schema.log"

      - name: Enforce measurement resolution gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '4 passed' "$RUNNER_TEMP/uci8-measurement-resolution.log"
          grep -Eq '1 passed' "$RUNNER_TEMP/uci8-measurement-resolution-schema.log"
          echo "UCI8_MEASUREMENT_RESOLUTION_5=PASS"

      - name: Validate bundle replay promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_bundle_replay_promotion.py -q | tee "$RUNNER_TEMP/uci8-bundle-replay.log"

      - name: Write RED witness
        if: always()
        shell: bash
        run: |
          {
            echo "schema_version=AEGIS_UCI8_RED_WITNESS_V1"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "expected_parent_sha=$EXPECTED_PARENT_SHA"
            echo "authority=EVIDENCE_ONLY"
            echo "public_benchmark_campaign=NOT_RUN"
            echo "agi_claim=NOT_ESTABLISHED"
            echo "statistical_mode=PAIRED_DESCRIPTIVE_V1"
          } > "$RUNNER_TEMP/uci8-red-witness.txt"
          for path in \
            "$RUNNER_TEMP/uci8-behavior.log" \
            "$RUNNER_TEMP/uci8-schema.log" \
            "$RUNNER_TEMP/uci8-repetition.log" \
            "$RUNNER_TEMP/uci8-checker-provenance.log" \
            "$RUNNER_TEMP/uci8-portable-checker.log" \
            "$RUNNER_TEMP/uci8-portable-schema.log" \
            "$RUNNER_TEMP/uci8-baseline-selection.log" \
            "$RUNNER_TEMP/uci8-published-comparability.log" \
            "$RUNNER_TEMP/uci8-measurement-resolution.log" \
            "$RUNNER_TEMP/uci8-measurement-resolution-schema.log" \
            "$RUNNER_TEMP/uci8-bundle-replay.log"; do
            if [[ -f "$path" ]]; then cat "$path" >> "$RUNNER_TEMP/uci8-red-witness.txt"; fi
          done

      - name: Upload RED witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uci8-red-witness-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/uci8-red-witness.txt
            ${{ runner.temp }}/uci8-behavior.log
            ${{ runner.temp }}/uci8-schema.log
            ${{ runner.temp }}/uci8-repetition.log
            ${{ runner.temp }}/uci8-checker-provenance.log
            ${{ runner.temp }}/uci8-portable-checker.log
            ${{ runner.temp }}/uci8-portable-schema.log
            ${{ runner.temp }}/uci8-baseline-selection.log
            ${{ runner.temp }}/uci8-published-comparability.log
            ${{ runner.temp }}/uci8-measurement-resolution.log
            ${{ runner.temp }}/uci8-measurement-resolution-schema.log
            ${{ runner.temp }}/uci8-bundle-replay.log
          if-no-files-found: warn
