name: Verify OpenAI Ten Proofs

on:
  push:
    branches:
      - verify/openai-ten-proofs-2026-08-01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-openai-ten-proofs-2026-08-01-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lean build and independent kernel checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact OpenAI certificate commit
        uses: actions/checkout@v4
        with:
          repository: openai/ten-proofs
          ref: c510a55434c0935cde446e5a372699a4671438f6
          path: ten-proofs
          fetch-depth: 1

      - name: Bind source identity
        shell: bash
        run: |
          set -euo pipefail
          cd ten-proofs
          actual="$(git rev-parse HEAD)"
          expected="c510a55434c0935cde446e5a372699a4671438f6"
          test "$actual" = "$expected"
          printf 'repository=openai/ten-proofs\ncommit=%s\n' "$actual" | tee ../source-identity.txt
          sha256sum *.lean lean-toolchain lakefile.toml lake-manifest.json formalization.yaml | tee ../source-sha256.txt

      - name: Build all certificates with Lean kernel
        id: lean-build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ten-proofs
          auto-config: false
          build: true
          build-args: All
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Audit placeholder tokens in authoritative Lean sources
        id: placeholder-audit
        shell: bash
        run: |
          set -euo pipefail
          cd ten-proofs

          # The authoritative corpus is the repository's top-level Lean source set.
          # ComparatorChallenges intentionally contains incomplete challenge material,
          # while .lake contains third-party dependencies; neither is an authority
          # source for this exact-commit certificate.
          mapfile -d '' files < <(
            find . -maxdepth 1 -type f -name '*.lean' -print0 | sort -z
          )

          if (( ${#files[@]} == 0 )); then
            echo 'No authoritative Lean source files found.' >&2
            exit 1
          fi

          : > ../placeholder-audit.txt
          grep -HnE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            "${files[@]}" | tee ../placeholder-audit.txt || true

          sorry_count="$(
            (grep -Eho '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' "${files[@]}" || true) \
              | wc -l | tr -d ' '
          )"
          admit_count="$(
            (grep -Eho '(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)' "${files[@]}" || true) \
              | wc -l | tr -d ' '
          )"

          {
            echo 'scope=top-level-authoritative-lean-sources'
            echo "source_file_count=${#files[@]}"
            echo "sorry_count=${sorry_count}"
            echo "admit_count=${admit_count}"
          } | tee -a "$GITHUB_OUTPUT" ../placeholder-audit-summary.txt

          if (( sorry_count != 0 || admit_count != 0 )); then
            echo 'Forbidden placeholder proof token detected in authoritative sources.' >&2
            exit 1
          fi

      - name: Independent Lean environment replay and nanoda check
        id: independent-check
        if: ${{ always() && steps.lean-build.outcome == 'success' }}
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ten-proofs
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: Write verification receipt
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.lean-build.outcome }}
          AUDIT_OUTCOME: ${{ steps.placeholder-audit.outcome }}
          AUDIT_SCOPE: ${{ steps.placeholder-audit.outputs.scope }}
          SOURCE_FILE_COUNT: ${{ steps.placeholder-audit.outputs.source_file_count }}
          SORRY_COUNT: ${{ steps.placeholder-audit.outputs.sorry_count }}
          ADMIT_COUNT: ${{ steps.placeholder-audit.outputs.admit_count }}
          INDEPENDENT_OUTCOME: ${{ steps.independent-check.outcome }}
        run: |
          {
            echo 'verification_class=EXACT_COMMIT_LEAN_KERNEL_AND_INDEPENDENT_CHECK'
            echo 'source_repository=openai/ten-proofs'
            echo 'source_commit=c510a55434c0935cde446e5a372699a4671438f6'
            echo "lean_build_outcome=${BUILD_OUTCOME:-UNKNOWN}"
            echo "placeholder_audit_outcome=${AUDIT_OUTCOME:-UNKNOWN}"
            echo "placeholder_audit_scope=${AUDIT_SCOPE:-UNKNOWN}"
            echo "authoritative_source_file_count=${SOURCE_FILE_COUNT:-UNKNOWN}"
            echo "sorry_count=${SORRY_COUNT:-UNKNOWN}"
            echo "admit_count=${ADMIT_COUNT:-UNKNOWN}"
            echo "independent_checker_outcome=${INDEPENDENT_OUTCOME:-UNKNOWN}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "verification_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee verification-receipt.txt

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-ten-proofs-verification-receipt
          path: |
            source-identity.txt
            source-sha256.txt
            placeholder-audit.txt
            placeholder-audit-summary.txt
            verification-receipt.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce verification conjunction
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.lean-build.outcome }}
          AUDIT_OUTCOME: ${{ steps.placeholder-audit.outcome }}
          SORRY_COUNT: ${{ steps.placeholder-audit.outputs.sorry_count }}
          ADMIT_COUNT: ${{ steps.placeholder-audit.outputs.admit_count }}
          INDEPENDENT_OUTCOME: ${{ steps.independent-check.outcome }}
        run: |
          set -euo pipefail
          test "${BUILD_OUTCOME}" = 'success'
          test "${AUDIT_OUTCOME}" = 'success'
          test "${SORRY_COUNT}" = '0'
          test "${ADMIT_COUNT}" = '0'
          test "${INDEPENDENT_OUTCOME}" = 'success'
