name: AEGIS Scale OS Controls

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scale-os-controls:
    name: aegis / scale-os-controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact workflow parser
        run: pip install PyYAML==6.0.2

      - name: Prove grace-cycle control flow
        run: python sovereign-omega-v2/python/tests/test_grace_chain_repair.py

      - name: Validate OSV workflow startup contract
        run: python scripts/validate-osv-workflow.py --output "$RUNNER_TEMP/OSV_STARTUP_RECEIPT.json"

      - name: Upload OSV startup receipt
        uses: actions/upload-artifact@v4
        with:
          name: aegis-osv-startup-${{ github.sha }}
          path: ${{ runner.temp }}/OSV_STARTUP_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      # Offline evaluation code is tested only if the candidate actually carries
      # both UWP-09 files. No model API, secrets, or private holdout access.
      - name: Checkout exact UWP-09 candidate when present
        if: ${{ hashFiles('scripts/uwp09_crescendo_adapter.py') != '' && hashFiles('scripts/test_uwp09_crescendo_adapter.py') != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: uwp09-candidate
          persist-credentials: false

      - name: Run exact-head UWP-09 Crescendo synthetic negative tests
        if: ${{ hashFiles('scripts/uwp09_crescendo_adapter.py') != '' && hashFiles('scripts/test_uwp09_crescendo_adapter.py') != '' }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C uwp09-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -m unittest discover -s uwp09-candidate/scripts -p 'test_uwp09_crescendo_adapter.py' -v
          python3 -m unittest discover -s uwp09-candidate/scripts -p 'test_uwp_benchmark_manifest.py' -v

      - name: Run exact-head evolution evidence negative tests
        if: ${{ hashFiles('agents/tests/test_evolution_evidence_admission.py') != '' && hashFiles('scripts/uwp09_crescendo_adapter.py') != '' }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C uwp09-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -m unittest discover -s uwp09-candidate/agents/tests -p 'test_evolution_evidence_admission.py' -v
          (cd uwp09-candidate && python3 -m agents.evolution selftest)
