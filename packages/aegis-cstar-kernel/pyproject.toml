[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cstar-kernel"
version = "0.1.0"
description = "Finite-dimensional C*-algebra/sheaf coherence kernel derived from AEGIS CSTAR diagrams"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
