name: AEGIS Repo Snapshot Export

on:
  push:
    branches:
      - ops/repo-snapshot-export-v1

permissions:
  contents: read

jobs:
  export:
    name: exact-head git bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: d92c116eca2ba2bc7989f19cf1320d72f87d1e7e
    steps:
      - name: Checkout exact target with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Build verified Git bundle
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"

          out="$RUNNER_TEMP/aegis-repo-snapshot"
          mkdir -p "$out"

          git branch -f aegis-snapshot "$TARGET_SHA"
          git bundle create "$out/AEGIS-OMEGA.bundle" aegis-snapshot
          git bundle verify "$out/AEGIS-OMEGA.bundle"

          cat > "$out/SNAPSHOT.json" <<JSON
          {
            "schema_version": "1.0.0",
            "repository": "$GITHUB_REPOSITORY",
            "target_sha": "$TARGET_SHA",
            "bundle_ref": "refs/heads/aegis-snapshot"
          }
          JSON

          (
            cd "$out"
            sha256sum AEGIS-OMEGA.bundle SNAPSHOT.json > SHA256SUMS
          )

      - name: Upload exact-head repo snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-repo-snapshot-d92c116eca2ba2bc7989f19cf1320d72f87d1e7e
          path: ${{ runner.temp }}/aegis-repo-snapshot
          if-no-files-found: error
          retention-days: 1
