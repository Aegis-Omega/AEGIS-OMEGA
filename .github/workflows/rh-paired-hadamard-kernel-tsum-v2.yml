name: RH Paired Hadamard Kernel Tsum V2

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilPairedHadamardKernelTsumV2.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilPairedHadamardKernelTsumV2Spec.lean'
      - '.github/workflows/rh-paired-hadamard-kernel-tsum-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_519_SHA: 53bc21debc3a944489f890b9eceff94126c35ab7
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2
  PARENT_519_BLOB: 68cecb9909b9ca270a34803b0fcf7f4b1697ad75

jobs:
  paired-kernel-tsum:
    name: verify paired Hadamard kernel tsum at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact external proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false

      - name: Verify #519 ancestry, pin, and frozen parent theorem source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .aegis merge-base --is-ancestor "$BASE_519_SHA" "$SOURCE_SHA"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilPairedHadamardFixedLineV1.lean)" = "$PARENT_519_BLOB"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilFixedLineExplicitFormulaContractV2.lean)" = "45c80a60ab06688dbb25f5fb992dfc53b8d0843f"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/ZeroCountingMellinSummabilityV1.lean)" = "01509b3933039aa595c83f366bbe90a44f2a4d81"
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          rm -f lake-manifest.json

      - name: Install pinned elan and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update mathlib
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get
          lean --version

      - name: Apply audited three-line old-pin factorization compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Hadamard/General/Factorization.lean')
          text = p.read_text()
          replacements = [
              ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
               'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
              ('have hgz : g z = Q z := ite_eq_left rfl',
               'have hgz : g z = Q z := by simp [g]'),
              ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
               'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check -- Hadamard/General/Factorization.lean
          git diff -- Hadamard/General/Factorization.lean > hadamard-factorization-old-pin-compat.patch
          test "$(grep -c '^[-+].*ite_eq_' hadamard-factorization-old-pin-compat.patch)" = 3

      - name: Build exact providers plus declared compatibility derivative
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            Hadamard.OrderOne.LogDerivMultiplicity \
            Lc.LiCriterion.XiGrowth \
            Lc.LiCriterion.HadamardSummabilityBridge \
            Lc.LiCriterion.HadamardBridge

      - name: Compile inherited #488 through #519 DAG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          files=(
            WeilCriterionCompactSmoothV1
            ZeroCriticalStripV1
            ZeroHeightFiniteSumV1
            ZeroHeightLimitContractV1
            ZeroHeightSummabilityBridgeV1
            ZeroMajorantSummabilityV1
            ZeroHeightShellMassV1
            ZeroShellQuadraticBoundV1
            ZeroShellAnalyticSynthesisV1
            ZeroCountingBoundV1
            MellinDecayEstimateV1
            ZeroCountingMellinSummabilityV1
            WeilMellinInversionV1
            WeilPrimeLineIdentityV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilAutocorrelationPoleAggregationV1
            WeilPoleTermV1
            WeilFixedLineExplicitFormulaContractV2
            WeilPairedHadamardFixedLineV1
          )
          for f in "${files[@]}"; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          done

      - name: Compile paired-kernel tsum target when present
        shell: bash
        run: |
          set -euo pipefail
          f=WeilPairedHadamardKernelTsumV2
          if [[ -f ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" ]]; then
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          fi

      - name: Compile preregistered paired-kernel tsum spec
        shell: bash
        run: |
          set -euo pipefail
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilPairedHadamardKernelTsumV2Spec.lean .
          lake env lean WeilPairedHadamardKernelTsumV2Spec.lean 2>&1 | tee paired-kernel-tsum-spec.log

      - name: Audit theorem surface when GREEN
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > PairedKernelTsumAudit.lean <<'EOF'
          import WeilPairedHadamardKernelTsumV2
          #print axioms riemannXi_weighted_hadamard_term_summable_v2
          #print axioms riemannXi_paired_hadamard_kernel_summable_v2
          #print axioms riemannXi_paired_hadamard_kernel_tsum_v2
          EOF
          lake env lean PairedKernelTsumAudit.lean 2>&1 | tee paired-kernel-tsum-axioms.log
          ! grep -F 'sorryAx' paired-kernel-tsum-axioms.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-paired-kernel-tsum-v2-${{ env.SOURCE_SHA }}
          path: |
            *.log
            hadamard-factorization-old-pin-compat.patch
          if-no-files-found: warn
          retention-days: 30
