name: Weil Concrete Finite Semantics V2

on:
  pull_request:
    paths:
      - "tests/test_weil_concrete_finite_semantics_v2_contract.py"
      - "sovereign-omega-v2/formal/theories/Weil/ConcreteFiniteGuinandWeilSemanticsV1.v"
      - "sovereign-omega-v2/formal/theories/Weil/AnalyticDefinitions.v"
      - ".github/workflows/weil-concrete-finite-semantics-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-concrete-finite-semantics-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  red-contract:
    name: preregistered semantics contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Execute preregistered PR1 contract
        shell: bash
        run: python3 -m unittest -v tests/test_weil_concrete_finite_semantics_v2_contract.py
