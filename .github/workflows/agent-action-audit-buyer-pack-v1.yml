name: Agent Action Audit Buyer Pack V1

'on':
  pull_request:
    paths:
      - 'commercial/agent-action-audit-demo-v1/**'
      - '.github/workflows/agent-action-audit-buyer-pack-v1.yml'
  push:
    branches:
      - 'commercial/agent-action-audit-demo-v1'
    paths:
      - 'commercial/agent-action-audit-demo-v1/**'
      - '.github/workflows/agent-action-audit-buyer-pack-v1.yml'

permissions:
  contents: read

jobs:
  buyer-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Validate exact buyer pack
        run: node commercial/agent-action-audit-demo-v1/validate-buyer-pack.mjs
