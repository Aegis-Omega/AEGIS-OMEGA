name: SOTA Sovereign Lock Refresh

on:
  push:
    branches:
      - refactor/sota-foundation-v1
    paths:
      - 'sovereign-omega-v2/package.json'
      - 'sovereign-omega-v2/eslint.config.js'
      - '.github/workflows/sota-sovereign-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Regenerate canonical npm lock
        working-directory: sovereign-omega-v2
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify regenerated graph installs and lints
        working-directory: sovereign-omega-v2
        run: |
          npm ci --ignore-scripts
          npm run lint

      - name: Upload regenerated lock only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-npm11-lock-${{ github.sha }}
          path: sovereign-omega-v2/package-lock.json
          if-no-files-found: error

      - name: Publish exact regenerated lock as GitHub-signed data commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: refactor/sota-foundation-v1
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const token = process.env.GH_TOKEN
          const repo = process.env.GITHUB_REPOSITORY
          const branch = process.env.TARGET_BRANCH
          const expected = process.env.EXPECTED_HEAD
          const lock = fs.readFileSync('sovereign-omega-v2/package-lock.json')
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`
          const variables = {
            input: {
              branch: { repositoryNameWithOwner: repo, branchName: branch },
              expectedHeadOid: expected,
              message: { headline: 'chore(sovereign): bind canonical npm 11 lock' },
              fileChanges: {
                additions: [{
                  path: 'sovereign-omega-v2/package-lock.json',
                  contents: lock.toString('base64'),
                }],
              },
            },
          }
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-sota-sovereign-lock-publisher-v1',
            },
            body: JSON.stringify({ query, variables }),
          })
          const body = await response.json()
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body))
            process.exit(1)
          }
          console.log(`SIGNED_LOCK_COMMIT=${body.data.createCommitOnBranch.commit.oid}`)
          NODE
