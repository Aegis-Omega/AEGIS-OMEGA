name: AEGIS Live State Truthfulness

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/python/bridge.py'
      - 'sovereign-omega-v2/python/tests/test_live_state_truthfulness.py'
      - '.github/workflows/live-state-truthfulness.yml'

permissions:
  contents: read

jobs:
  live-state-truthfulness:
    name: Live State Truthfulness [T1]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run live-state truthfulness contract
        run: python sovereign-omega-v2/python/tests/test_live_state_truthfulness.py
