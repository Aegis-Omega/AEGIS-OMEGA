name: QForm Proof-Carrying Bridge

on:
  pull_request:
    branches: [proof/weil-o0-globalization-v1]
    paths:
      - 'harness/sdk/qform_receipt.py'
      - 'sovereign-omega-v2/python/tests/test_qform_receipt.py'
      - 'research/qform/**'
      - '.github/workflows/qform-proof-carrying.yml'
  push:
    branches: [feat/qform-proof-carrying-v1]
    paths:
      - 'harness/sdk/qform_receipt.py'
      - 'sovereign-omega-v2/python/tests/test_qform_receipt.py'
      - 'research/qform/**'
      - '.github/workflows/qform-proof-carrying.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qform:
    name: Exact-head finite Q-form receipt
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "EXACT_HEAD_MISMATCH expected=$EXPECTED_SHA actual=$actual" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded verification dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 python-flint==0.8.0 jsonschema==4.25.1

      - name: Compile Q-form bridge
        run: |
          python -m py_compile harness/sdk/qform_receipt.py
          python -m py_compile sovereign-omega-v2/python/tests/test_qform_receipt.py

      - name: Run Q-form receipt tests
        run: python -m pytest -q sovereign-omega-v2/python/tests/test_qform_receipt.py

      - name: Generate exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qform-receipt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from harness.sdk.qform_receipt import QFormSpecV1, build_qform_receipt

          receipt = build_qform_receipt(
              QFormSpecV1(
                  P_cutoff=65010,
                  sigma='0.8',
                  du='0.005',
                  U_max='8.0',
                  prec_bits=256,
              ),
              gamma_fixture='14.134725',
              epsilon='1e-11',
          ).to_dict()
          target = Path(os.environ['RUNNER_TEMP']) / 'qform-receipt' / 'QFormReceiptV1.json'
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))
          PY

      - name: Validate receipt schema and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          receipt_path = Path(os.environ['RUNNER_TEMP']) / 'qform-receipt' / 'QFormReceiptV1.json'
          schema_path = Path('research/qform/qform-receipt-v1.schema.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(receipt)

          assert receipt['provenance']['commit_sha'] == os.environ['EXPECTED_SHA']
          assert receipt['exact_census']['primes_count'] == 6494
          assert receipt['exact_census']['prime_powers_count'] == 6586
          assert receipt['exact_census']['integer_crosscheck_verified'] is True
          assert receipt['finite_formula_authority'] == 'CERTIFIED_INTERVAL'
          assert receipt['overall_authority'] == 'EMPIRICAL_FIXTURE'
          assert receipt['gaussian_cutoff']['cutoff_relation_verified'] is True
          assert receipt['gaussian_cutoff']['envelope_below_epsilon_verified'] is True
          assert float(receipt['evaluations']['spectral_symbol_gamma_fixture']['undamped_arb_ball']['mid']) < -30.0
          assert receipt['formula_to_weil_operator_identity_proven'] is False
          assert receipt['tail_order_theorem_verified'] is False
          assert receipt['global_weil_positivity_proven'] is False
          assert receipt['rh_proven'] is False
          print('QFORM_RECEIPT_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Emit receipt digest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP/qform-receipt/QFormReceiptV1.json" | tee "$RUNNER_TEMP/qform-receipt/SHA256SUMS"

      - name: Upload exact-head Q-form evidence
        uses: actions/upload-artifact@v4
        with:
          name: qform-receipt-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/qform-receipt
          if-no-files-found: error
          retention-days: 30
