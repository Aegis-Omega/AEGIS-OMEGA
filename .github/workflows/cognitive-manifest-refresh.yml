name: Cognitive Manifest Preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-manifest-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: aegis / cognitive-manifest-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve current main parent state
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          parent_hash="$(git show origin/main:.claude.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["state_hash"])' 2>/dev/null || true)"
          if [[ ! "$parent_hash" =~ ^[0-9a-f]{64}$ ]]; then
            parent_hash="$(printf '0%.0s' {1..64})"
          fi
          echo "state_hash=$parent_hash" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic anchor preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cognitive-anchors"
          mkdir -p "$RUNNER_TEMP/cognitive-anchors"
          python scripts/build-cognitive-manifest.py \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}" \
            --output-dir "$RUNNER_TEMP/cognitive-anchors"
          python scripts/build-cognitive-manifest.py \
            --check \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}" \
            --output-dir "$RUNNER_TEMP/cognitive-anchors"

      - name: Prove candidate branch remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Upload cognitive anchor preview
        uses: actions/upload-artifact@v4
        with:
          name: aegis-cognitive-anchor-preview-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-anchors
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
