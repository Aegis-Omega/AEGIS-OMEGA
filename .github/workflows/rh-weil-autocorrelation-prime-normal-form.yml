name: RH Weil Autocorrelation Prime Normal Form

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPrimeNormalFormV1.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilAutocorrelationPrimeNormalFormV1Spec.lean'
      - '.github/workflows/rh-weil-autocorrelation-prime-normal-form.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  autocorrelation-prime-normal-form:
    name: verify autocorrelation canonical finite real prime sum at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis rev-parse HEAD > exact-source.log
          sha256sum lake-manifest.json >> exact-source.log

      - name: Install pinned elan and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version >> exact-source.log

      - name: Compile inherited chain, candidate, and preregistered spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          for f in \
            WeilCriterionCompactSmoothV1 \
            WeilPrimeSummabilityV1 \
            WeilPrimeReindexV1 \
            WeilAutocorrelationRealityV1 \
            WeilArchimedeanConvergenceV1 \
            WeilAutocorrelationClosureV1; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            sha256sum "$f.lean" >> exact-source.log
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          done

          if test -f .aegis/sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPrimeNormalFormV1.lean; then
            cp .aegis/sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPrimeNormalFormV1.lean .
            sha256sum WeilAutocorrelationPrimeNormalFormV1.lean >> exact-source.log
            lake env lean -o .lake/build/lib/lean/WeilAutocorrelationPrimeNormalFormV1.olean \
              WeilAutocorrelationPrimeNormalFormV1.lean 2>&1 | tee WeilAutocorrelationPrimeNormalFormV1.log
          fi

          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilAutocorrelationPrimeNormalFormV1Spec.lean .
          sha256sum WeilAutocorrelationPrimeNormalFormV1Spec.lean >> exact-source.log
          lake env lean WeilAutocorrelationPrimeNormalFormV1Spec.lean 2>&1 | tee WeilAutocorrelationPrimeNormalFormV1Spec.log

      - name: Audit target closures
        shell: bash
        run: |
          set -euo pipefail
          cat > WeilAutocorrelationPrimeNormalFormV1Audit.lean <<'EOF'
          import WeilAutocorrelationPrimeNormalFormV1
          #print axioms canonical_weil_autocorrelation_prime_term_real_v1
          #print axioms weil_autocorrelation_prime_sum_eq_canonical_finite_sum_v1
          #print axioms weil_autocorrelation_prime_sum_eq_finite_real_sum_v1
          EOF
          lake env lean WeilAutocorrelationPrimeNormalFormV1Audit.lean 2>&1 | tee WeilAutocorrelationPrimeNormalFormV1Audit.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = [
              'canonical_weil_autocorrelation_prime_term_real_v1',
              'weil_autocorrelation_prime_sum_eq_canonical_finite_sum_v1',
              'weil_autocorrelation_prime_sum_eq_finite_real_sum_v1',
          ]
          log = Path('WeilAutocorrelationPrimeNormalFormV1Audit.log').read_text()
          assert 'sorryAx' not in log
          for name in names:
              m = re.search(re.escape("'" + name + "' depends on axioms: ") + r"\[([^\]]*)\]", log, re.S)
              if m:
                  axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
                  assert axioms <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, axioms)
              else:
                  assert "'" + name + "' does not depend on any axioms" in log, name
          print('PASS: autocorrelation prime side is finite/canonical/real; explicit formula identity and global sign remain OPEN; RH=NOT_PROVEN; authority_effect=NONE')
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-weil-autocorrelation-prime-normal-form-${{ env.SOURCE_SHA }}
          path: |
            exact-source.log
            Weil*.log
          if-no-files-found: warn
          retention-days: 30
