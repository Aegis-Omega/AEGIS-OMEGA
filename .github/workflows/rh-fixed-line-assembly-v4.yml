name: RH Fixed-Line Assembly V4

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilMellinWeightedFixedLineV2.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/WeilFixedLineFubiniSwapV4.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilFixedLineAssemblyV4Spec.lean'
      - '.github/workflows/rh-fixed-line-assembly-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_527_SHA: 77adaa32bbedd32c765409b550b564413094b520
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2
  PARENT_527_BLOB: bd87f1d650f85d5f6c3e7eab5a52863ee9ac248d

jobs:
  assembly:
    name: verify fixed-line assembly at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact external proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false

      - name: Verify #527 ancestry, pin, and frozen parent theorem source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .aegis merge-base --is-ancestor "$BASE_527_SHA" "$SOURCE_SHA"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilPairedHadamardKernelTsumV2.lean)" = "$PARENT_527_BLOB"
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          rm -f lake-manifest.json

      - name: Install pinned elan and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update mathlib
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get
          lean --version

      - name: Apply audited three-line old-pin factorization compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Hadamard/General/Factorization.lean')
          text = p.read_text()
          replacements = [
              ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
               'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
              ('have hgz : g z = Q z := ite_eq_left rfl',
               'have hgz : g z = Q z := by simp [g]'),
              ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
               'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check -- Hadamard/General/Factorization.lean

      - name: Build exact providers
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            Hadamard.OrderOne.LogDerivMultiplicity \
            Lc.LiCriterion.XiGrowth \
            Lc.LiCriterion.HadamardSummabilityBridge \
            Lc.LiCriterion.HadamardBridge

      - name: Compile inherited RH DAG through #527
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          files=(
            WeilCriterionCompactSmoothV1
            ZeroCriticalStripV1
            ZeroHeightFiniteSumV1
            ZeroHeightLimitContractV1
            ZeroHeightSummabilityBridgeV1
            ZeroMajorantSummabilityV1
            ZeroHeightShellMassV1
            ZeroShellQuadraticBoundV1
            ZeroShellAnalyticSynthesisV1
            ZeroCountingBoundV1
            MellinDecayEstimateV1
            ZeroCountingMellinSummabilityV1
            WeilMellinInversionV1
            WeilPrimeLineIdentityV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilAutocorrelationPoleAggregationV1
            WeilPoleTermV1
            WeilFixedLineExplicitFormulaContractV2
            WeilPairedHadamardFixedLineV1
            WeilPairedHadamardKernelTsumV2
          )
          for f in "${files[@]}"; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          done

      - name: Compile FZ core target when present
        shell: bash
        run: |
          set -euo pipefail
          f=WeilFixedLineFubiniCoreV3
          if [[ -f ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" ]]; then
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          fi

      - name: Compile preregistered FZ core spec
        shell: bash
        run: |
          set -euo pipefail
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilFixedLineFubiniCoreV3Spec.lean .
          lake env lean WeilFixedLineFubiniCoreV3Spec.lean 2>&1 | tee fz-core-spec.log

      - name: Compile fixed-line assembly targets
        shell: bash
        run: |
          set -euo pipefail
          for f in WeilMellinWeightedFixedLineV2 WeilFixedLineFubiniSwapV4; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          done
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilFixedLineAssemblyV4Spec.lean .
          lake env lean WeilFixedLineAssemblyV4Spec.lean 2>&1 | tee fixed-line-assembly-v4-spec.log

      - name: Audit theorem surface when GREEN
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > FixedLineAssemblyAudit.lean <<'EOF'
          import WeilFixedLineFubiniSwapV4
          #print axioms weil_compact_smooth_mellin_vertical_abs_moment_one_v2
          #print axioms weil_compact_smooth_mellin_vertical_abs_moment_two_v3
          #print axioms weil_compact_smooth_mellin_has_vertical_norm_moments_two_v3
          #print axioms riemannXi_paired_kernel_integral_tsum_v4
          #print axioms riemannXi_paired_logDeriv_fixed_line_integral_v4
          EOF
          lake env lean FixedLineAssemblyAudit.lean 2>&1 | tee fixed-line-assembly-v4-axioms.log
          ! grep -F 'sorryAx' fixed-line-assembly-v4-axioms.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-fixed-line-assembly-v4-${{ env.SOURCE_SHA }}
          path: '*.log'
          if-no-files-found: warn
          retention-days: 30
