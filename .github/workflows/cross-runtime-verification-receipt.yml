name: Cross-Runtime Verification Receipt

on:
  push:
    branches: [feat/cross-runtime-verification-receipt-v1]
    paths:
      - 'harness/sdk/cross_runtime_verification.py'
      - 'sovereign-omega-v2/python/tests/test_cross_runtime_verification_receipt.py'
      - 'sovereign-omega-v2/python/tests/test_hardware_config.py'
      - 'harness/sdk/qform_*.py'
      - 'sovereign-omega-v2/python/tests/test_qform_receipt.py'
      - '.github/workflows/cross-runtime-verification-receipt.yml'
  pull_request:
    paths:
      - 'harness/sdk/cross_runtime_verification.py'
      - 'sovereign-omega-v2/python/tests/test_cross_runtime_verification_receipt.py'
      - 'sovereign-omega-v2/python/tests/test_hardware_config.py'
      - 'harness/sdk/qform_*.py'
      - 'sovereign-omega-v2/python/tests/test_qform_receipt.py'
      - '.github/workflows/cross-runtime-verification-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GUARD_SOURCE_SHA: e02341ef3cc452882916a524eb4675a395f081c7
  GUARD_NPM_VERSION: 11.19.0
  GUARD_EXPECTED_TGZ_SHA256: 1fdc22ea6e96ddcd7627593a9b9669f3eb869b8913b41c9fbdc1adb6abb2d373
  GUARD_EXPECTED_PACKAGE_RECEIPT_ROOT: 7a412897a241dd1a8ec260973eedfb753b48b859b8acd822b78fb8e69ae6fabc
  GUARD_EXPECTED_PACKAGE_RECEIPT_FILE_SHA256: 07d7c50f42ecdb00371ca8808eaf5f251ac258dbd98aa3511034793d9ec18396
  GUARD_EXPECTED_SUPPLY_RECEIPT_ROOT: eb35d57aa44273a62c15f7570b33f3fb9b197e1b60c19548fc98705c58fc8c04
  GUARD_EXPECTED_SUPPLY_RECEIPT_FILE_SHA256: 1b889ae57ede5dad12312cbe5506cda941d6eabe4a9031082f73199d27b0c3f0
  GUARD_EXPECTED_LOCK_SHA256: 07b6c8b2ddb35d8f28ca7e142234354b7a094c8a9f4b1c17fe71f87924f7a235
  GUARD_EXPECTED_AUDIT_CANONICAL_SHA256: abe54f13770b00a287157f44c1adb813cad81d992cddabc0917bb0ac6b8f6961
  GUARD_EXPECTED_SIGNATURES_CANONICAL_SHA256: 03e643b3669e02666db2936807ae533ac0658bcea150c6d805eb0f418ee4ec59
  GUARD_EXPECTED_NORMALIZED_SBOM_SHA256: faa549b738c8e38fe7e0ea84d088083f5a99b64af9986b38ab41484d5d78d532

jobs:
  receipt:
    name: Exact-source cross-runtime receipt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded verification dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1 python-flint==0.8.0 jsonschema==4.25.1

      - name: Run preregistered receipt falsifiers
        run: python -m pytest -q sovereign-omega-v2/python/tests/test_cross_runtime_verification_receipt.py

      - name: Replay T0 hardware suite on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-runtime"
          python sovereign-omega-v2/python/tests/test_hardware_config.py \
            | tee "$RUNNER_TEMP/cross-runtime/hardware.log"
          count="$(grep -c '^  PASS  ' "$RUNNER_TEMP/cross-runtime/hardware.log")"
          test "$count" = "159" || {
            echo "HARDWARE_PASS_COUNT_MISMATCH expected=159 actual=$count" >&2
            exit 1
          }
          ! grep -q '^  FAIL  ' "$RUNNER_TEMP/cross-runtime/hardware.log"
          printf '%s\n' "$count" > "$RUNNER_TEMP/cross-runtime/hardware-pass-count.txt"

      - name: Replay canonical QForm suite on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q sovereign-omega-v2/python/tests/test_qform_receipt.py \
            | tee "$RUNNER_TEMP/cross-runtime/qform.log"

      - name: Set up Node for independent Sovereign Guard replay
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Replay exact public Sovereign Guard package and supply-chain receipts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cross-runtime"
          guard="$RUNNER_TEMP/sovereign-guard-exact"

          git clone --quiet --no-tags --filter=blob:none https://github.com/Aegis-Omega/sovereign-guard.git "$guard"
          git -C "$guard" fetch --quiet --depth=1 origin "$GUARD_SOURCE_SHA"
          git -C "$guard" checkout --quiet --detach "$GUARD_SOURCE_SHA"
          test "$(git -C "$guard" rev-parse HEAD)" = "$GUARD_SOURCE_SHA"
          printf '%s\n' "$GUARD_SOURCE_SHA" > "$root/sovereign-guard-source-sha.txt"

          cd "$guard"
          npm install --global "npm@$GUARD_NPM_VERSION"
          test "$(npm --version)" = "$GUARD_NPM_VERSION"
          node --version | tee "$root/sovereign-guard-node-version.txt"
          npm --version | tee "$root/sovereign-guard-npm-version.txt"

          npm ci
          npm run build
          npm test | tee "$root/sovereign-guard-tests.log"
          mkdir -p artifacts
          npm audit --audit-level=low --json > artifacts/npm-audit.json
          npm audit signatures --json --include-attestations > artifacts/npm-signatures.json
          npm sbom --sbom-format=cyclonedx > artifacts/sbom.cdx.json

          AEGIS_SOURCE_SHA="$GUARD_SOURCE_SHA" KEEP_NPM_TARBALL=1 npm run verify:package
          AEGIS_SOURCE_SHA="$GUARD_SOURCE_SHA" npm run verify:supply-chain

          mapfile -t tgz < <(find . -maxdepth 1 -type f -name 'sovereign-guard-*.tgz' -print)
          test "${#tgz[@]}" -eq 1
          actual_tgz_sha="$(sha256sum "${tgz[0]}" | awk '{print $1}')"
          test "$actual_tgz_sha" = "$GUARD_EXPECTED_TGZ_SHA256"

          package_file_sha="$(sha256sum artifacts/NpmPackageReceiptV1.json | awk '{print $1}')"
          supply_file_sha="$(sha256sum artifacts/NpmSupplyChainReceiptV1.json | awk '{print $1}')"
          test "$package_file_sha" = "$GUARD_EXPECTED_PACKAGE_RECEIPT_FILE_SHA256"
          test "$supply_file_sha" = "$GUARD_EXPECTED_SUPPLY_RECEIPT_FILE_SHA256"

          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('artifacts/NpmPackageReceiptV1.json', 'utf8'));
          const supply = JSON.parse(fs.readFileSync('artifacts/NpmSupplyChainReceiptV1.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };

          if (pkg.receipt_version !== 'NpmPackageReceiptV1') fail('package receipt version mismatch');
          if (pkg.source.repository !== 'Aegis-Omega/sovereign-guard') fail('repository mismatch');
          if (pkg.source.git_sha !== process.env.GUARD_SOURCE_SHA) fail('source SHA mismatch');
          if (pkg.package.name !== 'sovereign-guard' || pkg.package.version !== '1.0.0') fail('package identity mismatch');
          if (pkg.package.sha256 !== process.env.GUARD_EXPECTED_TGZ_SHA256) fail('tarball SHA mismatch');
          if (pkg.receipt_sha256 !== process.env.GUARD_EXPECTED_PACKAGE_RECEIPT_ROOT) fail('package receipt root mismatch');
          if (pkg.verification.authority !== 'REMOTE_EXACT_SOURCE_PACK_VERIFIED') fail('package authority mismatch');
          if (pkg.verification.exact_source_sha_verified !== true) fail('exact source not verified');
          if (pkg.verification.reproducible_pack_verified !== true) fail('reproducibility not verified');
          if (pkg.reproducibility.independent_pack_count !== 2 || pkg.reproducibility.byte_for_byte_equal !== true) fail('pack reproducibility mismatch');
          if (pkg.verification.local_64_suite_bound !== false) fail('64-suite boundary laundered by package receipt');

          if (supply.receipt_version !== 'NpmSupplyChainReceiptV1') fail('supply receipt version mismatch');
          if (supply.source.git_sha !== process.env.GUARD_SOURCE_SHA) fail('supply source SHA mismatch');
          if (supply.receipt_sha256 !== process.env.GUARD_EXPECTED_SUPPLY_RECEIPT_ROOT) fail('supply receipt root mismatch');
          if (supply.verification.authority !== 'REMOTE_EXACT_SOURCE_SUPPLY_CHAIN_VERIFIED') fail('supply authority mismatch');
          if (supply.package_receipt.receipt_root !== pkg.receipt_sha256) fail('supply/package root binding mismatch');
          if (supply.package_receipt.tarball_sha256 !== pkg.package.sha256) fail('supply/tarball binding mismatch');
          if (supply.lockfile.sha256 !== process.env.GUARD_EXPECTED_LOCK_SHA256) fail('lock SHA mismatch');
          if (supply.audit.policy_threshold !== 'low' || supply.audit.vulnerabilities.total !== 0) fail('audit policy mismatch');
          if (supply.audit.canonical_sha256 !== process.env.GUARD_EXPECTED_AUDIT_CANONICAL_SHA256) fail('audit canonical SHA mismatch');
          if (supply.signatures.missing_count !== 0 || supply.signatures.invalid_count !== 0) fail('signature debt');
          if (supply.signatures.verified_count !== 6 || supply.signatures.provenance_attestation_count !== 6) fail('signature/provenance count mismatch');
          if (supply.signatures.canonical_sha256 !== process.env.GUARD_EXPECTED_SIGNATURES_CANONICAL_SHA256) fail('signatures canonical SHA mismatch');
          if (supply.sbom.normalized_sha256 !== process.env.GUARD_EXPECTED_NORMALIZED_SBOM_SHA256) fail('normalized SBOM SHA mismatch');
          if (supply.verification.local_64_suite_bound !== false || supply.non_claims.operator_reported_64_suite_authenticated !== false) fail('64-suite boundary laundered by supply receipt');
          if (supply.non_claims.advisory_state_is_timeless !== false) fail('advisory state incorrectly promoted to timeless');
          NODE

          cp artifacts/NpmPackageReceiptV1.json "$root/GuardNpmPackageReceiptV1.json"
          cp artifacts/NpmSupplyChainReceiptV1.json "$root/GuardNpmSupplyChainReceiptV1.json"
          cp artifacts/npm-audit.json "$root/sovereign-guard-npm-audit.json"
          cp artifacts/npm-signatures.json "$root/sovereign-guard-npm-signatures.json"
          cp artifacts/sbom.cdx.json "$root/sovereign-guard-sbom.cdx.json"
          cp "${tgz[0]}" "$root/sovereign-guard-1.0.0.tgz"
          sha256sum \
            "$root/GuardNpmPackageReceiptV1.json" \
            "$root/GuardNpmSupplyChainReceiptV1.json" \
            "$root/sovereign-guard-1.0.0.tgz" \
            "$root/sovereign-guard-npm-audit.json" \
            "$root/sovereign-guard-npm-signatures.json" \
            "$root/sovereign-guard-sbom.cdx.json" \
            > "$root/sovereign-guard-replay.sha256"

      - name: Emit fail-closed cross-runtime receipt with artifact identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from harness.sdk.cross_runtime_verification import RuntimeEvidenceV1, build_cross_runtime_receipt

          root = Path(os.environ['RUNNER_TEMP']) / 'cross-runtime'
          hardware_passes = int((root / 'hardware-pass-count.txt').read_text().strip())
          candidate = os.environ['EXPECTED_SHA']
          package_path = root / 'GuardNpmPackageReceiptV1.json'
          supply_path = root / 'GuardNpmSupplyChainReceiptV1.json'
          guard_package = json.loads(package_path.read_text())
          guard_supply = json.loads(supply_path.read_text())
          guard_source = guard_package['source']['git_sha']
          package_file_sha = hashlib.sha256(package_path.read_bytes()).hexdigest()
          supply_file_sha = hashlib.sha256(supply_path.read_bytes()).hexdigest()

          assert guard_source == os.environ['GUARD_SOURCE_SHA']
          assert guard_package['package']['sha256'] == os.environ['GUARD_EXPECTED_TGZ_SHA256']
          assert guard_package['receipt_sha256'] == os.environ['GUARD_EXPECTED_PACKAGE_RECEIPT_ROOT']
          assert package_file_sha == os.environ['GUARD_EXPECTED_PACKAGE_RECEIPT_FILE_SHA256']
          assert guard_package['verification']['authority'] == 'REMOTE_EXACT_SOURCE_PACK_VERIFIED'
          assert guard_package['verification']['local_64_suite_bound'] is False

          assert guard_supply['source']['git_sha'] == guard_source
          assert guard_supply['receipt_sha256'] == os.environ['GUARD_EXPECTED_SUPPLY_RECEIPT_ROOT']
          assert supply_file_sha == os.environ['GUARD_EXPECTED_SUPPLY_RECEIPT_FILE_SHA256']
          assert guard_supply['verification']['authority'] == 'REMOTE_EXACT_SOURCE_SUPPLY_CHAIN_VERIFIED'
          assert guard_supply['audit']['vulnerabilities']['total'] == 0
          assert guard_supply['signatures']['missing_count'] == 0
          assert guard_supply['signatures']['invalid_count'] == 0
          assert guard_supply['verification']['local_64_suite_bound'] is False

          components = [
              RuntimeEvidenceV1(
                  component='hardware_config_t0', required=True,
                  source_repo='Aegis-Omega/AEGIS-OMEGA', source_commit=candidate,
                  execution_commit=candidate, execution_status='PASS',
                  observed_passes=hardware_passes, observed_failures=0,
                  evidence_origin='REMOTE_EXACT_HEAD_REPLAY',
              ),
              RuntimeEvidenceV1(
                  component='qform_canonical_proof_carrying', required=True,
                  source_repo='Aegis-Omega/AEGIS-OMEGA', source_commit=candidate,
                  execution_commit=candidate, execution_status='PASS',
                  observed_passes=None, observed_failures=0,
                  evidence_origin='REMOTE_EXACT_HEAD_REPLAY',
              ),
              RuntimeEvidenceV1(
                  component='sovereign_guard_public_package_v1', required=True,
                  source_repo='Aegis-Omega/sovereign-guard', source_commit=guard_source,
                  execution_commit=guard_source, execution_status='PASS',
                  observed_passes=None, observed_failures=0,
                  evidence_origin='REMOTE_EXACT_HEAD_ARTIFACT_REPLAY',
                  evidence_kind='NpmPackageReceiptV1',
                  evidence_sha256=package_file_sha,
              ),
              RuntimeEvidenceV1(
                  component='sovereign_guard_public_supply_chain_v1', required=True,
                  source_repo='Aegis-Omega/sovereign-guard', source_commit=guard_source,
                  execution_commit=guard_source, execution_status='PASS',
                  observed_passes=None, observed_failures=0,
                  evidence_origin='REMOTE_EXACT_HEAD_ARTIFACT_REPLAY',
                  evidence_kind='NpmSupplyChainReceiptV1',
                  evidence_sha256=supply_file_sha,
              ),
              RuntimeEvidenceV1(
                  component='sovereign_guard_64_suite', required=True,
                  source_repo='Aegis-Omega/sovereign-guard', source_commit=None,
                  execution_commit=None, execution_status='PASS',
                  observed_passes=64, observed_failures=0,
                  evidence_origin='OPERATOR_REPORTED_LOCAL_WORKING_ENVIRONMENT_UNBOUND',
                  remote_reference_commit=guard_source,
              ),
          ]
          receipt = build_cross_runtime_receipt(components).to_dict()
          target = root / 'CrossRuntimeVerificationReceiptV1.json'
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(target.read_text())

          by_name = {item['component']: item for item in receipt['components']}
          assert by_name['sovereign_guard_public_package_v1']['binding_status'] == 'REMOTE_EXACT_HEAD_VERIFIED'
          assert by_name['sovereign_guard_public_package_v1']['evidence_sha256'] == package_file_sha
          assert by_name['sovereign_guard_public_supply_chain_v1']['binding_status'] == 'REMOTE_EXACT_HEAD_VERIFIED'
          assert by_name['sovereign_guard_public_supply_chain_v1']['evidence_sha256'] == supply_file_sha
          assert by_name['sovereign_guard_64_suite']['binding_status'] == 'LOCAL_VERIFIED_UNBOUND'
          assert by_name['sovereign_guard_64_suite']['remote_reference_grants_authority'] is False
          assert receipt['overall_status'] == 'BLOCKED_UNBOUND_COMPONENT'
          assert receipt['all_required_components_exact_head_bound'] is False
          assert receipt['rh_proven'] is False
          PY

      - name: Emit evidence digests
        shell: bash
        run: |
          sha256sum "$RUNNER_TEMP/cross-runtime/"* | tee "$RUNNER_TEMP/cross-runtime/SHA256SUMS"

      - name: Upload cross-runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-runtime-verification-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/cross-runtime/
          if-no-files-found: error
          retention-days: 30
