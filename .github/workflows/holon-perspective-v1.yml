name: Holon Perspective v1

on:
  pull_request:
    paths:
      - "harness/inference/holon/perspective.py"
      - "harness/inference/holon/test_perspective.py"
      - ".github/workflows/holon-perspective-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holon-perspective-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perspective:
    name: aegis / holon-perspective-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"

      - name: Compile Perspective contract
        working-directory: harness/inference/holon
        run: python -m py_compile perspective.py test_perspective.py

      - name: Run Perspective falsifiers
        working-directory: harness/inference/holon
        run: python -m unittest -v test_perspective.py
