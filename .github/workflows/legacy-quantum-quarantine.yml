name: Legacy Quantum Quarantine

on:
  pull_request:
    paths:
      - "clients/gemma-holon/quantum/**"
      - "quarantine/legacy-quantum-demonstrator/**"
      - "sovereign-omega-v2/src/**"
      - "scripts/agent_governance_lint.py"
      - "tests/governance/test_agent_governance_lint.py"
      - ".github/workflows/legacy-quantum-quarantine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-quantum-quarantine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  governance-lint:
    name: Governance / legacy quantum quarantine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.3.5'

      - name: Run quarantine contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/governance/test_agent_governance_lint.py -v

      - name: Enforce repository quarantine boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agent_governance_lint.py
