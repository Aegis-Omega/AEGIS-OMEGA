name: Mellin Compact Support V1

on:
  push:
    branches:
      - proof/mellin-compact-support-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-kernel-replay:
    runs-on: ubuntu-24.04
    env:
      MATHLIB_SHA: 78f7ceb75eb8545d8f24744941f3629c16eb7040
      LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0
      EVIDENCE_DIR: docs/evidence/mellin-compact-support-v1
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ github.sha }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind candidate, Mathlib and evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          test "$(git -C .aegis rev-parse HEAD)" = "${GITHUB_SHA}"
          cd ".aegis/$EVIDENCE_DIR"
          sha256sum -c SHA256SUMS
          {
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "MATHLIB_SHA=$MATHLIB_SHA"
            echo "LEAN_TOOLCHAIN=$LEAN_TOOLCHAIN"
            sha256sum SHA256SUMS manifest.json MellinCompactSupport.lean \
              MellinCompactSupport_AxiomCheck.lean \
              MellinCompactSupport_NonVacuity.lean \
              mellinConvergent_of_hasCompactSupport.patch
          } > ../../../mellin-exact-source.log

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version | tee -a .aegis/mellin-exact-source.log
          lake exe cache get Mathlib.Analysis.MellinTransform

      - name: Compile pristine standalone theorem and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          SRC=".aegis/$EVIDENCE_DIR"
          lake env lean "$SRC/MellinCompactSupport.lean" 2>&1 | tee mellin-standalone.log
          lake env lean "$SRC/MellinCompactSupport_AxiomCheck.lean" 2>&1 | tee mellin-axioms.log
          grep -F "depends on axioms: [propext, Classical.choice, Quot.sound]" mellin-axioms.log
          if grep -Fq sorryAx mellin-axioms.log; then
            echo "unexpected sorryAx" >&2
            exit 1
          fi

      - name: Apply exact patch and build Mathlib module
        shell: bash
        run: |
          set -euo pipefail
          SRC=".aegis/$EVIDENCE_DIR"
          git apply --check "$SRC/mellinConvergent_of_hasCompactSupport.patch"
          git apply "$SRC/mellinConvergent_of_hasCompactSupport.patch"
          test "$(sha256sum Mathlib/Analysis/MellinTransform.lean | awk '{print $1}')" = \
            "216d04d4eba956b298f8106e4114b61e5e0b08cf57da13b95f4009f76b517fb0"
          lake build Mathlib.Analysis.MellinTransform 2>&1 | tee mellin-module-build.log
          lake exe runLinter Mathlib.Analysis.MellinTransform 2>&1 | tee mellin-runLinter.log

      - name: Compile non-vacuity witness against patched module
        shell: bash
        run: |
          set -euo pipefail
          SRC=".aegis/$EVIDENCE_DIR"
          lake env lean "$SRC/MellinCompactSupport_NonVacuity.lean" 2>&1 | tee mellin-nonvacuity.log

      - name: Produce exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mellin-hosted-evidence
          cp .aegis/mellin-exact-source.log mellin-hosted-evidence/ 2>/dev/null || true
          cp mellin-standalone.log mellin-axioms.log mellin-module-build.log \
             mellin-runLinter.log mellin-nonvacuity.log mellin-hosted-evidence/ 2>/dev/null || true
          cp ".aegis/$EVIDENCE_DIR/manifest.json" mellin-hosted-evidence/
          cp ".aegis/$EVIDENCE_DIR/SHA256SUMS" mellin-hosted-evidence/original-SHA256SUMS
          {
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "MATHLIB_SHA=$MATHLIB_SHA"
            echo "LEAN_TOOLCHAIN=$LEAN_TOOLCHAIN"
            find mellin-hosted-evidence -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum
          } > mellin-hosted-evidence/HOSTED-SHA256SUMS

      - name: Upload exact-head Mellin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mellin-compact-support-v1-${{ github.sha }}
          path: mellin-hosted-evidence/
          if-no-files-found: error
          retention-days: 30
