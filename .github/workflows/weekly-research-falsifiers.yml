name: Weekly Research Boundary Falsifiers

on:
  pull_request:
    paths:
      - "harness/sdk/weekly_research_falsifiers.py"
      - "sovereign-omega-v2/python/tests/test_weekly_research_falsifiers.py"
      - "harness/sdk/atomic_admission.py"
      - "harness/sdk/collective_memory.py"
      - "sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py"
      - "sovereign-omega-v2/python/tests/test_uci6_collective_memory.py"
      - ".github/workflows/weekly-research-falsifiers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-research-falsifiers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  falsifiers:
    name: aegis / research-boundary-falsifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Compile boundary contract
        run: python -m py_compile harness/sdk/weekly_research_falsifiers.py sovereign-omega-v2/python/tests/test_weekly_research_falsifiers.py

      - name: Run new boundary falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_weekly_research_falsifiers.py

      - name: Re-run inherited atomic-admission falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py

      - name: Re-run inherited collective-memory falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci6_collective_memory.py
