name: Universal Intelligence Evidence Replay

on:
  pull_request:
    paths:
      - 'harness/sdk/universal_intelligence_evidence.py'
      - 'sovereign-omega-v2/python/tests/test_universal_intelligence_replay_evidence.py'
      - '.github/workflows/universal-intelligence-evidence-replay.yml'
  push:
    branches:
      - integration/aegis-universal-intelligence-rh-v1
    paths:
      - 'harness/sdk/universal_intelligence_evidence.py'
      - 'sovereign-omega-v2/python/tests/test_universal_intelligence_replay_evidence.py'
      - '.github/workflows/universal-intelligence-evidence-replay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==8.4.1'

      - name: Compile evidence boundary
        run: python -m py_compile harness/sdk/universal_intelligence_evidence.py

      - name: Run replay-bound empirical falsifiers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q sovereign-omega-v2/python/tests/test_universal_intelligence_replay_evidence.py
