name: Weil Prime Term Support V1

on:
  pull_request:
    paths:
      - "tests/test_weil_prime_term_support_v1.py"
      - "sovereign-omega-v2/formal/tests/Weil/ConcretePrimeTermSupportV1Spec.v"
      - "sovereign-omega-v2/formal/theories/Weil/ConcreteFiniteGuinandWeilSemanticsV1.v"
      - ".github/workflows/weil-prime-term-support-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-prime-term-support-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  red-contract:
    name: preregistered complex prime-term support
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Execute preregistered support contract
        shell: bash
        run: python3 -m unittest -v tests/test_weil_prime_term_support_v1.py

  coq-support:
    name: coqc / complex prime-term support
    needs: red-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare support evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-prime-term-support-v1
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-prime-term-support-v1

      - name: Compile support and assumption audits
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: default
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTS="$ROOT/formal/tests/Weil"
            OUT="$ROOT/weil-prime-term-support-v1"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"

            for f in \
              PrimeSourceDerivativeConstructive \
              PrimePowerWeightBridge \
              FinitePrimeSourceSum \
              PrimePowerArithmeticBridge \
              PrimalityStdlibBridge \
              VonMangoldtCanonicalBridge \
              CanonicalPrimeSourceSum \
              ConcreteFiniteGuinandWeilSemanticsV1
            do
              coqc -Q "$THEORY" "" "$THEORY/$f.v" 2>&1 | tee "$OUT/$f.log"
            done

            coqc -Q "$THEORY" "" -Q "$TESTS" "" \
              "$TESTS/ConcretePrimeTermSupportV1Spec.v" \
              2>&1 | tee "$OUT/ConcretePrimeTermSupportV1Spec.log"

            for theorem in \
              finite_prime_scalar_term_leading_zero_v1 \
              finite_prime_scalar_term_tail_index_v1 \
              concrete_prime_term_semantics_v1
            do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              cat > "$query" <<EOF
            Set Coqtop Exit On Error.
            Require Import ConcreteFiniteGuinandWeilSemanticsV1.
            Print Assumptions ${theorem}.
            EOF
              coqtop -quiet -batch -Q "$THEORY" "" -l "$query" > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for ${theorem}" >&2
                exit 1
              fi
            done

            cat > "$OUT/support-status.txt" <<'EOF'
            receipt_kind=AEGIS_CONCRETE_PRIME_TERM_COMPLEX_SUPPORT_V1
            formula_level_complex_support=CLOSED
            concrete_prime_term_semantics_v1=COQ_KERNEL_CLOSED
            cross_prover_semantic_equivalence=SEPARATE_CANONICAL_AST_BINDING_REQUIRED
            carrier_correspondence=NOT_CLAIMED
            matrix_entries_binding=NOT_YET_CLAIMED
            finite_psd=NOT_YET_IMPORTED
            global_weil_positivity=NOT_PROVEN
            rh=NOT_PROVEN
            authority_effect=NONE
            EOF

      - name: Upload support evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concrete-prime-term-support-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-prime-term-support-v1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
