name: Apple Foundation Models Runtime

on:
  push:
    branches:
      - feat/apple-foundation-models-runtime-v1
    paths:
      - 'clients/gemma-edge-ios/**'
      - '.github/workflows/apple-foundation-models-runtime.yml'
  pull_request:
    paths:
      - 'clients/gemma-edge-ios/**'
      - '.github/workflows/apple-foundation-models-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-foundation-models-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-foundation-models:
    name: Apple Foundation Models / swift test
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Record and enforce Apple toolchain identity
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
          OS_MAJOR="$(sw_vers -productVersion | cut -d. -f1)"
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          test "$OS_MAJOR" = "26"
          test "$XCODE_MAJOR" = "26"

      - name: Require FoundationModels SDK surface
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$SDKROOT/System/Library/Frameworks/FoundationModels.framework"
          echo "FoundationModels.framework present at $SDKROOT"

      - name: Run GemmaEdge Swift tests
        working-directory: clients/gemma-edge-ios
        run: |
          set -euo pipefail
          swift test --parallel

      - name: Build AEGISAppleLab against Apple iOS SDK (no signing)
        run: |
          set -euo pipefail
          PROJECT="clients/gemma-edge-ios/AEGISAppleLab/AEGISAppleLab.xcodeproj"
          xcodebuild -project "$PROJECT" -list
          xcodebuild \
            -project "$PROJECT" \
            -scheme AEGISAppleLab \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
