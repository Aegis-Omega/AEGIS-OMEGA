name: AEGIS Cross-Boundary Authority V1

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/python/cross_boundary_authority.py"
      - "sovereign-omega-v2/python/research_invariants.py"
      - "sovereign-omega-v2/python/tests/test_cross_boundary_authority.py"
      - ".aegis/cross-domain/fixtures/qbp-cross-boundary-v1.json"
      - "docs/research/cross-boundary-authority-v1.md"
      - ".github/workflows/cross-boundary-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-boundary-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind execution to selected head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile authority boundary
        run: |
          python -m py_compile             sovereign-omega-v2/python/research_invariants.py             sovereign-omega-v2/python/cross_boundary_authority.py             sovereign-omega-v2/python/tests/test_cross_boundary_authority.py
      - name: Run cross-boundary fail-closed regressions
        env:
          PYTHONPATH: sovereign-omega-v2/python
        run: python sovereign-omega-v2/python/tests/test_cross_boundary_authority.py -v
