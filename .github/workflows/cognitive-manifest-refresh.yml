name: Cognitive Manifest Refresh

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Existing non-main branch to receive refreshed cognitive anchors
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: cognitive-manifest-refresh-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: aegis / cognitive-manifest-refresh
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_ACTIONS_APP_ID: '15368'
    steps:
      - name: Checkout trusted main control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact admitted main before mutation
        id: admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          git check-ref-format --branch "$TARGET_REF" >/dev/null
          if [[ "$TARGET_REF" == "main" ]]; then
            echo "Refusing to mutate main from the cognitive-anchor writer." >&2
            exit 1
          fi
          if [[ "$TARGET_REF" == repair/cognitive-anchor-* ]]; then
            echo "Recovery branches are never auto-mutated: $TARGET_REF" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$TARGET_REF" >/dev/null; then
            echo "Target must already exist as a remote branch: refs/heads/$TARGET_REF" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced after dispatch: event=$GITHUB_SHA current=$main_sha" >&2
            exit 1
          fi

          main_manifest="$RUNNER_TEMP/main-claude.json"
          git show "$main_sha:.claude.json" > "$main_manifest"
          parent_hash="$(python - "$main_manifest" <<'PY'
          import hashlib
          import json
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          actual = manifest.get("state_hash")
          if not isinstance(actual, str) or re.fullmatch(r"[0-9a-f]{64}", actual) is None:
              raise SystemExit("state_hash is not lowercase SHA-256 hex")
          if actual == "0" * 64:
              raise SystemExit("implicit zero parent is forbidden")
          unhashed = dict(manifest)
          unhashed.pop("state_hash", None)
          payload = json.dumps(
              unhashed,
              ensure_ascii=False,
              allow_nan=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          expected = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit("state_hash mismatch")
          print(actual)
          PY
          )"

          MAIN_SHA="$main_sha" python - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["MAIN_SHA"]
          token = os.environ["GH_TOKEN"]
          app_id = int(os.environ["GITHUB_ACTIONS_APP_ID"])
          required = (
              "aegis / automaton-2",
              "aegis / automaton-3",
              "Main branch enforcement",
          )

          check_runs = []
          page = 1
          while True:
              url = f"{api}/repos/{repo}/commits/{sha}/check-runs?per_page=100&page={page}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              batch = payload.get("check_runs", [])
              check_runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          for name in required:
              candidates = [
                  run
                  for run in check_runs
                  if run.get("name") == name
                  and run.get("head_sha") == sha
                  and isinstance(run.get("app"), dict)
                  and run["app"].get("id") == app_id
              ]
              if not candidates:
                  raise SystemExit(
                      f"missing publisher-bound exact-main check: {name} app={app_id} head_sha={sha}"
                  )
              latest = max(candidates, key=lambda run: int(run.get("id") or 0))
              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  raise SystemExit(
                      f"main check is not successful: {name} "
                      f"status={latest.get('status')} conclusion={latest.get('conclusion')}"
                  )
              print(
                  f"MAIN_CHECK_OK name={name} id={latest.get('id')} "
                  f"app={latest['app'].get('id')} head_sha={latest.get('head_sha')}"
              )
          PY

          cp scripts/build-cognitive-manifest.py "$RUNNER_TEMP/trusted-build-cognitive-manifest.py"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "state_hash=$parent_hash" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout explicit target after admission gate
        if: steps.admission.outputs.allowed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Generate deterministic anchors with trusted main generator
        if: steps.admission.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          PARENT_STATE_HASH: ${{ steps.admission.outputs.state_hash }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/trusted-build-cognitive-manifest.py" \
            --root "$GITHUB_WORKSPACE" \
            --ref "$TARGET_REF" \
            --parent-state-hash "$PARENT_STATE_HASH"
          python "$RUNNER_TEMP/trusted-build-cognitive-manifest.py" \
            --check \
            --root "$GITHUB_WORKSPACE" \
            --ref "$TARGET_REF" \
            --parent-state-hash "$PARENT_STATE_HASH"

      - name: Commit refreshed anchors
        if: steps.admission.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude.json skill-hashes.sha256; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude.json skill-hashes.sha256
          git commit -m "chore(manifest): refresh cognitive-state anchors"
          git push origin "HEAD:refs/heads/$TARGET_REF"
