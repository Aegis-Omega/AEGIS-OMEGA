name: CUDA-Q Reproducibility Spike

on:
  push:
    branches:
      - research/gravity-quantum-interface-v1
    paths:
      - '.github/workflows/cudaq-reproducibility-spike.yml'
      - 'gravity_quantum/test_cudaq_reproducibility_contract.py'
  pull_request:
    branches:
      - research/gravity-quantum-interface-v1
    paths:
      - '.github/workflows/cudaq-reproducibility-spike.yml'
      - 'gravity_quantum/test_cudaq_reproducibility_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cudaq-cpu-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify reproducibility contract
        run: python gravity_quantum/test_cudaq_reproducibility_contract.py -v

      - name: Install pinned CUDA-Q
        run: python -m pip install --disable-pip-version-check 'cudaq==0.15.1'

      - name: Capture resolved environment lock
        run: |
          set -euo pipefail
          mkdir -p artifacts/cudaq-spike
          python -m pip freeze --all | LC_ALL=C sort > artifacts/cudaq-spike/environment.lock.txt
          test -s artifacts/cudaq-spike/environment.lock.txt

      - name: Run qpp-cpu Bell reproducibility probe
        env:
          SPIKE_SEED: '230911'
          SPIKE_SHOTS: '1000'
        run: |
          cat > /tmp/aegis_cudaq_spike.py <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path

          import cudaq

          seed = int(os.environ['SPIKE_SEED'])
          shots = int(os.environ['SPIKE_SHOTS'])
          cudaq.set_target('qpp-cpu')

          @cudaq.kernel
          def bell():
              q = cudaq.qvector(2)
              h(q[0])
              x.ctrl(q[0], q[1])
              mz(q)

          def run_once():
              cudaq.set_random_seed(seed)
              result = cudaq.sample(bell, shots_count=shots)
              return {str(k): int(v) for k, v in result.items()}

          counts_a = run_once()
          counts_b = run_once()
          allowed = {'00', '11'}
          other_a = {k: v for k, v in counts_a.items() if k not in allowed and v}
          other_b = {k: v for k, v in counts_b.items() if k not in allowed and v}

          checks = {
              'repeat_equal_same_seed': counts_a == counts_b,
              'only_bell_states_a': not other_a,
              'only_bell_states_b': not other_b,
              'shot_count_a': sum(counts_a.values()) == shots,
              'shot_count_b': sum(counts_b.values()) == shots,
              'both_expected_states_present': counts_a.get('00', 0) > 0 and counts_a.get('11', 0) > 0,
          }

          environment_lock = Path('artifacts/cudaq-spike/environment.lock.txt').read_bytes()
          receipt = {
              'schema': 'AEGIS_CUDAQ_REPRODUCIBILITY_SPIKE_V2',
              'scope': 'THROWAWAY_FEASIBILITY_SPIKE',
              'head_sha': os.environ['CANDIDATE_SHA'],
              'cudaq_version': importlib.metadata.version('cudaq'),
              'python_version': platform.python_version(),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'environment_lock_sha256': hashlib.sha256(environment_lock).hexdigest(),
              'target': 'qpp-cpu',
              'seed': seed,
              'shots': shots,
              'counts_run_a': dict(sorted(counts_a.items())),
              'counts_run_b': dict(sorted(counts_b.items())),
              'checks': checks,
              'gpu_acceleration_tested': False,
              'qpu_hardware_tested': False,
              'physics_claim_effect': 'NONE',
              'authority_effect': 'NONE',
          }

          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('artifacts/cudaq-spike/receipt.json').write_text(payload, encoding='utf-8')
          digest = hashlib.sha256(payload.encode()).hexdigest()
          print(payload)
          print('receipt_sha256=' + digest)

          if not all(checks.values()):
              raise SystemExit('CUDA-Q reproducibility spike failed: ' + json.dumps(checks, sort_keys=True))
          PY
          python /tmp/aegis_cudaq_spike.py

      - name: Verify spike receipt and environment lock
        run: |
          set -euo pipefail
          cd artifacts/cudaq-spike
          sha256sum receipt.json environment.lock.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload spike evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cudaq-reproducibility-spike-${{ env.CANDIDATE_SHA }}
          path: artifacts/cudaq-spike/
          if-no-files-found: error
