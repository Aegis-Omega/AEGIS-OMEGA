name: Archive Python Restoration

on:
  pull_request:
    branches: [main]
    paths:
      - "swarm_os/**"
      - "scripts/test-archive-swarm-runtime.py"
      - "reports/archive-restoration-swarm-arc-v1.json"
      - "reports/archive-swarm-runtime-smoke-v1.json"
      - ".github/workflows/archive-python-restoration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-python:
    name: archive-restoration-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile recovered source
        run: python -m compileall -q swarm_os
      - name: Install bounded smoke dependencies
        run: python -m pip install --disable-pip-version-check -r swarm_os/requirements-restoration-smoke.txt
      - name: Execute bounded ARC/SWARM/biology runtime smoke
        run: |
          set -eo pipefail
          PYTHONPATH=. python scripts/test-archive-swarm-runtime.py | tee /tmp/archive-swarm-smoke.out
          tail -n 1 /tmp/archive-swarm-smoke.out > /tmp/archive-swarm-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path("/tmp/archive-swarm-smoke.json").read_text())
          expected=json.loads(Path("reports/archive-swarm-runtime-smoke-v1.json").read_text())
          if observed != expected:
              raise SystemExit("archive runtime smoke drift")
          if observed.get("status") != "PASS":
              raise SystemExit("archive runtime smoke did not pass")
          PY
      - name: Reject credential-shaped literals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"""(?i)(api[_-]?key|token|secret)\s*=\s*["'][^"']{20,}["']"""),
          ]
          allowed = {"YOUR_NIM_KEY"}
          hits = []
          for path in Path("swarm_os").rglob("*.py"):
              for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if any(p.search(line) for p in patterns) and not any(x in line for x in allowed):
                      hits.append(f"{path}:{number}")
          if hits:
              raise SystemExit("credential-shaped literals: " + ", ".join(hits))
          PY
      - name: Authority boundary
        run: |
          echo "authority_effect=NONE"
          echo "production_wiring=NOT_PERFORMED"
