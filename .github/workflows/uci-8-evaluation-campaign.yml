name: UCI-8 Evaluation Campaign

on:
  pull_request:
    branches:
      - feat/uci-7-agi-evidence-protocol-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uci8-evaluation-campaign:
    name: uci8 / evaluation-campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_PARENT_SHA: 1aa405975e2b3f3c1b1c0022a6b75e0b21d395ec
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact stacked lineage
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          if [[ -n "$PR_BASE_SHA" ]]; then test "$PR_BASE_SHA" = "$EXPECTED_PARENT_SHA"; fi
          echo "UCI8_CANDIDATE_SHA=$actual"
          echo "UCI8_EXPECTED_PARENT_SHA=$EXPECTED_PARENT_SHA"
          echo "UCI8_EXACT_LINEAGE=PASS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.3.5 jsonschema==4.23.0

      - name: Validate inherited and UCI-8 schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          paths = [
              Path('schemas/transition-identity-envelope.v1.schema.json'), Path('schemas/decision-receipt.v1.schema.json'),
              Path('schemas/execution-receipt.v1.schema.json'), Path('schemas/effect-receipt.v1.schema.json'),
              Path('schemas/effect-witness.v1.schema.json'), Path('schemas/complete-verification-result.v1.schema.json'),
              Path('schemas/admission-record.v1.schema.json'), Path('schemas/quarantined-evidence-memory-record.v1.schema.json'),
              Path('schemas/memory-projection-request.v1.schema.json'), Path('schemas/canonical-memory-record.v1.schema.json'),
              Path('schemas/memory-control-request.v1.schema.json'), Path('schemas/memory-control-record.v1.schema.json'),
              Path('schemas/capability-task-spec.v1.schema.json'), Path('schemas/capability-trial-result.v1.schema.json'),
              Path('schemas/evaluation-suite.v1.schema.json'), Path('schemas/agi-evidence-assessment.v1.schema.json'),
              Path('schemas/benchmark-track-spec.v1.schema.json'), Path('schemas/evaluation-campaign-manifest.v1.schema.json'),
              Path('schemas/paired-benchmark-trial.v1.schema.json'), Path('schemas/campaign-evidence-bundle.v1.schema.json'),
              Path('schemas/checker-result-attestation.v1.schema.json'), Path('schemas/pair-verification-attestation.v1.schema.json'),
          ]
          for path in paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              print(f'UCI8_SCHEMA_OK {path}')
          print(f'UCI8_SCHEMA_COUNT={len(paths)}')
          if len(paths) != 22: raise SystemExit('UCI8_SCHEMA_CARDINALITY_MISMATCH')
          PY

      - name: Run inherited UCI-4 UCI-5 UCI-6 proofline
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py \
            sovereign-omega-v2/python/tests/test_transition_receipts_cli_pr1.py \
            sovereign-omega-v2/python/tests/test_effect_adapters_pr2.py \
            sovereign-omega-v2/python/tests/test_effect_verifier_pr3.py \
            sovereign-omega-v2/python/tests/test_complete_verifier_pr4.py \
            sovereign-omega-v2/python/tests/test_complete_verifier_pr4_receipt_binding.py \
            sovereign-omega-v2/python/tests/test_uci4_effect_chain_integration.py \
            sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py \
            sovereign-omega-v2/python/tests/test_uci6_collective_memory.py \
            sovereign-omega-v2/python/tests/test_uci6_memory_prestate.py \
            sovereign-omega-v2/python/tests/test_uci6_memory_schemas.py \
            sovereign-omega-v2/python/tests/test_uci6_internal_base_guard.py \
            -q | tee "$RUNNER_TEMP/uci8-inherited-pytest.log"
          grep -Eq '131 passed' "$RUNNER_TEMP/uci8-inherited-pytest.log"

      - name: Validate inherited UCI-5 CI contract guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci5_ci_contract.py -q | tee "$RUNNER_TEMP/uci8-inherited-uci5-ci.log"
          grep -Eq '3 passed' "$RUNNER_TEMP/uci8-inherited-uci5-ci.log"

      - name: Validate inherited UCI-7 protocol
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci7_agi_evidence_protocol.py sovereign-omega-v2/python/tests/test_uci7_agi_evidence_schemas.py -q | tee "$RUNNER_TEMP/uci8-inherited-uci7-protocol.log"
          grep -Eq '13 passed' "$RUNNER_TEMP/uci8-inherited-uci7-protocol.log"

      - name: Validate inherited UCI-7 CI contract guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci7_ci_contract.py -q | tee "$RUNNER_TEMP/uci8-inherited-uci7-ci.log"
          grep -Eq '4 passed' "$RUNNER_TEMP/uci8-inherited-uci7-ci.log"

      - name: Validate inherited UCI-7 checker provenance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci7_checker_provenance.py -q | tee "$RUNNER_TEMP/uci8-inherited-uci7-checker.log"
          grep -Eq '2 passed' "$RUNNER_TEMP/uci8-inherited-uci7-checker.log"

      - name: Validate inherited UCI-7 baseline attribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci7_baseline_attribution.py -q | tee "$RUNNER_TEMP/uci8-inherited-uci7-baseline.log"
          grep -Eq '5 passed' "$RUNNER_TEMP/uci8-inherited-uci7-baseline.log"

      - name: Run full local UCI-8 proofline
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            sovereign-omega-v2/python/tests/test_uci8_evaluation_campaign.py \
            sovereign-omega-v2/python/tests/test_uci8_evaluation_campaign_schemas.py \
            sovereign-omega-v2/python/tests/test_uci8_repetition_manifest.py \
            sovereign-omega-v2/python/tests/test_uci8_checker_provenance.py \
            sovereign-omega-v2/python/tests/test_uci8_portable_checker_attestation.py \
            sovereign-omega-v2/python/tests/test_uci8_portable_attestation_schemas.py \
            sovereign-omega-v2/python/tests/test_uci8_baseline_selection_integrity.py \
            sovereign-omega-v2/python/tests/test_uci8_published_comparability.py \
            sovereign-omega-v2/python/tests/test_uci8_measurement_resolution.py \
            sovereign-omega-v2/python/tests/test_uci8_measurement_resolution_schema.py \
            sovereign-omega-v2/python/tests/test_uci8_bundle_replay_promotion.py \
            sovereign-omega-v2/python/tests/test_uci8_portable_pair_verification.py \
            sovereign-omega-v2/python/tests/test_uci8_pair_verification_schemas.py \
            sovereign-omega-v2/python/tests/test_uci8_campaign_verification_receipt.py \
            -q | tee "$RUNNER_TEMP/uci8-local-proofline.log"
          grep -Eq '47 passed' "$RUNNER_TEMP/uci8-local-proofline.log"

      - name: Validate UCI-8 CI contract guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci8_ci_contract.py -q | tee "$RUNNER_TEMP/uci8-ci-contract.log"
          grep -Eq '4 passed' "$RUNNER_TEMP/uci8-ci-contract.log"

      - name: Write exact-head witness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema_version=AEGIS_UCI8_CI_WITNESS_V1"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "expected_parent_sha=$EXPECTED_PARENT_SHA"
            echo "authority=EVIDENCE_ONLY"
            echo "agi_claim=NOT_ESTABLISHED"
            echo "unit_tests_are_agi_proof=FALSE"
            echo "public_benchmark_campaign=NOT_RUN"
            echo "external_replication=NOT_ESTABLISHED"
            echo "schema_cardinality=22_REQUIRED_AND_TESTED"
            echo "inherited_uci456_proofline=131_REQUIRED_AND_TESTED"
            echo "inherited_uci7_protocol_and_guards=REQUIRED_AND_TESTED"
            echo "uci8_local_proofline=47_REQUIRED_AND_TESTED"
            echo "uci8_ci_guards=4_REQUIRED_AND_TESTED"
            echo "statistical_mode=PAIRED_DESCRIPTIVE_V1"
            echo "pair_replay_promotion=PAIR_LEVEL_HMAC_VERIFICATION_REQUIRED_AND_TESTED"
            echo "campaign_promotion_receipt=PREREGISTERED_NOT_IMPLEMENTED"
            echo "hmac_trust=SYMMETRIC_SHARED_KEY"
            echo "public_key_signature=NOT_ESTABLISHED"
            echo "preregistration_temporal_attestation=NOT_ESTABLISHED"
          } > "$RUNNER_TEMP/uci8-witness.txt"
          for path in "$RUNNER_TEMP"/uci8-*.log; do if [[ -f "$path" ]]; then cat "$path" >> "$RUNNER_TEMP/uci8-witness.txt"; fi; done

      - name: Upload UCI-8 witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uci8-evaluation-campaign-witness-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/uci8-witness.txt
            ${{ runner.temp }}/uci8-*.log
          if-no-files-found: error
