name: Weil Finite Source Calculus V1

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilFiniteSourceCalculusV1.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilFiniteSourceCalculusV1Spec.lean'
      - '.github/workflows/weil-finite-source-calculus-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  finite-source-calculus:
    name: verify finite single-frequency source calculus at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis rev-parse HEAD > exact-source.log
          sha256sum lake-manifest.json >> exact-source.log

      - name: Install pinned elan and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version >> exact-source.log

      - name: Compile candidate and preregistered contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          if test -f .aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteSourceCalculusV1.lean; then
            cp .aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteSourceCalculusV1.lean .
            sha256sum WeilFiniteSourceCalculusV1.lean >> exact-source.log
            lake env lean -o .lake/build/lib/lean/WeilFiniteSourceCalculusV1.olean WeilFiniteSourceCalculusV1.lean 2>&1 | tee WeilFiniteSourceCalculusV1.log
          fi
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilFiniteSourceCalculusV1Spec.lean .
          sha256sum WeilFiniteSourceCalculusV1Spec.lean >> exact-source.log
          lake env lean WeilFiniteSourceCalculusV1Spec.lean 2>&1 | tee WeilFiniteSourceCalculusV1Spec.log

      - name: Audit target closures
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > WeilFiniteSourceCalculusAudit.lean <<'EOF'
          import WeilFiniteSourceCalculusV1
          #print axioms weil_single_frequency_source_offdiag_v1
          #print axioms weil_single_frequency_source_diagonal_v1
          #print axioms weil_single_frequency_source_calculus_v1
          #print axioms weil_finite_source_measure_extension_v1
          #print axioms weil_finite_source_full_entry_identification_v1
          EOF
          lake env lean WeilFiniteSourceCalculusAudit.lean 2>&1 | tee WeilFiniteSourceCalculusAudit.log
          ! grep -q sorryAx WeilFiniteSourceCalculusAudit.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-finite-source-calculus-${{ env.SOURCE_SHA }}
          path: |
            exact-source.log
            *.log
          if-no-files-found: warn
          retention-days: 30
