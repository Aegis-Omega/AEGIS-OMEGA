name: KG-004 Trace Refinement

on:
  pull_request:
    paths:
      - "harness/sdk/trace_constraint_refinement.py"
      - "sovereign-omega-v2/python/tests/test_trace_constraint_refinement.py"
      - "sovereign-omega-v2/formal/theories/Core/TraceConstraintRefinement.v"
      - ".github/workflows/kg-004-trace-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-004-trace-refinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python-refinement:
    name: python semantic resolver falsifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Bind exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact pytest
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Run KG-004 falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_trace_constraint_refinement.py

  coq-refinement:
    name: coqc path-refinement theorem
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Bind exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Prepare evidence workspace
        shell: bash
        run: |
          mkdir -p kg-004-coq-evidence/assumptions
          printf '%s\n' "$SOURCE_SHA" > kg-004-coq-evidence/source-commit.txt
          chmod -R a+rwX kg-004-coq-evidence sovereign-omega-v2/formal/theories/Core
      - name: Kernel-check refinement theorem
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2/formal/theories/Core"
            OUT="$PWD/kg-004-coq-evidence"
            SRC="$ROOT/TraceConstraintRefinement.v"
            test -f "$SRC"
            if grep -En '^[[:space:]]*(Axiom|Parameter|Admitted)([[:space:]]|\.)|^[[:space:]]*admit([[:space:]]|\.)' "$SRC"; then
              echo 'FORBIDDEN_PROOF_ESCAPE_HATCH'
              exit 1
            fi
            coqc --version | tee "$OUT/coq-version.txt"
            (cd "$ROOT" && coqc ConstraintCarryingTransformation.v && coqc TraceConstraintRefinement.v) 2>&1 | tee "$OUT/compile.log"
            THEOREMS='resolver_valid_edge_is_constraint_carrying trace_path_refines_transform_chain trace_path_constraint_closure resolver_valid_path_preserves_provenance resolver_valid_path_preserves_restrictions resolver_valid_path_nonamplifies_authority'
            for theorem in $THEOREMS; do
              query="$OUT/assumptions/${theorem}.v"
              log="$OUT/assumptions/${theorem}.txt"
              printf 'Set Coqtop Exit On Error.\nRequire Import TraceConstraintRefinement.\nPrint Assumptions %s.\n' "$theorem" > "$query"
              (cd "$ROOT" && coqtop -quiet -batch -l "$query") > "$log" 2>&1
              grep -Fq 'Closed under the global context' "$log"
              rm -f "$query"
            done
            sha256sum "$SRC" > "$OUT/source.sha256"
      - name: Upload KG-004 Coq evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kg-004-coq-evidence-${{ env.SOURCE_SHA }}
          path: kg-004-coq-evidence/
          if-no-files-found: error
          retention-days: 30
