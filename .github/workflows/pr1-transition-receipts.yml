name: AEGIS PR-1 Transition Receipts Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - 'harness/sdk/transition_receipts.py'
      - 'harness/sdk/authority_client.py'
      - 'scripts/automaton3-authority.py'
      - 'scripts/run-automaton3-tests.py'
      - 'sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py'
      - 'sovereign-omega-v2/python/tests/test_transition_receipts_cli_pr1.py'
      - 'schemas/transition-identity-envelope.v1.schema.json'
      - 'schemas/decision-receipt.v1.schema.json'
      - 'schemas/execution-receipt.v1.schema.json'
      - 'schemas/effect-receipt.v1.schema.json'
      - '.github/workflows/pr1-transition-receipts.yml'
  push:
    branches: [main]
    paths:
      - 'harness/sdk/transition_receipts.py'
      - 'harness/sdk/authority_client.py'
      - 'scripts/automaton3-authority.py'
      - 'scripts/run-automaton3-tests.py'
      - 'sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py'
      - 'sovereign-omega-v2/python/tests/test_transition_receipts_cli_pr1.py'
      - 'schemas/transition-identity-envelope.v1.schema.json'
      - 'schemas/decision-receipt.v1.schema.json'
      - 'schemas/execution-receipt.v1.schema.json'
      - 'schemas/effect-receipt.v1.schema.json'
      - '.github/workflows/pr1-transition-receipts.yml'

permissions:
  contents: read

jobs:
  pr1-transition-receipts:
    name: aegis / pr1-transition-receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 --version

      - name: Run frozen PR-1 falsification suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-automaton3-tests.py \
            --output "$RUNNER_TEMP/PR1_TEST_SUMMARY.json" \
            --log "$RUNNER_TEMP/PR1_TEST.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'PR1_TEST_SUMMARY.json').read_text(encoding='utf-8'))
          required = {
              'expected_test_count': 57,
              'return_code': 0,
              'bypasses': 0,
              'pr1_safe_incompleteness_asserted': True,
              'transition_binding_asserted': True,
              'receipt_separation_asserted': True,
              'effect_receipt_schema_defined': True,
              'valid_effect_receipt_production_unavailable_asserted': True,
              'legacy_receipt_effect_evidence_forbidden_asserted': True,
              'legacy_fallback_forbidden_asserted': True,
              'effect_bound_admission_unavailable_asserted': True,
          }
          for key, expected in required.items():
              actual = summary.get(key)
              if actual != expected:
                  raise SystemExit(f'PR1_CONFORMANCE_FAIL {key}: expected={expected!r} actual={actual!r}')
          print('PR1_SAFE_INCOMPLETENESS_PASS')
          PY

      - name: Preserve PR-1 witness
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aegis-pr1-transition-receipts-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/PR1_TEST_SUMMARY.json
            ${{ runner.temp }}/PR1_TEST.log
          if-no-files-found: warn
          retention-days: 30
