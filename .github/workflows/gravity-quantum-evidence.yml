name: Gravity Quantum Evidence

on:
  push:
    branches:
      - research/gravity-quantum-interface-v1
    paths:
      - 'gravity_quantum/**'
      - 'verifiable/chain.py'
      - '.github/workflows/gravity-quantum-evidence.yml'
  pull_request:
    paths:
      - 'gravity_quantum/**'
      - 'verifiable/chain.py'
      - '.github/workflows/gravity-quantum-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gravity-quantum-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bounded evidence lane
        run: |
          python3 -m compileall -q gravity_quantum
          python3 -m py_compile verifiable/chain.py

      - name: Run V1 fail-closed falsifiers
        run: python3 -m gravity_quantum.test_evidence_pipeline

      - name: Run V2 fail-closed falsifiers
        run: |
          python3 -m unittest \
            gravity_quantum.test_measurement_v2 \
            gravity_quantum.test_v2_pipeline \
            -v

      - name: Emit replay-verifiable receipts
        run: |
          mkdir -p artifacts/gravity-quantum
          printf '%s\n' "${GITHUB_SHA}" > artifacts/gravity-quantum/head-sha.txt
          python3 -m gravity_quantum.evidence_pipeline > artifacts/gravity-quantum/receipt-v1.json
          python3 -m gravity_quantum.v2_pipeline > artifacts/gravity-quantum/receipt-v2.json
          (
            cd artifacts/gravity-quantum
            sha256sum head-sha.txt receipt-v1.json receipt-v2.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: gravity-quantum-evidence-${{ github.sha }}
          path: artifacts/gravity-quantum/
          if-no-files-found: error
