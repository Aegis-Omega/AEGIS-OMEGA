name: RH Finite Prime Phase Independent Replay

on:
  pull_request:
    paths:
      - 'research/rh/finite_prime_phase_independent.py'
      - 'research/rh/FINITE_PRIME_PHASE_INDEPENDENT.md'
      - 'research/rh/receipts/finite_prime_phase_independent_p20000.json'
      - '.github/workflows/rh-finite-prime-phase-independent.yml'
  push:
    branches:
      - research/rh-finite-prime-phase-independent-v1
    paths:
      - 'research/rh/finite_prime_phase_independent.py'
      - 'research/rh/FINITE_PRIME_PHASE_INDEPENDENT.md'
      - 'research/rh/receipts/finite_prime_phase_independent_p20000.json'
      - '.github/workflows/rh-finite-prime-phase-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-finite-prime-phase-independent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: exact-head Arb replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned Arb binding
        run: python -m pip install 'python-flint==0.9.0'

      - name: Compile research harness
        run: python -m py_compile research/rh/finite_prime_phase_independent.py

      - name: Replay interval-certified finite identities
        shell: bash
        run: |
          set -euo pipefail
          cp research/rh/receipts/finite_prime_phase_independent_p20000.json /tmp/expected-receipt.json
          PYTHONHASHSEED=0 python research/rh/finite_prime_phase_independent.py | tee /tmp/finite-prime-phase.log
          grep -Fq 'RESULT: ALL CHECKS PASS (interval-certified)' /tmp/finite-prime-phase.log
          cmp -s /tmp/expected-receipt.json research/rh/receipts/finite_prime_phase_independent_p20000.json
          git diff --exit-code -- research/rh/receipts/finite_prime_phase_independent_p20000.json
          sha256sum \
            research/rh/finite_prime_phase_independent.py \
            research/rh/receipts/finite_prime_phase_independent_p20000.json

      - name: Assert bounded authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EPISTEMIC_STATUS: INDEPENDENT_RECONSTRUCTION + INTERVAL_CERTIFIED' research/rh/finite_prime_phase_independent.py
          grep -Fq 'NOT CLAIMED: RH, the Weil positivity criterion, or any statement about zeros.' research/rh/finite_prime_phase_independent.py
          echo 'FINITE_PRIME_PHASE_REPLAY_PASS authority=INTERVAL_CERTIFIED_RECONSTRUCTION rh_proven=false'
