name: AEGIS RH Restricted Weil Final Bridge V13

on:
  push:
    branches:
      - 'proof/rh-restricted-weil-final-bridge-v13'
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean'
      - '.github/workflows/rh-restricted-weil-final-bridge-v13.yml'
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean'
      - '.github/workflows/rh-restricted-weil-final-bridge-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-restricted-weil-final-bridge-v13-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old, new = os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA'], os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          rm -f lake-manifest.json
          mkdir -p evidence .lake/build/lib/lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update mathlib
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Apply audited old-pin provider overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Hadamard/General/Factorization.lean')
          text = p.read_text()
          for old, new in [
              ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
               'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
              ('have hgz : g z = Q z := ite_eq_left rfl',
               'have hgz : g z = Q z := by simp [g]'),
              ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
               'rw [if_neg heq, hQ_eq_div z (hz heq)]')]:
              assert text.count(old) == 1
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Build pinned provider
        shell: bash
        run: |
          set -euo pipefail
          lake build Lc.LiCriterion.Basic Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge \
            Lc.LiCriterion.HadamardBridge Hadamard.OrderOne.LogDeriv Hadamard.OrderOne.LogDerivMultiplicity \
            Hadamard.OrderOne.TailEstimates

      - name: Compile AEGIS dependency closure (topological order)
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          files=(
            WeilMomentKillerConstructionV1
            ZeroCriticalStripV1
            ZeroHeightFiniteSumV1
            ZeroHeightLimitContractV1
            ZeroHeightSummabilityBridgeV1
            RestrictedWeilCriterionTargetWitnessV11
            ZeroMajorantSummabilityV1
            ZeroHeightShellMassV1
            ZeroShellQuadraticBoundV1
            ZeroShellAnalyticSynthesisV1
            ZeroCountingBoundV1
            WeilCriterionCompactSmoothV1
            MellinDecayEstimateV1
            ZeroCountingMellinSummabilityV1
            WeilMellinInversionV1
            WeilPrimeLineIdentityV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilAutocorrelationPoleAggregationV1
            WeilPoleTermV1
            WeilFixedLineExplicitFormulaContractV2
            WeilPairedHadamardFixedLineV1
            WeilPairedHadamardKernelTsumV2
            WeilFixedLineFubiniCoreV3
            WeilMellinWeightedFixedLineV2
            WeilFixedLineFubiniSwapV4
            WeilPairedMellinProfileV5
            WeilFixedLineKernelIntegralV6
            WeilFixedLineXSpaceTailV7
            WeilReciprocalPairedTestV8
            WeilDigammaIntegralReductionV1
            WeilDigammaSeriesRealV1
            WeilDigammaSeriesHalfPlaneV1
            WeilFixedLineGammaCoreV10
            WeilFixedLineGammaFubiniV10
            WeilFixedLineGammaAssemblyV10
            WeilArchimedeanCorrectionV10
            WeilFixedLineGammaXSpaceV10
            WeilFixedLineCompletedGammaV10
            WeilPairedZeroEvaluationV9
            WeilPairedHadamardTsumFusionV1
            WeilZeroCarrierBridgeV10
            WeilFixedLineZeroSideV10
            WeilXiLogDerivDecompositionV10
            WeilFixedLineArithmeticV10
            WeilExplicitFormulaV10
            WeilMixedClosureV2
            WeilThreeBlockRationalV1
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilLogCoordinateIsometryV21
            WeilThreeBlockAnalyticConstantsV21
            WeilDiagonalKernelReductionV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
            WeilThreeBlockCrossPrimeWindowV29
            WeilThreeBlockPrimeEvaluationV30
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockCrossAssemblyV30
            WeilSeparatedArchBridgeV31
            RHFinalClosureSpineV1
            WeilAutocorrelationExplicitFormulaV10
            WeilZeroSideIdentificationV1
            WeilTwoPointPositivityV1
            WeilAbjadFourPhaseBridgeV1
            RHTranslatedKernelDominanceV1
            RHMillenniumGateV10
            RestrictedWeilCriterionKernelBridgeV10
            WeilAutocorrelationMellinV11
            WeilZeroTranslationV11
            WeilZeroTwoPointV11
            RestrictedWeilCriterionResidueWitnessV11
            RestrictedWeilCriterionZeroKernelV10
            RestrictedWeilCriterionLaplaceV10
            RestrictedWeilCriterionResidueCoefficientV11
            WeilZeroKernelHermitianV11
            RHZeroKernelBoundV11
            RHZeroKernelLaplaceV12
            RHZeroKernelLaplaceAnalyticV12
          )
          : > evidence/source-sha256.txt
          for f in "${files[@]}"; do
            cp "$ROOT/$f.lean" "$f.lean"
            sha256sum "$f.lean" >> evidence/source-sha256.txt
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" > "evidence/$f.log" 2>&1 \
              || { cat "evidence/$f.log"; exit 1; }
          done

      - name: Compile exact producer and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          cp .aegis/sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean .
          lake env lean RestrictedWeilCriterionFinalV13.lean 2>&1 | tee evidence/final-v13.log
          ! grep -F 'sorryAx' evidence/final-v13.log
          ! grep -h 'sorryAx' evidence/*.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-restricted-weil-final-bridge-v13-${{ env.SOURCE_SHA }}
          path: evidence/
