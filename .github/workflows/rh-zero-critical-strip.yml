name: RH Zero Critical Strip

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroCriticalStripV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_critical_strip_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_critical_strip_v1.py'
      - '.github/workflows/rh-zero-critical-strip.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: 8dd25b1e5bf55d902fe5b57e8572e8e564d4c983
  LOWER_SHA: 4032b37cd7865b9dc545ff7797cb54290a7611b2
  LOWER_RECEIPT: 33e3e7bc12499798dfc94c177ff8b41cb2a63993d80b8f18419d0e5544406669
  LOWER_ARTIFACT: 510c575849a99ffe499e0e03332e5fede67d55357188b7241caede8108b9fc1f
  UPPER_SHA: 7364684165501a271ecf5a0fdbc4158b13e6f557
  UPPER_RECEIPT: 48648fae3fa78759acabf8473c08d618d99ff62a9239d23722dd72244a29daf7
  UPPER_ARTIFACT: bcbcc1ff968e43e048eac31dc35bd0f4a2c831750ec014819de8af8a02c67ab0
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  FORMAL_CONJECTURES_RH_BLOB_SHA: c8d38bef385eb15661c3daf7449625b66b019b2a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  HURWITZ_VALUES_BLOB_SHA: 4bdfedf2cf474a721e0687852a5782f304781eb7
  NONVANISHING_BLOB_SHA: 610bd56365d49c5ffa9ebeb29e0a383c768248e2
  RIEMANN_ZETA_BLOB_SHA: 3c92195fce20df7fda41cfd823b3266f83cf3070

jobs:
  critical-strip:
    name: pinned critical-strip localization
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroCriticalStripV1.lean)" = "$SOURCE_BLOB_SHA"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zero_critical_strip_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zero_critical_strip_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZERO_CRITICAL_STRIP_V1'
          p = m['verified_parent_evidence']
          lo, up = p['lower_localization'], p['upper_localization']
          assert (lo['aegis_revision'], lo['receipt_sha256'], lo['artifact_sha256']) == (os.environ['LOWER_SHA'], os.environ['LOWER_RECEIPT'], os.environ['LOWER_ARTIFACT'])
          assert (up['aegis_revision'], up['receipt_sha256'], up['artifact_sha256']) == (os.environ['UPPER_SHA'], os.environ['UPPER_RECEIPT'], os.environ['UPPER_ARTIFACT'])
          e = m['external_environment']
          assert e['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert e['formal_conjectures_rh_blob_sha'] == os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          assert m['formal_source']['git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          s = m['scope']
          assert s['full_critical_strip_localization'] == 'CANDIDATE'
          for key in ('critical_line_re_half','height_truncation_equivalence','radial_limit_existence','explicit_formula_theorem','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(git hash-object FormalConjectures/Millenium/RiemannHypothesis.lean)" = "$FORMAL_CONJECTURES_RH_BLOB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: lake exe cache get

      - name: Bind pinned Mathlib sources
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/HurwitzZetaValues.lean)" = "$HURWITZ_VALUES_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/Nonvanishing.lean)" = "$NONVANISHING_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/RiemannZeta.lean)" = "$RIEMANN_ZETA_BLOB_SHA"

      - name: Compile critical-strip localization
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-critical-strip-lean-version.txt"
          lake env lean "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroCriticalStripV1.lean" 2>&1 | tee "$GITHUB_WORKSPACE/zero-critical-strip-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-critical-strip-lean.log"

      - name: Emit fail-closed critical-strip receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroCriticalStripV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zero_critical_strip_v1.json')
          log = Path('zero-critical-strip-lean.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZERO_CRITICAL_STRIP_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'lower_parent_revision':os.environ['LOWER_SHA'],
            'lower_parent_receipt_sha256':os.environ['LOWER_RECEIPT'],
            'upper_parent_revision':os.environ['UPPER_SHA'],
            'upper_parent_receipt_sha256':os.environ['UPPER_RECEIPT'],
            'formal_conjectures_revision':os.environ['FORMAL_CONJECTURES_SHA'],
            'formal_conjectures_rh_blob_sha':os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'full_critical_strip_localization':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'critical_line_re_half':'OPEN',
            'height_truncation_equivalence':'OPEN',
            'radial_limit_existence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zero-critical-strip-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zero-critical-strip-receipt.json').read_text())
          PY

      - name: Upload critical-strip evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-critical-strip-${{ env.SOURCE_SHA }}
          path: |
            zero-critical-strip-lean-version.txt
            zero-critical-strip-lean.log
            zero-critical-strip-receipt.json
          if-no-files-found: error
          retention-days: 30
