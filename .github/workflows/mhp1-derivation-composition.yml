name: MHP-1 Derivation Composition

on:
  push:
    branches: [feat/mhp1-derivation-composition-v1]
    paths:
      - 'harness/sdk/heritage_composition.py'
      - 'harness/sdk/meaning_heritage.py'
      - 'harness/tests/test_heritage_derivation_composition.py'
      - 'harness/tests/test_heritage_transitive_composition.py'
      - '.github/workflows/mhp1-derivation-composition.yml'
  pull_request:
    paths:
      - 'harness/sdk/heritage_composition.py'
      - 'harness/sdk/meaning_heritage.py'
      - 'harness/tests/test_heritage_derivation_composition.py'
      - 'harness/tests/test_heritage_transitive_composition.py'
      - '.github/workflows/mhp1-derivation-composition.yml'

permissions:
  contents: read

concurrency:
  group: mhp1-derivation-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: aegis / mhp1-derivation-composition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile derivation composition contract and parent kernels
        run: |
          python -m py_compile \
            harness/sdk/meaning_heritage.py \
            harness/sdk/heritage_composition.py \
            harness/tests/test_heritage_derivation_composition.py \
            harness/tests/test_heritage_transitive_composition.py

      - name: Run RED or GREEN derivation composition suite
        run: |
          python -m pytest -q \
            harness/tests/test_heritage_derivation_composition.py \
            harness/tests/test_heritage_transitive_composition.py
