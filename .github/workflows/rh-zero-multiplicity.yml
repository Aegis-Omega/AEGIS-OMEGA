name: RH Zero Multiplicity

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroMultiplicityV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_multiplicity_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_multiplicity_v1.py'
      - '.github/workflows/rh-zero-multiplicity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PARENT_BOUNDED_ZERO_SHA: 3864bb8379fdfb79a9963dc802ee1d26ef9bad69
  PARENT_BOUNDED_ZERO_RECEIPT_SHA256: 871c3392db9aadce93dc59a1f6c91264d9724d322860fbb742ee6faf6fba2788
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  ZETA_ZEROS_BLOB_SHA: 0b8046e67ae5d1e613366e86fdf6b205eea3a6b1
  ANALYTIC_ORDER_BLOB_SHA: 43cc6d88cb0ecba9560d4c29a410b271d9432628
  SOURCE_SHA256: c4f8aa0e3b691abb99969b853cba94d6ef47a0794338418eb7bb7f8b7a99973f

jobs:
  multiplicity:
    name: pinned nontrivial-zero multiplicity weight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and source digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s  %s\n' \
            "$SOURCE_SHA256" \
            'sovereign-omega-v2/formal/bridges/lean/ZeroMultiplicityV1.lean' \
            | sha256sum -c -
          python3 -m unittest \
            sovereign-omega-v2/formal/tests/test_zero_multiplicity_v1.py \
            -v

      - name: Verify fail-closed multiplicity manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          m = json.loads(Path(
              'sovereign-omega-v2/formal/bridges/zero_multiplicity_v1.json'
          ).read_text(encoding='utf-8'))
          assert m['schema_version'] == 'AEGIS_ZERO_MULTIPLICITY_V1'
          assert m['namespace'] == 'mathematics.rh.zero_multiplicity'
          assert m['evidence_class'] == 'FORMAL_THEOREM_CANDIDATE'
          p = m['parent_bounded_zero']
          assert p['aegis_revision'] == os.environ['PARENT_BOUNDED_ZERO_SHA']
          assert p['bounded_zero_receipt_sha256'] == os.environ['PARENT_BOUNDED_ZERO_RECEIPT_SHA256']
          assert p['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert p['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert p['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          assert m['upstream_mathlib'][0]['git_blob_sha'] == os.environ['ZETA_ZEROS_BLOB_SHA']
          assert m['upstream_mathlib'][1]['git_blob_sha'] == os.environ['ANALYTIC_ORDER_BLOB_SHA']
          assert m['formal_source']['sha256'] == os.environ['SOURCE_SHA256']
          s = m['scope']
          assert s['nontrivial_zero_index'] == 'ENCODED'
          assert s['analytic_order_finite_at_nontrivial_zero'] == 'CANDIDATE'
          assert s['natural_multiplicity_positive'] == 'CANDIDATE'
          assert s['multiplicity_cast_recovers_analytic_order'] == 'CANDIDATE'
          assert s['pointwise_multiplicity_weighted_mellin_summand'] == 'ENCODED'
          assert s['global_zero_sum'] == 'OPEN'
          assert s['global_zero_sum_convergence'] == 'OPEN'
          assert s['explicit_formula_theorem'] == 'OPEN'
          assert s['rh_equivalence'] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition'] == {
              'decision': 'HOLD_RESEARCH_ONLY',
              'rh_proved': False,
              'rh_disproved': False,
              'claim_promotion': 'BLOCKED',
              'merge': 'NOT_PERFORMED',
              'authority_effect': 'NONE',
          }
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external project, Mathlib and Lean pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('lake-manifest.json').read_text(encoding='utf-8'))
          mathlib = next((p for p in manifest.get('packages', []) if p.get('name') == 'mathlib'), None)
          assert mathlib is not None
          assert (mathlib.get('rev') or mathlib.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Bind pinned Mathlib multiplicity sources
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/ZetaZeros.lean)" = "$ZETA_ZEROS_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Analytic/Order.lean)" = "$ANALYTIC_ORDER_BLOB_SHA"
          grep -F 'noncomputable def analyticOrderNatAt' \
            .lake/packages/mathlib/Mathlib/Analysis/Analytic/Order.lean

      - name: Compile zero multiplicity theorem
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-multiplicity-lean-version.txt"
          lake env lean \
            "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroMultiplicityV1.lean" \
            2>&1 | tee "$GITHUB_WORKSPACE/zero-multiplicity-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-multiplicity-lean.log"

      - name: Emit fail-closed multiplicity receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroMultiplicityV1.lean')
          manifest_path = Path('sovereign-omega-v2/formal/bridges/zero_multiplicity_v1.json')
          log = Path('zero-multiplicity-lean.log').read_text(encoding='utf-8')
          version = Path('zero-multiplicity-lean-version.txt').read_text(encoding='utf-8').strip()
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == os.environ['SOURCE_SHA256']
          assert 'sorryAx' not in log

          receipt = {
              'schema_version': 'AEGIS_ZERO_MULTIPLICITY_RECEIPT_V1',
              'source_commit': os.environ['SOURCE_SHA'],
              'formal_source_sha256': digest,
              'manifest_sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'parent_bounded_zero_revision': os.environ['PARENT_BOUNDED_ZERO_SHA'],
              'parent_bounded_zero_receipt_sha256': os.environ['PARENT_BOUNDED_ZERO_RECEIPT_SHA256'],
              'formal_conjectures_revision': os.environ['FORMAL_CONJECTURES_SHA'],
              'mathlib_revision': os.environ['MATHLIB_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'lean_version_output': version,
              'formal_theorem_compiled': True,
              'verified_scope': [
                  'NONTRIVIAL_ZERO_INDEX_BOUND',
                  'ANALYTIC_ORDER_FINITE_AT_NONTRIVIAL_ZERO',
                  'NATURAL_ZERO_MULTIPLICITY_STRICTLY_POSITIVE',
                  'MULTIPLICITY_CAST_RECOVERS_ANALYTIC_ORDER',
                  'POINTWISE_MULTIPLICITY_WEIGHTED_MELLIN_SUMMAND',
                  'NO_SORRYAX_IN_MULTIPLICITY_AXIOM_OUTPUT',
              ],
              'global_zero_sum': 'OPEN',
              'global_zero_sum_convergence': 'OPEN',
              'explicit_formula_theorem': 'OPEN',
              'rh_equivalence': 'OPEN',
              'rh_proved': False,
              'rh_disproved': False,
              'claim_promotion': 'BLOCKED',
              'decision': 'HOLD_RESEARCH_ONLY',
              'merge': 'NOT_PERFORMED',
              'authority_effect': 'NONE',
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          out = Path('zero-multiplicity-receipt.json')
          out.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload multiplicity evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-multiplicity-${{ env.SOURCE_SHA }}
          path: |
            zero-multiplicity-lean-version.txt
            zero-multiplicity-lean.log
            zero-multiplicity-receipt.json
          if-no-files-found: error
          retention-days: 30
