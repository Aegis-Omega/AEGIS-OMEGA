name: AEGIS Agent Dispatch

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, review_requested]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    name: Dispatch to AEGIS Agent Ecosystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    # PROXY_URL is non-secret routing configuration. The dispatch step separately
    # requires AEGIS_PLATFORM_API_KEY and fails closed when it is absent.
    if: vars.PROXY_URL != ''

    steps:
      - name: Determine event type and payload
        id: classify
        # Untrusted GitHub event fields are transported through environment
        # variables and compact JSON, never interpolated into shell source.
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_LABEL: ${{ github.event.label.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          EVENT_TYPE=""
          PAYLOAD="{}"

          is_trusted_association() {
            case "$1" in
              OWNER|MEMBER|COLLABORATOR) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # A CI result originating from a fork is evidence, not authorization
            # to spend agent/model resources.
            if [ "$WF_HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
              printf 'Skipping workflow_run from untrusted repository: %s\n' "$WF_HEAD_REPOSITORY"
            elif [ "$WF_CONCLUSION" = "failure" ]; then
              EVENT_TYPE="github_ci_failure"
              PAYLOAD=$(jq -cn \
                --arg branch "$WF_BRANCH" \
                --arg run_id "$WF_RUN_ID" \
                --arg conclusion "$WF_CONCLUSION" \
                '{"branch":$branch,"run_id":$run_id,"failures":$conclusion}')
            elif [ "$WF_CONCLUSION" = "success" ]; then
              EVENT_TYPE="github_ci_success"
              PAYLOAD=$(jq -cn \
                --arg branch "$WF_BRANCH" \
                '{"branch":$branch}')
            fi

          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Public/fork PRs must not become a model-spend trigger merely by
            # opening or synchronizing a branch.
            if is_trusted_association "$PR_ASSOCIATION"; then
              EVENT_TYPE="github_pr_opened"
              PAYLOAD=$(jq -cn \
                --arg title "$PR_TITLE" \
                --arg number "$PR_NUMBER" \
                --arg url "$PR_URL" \
                '{"title":$title,"number":$number,"url":$url}')
            else
              printf 'Skipping untrusted PR association: %s\n' "$PR_ASSOCIATION"
            fi

          elif [ "$EVENT_NAME" = "issues" ]; then
            # A maintainer-applied label is the explicit authorization edge for
            # issue-originated dispatch. Opening an issue alone is insufficient.
            if [ "$ISSUE_LABEL" = "aegis-dispatch-approved" ]; then
              EVENT_TYPE="github_issue_approved"
              PAYLOAD=$(jq -cn \
                --arg title "$ISSUE_TITLE" \
                --arg number "$ISSUE_NUMBER" \
                --arg body "$ISSUE_BODY" \
                '{"title":$title,"number":$number,"body":$body}')
            fi

          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # Mention-based dispatch is accepted only from repository-trusted
            # actors; untrusted comment text remains data, never authority.
            if is_trusted_association "$COMMENT_ASSOCIATION" && \
               printf '%s' "$COMMENT_BODY" | grep -Fq "@aegis-agent"; then
              EVENT_TYPE="github_pr_comment"
              PAYLOAD=$(jq -cn \
                --arg body "$COMMENT_BODY" \
                --arg number "$COMMENT_ISSUE_NUMBER" \
                '{"body":$body,"number":$number}')
            fi
          fi

          # jq -c guarantees one-line JSON, so GitHub's line-oriented output
          # protocol cannot be broken by newlines in issue/comment content.
          printf 'event_type=%s\n' "$EVENT_TYPE" >> "$GITHUB_OUTPUT"
          printf 'payload=%s\n' "$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Dispatch to AEGIS constitutional proxy
        if: steps.classify.outputs.event_type != ''
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
          AEGIS_PLATFORM_API_KEY: ${{ secrets.AEGIS_PLATFORM_API_KEY }}
          DISPATCH_EVENT_TYPE: ${{ steps.classify.outputs.event_type }}
          DISPATCH_PAYLOAD: ${{ steps.classify.outputs.payload }}
        run: |
          set -euo pipefail

          if [ -z "$AEGIS_PLATFORM_API_KEY" ]; then
            echo "AEGIS_PLATFORM_API_KEY is required for agent dispatch" >&2
            exit 2
          fi

          case "$PROXY_URL" in
            https://*) ;;
            *) echo "PROXY_URL must use https://" >&2; exit 2 ;;
          esac

          REQUEST_BODY=$(jq -cn \
            --arg event_type "$DISPATCH_EVENT_TYPE" \
            --argjson payload "$DISPATCH_PAYLOAD" \
            '{"event_type":$event_type,"payload":$payload}')

          curl --fail-with-body --show-error --silent \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 30 \
            --retry 2 --retry-all-errors \
            -X POST "$PROXY_URL/agents/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $AEGIS_PLATFORM_API_KEY" \
            --data-binary "$REQUEST_BODY" \
            | jq '.results[] | {role, ralph_cycles, is_valid, output: (.output | .[0:500])}'
