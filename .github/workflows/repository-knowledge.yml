name: Repository Knowledge Cartography

on:
  push:
    branches:
      - feat/repository-cartographer-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-knowledge:
    name: aegis / repository-knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run repository cartographer contract
        shell: bash
        run: python scripts/test-repository-cartographer.py

      - name: Assert authority neutrality
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents:[[:space:]]*write|id-token:[[:space:]]*write|attestations:[[:space:]]*write|deployments:[[:space:]]*write' .github/workflows/repository-knowledge.yml
