name: AEGIS Platform Epistemic Reconciliation Bootstrap

on:
  push:
    branches: ['reconcile/platform-epistemic-boundaries-v1']
    paths:
      - '.github/workflows/platform-epistemic-reconciliation-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    name: Exact semantic-delta reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: a34d664d66ae9f7c2e729cd4ccb07b74130c660f
      SWARM_SHA: 66a3a78057c1bdc9c38bd1a4651ec9394b899aa7
      AUTONOMOUS_SHA: 70d6247bbcbe75916c870f59c7cd31623faed080
      BRIDGE_SHA: a77dfd4c2d6b92cdf5ad629c7137ed3485353277
      LIVE_STATE_SHA: f990659ecf1cddf40a0114ad79983eafbf384d22
      TEMPLATE_SHA: 534052e82adff26b6c9e0271ec15af437a74e6f5
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: reconcile/platform-epistemic-boundaries-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Assert bounded pre-composition branch state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          actual="$(git diff --name-only "$BASE_SHA..HEAD" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.claude.json' \
            '.github/workflows/platform-epistemic-reconciliation-bootstrap.yml' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"

          git show "$BASE_SHA:.claude.json" > /tmp/base-claude.json
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/base-claude.json').read_text())
          current = json.loads(Path('.claude.json').read_text())

          allowed = (
              ('provenance', 'source_ref'),
              ('provenance', 'parent_state_hash'),
              ('state_hash',),
          )
          for path in allowed:
              b = base
              c = current
              for key in path[:-1]:
                  b = b[key]
                  c = c[key]
              b.pop(path[-1], None)
              c.pop(path[-1], None)

          if base != current:
              raise SystemExit('UNBOUNDED_COGNITIVE_MANIFEST_CHANGE')
          PY

          printf 'PRECOMPOSITION_STATE=BOUNDED\n'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Replay frozen semantic deltas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          replay_delta() {
            label="$1"
            sha="$2"
            shift 2

            git fetch --no-tags origin "$sha"
            git merge-base --is-ancestor "$BASE_SHA" "$sha"
            merge_count="$(git rev-list --count --merges "$BASE_SHA..$sha")"
            test "$merge_count" = "0"

            patch="/tmp/${label}.patch"
            git diff --binary "$BASE_SHA" "$sha" -- "$@" > "$patch"
            test -s "$patch"

            printf 'REPLAY=%s SOURCE=%s\n' "$label" "$sha"
            git apply --3way --index "$patch"
            git diff --cached --check
            git commit -m "reconcile(${label}): replay frozen verified semantic delta"
          }

          replay_delta swarm "$SWARM_SHA" \
            .github/workflows/swarm-epistemic-boundary.yml \
            sovereign-omega-v2/python/platform_helpers.py \
            sovereign-omega-v2/python/tests/test_platform.py \
            sovereign-omega-v2/python/tests/test_swarm_epistemic_boundary.py

          replay_delta autonomous "$AUTONOMOUS_SHA" \
            .github/workflows/autonomous-agent-evidence-boundary.yml \
            sovereign-omega-v2/python/platform_helpers.py \
            sovereign-omega-v2/python/tests/test_autonomous_agent_evidence_boundary.py

          replay_delta bridge "$BRIDGE_SHA" \
            .github/workflows/bridge-evidence-composition.yml \
            sovereign-omega-v2/python/bridge.py \
            sovereign-omega-v2/python/tests/test_bridge_evidence_composition.py

          replay_delta live-state "$LIVE_STATE_SHA" \
            .github/workflows/live-state-truthfulness.yml \
            sovereign-omega-v2/python/bridge.py \
            sovereign-omega-v2/python/tests/test_live_state_truthfulness.py

          replay_delta template "$TEMPLATE_SHA" \
            .github/workflows/template-epistemic-boundary.yml \
            sovereign-omega-v2/python/platform_helpers.py \
            sovereign-omega-v2/python/tests/test_platform.py \
            sovereign-omega-v2/python/tests/test_template_epistemic_boundary.py

          git diff --check "$BASE_SHA..HEAD"

      - name: Run all focused epistemic contracts
        shell: bash
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_swarm_epistemic_boundary.py
          python sovereign-omega-v2/python/tests/test_autonomous_agent_evidence_boundary.py
          python sovereign-omega-v2/python/tests/test_bridge_evidence_composition.py
          python sovereign-omega-v2/python/tests/test_live_state_truthfulness.py
          python sovereign-omega-v2/python/tests/test_template_epistemic_boundary.py
          python sovereign-omega-v2/python/tests/test_platform.py

      - name: Seal reconciliation provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reconciliation-ledger.txt <<EOF
          BASE_SHA=$BASE_SHA
          SWARM_SHA=$SWARM_SHA
          AUTONOMOUS_SHA=$AUTONOMOUS_SHA
          BRIDGE_SHA=$BRIDGE_SHA
          LIVE_STATE_SHA=$LIVE_STATE_SHA
          TEMPLATE_SHA=$TEMPLATE_SHA
          RESULT_HEAD=$(git rev-parse HEAD)
          EOF
          cat /tmp/reconciliation-ledger.txt

      - name: Push reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:reconcile/platform-epistemic-boundaries-v1
