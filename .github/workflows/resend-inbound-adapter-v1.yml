name: Resend inbound adapter v1

on:
  pull_request:
    paths:
      - 'harness/sdk/resend_inbound.py'
      - 'tests/test_resend_inbound.py'
      - 'tests/test_resend_inbound_ingest.py'
      - 'scripts/resend_inbound_ingest.py'
      - 'tests/fixtures/resend_inbound/**'
      - 'docs/resend-inbound-contract-v1.md'
      - '.github/workflows/resend-inbound-adapter-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact candidate
        run: |
          echo "candidate_sha=${GITHUB_SHA}"
          test -n "${GITHUB_SHA}"
      - name: Install exact schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate metadata schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          path = Path('schemas/resend-inbound-metadata.v1.schema.json')
          schema = json.loads(path.read_text(encoding='utf-8'))
          validator_for(schema).check_schema(schema)
          print(f'SCHEMA_OK {path}')
          PY
      - name: Compile adapter and regression
        run: python -m compileall -q harness/sdk/resend_inbound.py scripts/resend_inbound_ingest.py tests/test_resend_inbound.py tests/test_resend_inbound_ingest.py
      - name: Run bounded inbound regression
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_resend_inbound*.py' -v
