name: QForm Error Algebra

on:
  push:
    branches: [proof/qform-error-algebra-v1]
    paths:
      - 'sovereign-omega-v2/formal/tests/Weil/QFormErrorAlgebraSpec.v'
      - 'sovereign-omega-v2/formal/theories/Weil/QFormErrorAlgebra.v'
      - '.github/workflows/qform-error-algebra.yml'
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/tests/Weil/QFormErrorAlgebraSpec.v'
      - 'sovereign-omega-v2/formal/theories/Weil/QFormErrorAlgebra.v'
      - '.github/workflows/qform-error-algebra.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  attest:
    name: coqc / QForm quotient stability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Reject declared assumptions in authority source when present
        shell: bash
        run: |
          set -euo pipefail
          src=sovereign-omega-v2/formal/theories/Weil/QFormErrorAlgebra.v
          if test -f "$src" && grep -En '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted)[[:space:].]' "$src"; then
            echo "Declared assumption/admission forbidden: $src" >&2
            exit 1
          fi

      - name: Prepare writable evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/qform-error-algebra-attestation
          chmod -R a+rwX sovereign-omega-v2/formal/theories/Weil sovereign-omega-v2/formal/tests/Weil sovereign-omega-v2/qform-error-algebra-attestation

      - name: Compile preregistered specification
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            DIR="$ROOT/formal/theories/Weil"
            TEST="$ROOT/formal/tests/Weil/QFormErrorAlgebraSpec.v"
            OUT="$ROOT/qform-error-algebra-attestation"
            cd "$DIR"
            coqc --version | tee "$OUT/coq-version.txt"
            if test -f QFormErrorAlgebra.v; then
              coqc QFormErrorAlgebra.v 2>&1 | tee "$OUT/qform-error-algebra.log"
            fi
            coqc "$TEST" 2>&1 | tee "$OUT/qform-error-algebra-spec.log"

            for theorem in normalized_quotient_cross_error_v1 normalized_quotient_stability_v1; do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              printf 'Set Coqtop Exit On Error.\nRequire Import QFormErrorAlgebra.\nPrint Assumptions %s.\n' "$theorem" > "$query"
              coqtop -quiet -batch -l "$query" > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for $theorem" >&2
                exit 1
              fi
            done

      - name: Emit formal algebra receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path('qform-error-algebra-attestation')
          source = Path('formal/theories/Weil/QFormErrorAlgebra.v')
          payload = {
              'receipt_kind': 'AEGIS_QFORM_ERROR_ALGEBRA_RECEIPT_V1',
              'source_commit': '${{ env.SOURCE_SHA }}',
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'rational_cross_error_kernel_machine_bound': True,
              'rational_normalized_quotient_stability_machine_bound': True,
              'constructive_real_transport_machine_bound': False,
              'gaussian_tail_inequality_machine_bound': False,
              'composite_trapezoid_theorem_machine_bound': False,
              'analytic_error_bound_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = out / 'qform-error-algebra-receipt.json'
          target.write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n')
          print(target.read_text())
          assert payload['constructive_real_transport_machine_bound'] is False
          assert payload['rh_proven'] is False
          PY

      - name: Upload QForm error algebra evidence
        uses: actions/upload-artifact@v4
        with:
          name: qform-error-algebra-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/qform-error-algebra-attestation/
          if-no-files-found: error
          retention-days: 30
