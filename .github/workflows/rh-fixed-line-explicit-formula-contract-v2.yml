name: RH Fixed-Line Explicit Formula Contract V2

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilPoleTermV1.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/WeilFixedLineExplicitFormulaContractV2.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilFixedLineExplicitFormulaContractV2Spec.lean'
      - '.github/workflows/rh-fixed-line-explicit-formula-contract-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_507_SHA: d88587788630a5bafa12fdeb0619f3806f89d035
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11

jobs:
  fixed-line-contract:
    name: verify corrected fixed-line contract at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact external proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false

      - name: Verify #507 ancestry, old pin, and inherited blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .aegis merge-base --is-ancestor "$BASE_507_SHA" "$SOURCE_SHA"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationClosureV1.lean)" = "8a578da0d379d2a643c2ce436a97a4ff5e3531eb"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPoleAggregationV1.lean)" = "bb785359eda0b4e03cea65de65bc21c9a0a70191"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/ZeroCountingMellinSummabilityV1.lean)" = "01509b3933039aa595c83f366bbe90a44f2a4d81"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilPrimeLineIdentityV1.lean)" = "4db96b150c658897e571a157acd29831c7838ec5"
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          rm -f lake-manifest.json

      - name: Install pinned elan and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update mathlib
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get
          lean --version

      - name: Build multiplicity provider
        shell: bash
        run: |
          set -euo pipefail
          lake build Hadamard.OrderOne.TailEstimates Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge

      - name: Compile inherited #488/#490/#493/#507 DAG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          files=(
            WeilCriterionCompactSmoothV1
            ZeroCriticalStripV1
            ZeroHeightFiniteSumV1
            ZeroHeightLimitContractV1
            ZeroHeightSummabilityBridgeV1
            ZeroMajorantSummabilityV1
            ZeroHeightShellMassV1
            ZeroShellQuadraticBoundV1
            ZeroShellAnalyticSynthesisV1
            ZeroCountingBoundV1
            MellinDecayEstimateV1
            ZeroCountingMellinSummabilityV1
            WeilMellinInversionV1
            WeilPrimeLineIdentityV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilAutocorrelationPoleAggregationV1
          )
          for f in "${files[@]}"; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
          done

      - name: Compile port and corrected contract when present
        shell: bash
        run: |
          set -euo pipefail
          for f in WeilPoleTermV1 WeilFixedLineExplicitFormulaContractV2; do
            if [[ -f ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" ]]; then
              cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
              lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"
            fi
          done

      - name: Compile preregistered contract spec
        shell: bash
        run: |
          set -euo pipefail
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilFixedLineExplicitFormulaContractV2Spec.lean .
          lake env lean WeilFixedLineExplicitFormulaContractV2Spec.lean 2>&1 | tee fixed-line-contract-spec.log

      - name: Audit new theorem surface when GREEN
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > FixedLineContractAudit.lean <<'EOF'
          import WeilFixedLineExplicitFormulaContractV2
          #print axioms WeilPoleTerm.neg_logDeriv_riemannZeta_residue_one
          #print axioms WeilPoleTerm.weil_pole_term_v1
          #print axioms WeilPoleTerm.vonMangoldt_lseries_eq_neg_logDeriv_v1
          #print axioms weil_autocorrelation_zero_residue_summable_v2
          #print axioms weil_autocorrelation_zero_residue_norm_summable_v2
          #print axioms weil_autocorrelation_prime_line_identity_v2
          #print axioms weil_autocorrelation_fixed_line_readiness_v2
          #print axioms weil_autocorrelation_fixed_line_readiness_of_moments_v2
          EOF
          lake env lean FixedLineContractAudit.lean 2>&1 | tee fixed-line-contract-axioms.log
          ! grep -F 'sorryAx' fixed-line-contract-axioms.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-fixed-line-contract-v2-${{ env.SOURCE_SHA }}
          path: |
            *.log
          if-no-files-found: warn
          retention-days: 30
