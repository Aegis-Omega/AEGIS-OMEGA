name: Promote Main-Governed Manifest Signer V1

on:
  push:
    branches:
      - control/fix-main-governed-manifest-signer-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: rebind/mycorrhizal-1bna-registry-secure-main-signed-v1
      EXPECTED_PARENT: 6857aecf1af14e0315c10f2268fd233ed0a1ad7c
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Promote GitHub-signed manifest writer fix
        run: node .github/scripts/promote-main-governed-manifest-signer-v1.mjs
