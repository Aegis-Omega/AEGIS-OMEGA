name: M1 Record Contract V2

on:
  push:
    branches:
      - diagnostic/m1-record-contract-v2
  pull_request:
    branches:
      - fix/m1-wrap-fail-closed-v1
    paths:
      - sovereign-omega-v2/python/m1_record_contract_v2.py
      - sovereign-omega-v2/python/tests/test_m1_record_contract_v2.py
      - .github/workflows/m1-record-contract-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-record-contract-v2:
    name: M1 fixed-record transitive-chain contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run diagnostic/reference contract
        run: python sovereign-omega-v2/python/tests/test_m1_record_contract_v2.py
