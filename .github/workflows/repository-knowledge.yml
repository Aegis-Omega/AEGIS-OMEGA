name: Repository Knowledge Cartography

on:
  push:
    branches:
      - feat/repository-cartographer-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-knowledge:
    name: aegis / repository-knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run repository cartographer contract
        shell: bash
        run: python scripts/test-repository-cartographer.py


      - name: Produce exact-head image content observation (no authority)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path
          from harness.sdk.repository_knowledge import (
              build_snapshot, build_runtime_export_manifest,
              verify_runtime_export_manifest,
          )
          repo = Path.cwd()
          snapshot = build_snapshot(repo, repository_id=1095915905,
                                    repository_full_name="Aegis-Omega/AEGIS-OMEGA")
          assert snapshot["source_head_sha"] == os.environ["CANDIDATE_SHA"]
          manifest = build_runtime_export_manifest(snapshot)
          with tempfile.TemporaryDirectory() as temp:
              image = Path(temp)
              for record in manifest["files"]:
                  path = record["path"]
                  src = repo / ("vertex/serve.py" if path == "serve.py" else path)
                  target = image / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, target)
              result = verify_runtime_export_manifest(
                  image, manifest, expected_head=os.environ["CANDIDATE_SHA"])
              assert result["status"] == "CONTENT_MATCH_ONLY", result
              assert result["authority"] == "NOT_GRANTED", result
          out = Path(os.environ["RUNNER_TEMP"]) / "runtime-export"
          out.mkdir(exist_ok=True)
          (out / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n")
          (out / "receipt.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n")
          print(json.dumps({"source_head": manifest["source_head_sha"],
              "source_tree": manifest["source_tree_sha"], "files": len(manifest["files"]),
              "observation": result["status"], "authority": result["authority"]},
              sort_keys=True))
          PY


      - name: Validate real Docker source layer offline (no registry or Cloud Build)
        shell: bash
        run: |
          set -euo pipefail
          # Local source stage does not pull a base, run a container, or install deps.
          probe="aegis-source-probe:$CANDIDATE_SHA"
          docker build --target source-payload --network none \
            --file vertex/Dockerfile --tag "$probe" .
          container="$(docker create "$probe" /bin/true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          image_root="$RUNNER_TEMP/runtime-export/docker-source-layer"
          mkdir -p "$image_root"
          docker cp "$container:/app/." "$image_root/"
          IMAGE_ROOT="$image_root" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from harness.sdk.repository_knowledge import verify_runtime_export_manifest
          output = Path(os.environ["RUNNER_TEMP"]) / "runtime-export"
          manifest = json.loads((output / "manifest.json").read_text(encoding="utf-8"))
          receipt = verify_runtime_export_manifest(
              Path(os.environ["IMAGE_ROOT"]), manifest,
              expected_head=os.environ["CANDIDATE_SHA"],
          )
          if receipt["status"] != "CONTENT_MATCH_ONLY" or receipt["authority"] != "NOT_GRANTED":
              raise SystemExit("DENIED: Docker source payload differs from exact Git source: "
                               + json.dumps(receipt, sort_keys=True))
          (output / "docker-source-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"source_head_sha": receipt["source_head_sha"],
                            "status": receipt["status"], "authority": receipt["authority"],
                            "scope": "SOURCE_LAYER_ONLY",
                            "image_attestation": "NOT_PRESENT"}, sort_keys=True))
          PY
          # Do not upload extracted source files. Upload only content metadata.
          rm -rf -- "$image_root"


      - name: Upload image content evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-export-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/runtime-export/
          if-no-files-found: error
          retention-days: 14

      - name: Assert authority neutrality
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents:[[:space:]]*write|id-token:[[:space:]]*write|attestations:[[:space:]]*write|deployments:[[:space:]]*write' .github/workflows/repository-knowledge.yml
