name: Publish Cognitive Writer Transition Anchors V1

on:
  push:
    branches:
      - control/publish-cognitive-writer-transition-anchors-v1

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: transition/cognitive-writer-digest-allowlist-signed-v1
      EXPECTED_TARGET_HEAD: 2a5c10114af37a40ba297ea1c85e8cb9b5bbe708
      ARTIFACT_ID: '10486688612'
      ARTIFACT_SHA256: 2a4c1ba06b36a82f0efbe8483ec3b536f37831b1a8eadf69e191fdc7f1a0888c
      MANIFEST_SHA256: 0cc257c97ebf4443f7078b274152f8a45c4c2f5ab42276e57bf1ab5dfd54505e
      SKILL_HASHES_SHA256: 8deeb1db0f70b89b381c9311b978b3224fa5253e4e8337547f36a3f13b1371b1
      EXPECTED_PARENT_STATE: 8de11bf84d283cd248ae017c5914ef592a9d922d41cda91e59450369a72edcdb
      EXPECTED_STATE: 80e91cfeda2bc8a5aec2b6e087623e3139d49676b227ca5437dc15e83c265cb7
    steps:
      - name: Download exact Automaton-2 expected-anchor artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/anchors.zip"
          echo "$ARTIFACT_SHA256  $RUNNER_TEMP/anchors.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/anchors"
          unzip -q "$RUNNER_TEMP/anchors.zip" -d "$RUNNER_TEMP/anchors"
          test -f "$RUNNER_TEMP/anchors/.claude.json"
          test -f "$RUNNER_TEMP/anchors/skill-hashes.sha256"
          echo "$MANIFEST_SHA256  $RUNNER_TEMP/anchors/.claude.json" | sha256sum -c -
          echo "$SKILL_HASHES_SHA256  $RUNNER_TEMP/anchors/skill-hashes.sha256" | sha256sum -c -

      - name: Verify exact governed anchor semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/anchors/.claude.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          obj = json.load(open(path, encoding='utf-8'))
          assert obj['provenance']['source_ref'] == os.environ['TARGET_BRANCH']
          assert obj['provenance']['parent_state_hash'] == os.environ['EXPECTED_PARENT_STATE']
          assert obj['state_hash'] == os.environ['EXPECTED_STATE']
          print('ANCHOR_SEMANTICS_OK')
          PY

      - name: Create GitHub-signed exact-anchor child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.TARGET_BRANCH;
          const expectedHead = process.env.EXPECTED_TARGET_HEAD;

          const refResponse = await fetch(
            `https://api.github.com/repos/${repo}/branches/${encodeURIComponent(branch)}`,
            {
              headers: {
                authorization: `bearer ${token}`,
                accept: 'application/vnd.github+json',
                'user-agent': 'aegis-signed-anchor-rebind-v1',
              },
            }
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== expectedHead) {
            console.error(`STALE_TARGET expected=${expectedHead} live=${refBody.commit.sha}`);
            process.exit(1);
          }

          const files = [
            ['.claude.json', `${process.env.RUNNER_TEMP}/anchors/.claude.json`],
            ['skill-hashes.sha256', `${process.env.RUNNER_TEMP}/anchors/skill-hashes.sha256`],
          ];
          const additions = files.map(([path, local]) => ({
            path,
            contents: fs.readFileSync(local).toString('base64'),
          }));
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }`;
          const variables = {
            input: {
              branch: { repositoryNameWithOwner: repo, branchName: branch },
              expectedHeadOid: expectedHead,
              message: { headline: 'chore(manifest): signed rebind expected cognitive anchors' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-signed-anchor-rebind-v1',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_ANCHOR_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_ANCHOR_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
