name: RH Autocorrelation Pole Aggregation

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPoleAggregationV1.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationClosureV1.lean'
      - '.github/workflows/rh-autocorrelation-pole-aggregation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  pole-aggregation:
    name: verify Mellin endpoint aggregation at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact pins and inherited blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationClosureV1.lean)" = "8a578da0d379d2a643c2ce436a97a4ff5e3531eb"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/WeilMellinInversionV1.lean)" = "b88e90577394aa5cd800d5ea7c8fd411bc4f2468"
          git -C .aegis rev-parse HEAD > exact-source.log
          sha256sum lake-manifest.json >> exact-source.log

      - name: Install pinned elan and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version >> exact-source.log

      - name: Compile proven Mellin DAG, autocorrelation closure and pole aggregation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          proof_compile_failed=0
          for f in WeilCriterionCompactSmoothV1 ZeroCriticalStripV1 ZeroHeightFiniteSumV1 ZeroHeightLimitContractV1 ZeroHeightSummabilityBridgeV1 ZeroMajorantSummabilityV1 ZeroHeightShellMassV1 ZeroShellQuadraticBoundV1 ZeroShellAnalyticSynthesisV1 MellinDecayEstimateV1 WeilMellinInversionV1 WeilPrimeSummabilityV1 WeilArchimedeanConvergenceV1 WeilAutocorrelationRealityV1 WeilAutocorrelationClosureV1 WeilAutocorrelationPoleAggregationV1; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "$f.lean"
            sha256sum "$f.lean" >> exact-source.log
            if ! lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "$f.log"; then
              proof_compile_failed=1
            fi
          done
          test "$proof_compile_failed" = 0

      - name: Audit exact theorem surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT_SOURCE'
          from pathlib import Path
          import json, re
          src = Path('WeilAutocorrelationPoleAggregationV1.lean').read_text()
          names = re.findall(r'^theorem ([a-zA-Z0-9_]+)', src, re.M)
          assert len(names) == 8, names
          Path('expected-theorems.json').write_text(json.dumps(names, indent=2) + '\n')
          Path('PoleAggregationAudit.lean').write_text(
              'import WeilAutocorrelationPoleAggregationV1\n' +
              '\n'.join('#print axioms ' + n for n in names) + '\n')
          PY_AUDIT_SOURCE
          lake env lean PoleAggregationAudit.lean 2>&1 | tee pole-aggregation-axioms.log
          python3 - <<'PY_AUDIT_LOG'
          from pathlib import Path
          import json, re
          names = json.loads(Path('expected-theorems.json').read_text())
          log = Path('pole-aggregation-axioms.log').read_text()
          assert 'sorryAx' not in log
          for name in names:
              if "'" + name + "' does not depend on any axioms" in log:
                  continue
              m = re.search(re.escape("'" + name + "' depends on axioms: ") + r"\[([^\]]*)\]", log, re.S)
              assert m, name
              axioms = {x.strip() for x in m[1].split(',') if x.strip()}
              assert axioms <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, axioms)
          print('PASS: 8 theorem closures audited; endpoint factorization binding remains separate; RH=NOT_PROVEN; authority_effect=NONE')
          PY_AUDIT_LOG

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-autocorrelation-pole-aggregation-${{ env.SOURCE_SHA }}
          path: |
            exact-source.log
            Weil*.log
            pole-aggregation-axioms.log
            expected-theorems.json
          if-no-files-found: warn
          retention-days: 30
