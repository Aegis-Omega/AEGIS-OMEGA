name: JCS cross-engine parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'sovereign-omega-v2/src/core/canonicalize.ts'
      - 'sovereign-omega-v2/packages/kernel/**'
      - 'sovereign-omega-v2/test/determinism/rfc8785-utf16-order.test.ts'
      - 'sovereign-omega-v2/test/determinism/wasm-kernel.test.ts'
      - 'sovereign-omega-v2/test/determinism/jcs-historical-compat.test.ts'
      - 'sovereign-omega-v2/python/tests/test_canon_equivalence.py'
      - '.github/workflows/jcs-cross-engine.yml'

permissions:
  contents: read

concurrency:
  group: jcs-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonicalization-parity:
    name: Rust build + actual WASM/TypeScript parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sovereign-omega-v2
    steps:
      - name: Checkout exact pull-request candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sovereign-omega-v2/package-lock.json

      - name: Validate hosted Rust toolchain and install WASM target
        run: |
          rustc --version
          cargo --version
          rustup target add wasm32-unknown-unknown

      - name: Install locked Node dependencies
        run: npm ci

      - name: Compile and execute Rust kernel tests
        run: cargo test --locked -p kernel

      - name: Compile real WASM kernel (no skipped parity)
        run: |
          cargo build --locked --target wasm32-unknown-unknown --release -p kernel
          test -s target/wasm32-unknown-unknown/release/kernel.wasm

      - name: Run Unicode regression and real WASM parity
        run: |
          test -s target/wasm32-unknown-unknown/release/kernel.wasm
          npx vitest run test/unit/jcs.test.ts test/determinism/rfc8785-utf16-order.test.ts test/determinism/wasm-kernel.test.ts test/determinism/jcs-historical-compat.test.ts --reporter=verbose

      - name: Verify historical Python JCS-1 receipts (no migration)
        run: python3 python/tests/test_canon_equivalence.py

      - name: Verify TypeScript types
        run: npm run typecheck
