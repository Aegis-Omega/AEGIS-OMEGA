name: claim-promotion-v0.4

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - openai/aegis-v04-fail-closed-admission

permissions:
  contents: read

jobs:
  red-green:
    name: aegis / claim-promotion-v0.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.4 falsification suite
        run: node --test tests/claim-promotion-v04.test.mjs
