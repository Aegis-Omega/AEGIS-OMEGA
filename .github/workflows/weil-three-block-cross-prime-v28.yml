name: Weil Three Block Cross Prime V2.8

on:
  push:
    branches: ['proof/weil-three-block-cross-v28-49c36e5a']
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilThreeBlockCrossPrimeV28.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilThreeBlockCrossPrimeV28Spec.lean'
      - '.github/workflows/weil-three-block-cross-prime-v28.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-three-block-cross-prime-v28-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  BASE_V27_SOURCE_SHA: 49c36e5a20c4afe72961314932453f261d5a0304
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: exact translated mixed cross replay
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and V2.7 GREEN ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis merge-base --is-ancestor "$BASE_V27_SOURCE_SHA" "$SOURCE_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilDiagonalKernelReductionV21
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
          )
          : > evidence/modules.txt
          : > evidence/exact-source.log
          for m in "${modules[@]}"; do
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilThreeBlockCrossPrimeV28Spec.lean .
          sha256sum WeilThreeBlockCrossPrimeV28Spec.lean >> evidence/exact-source.log
          printf 'SOURCE_SHA=%s\nBASE_V27_SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n' \
            "$SOURCE_SHA" "$BASE_V27_SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" >> evidence/exact-source.log

      - name: Obtain exact Lean and dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get             Mathlib/Analysis/MellinTransform.lean             Mathlib/NumberTheory/ArithmeticFunction/VonMangoldt.lean             Mathlib/NumberTheory/Harmonic/EulerMascheroni.lean             Mathlib/NumberTheory/LSeries/RiemannZeta.lean             Mathlib/Analysis/Complex/ExponentialBounds.lean             Mathlib/Analysis/Real/Pi/Bounds.lean             Mathlib/MeasureTheory/Function/JacobianOneDim.lean             Mathlib/MeasureTheory/Measure/Haar/Basic.lean             Mathlib/Analysis/SpecialFunctions/ImproperIntegrals.lean             Mathlib/Analysis/SpecialFunctions/Trigonometric/Basic.lean             Mathlib/Analysis/SpecialFunctions/Trigonometric/DerivHyp.lean             Mathlib/MeasureTheory/Integral/IntegralEqImproper.lean             Mathlib/MeasureTheory/Integral/Bochner/ContinuousLinearMap.lean             Mathlib/MeasureTheory/Measure/Lebesgue/Basic.lean             Mathlib/Tactic.lean
          lean --version | tee evidence/lean-version.log

      - name: Compile exact module chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt
          lake env lean WeilThreeBlockCrossPrimeV28Spec.lean \
            2>&1 | tee evidence/cross-prime-v28-spec.log

      - name: Audit V2.8 theorem surface
        shell: bash
        run: |
          set -euo pipefail
          cat > AuditCrossPrimeV28.lean <<'EOF'
          import WeilThreeBlockCrossPrimeV28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.logCross_eq_mixed_v28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.logCross_translate_eq_logCorrelation_v28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.exp_half_mul_mixed_translate_v28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.logCorrelation_zero_of_width_abs_v28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.mixed_translate_zero_of_width_v28
          #print axioms AEGIS.WeilThreeBlockCrossPrimeV28.mixed_translate_center_v28
          EOF
          sed -i 's/^          //' AuditCrossPrimeV28.lean
          lake env lean AuditCrossPrimeV28.lean 2>&1 | tee evidence/axioms-cross-prime-v28.log
          ! grep -F 'sorryAx' evidence/axioms-cross-prime-v28.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = [
            'AEGIS.WeilThreeBlockCrossPrimeV28.logCross_eq_mixed_v28',
            'AEGIS.WeilThreeBlockCrossPrimeV28.logCross_translate_eq_logCorrelation_v28',
            'AEGIS.WeilThreeBlockCrossPrimeV28.exp_half_mul_mixed_translate_v28',
            'AEGIS.WeilThreeBlockCrossPrimeV28.logCorrelation_zero_of_width_abs_v28',
            'AEGIS.WeilThreeBlockCrossPrimeV28.mixed_translate_zero_of_width_v28',
            'AEGIS.WeilThreeBlockCrossPrimeV28.mixed_translate_center_v28',
          ]
          log = Path('evidence/axioms-cross-prime-v28.log').read_text()
          allowed = {'propext','Classical.choice','Quot.sound'}
          for name in names:
            none = f"'{name}' does not depend on any axioms"
            found = re.findall(re.escape(f"'{name}' depends on axioms: ") + r'\[([^\]]*)\]', log, re.S)
            if none in log and not found:
              axioms=set()
            elif none not in log and len(found)==1:
              axioms={a.strip() for a in found[0].split(',') if a.strip()}
            else:
              raise SystemExit('FAIL incomplete axiom output '+name)
            if not axioms <= allowed:
              raise SystemExit('FAIL unexpected axioms '+name+' '+repr(axioms))
          print('PASS: translated mixed cross V2.8 theorem surface')
          PY

      - name: Emit bounded disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          BASE_V27_SOURCE_SHA=$BASE_V27_SOURCE_SHA
          CANDIDATE_SHA=$SOURCE_SHA
          TRANSLATED_MIXED_LOG_TRANSPORT=TARGETED
          TWO_SIDED_WIDTH_VANISHING=TARGETED
          TRANSLATED_MIXED_CENTER_VALUE=TARGETED
          ADJACENT_PRIME_SUM=OPEN
          OUTER_PRIME_SUM=OPEN
          CROSS_ARCHIMEDEAN_MAJORANT=OPEN
          CROSS_B_51_OVER_100=OPEN
          CROSS_B_9_OVER_25=OPEN
          GLOBAL_WEIL_POSITIVITY=OPEN
          RH=NOT_PROVEN
          authority_effect=NONE
          merge=NONE
          EOF
          sed -i 's/^          //' evidence/DISPOSITION.txt

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-three-block-cross-prime-v28-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
