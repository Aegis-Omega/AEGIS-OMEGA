name: OPTIMUS V18 Adaptive HOLON Source-Bound Contracts

on:
  push:
    branches:
      - integration/optimus-v18-adaptive-holon-20261117
    paths:
      - '.github/workflows/optimus-v18-adaptive-holon.yml'
      - '.claude.json'
      - 'sovereign-omega-v2/python/**'
  pull_request:
    branches:
      - integration/optimus-v17-holon-transition-v14-20261116
    paths:
      - '.github/workflows/optimus-v18-adaptive-holon.yml'
      - '.claude.json'
      - 'sovereign-omega-v2/python/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-v18-admission-preflight:
    name: V18 mmap, M123, checkpoint 2.3, V14 and V17 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AEGIS_ARRAY_BYTES: '65536'
      AEGIS_TRANSITION_OBSERVER: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing CoreMatrix dependency
        run: python -m pip install psutil
      - name: Verify exact V18 and original V15 donor Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object sovereign-omega-v2/python/core_matrix.py)" = 'dd5ad797b934238bad59ed41c3f9e7f26a751828'
          test "$(git hash-object sovereign-omega-v2/python/adaptive_memory.py)" = '28e1d602f4c8efcd335b00635328b4d07d2bac52'
          test "$(git hash-object sovereign-omega-v2/python/tests/test_v18_adaptive_holon.py)" = 'fec06b5c65ccb3acbf5fa98b02f7ae644f196586'
          test "$(git hash-object sovereign-omega-v2/python/tests/test_holon_v14_integration_v17.py)" = '38f1699e526c1700837ae36c9f14c14e128fef18'
          test "$(git hash-object sovereign-omega-v2/python/ledger_persist.py)" = 'c18c81c2ec4cb28f2db99b5f87e4bf5aeac81826'
          test "$(git hash-object sovereign-omega-v2/python/m1_chain.py)" = 'dab08ab13d5500b557cca7eadd7b0ad7eae7c435'
      - name: Verify cognitive manifest ancestor and keep skills unchanged
        run: |
          python scripts/build-cognitive-manifest.py --check --ref integration/optimus-v18-adaptive-holon-20261117 --parent-state-hash 7da4a08bc415e25b268158b238385ac576eb43a40a80523ca014800021ab09a1
      - name: Compile exact modules before import
        run: python -m py_compile sovereign-omega-v2/python/core_matrix.py sovereign-omega-v2/python/adaptive_memory.py sovereign-omega-v2/python/ledger_persist.py
      - name: Existing M1 M2 M3 source-bound contracts
        run: python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_m123_contracts_v2.py' -v
      - name: Existing calibration and recovery regressions
        run: |
          python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_failsafe_reset_guard_v1.py' -v
          python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_calibration_plan_integrity_v1.py' -v
          python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_checkpoint_lock_integrity_v1.py' -v
      - name: Existing ledger 2.3 and V14/V17 regressions
        run: |
          python sovereign-omega-v2/python/tests/test_ledger_persist_v2.py
          python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_transition_info.py' -v
          python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_holon_v14_integration_v17.py' -v
      - name: Exact V15 layout math independent of older checkpoint
        run: python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_adaptive_memory_v15.py' -v
      - name: V18 actual mmap, chain parity, checkpoint continuation and noninterference
        run: python -m unittest discover -s sovereign-omega-v2/python/tests -p 'test_v18_adaptive_holon.py' -v
