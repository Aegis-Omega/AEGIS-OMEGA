name: Body/Head Provenance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: body-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  binding:
    name: Body cites current head
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Enforce workflow identity and exact candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${GITHUB_REPOSITORY}" = "Aegis-Omega/AEGIS-OMEGA"
          case "${GITHUB_WORKFLOW_REF}" in
            "${GITHUB_REPOSITORY}/.github/workflows/body-head-binding.yml@"*) ;;
            *) echo "::error::WORKFLOW_IDENTITY_MISMATCH"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)
          pr = event["pull_request"]
          assert pr["head"]["sha"] == os.environ["CANDIDATE_SHA"], "HEAD_SHA_MISMATCH"
          assert pr["head"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "HEAD_REPOSITORY_MISMATCH"
          assert pr["base"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "BASE_REPOSITORY_MISMATCH"
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifier regression tests
        working-directory: scripts
        run: python3 test_verify_body_head_binding.py

      - name: Assert the description cites this exact head
        run: python3 scripts/verify_body_head_binding.py --head-sha "$CANDIDATE_SHA"
