name: AEGIS Authorization Effect Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/authorization-effect-chain-v1]

permissions:
  contents: read

jobs:
  authorization-effect-chain:
    name: authorization -> effect / composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "EXACT_HEAD=$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install authorization verifier dependencies
        run: python -m pip install --disable-pip-version-check cryptography pyyaml rfc8785

      - name: Run live platform effect-boundary falsifiers
        run: |
          python sovereign-omega-v2/python/tests/test_bridge_execution_id_binding.py
          python sovereign-omega-v2/python/tests/test_platform_effect_chain_live.py
          python sovereign-omega-v2/python/tests/test_automaton3_platform_manifest.py
          python scripts/test_agent_dispatch_payload.py
          python sovereign-omega-v2/python/tests/test_agent_dispatch_identity.py

      - name: Run inherited effect-chain regression
        run: |
          python sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py
          python sovereign-omega-v2/python/tests/test_effect_adapters_pr2.py
          python sovereign-omega-v2/python/tests/test_effect_verifier_pr3.py
          python sovereign-omega-v2/python/tests/test_complete_verifier_pr4.py

      - name: Build and inspect exact-candidate Agent Dispatch image
        shell: bash
        run: |
          set -euo pipefail
          image="aegis-agent-dispatch-ci:${CANDIDATE_SHA}"
          docker build --tag "$image" --file vertex/Dockerfile .
          docker run --rm \
            --entrypoint python \
            --env "AEGIS_IMAGE_SOURCE_COMMIT=${CANDIDATE_SHA}" \
            "$image" \
            -c 'from pathlib import Path; required=("/app/CONSTITUTIONAL_DECLARATION.md","/app/.claude.json","/app/skill-hashes.sha256","/app/docs/claims.json"); missing=[p for p in required if not Path(p).is_file()]; assert not missing, f"missing constitutional anchors: {missing}"; import harness.sdk.github_dispatch_identity; import serve; assert str(serve._RUNTIME_ROOT)=="/app"; print("AGENT_DISPATCH_IMAGE_PASS")'
