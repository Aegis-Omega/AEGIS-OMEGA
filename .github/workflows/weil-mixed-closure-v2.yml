name: Weil Mixed Closure V2
on:
  push:
    branches: ['proof/weil-three-block-rational-v1-cf660498']
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/Weil*V2.lean'
      - '.github/workflows/weil-mixed-closure-v2.yml'
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
jobs:
  verify:
    name: mixed closure and complex lift; no global sign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false
      - name: Checkout exact AEGIS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          persist-credentials: false
      - name: Bind sources and toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          mkdir -p evidence .lake/build/lib/lean
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n' "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" > evidence/exact-source.log
          for m in WeilCriterionCompactSmoothV1 WeilPrimeSummabilityV1 WeilArchimedeanConvergenceV1 WeilAutocorrelationRealityV1 WeilAutocorrelationClosureV1 WeilThreeBlockRationalV1 WeilMixedClosureV2 WeilThreeBlockComplexV2 WeilMixedAlgebraV2 WeilDisjointEnergyV2; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$m.lean" .
            cp "$m.lean" evidence/
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          echo 'f6076a2cb13107151c352675a8f460b18981c48c6158802b31b08b1e6b0f5eb6  WeilThreeBlockRationalV1.lean' | sha256sum -c -
          echo 'def6148deca54152e9f6c8a4c0c3c489c4933a1dcca7b379db8e05cbac14eea5  WeilMixedClosureV2.lean' | sha256sum -c -
          echo '8d07d516aea197a4a0b122d273724bba895e441f5417dcb84135dd9d21a285cb  WeilThreeBlockComplexV2.lean' | sha256sum -c -
          echo '4a3a19f662c791589de37cff3a54122e67817d796841d92af556237a23177227  WeilMixedAlgebraV2.lean' | sha256sum -c -
          echo '9b54676144f374c64cbbf809f03c67531b9be6094e811c86e6059cc898a6f2ce  WeilDisjointEnergyV2.lean' | sha256sum -c -
          sha256sum lake-manifest.json .aegis/.github/workflows/weil-mixed-closure-v2.yml >> evidence/exact-source.log
          python3 - <<'PY'
          from pathlib import Path
          imports = set()
          for mod in Path('evidence/modules.txt').read_text().splitlines():
              for line in Path(mod + '.lean').read_text().splitlines():
                  if line.startswith('import '):
                      for name in line[7:].split():
                          if name.startswith('Mathlib.'):
                              imports.add(name.replace('.', '/') + '.lean')
          Path('imports.txt').write_text('\n'.join(sorted(imports)) + '\n')
          PY
      - name: Obtain exact Lean and targeted dependencies
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          mapfile -t imports < imports.txt
          lake exe cache get "${imports[@]}"
          lean --version >> evidence/exact-source.log
      - name: Compile each exact module
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r m; do
            if lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" > "evidence/$m.log" 2>&1; then
              sha256sum ".lake/build/lib/lean/$m.olean" >> evidence/exact-source.log
            else
              cat "evidence/$m.log"
              failed=1
            fi
          done < evidence/modules.txt
          test "$failed" = 0
      - name: Audit every new theorem's dependency closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          modules = ['WeilMixedClosureV2', 'WeilThreeBlockComplexV2', 'WeilMixedAlgebraV2', 'WeilDisjointEnergyV2']
          names = []
          for m in modules:
              s = Path(m + '.lean').read_text()
              names += ['AEGIS.' + m + '.' + n for n in re.findall(r'^theorem ([A-Za-z0-9_]+)', s, re.M)]
          if len(names) != 45 or len(set(names)) != 45:
              raise SystemExit('FAIL: theorem census changed unexpectedly')
          Path('evidence/expected-theorems.json').write_text(json.dumps(names, indent=2) + '\n')
          Path('Audit.lean').write_text('\n'.join(['import ' + m for m in modules] + ['#print axioms ' + n for n in names]) + '\n')
          PY
          lake env lean Audit.lean 2>&1 | tee evidence/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          names = json.loads(Path('evidence/expected-theorems.json').read_text())
          log = Path('evidence/axioms.log').read_text()
          result = {}
          for name in names:
              none = "'" + name + "' does not depend on any axioms"
              found = re.findall(re.escape("'" + name + "' depends on axioms: ") + r'\[([^\]]*)\]', log, re.S)
              if none in log and not found:
                  axioms = set()
              elif none not in log and len(found) == 1:
                  axioms = {a.strip() for a in found[0].split(',') if a.strip()}
              else:
                  raise SystemExit('FAIL: incomplete axiom output ' + name)
              if not axioms <= {'propext', 'Classical.choice', 'Quot.sound'}:
                  raise SystemExit('FAIL: unexpected axioms ' + repr(axioms))
              result[name] = sorted(axioms)
          Path('evidence/axiom-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print('PASS: 45 new theorem closures; LOG_KERNEL=OPEN; ANALYTIC_SIGN_BOUNDS=OPEN; RH=NOT_PROVEN; authority_effect=NONE')
          PY
      - name: Require rejection of wrong conjugation and strict zero claim
        run: |
          set -euo pipefail
          cat > WrongConjugation.lean <<'LEAN'
          import WeilThreeBlockComplexV2
          example : (Complex.I * star Complex.I * (1 : ℂ)).re = (Complex.I * Complex.I * (1 : ℂ)).re := by
            norm_num
          LEAN
          cat > StrictZero.lean <<'LEAN'
          import WeilThreeBlockComplexV2
          open AEGIS.WeilThreeBlockComplexV2
          example : cross 0 0 0 0 0 0 < 0 := by
            norm_num [cross]
          LEAN
          for m in WrongConjugation StrictZero; do
            if lake env lean "$m.lean" > "evidence/$m.log" 2>&1; then
              echo 'FAIL: false theorem accepted'
              exit 1
            fi
            grep -q 'False' "evidence/$m.log"
            grep -q 'error:' "evidence/$m.log"
            cp "$m.lean" evidence/
          done
      - name: Export proof objects
        run: |
          set -euo pipefail
          for m in WeilMixedClosureV2 WeilThreeBlockComplexV2 WeilMixedAlgebraV2 WeilDisjointEnergyV2; do
            cp ".lake/build/lib/lean/$m.olean" evidence/
          done
          cp Audit.lean evidence/
          echo 'NEW_PROOFS=MIXED_CLOSURE_AND_ACTUAL_FINITE_EXPANSION; ANALYTIC_SIGN_BOUNDS=OPEN; GLOBAL_WEIL_SIGN=OPEN; RH=NOT_PROVEN; authority_effect=NONE' > evidence/DISPOSITION.txt
      - name: Upload exact-source evidence including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-mixed-v2-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
