name: AegisQ IFG Research Binding

on:
  push:
    paths:
      - 'packages/aegisq-ifg/**'
      - 'sovereign-omega-v2/src/research/aegisq-*.ts'
      - 'sovereign-omega-v2/src/calibration/quanphotonic*.ts'
      - 'sovereign-omega-v2/src/core/**'
      - 'sovereign-omega-v2/src/consensus/crypto.ts'
      - 'sovereign-omega-v2/test/**/aegisq-*.test.ts'
      - 'sovereign-omega-v2/test/unit/quanphotonic*.test.ts'
      - 'sovereign-omega-v2/package-lock.json'
      - '.github/workflows/aegisq-ifg.yml'
  pull_request:
    paths:
      - 'packages/aegisq-ifg/**'
      - 'sovereign-omega-v2/src/research/aegisq-*.ts'
      - 'sovereign-omega-v2/src/calibration/quanphotonic*.ts'
      - 'sovereign-omega-v2/src/core/**'
      - 'sovereign-omega-v2/src/consensus/crypto.ts'
      - 'sovereign-omega-v2/test/**/aegisq-*.test.ts'
      - 'sovereign-omega-v2/test/unit/quanphotonic*.test.ts'
      - 'sovereign-omega-v2/package-lock.json'
      - '.github/workflows/aegisq-ifg.yml'

permissions:
  contents: read

jobs:
  research-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sovereign-omega-v2/package-lock.json
      - name: Install pinned numerical dependencies
        run: python -m pip install -r packages/aegisq-ifg/requirements.txt
      - name: Verify independent Python gate and strict wire parser
        working-directory: packages/aegisq-ifg
        run: python -m unittest discover -s tests -v
      - name: Install locked TypeScript dependencies
        working-directory: sovereign-omega-v2
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frozen source membrane
        working-directory: sovereign-omega-v2
        run: node scripts/verify-hashes.mjs
      - name: Verify calibration and real Python admission
        working-directory: sovereign-omega-v2
        run: >-
          npm run test --
          test/unit/quanphotonic-calibration.test.ts
          test/unit/quanphotonic-persistent-replay.test.ts
          test/unit/aegisq-admission.test.ts
          test/integration/aegisq-python.test.ts
      - name: Typecheck integration
        working-directory: sovereign-omega-v2
        run: npm run typecheck
