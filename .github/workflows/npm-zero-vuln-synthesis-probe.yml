name: NPM Zero-Vulnerability Synthesis Probe

on:
  push:
    branches:
      - hardening/mycorrhizal-structural-witness-v1
    paths:
      - .github/workflows/npm-zero-vuln-synthesis-probe.yml

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sovereign-omega-v2/package-lock.json
      - name: Install exact baseline
        working-directory: sovereign-omega-v2
        run: npm ci
      - name: Rewrite direct vulnerable ranges atomically
        working-directory: sovereign-omega-v2
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.ajv = '^8.20.0';
          p.devDependencies.postcss = '^8.5.28';
          p.devDependencies.vitest = '^4.1.11';
          p.devDependencies['@vitest/coverage-v8'] = '^4.1.11';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Resolve direct peer set with patched npm 10 resolver
        working-directory: sovereign-omega-v2
        run: npx --yes npm@10.9.9 install --package-lock-only --ignore-scripts
      - name: Refresh vulnerable transitive patches within existing parent ranges
        working-directory: sovereign-omega-v2
        run: |
          npx --yes npm@10.9.9 update --package-lock-only --ignore-scripts \
            baseline-browser-mapping \
            brace-expansion \
            browserslist \
            fast-uri \
            js-yaml \
            postcss-selector-parser \
            undici
      - name: Audit synthesized graph
        working-directory: sovereign-omega-v2
        run: |
          npx --yes npm@10.9.9 audit --json > audit-zero-candidate.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a = JSON.parse(fs.readFileSync('audit-zero-candidate.json','utf8'));
          console.log('ZERO_CANDIDATE_AUDIT=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          console.log('ZERO_CANDIDATE_RESIDUAL=' + JSON.stringify(Object.fromEntries(Object.entries(a.vulnerabilities ?? {}).map(([k,v]) => [k,{severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}]))));
          if ((a.metadata?.vulnerabilities?.total ?? 0) !== 0) process.exit(2);
          NODE
      - name: Show exact dependency delta
        run: git diff -- sovereign-omega-v2/package.json sovereign-omega-v2/package-lock.json
      - name: Compatibility reinstall with repository-bundled npm
        working-directory: sovereign-omega-v2
        run: |
          npm --version
          npm ci
      - name: Frozen hashes
        working-directory: sovereign-omega-v2
        run: node scripts/verify-hashes.mjs
      - name: Focused MCM tests
        working-directory: sovereign-omega-v2
        run: npx vitest run test/unit/mycorrhizal-contracts.test.ts test/unit/mycorrhizal-state.test.ts test/unit/mycorrhizal-routing.test.ts test/unit/mycorrhizal-1bna.test.ts test/unit/mycorrhizal-structural-witness-registry.test.ts
      - name: Full tests
        working-directory: sovereign-omega-v2
        run: npm run test
      - name: TypeScript strict check
        working-directory: sovereign-omega-v2
        run: npm run typecheck
      - name: Production build
        working-directory: sovereign-omega-v2
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: npm-zero-vulnerability-candidate
          path: |
            sovereign-omega-v2/package.json
            sovereign-omega-v2/package-lock.json
            sovereign-omega-v2/audit-zero-candidate.json
