name: SOL Lockfile Repair

on:
  push:
    branches:
      - feat/sol-cross-platform-control-plane
    paths:
      - 'platform/sol/cloudflare/worker/package.json'
      - '.github/workflows/sol-lockfile-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/sol-cross-platform-control-plane
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Regenerate exact lockfile
        working-directory: platform/sol/cloudflare/worker
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high-severity audit gate
        working-directory: platform/sol/cloudflare/worker
        run: npm audit --audit-level=high

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aegis-ci'
          git config user.email 'aegis-ci@users.noreply.github.com'
          git add platform/sol/cloudflare/worker/package-lock.json
          if git diff --cached --quiet; then
            echo 'LOCKFILE_UNCHANGED'
            exit 0
          fi
          git commit -m 'fix(edge): regenerate audited dependency lockfile'
          git push origin HEAD:feat/sol-cross-platform-control-plane
