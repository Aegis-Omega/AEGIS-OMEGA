name: Company Brain v1

on:
  pull_request:
    paths:
      - "harness/sdk/company_brain.py"
      - "harness/sdk/metacognitive_executive.py"
      - "harness/sdk/proof_trace.py"
      - "sovereign-omega-v2/python/tests/test_company_brain.py"
      - ".github/workflows/company-brain-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-brain-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  company-brain:
    name: aegis / company-brain-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Compile company brain contract
        run: python -m py_compile harness/sdk/company_brain.py sovereign-omega-v2/python/tests/test_company_brain.py

      - name: Run company brain falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_company_brain.py

      - name: Re-run metacognitive executive falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_metacognitive_executive.py

      - name: Re-run proof trace falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_proof_trace_sdk.py
