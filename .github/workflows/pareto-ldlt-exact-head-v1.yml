name: Pareto exact LDLT replay

on:
  push:
    branches:
      - evidence/pareto-ldlt-exact-head-v1

permissions:
  contents: read

env:
  VERIFIER_SHA: 7c94ba577f62e5a9fcd96b9b5ae4859d106db081

jobs:
  verify:
    name: pareto / exact-head verify-ldlt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIER_SHA }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact verifier head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          test "$actual" = "$VERIFIER_SHA"
          printf '%s\n' "$actual"

      - name: Build canonical Pareto semantics commitment and CLI payload
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/pareto-ldlt"
          mkdir -p "$EVIDENCE"
          EVIDENCE="$EVIDENCE" VERIFIER_SHA="$VERIFIER_SHA" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          R = lambda n, d=1: {"numerator": n, "denominator": d}
          overlap = [
              [R(0), R(51,100), R(9,25)],
              [R(51,100), R(0), R(51,100)],
              [R(9,25), R(51,100), R(0)],
          ]
          matrix = [
              [R(93,100), R(-51,100), R(-9,25)],
              [R(-51,100), R(93,100), R(-51,100)],
              [R(-9,25), R(-51,100), R(93,100)],
          ]
          lower = [
              [R(1), R(0), R(0)],
              [R(-17,31), R(1), R(0)],
              [R(-12,31), R(-731,672), R(1)],
          ]
          diagonal = [R(93,100), R(504,775), R(473,22400)]

          spec = {
              "schema": "AEGIS_PARETO_RATIONAL_MAJORANT_SPEC_V1",
              "verifier_target_sha": os.environ["VERIFIER_SHA"],
              "source_context": {
                  "repository": "Aegis-Omega/AEGIS-OMEGA",
                  "pareto_weil_context": "PR_494_WeilThreeBlockRationalV1",
                  "construction": "B=(93/100)I-A_overlap",
              },
              "A_overlap": overlap,
              "B": matrix,
              "L": lower,
              "D": diagonal,
              "leading_principal_minors": [R(93,100), R(378,625), R(12771,1000000)],
              "semantic_boundary": {
                  "finite_rational_algebra_only": True,
                  "guinand_weil_matrix_semantics_verified": False,
                  "global_weil_positivity_proven": False,
                  "rh_proven": False,
                  "authority_effect": "NONE",
              },
          }
          canonical = json.dumps(spec, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n"
          root = hashlib.sha256(canonical.encode()).hexdigest()

          payload = {
              "matrix": matrix,
              "lower": lower,
              "diagonal": diagonal,
              "matrix_semantics_root": root,
          }
          provenance = {
              "schema": "AEGIS_PARETO_LDLT_EXACT_HEAD_PROVENANCE_V1",
              "verifier_target_sha": os.environ["VERIFIER_SHA"],
              "matrix_semantics_root": root,
              "exact_head_is_external_to_cli_payload": True,
              "authority_effect": "NONE",
              "rh_status": "NOT_PROVEN",
          }
          out = Path(os.environ["EVIDENCE"])
          (out / "pareto-rational-majorant-spec.json").write_text(canonical, encoding="utf-8")
          (out / "verify-ldlt-input.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          (out / "provenance.json").write_text(json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print(root)
          PY

      - name: Run exact-head verify-ldlt
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/pareto-ldlt"
          PYTHONPATH="$GITHUB_WORKSPACE/target" python "$GITHUB_WORKSPACE/target/scripts/weil-proof.py" \
            verify-ldlt \
            --input "$EVIDENCE/verify-ldlt-input.json" \
            --output "$EVIDENCE/verify-ldlt-packet.json"
          cat "$EVIDENCE/verify-ldlt-packet.json"

      - name: Assert receipt boundary and strict pivots
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/pareto-ldlt"
          EVIDENCE="$EVIDENCE" VERIFIER_SHA="$VERIFIER_SHA" python - <<'PY'
          import hashlib, json, os
          from fractions import Fraction
          from pathlib import Path

          root = Path(os.environ["EVIDENCE"])
          packet = json.loads((root / "verify-ldlt-packet.json").read_text())
          v = packet["verification"]
          assert v["valid"] is True
          assert v["status"] == "FINITE_MATRIX_PSD_VERIFIED"
          assert v["lower_factor_verified"] is True
          assert v["factorization_verified"] is True
          assert v["nonnegative_diagonal_verified"] is True
          assert v["finite_matrix_psd_verified"] is True
          assert v["galerkin_semantics_verified"] is False
          assert v["global_weil_positivity_proven"] is False
          assert v["rh_proven"] is False
          assert "MATRIX_ENTRIES_REQUIRE_INDEPENDENT_GUINAND_WEIL_EVALUATOR" in v["open_obligations"]

          payload = json.loads((root / "verify-ldlt-input.json").read_text())
          pivots = [Fraction(x["numerator"], x["denominator"]) for x in payload["diagonal"]]
          assert all(x > 0 for x in pivots)
          minors = [pivots[0], pivots[0]*pivots[1], pivots[0]*pivots[1]*pivots[2]]
          assert minors == [Fraction(93,100), Fraction(378,625), Fraction(12771,1000000)]

          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          summary = {
              "schema": "AEGIS_PARETO_LDLT_EXACT_HEAD_RECEIPT_V1",
              "verifier_target_sha": os.environ["VERIFIER_SHA"],
              "matrix_semantics_root": payload["matrix_semantics_root"],
              "cli_status": v["status"],
              "finite_matrix_psd_verified": True,
              "strict_positive_diagonal_verified": True,
              "strict_positive_definite_derived": True,
              "galerkin_semantics_verified": False,
              "global_weil_positivity_proven": False,
              "rh_proven": False,
              "authority_effect": "NONE",
              "digests": {
                  "spec_sha256": digest(root / "pareto-rational-majorant-spec.json"),
                  "input_sha256": digest(root / "verify-ldlt-input.json"),
                  "packet_sha256": digest(root / "verify-ldlt-packet.json"),
              },
          }
          (root / "exact-head-receipt.json").write_text(json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload exact-head LDLT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pareto-ldlt-exact-head-${{ env.VERIFIER_SHA }}
          path: ${{ runner.temp }}/pareto-ldlt
          if-no-files-found: error
