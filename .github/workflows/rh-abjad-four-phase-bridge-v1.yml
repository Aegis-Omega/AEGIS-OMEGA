name: RH Abjad Four Phase Bridge V1

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilAbjadFourPhaseBridgeV1.lean'
      - 'sovereign-omega-v2/formal/tests/lean/WeilAbjadFourPhaseBridgeV1Spec.lean'
      - '.github/workflows/rh-abjad-four-phase-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  abjad-four-phase:
    name: verify Abjad triadic carrier and four-phase transfer at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis rev-parse HEAD > exact-source.log
          sha256sum lake-manifest.json >> exact-source.log

      - name: Install pinned elan and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version >> exact-source.log

      - name: Compile prerequisite, candidate bridge, and preregistered spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          cp .aegis/sovereign-omega-v2/formal/bridges/lean/WeilTwoPointPositivityV1.lean .
          sha256sum WeilTwoPointPositivityV1.lean >> exact-source.log
          lake env lean -o .lake/build/lib/lean/WeilTwoPointPositivityV1.olean WeilTwoPointPositivityV1.lean 2>&1 | tee WeilTwoPointPositivityV1.log

          if test -f .aegis/sovereign-omega-v2/formal/bridges/lean/WeilAbjadFourPhaseBridgeV1.lean; then
            cp .aegis/sovereign-omega-v2/formal/bridges/lean/WeilAbjadFourPhaseBridgeV1.lean .
            sha256sum WeilAbjadFourPhaseBridgeV1.lean >> exact-source.log
            lake env lean -o .lake/build/lib/lean/WeilAbjadFourPhaseBridgeV1.olean WeilAbjadFourPhaseBridgeV1.lean 2>&1 | tee WeilAbjadFourPhaseBridgeV1.log
          fi

          cp .aegis/sovereign-omega-v2/formal/tests/lean/WeilAbjadFourPhaseBridgeV1Spec.lean .
          sha256sum WeilAbjadFourPhaseBridgeV1Spec.lean >> exact-source.log
          lake env lean WeilAbjadFourPhaseBridgeV1Spec.lean 2>&1 | tee WeilAbjadFourPhaseBridgeV1Spec.log

      - name: Audit theorem dependency closures
        shell: bash
        run: |
          set -euo pipefail
          cat > WeilAbjadFourPhaseAudit.lean <<'EOF'
          import WeilAbjadFourPhaseBridgeV1
          #print axioms abjad_triadic_sum_iff_node_v1
          #print axioms abjad_phase_four_phase_v1
          #print axioms four_phase_has_abjad_node_v1
          #print axioms abjad_phase_forall_iff_four_phase_v1
          #print axioms abjad_classical_witness_phases_v1
          #print axioms weil_abjad_triadic_nonnegative_components_v1
          #print axioms weil_abjad_triadic_negative_witness_v1
          EOF
          lake env lean WeilAbjadFourPhaseAudit.lean 2>&1 | tee WeilAbjadFourPhaseAudit.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = [
              'abjad_triadic_sum_iff_node_v1',
              'abjad_phase_four_phase_v1',
              'four_phase_has_abjad_node_v1',
              'abjad_phase_forall_iff_four_phase_v1',
              'abjad_classical_witness_phases_v1',
              'weil_abjad_triadic_nonnegative_components_v1',
              'weil_abjad_triadic_negative_witness_v1',
          ]
          log = Path('WeilAbjadFourPhaseAudit.log').read_text()
          assert 'sorryAx' not in log
          for name in names:
              m = re.search(re.escape("'" + name + "' depends on axioms: ") + r"\[([^\]]*)\]", log, re.S)
              assert m, name
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert axioms <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, axioms)
          print('PASS: Abjad phase carrier is exactly the existing four-phase carrier; global Weil sign remains OPEN; RH=NOT_PROVEN; authority_effect=NONE')
          PY

      - name: Upload exact-head proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-abjad-four-phase-${{ env.SOURCE_SHA }}
          path: |
            exact-source.log
            *.log
          if-no-files-found: warn
          retention-days: 30
