name: Witness Fabric V1

on:
  push:
    branches:
      - feature/always-on-witness-fabric-v1
  pull_request:
    paths:
      - 'sovereign-omega-v2/python/witness_fabric.py'
      - 'sovereign-omega-v2/python/bridge.py'
      - 'sovereign-omega-v2/python/tests/test_witness_fabric_v1.py'
      - '.github/workflows/witness-fabric-v1.yml'

permissions:
  contents: read

jobs:
  witness-fabric:
    name: aegis / witness-fabric-v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run witness fabric contract
        run: python sovereign-omega-v2/python/tests/test_witness_fabric_v1.py
      - name: Compile bridge and witness modules
        run: python -m py_compile sovereign-omega-v2/python/bridge.py sovereign-omega-v2/python/witness_fabric.py
