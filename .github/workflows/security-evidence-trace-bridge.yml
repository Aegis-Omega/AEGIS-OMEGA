name: Security Evidence Trace Bridge

on:
  push:
    branches:
      - trace/security-evidence-prooftrace-v1
  pull_request:
    branches:
      - trace/proof-trace-sdk-v1
    paths:
      - 'harness/sdk/security_evidence_trace.py'
      - 'harness/sdk/proof_trace.py'
      - 'security/security_evidence_set.py'
      - 'security/glasswing_evidence.py'
      - 'security/verifier_provenance.py'
      - 'security/test_verifier_provenance.py'
      - 'sovereign-omega-v2/python/tests/test_security_evidence_trace_bridge.py'
      - 'sovereign-omega-v2/python/tests/test_proof_trace_sdk.py'
      - '.github/workflows/security-evidence-trace-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  security-evidence-trace-bridge:
    name: aegis / security-evidence-trace-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Compile bridge contracts
        run: >-
          python -m py_compile
          harness/sdk/security_evidence_trace.py
          harness/sdk/proof_trace.py
          security/security_evidence_set.py
          security/test_verifier_provenance.py
          sovereign-omega-v2/python/tests/test_security_evidence_trace_bridge.py

      - name: Run bridge falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_security_evidence_trace_bridge.py

      - name: Run verifier provenance falsifiers
        run: python -m unittest -v security/test_verifier_provenance.py

      - name: Re-run ProofTrace falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_proof_trace_sdk.py

      - name: Re-run weekly research boundary falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_weekly_research_falsifiers.py

      - name: Re-run receipt separation falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py

      - name: Re-run effect verifier falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_effect_verifier_pr3.py

      - name: Re-run atomic admission falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py

      - name: Re-run collective memory falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci6_collective_memory.py

      - name: Re-run security evidence falsifiers
        run: >-
          python -m unittest -v
          security/test_glasswing_evidence_contract.py
          security/test_glasswing_artisan_adapter.py
          security/test_security_evidence_set.py
