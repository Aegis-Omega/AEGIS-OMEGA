name: RH Zeta Divisor Ledger

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZetaDivisorLedgerV1.lean'
      - 'sovereign-omega-v2/formal/tests/test_zeta_divisor_ledger_v1.py'
      - '.github/workflows/rh-zeta-divisor-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PARENT_DOMAIN_SHA: db428f818c63efcbe16db3e6cca7bd00c5371ead
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LEDGER_SOURCE_SHA256: 975c3da38c8250c76c4b0a926908a1aa97b4059a3a081e8501ba9e036869a7e8

jobs:
  ledger:
    name: pinned finite zeta divisor ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and ledger source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s  %s\n' \
            "$LEDGER_SOURCE_SHA256" \
            'sovereign-omega-v2/formal/bridges/lean/ZetaDivisorLedgerV1.lean' \
            | sha256sum -c -
          python3 -m unittest \
            sovereign-omega-v2/formal/tests/test_zeta_divisor_ledger_v1.py \
            -v

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text(encoding='utf-8'))
          p = next(p for p in m['packages'] if p.get('name') == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        run: lake exe cache get

      - name: Compile finite zeta divisor ledger
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zeta-ledger-lean-version.txt"
          lake env lean \
            "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZetaDivisorLedgerV1.lean" \
            2>&1 | tee "$GITHUB_WORKSPACE/zeta-ledger-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zeta-ledger-lean.log"

      - name: Emit fail-closed zeta ledger receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZetaDivisorLedgerV1.lean')
          log = Path('zeta-ledger-lean.log').read_text(encoding='utf-8')
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == os.environ['LEDGER_SOURCE_SHA256']
          assert 'sorryAx' not in log
          receipt = {
              'schema_version': 'AEGIS_RH_ZETA_DIVISOR_LEDGER_RECEIPT_V1',
              'source_commit': os.environ['SOURCE_SHA'],
              'parent_domain_revision': os.environ['PARENT_DOMAIN_SHA'],
              'formal_conjectures_revision': os.environ['FORMAL_CONJECTURES_SHA'],
              'mathlib_revision': os.environ['MATHLIB_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'source_sha256': digest,
              'local_compact_divisor_finiteness': 'PROVED_IN_LEAN',
              'multiplicity_source': 'MATHLIB_ANALYTIC_ORDER_AT',
              'nontrivial_zero_filter': 'ENCODED',
              'finite_weighted_ledger': 'ENCODED',
              'global_zero_sum_convergence': 'OPEN',
              'explicit_formula_identity': 'OPEN',
              'rh_proved': False,
              'rh_disproved': False,
              'claim_promotion': 'BLOCKED',
              'decision': 'HOLD_RESEARCH_ONLY',
              'merge': 'NOT_PERFORMED',
              'authority_effect': 'NONE',
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          out = Path('zeta-divisor-ledger-receipt.json')
          out.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload zeta ledger evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zeta-divisor-ledger-${{ env.SOURCE_SHA }}
          path: |
            zeta-ledger-lean-version.txt
            zeta-ledger-lean.log
            zeta-divisor-ledger-receipt.json
          if-no-files-found: error
          retention-days: 30
