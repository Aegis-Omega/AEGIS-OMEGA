name: Repository Knowledge Cartography

on:
  push:
    branches:
      - feat/repository-cartographer-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-knowledge:
    name: aegis / repository-knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run repository cartographer contract
        shell: bash
        run: |
          python scripts/test-repository-cartographer.py
          python scripts/test_aegis_topology.py
          python scripts/test_optimus_docs.py
          python scripts/test_docs_source_contract.py
          python scripts/test_validate_compose_targets.py
          python scripts/aegis_topology.py --strict --summary
          python -m unittest discover -s scripts -p 'test_source_plane*.py' -v

      - name: Verify live pinned cross-repository source objects
        shell: bash
        env:
          # Ephemeral, repository-scoped Actions token; read-only permission above.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from harness.sdk.source_plane import (
              ArtifactRequest, SourcePlane, verify_manifest_document,
          )

          # Immutable fixtures verified independently from GitHub Git objects.
          # Cross-repository HTTP GETs exercise the production transport, not mocks.
          expected = {
              ("Aegis-Omega/AEGIS-OMEGA",
               "c6f4f2131ab06c5b20cfd3d0eafd99e3ca246bc8",
               "harness/sdk/repository_knowledge.py"):
                  "8a4468fa94ae71c3410f89b87d6c0055bf5ba3af",
              ("Aegis-Omega/formal-conjectures",
               "791f16d6cd8bab1cdc9b3fd4be1272e799eacd3e",
               "lean-toolchain"):
                  "a8afa7d1b02d96f0671eba854a8dc4b416beb473",
          }
          requests = [ArtifactRequest(*key) for key in expected]
          manifest = SourcePlane(token=os.environ["GITHUB_TOKEN"]).manifest(requests)
          observed = {
              (a["repository"], a["commit_sha"], a["path"]): a["blob_sha1"]
              for a in manifest["artifacts"]
          }
          if observed != expected:
              raise SystemExit("SOURCE_PLANE_PINNED_BLOB_MISMATCH")
          if manifest["authority"] != "NONE" or manifest["access"] != "READ_ONLY":
              raise SystemExit("SOURCE_PLANE_AUTHORITY_ESCALATION")
          if verify_manifest_document(manifest)["status"] != "ESTABLISHED":
              raise SystemExit("SOURCE_PLANE_MANIFEST_INVALID")
          print("SOURCE_PLANE_LIVE_CROSS_REPO_PASS: 2 pinned repositories; authority=NONE")
          PY

      - name: Assert authority neutrality
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents:[[:space:]]*write|id-token:[[:space:]]*write|attestations:[[:space:]]*write|deployments:[[:space:]]*write' .github/workflows/repository-knowledge.yml
