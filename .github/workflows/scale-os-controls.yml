name: AEGIS Scale OS Controls

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scale-os-controls:
    name: aegis / scale-os-controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact workflow parser
        run: pip install PyYAML==6.0.2

      - name: Prove grace-cycle control flow
        run: python sovereign-omega-v2/python/tests/test_grace_chain_repair.py

      - name: Validate OSV workflow startup contract
        run: python scripts/validate-osv-workflow.py --output "$RUNNER_TEMP/OSV_STARTUP_RECEIPT.json"

      - name: Upload OSV startup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-osv-startup-${{ github.sha }}
          path: ${{ runner.temp }}/OSV_STARTUP_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
