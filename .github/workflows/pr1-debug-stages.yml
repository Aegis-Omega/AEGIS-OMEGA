name: PR-1 Debug Stages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-smoke:
    name: debug / runner-smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo RUNNER_OK

  checkout-smoke:
    name: debug / exact-checkout
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

  pr1-core:
    name: debug / pr1-core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py

  pr1-cli:
    name: debug / pr1-cli-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sovereign-omega-v2/python/tests/test_transition_receipts_cli_pr1.py

  full-runner:
    name: debug / full-automaton3-python-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/run-automaton3-tests.py \
            --output "$RUNNER_TEMP/PR1_DEBUG_SUMMARY.json" \
            --log "$RUNNER_TEMP/PR1_DEBUG.log"
