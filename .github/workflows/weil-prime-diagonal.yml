name: Weil Prime Diagonal

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/tests/Weil/PrimeDiagonalSpec.v"
      - "sovereign-omega-v2/formal/theories/Weil/FinitePrimeDiagonal.v"
      - ".github/workflows/weil-prime-diagonal.yml"
      - ".github/workflows/coq-formal-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-prime-diagonal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  attest:
    name: coqc / prime diagonal bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Reject declared assumptions in authority source
        shell: bash
        run: |
          set -euo pipefail
          src=sovereign-omega-v2/formal/theories/Weil/FinitePrimeDiagonal.v
          test -f "$src"
          if grep -En '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted)[[:space:].]' "$src"; then
            echo "Declared assumption/admission forbidden: $src" >&2
            exit 1
          fi

      - name: Prepare writable Coq evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-prime-diagonal-attestation
          chmod -R a+rwX sovereign-omega-v2/formal/theories/Weil sovereign-omega-v2/formal/tests/Weil sovereign-omega-v2/weil-prime-diagonal-attestation

      - name: Compile specification and print assumptions
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            DIR="$ROOT/formal/theories/Weil"
            TEST="$ROOT/formal/tests/Weil/PrimeDiagonalSpec.v"
            OUT="$ROOT/weil-prime-diagonal-attestation"
            cd "$DIR"
            coqc --version | tee "$OUT/coq-version.txt"
            coqc FiniteBridge.v
            coqc FiniteEntryDictionary.v
            coqc FinitePrimeDiagonal.v 2>&1 | tee "$OUT/finite-prime-diagonal.log"
            coqc "$TEST" 2>&1 | tee "$OUT/prime-diagonal-spec.log"

            for theorem in \
              prime_diagonal_sign_periodicity_bridge \
              prime_diagonal_source_sign_bridge
            do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              printf 'Set Coqtop Exit On Error.\nRequire Import FinitePrimeDiagonal.\nPrint Assumptions %s.\n' "$theorem" > "$query"
              coqtop -quiet -batch -l "$query" > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for $theorem" >&2
                exit 1
              fi
            done

      - name: Emit content-addressed prime diagonal receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          out = Path('weil-prime-diagonal-attestation')
          source = Path('formal/theories/Weil/FinitePrimeDiagonal.v')
          names = [
              'prime_diagonal_sign_periodicity_bridge',
              'prime_diagonal_source_sign_bridge',
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload = {
              'receipt_kind': 'AEGIS_WEIL_PRIME_DIAGONAL_RECEIPT_V1',
              'authority': 'FORMAL_MATH_EVIDENCE_ONLY',
              'source_commit': '${{ env.SOURCE_SHA }}',
              'source_sha256': sha(source),
              'coq_version_sha256': sha(out / 'coq-version.txt'),
              'compile_log_sha256': sha(out / 'finite-prime-diagonal.log'),
              'spec_log_sha256': sha(out / 'prime-diagonal-spec.log'),
              'theorem_assumption_log_sha256': {
                  name: sha(out / f'{name}.assumptions.txt') for name in names
              },
              'theorem_count': len(names),
              'declared_assumptions': 0,
              'prime_diagonal_sign_periodicity_bridge_formalized': True,
              'prime_diagonal_weighted_contribution_bridge_formalized': True,
              'prime_diagonal_trig_periodicity_machine_bound': False,
              'prime_source_sine_derivative_machine_bound': False,
              'prime_diagonal_dictionary_formalized': False,
              'analytic_pole_normalization_machine_bound': False,
              'archimedean_entry_identity_proven': False,
              'guinand_weil_explicit_formula_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
              'open_obligations': [
                  'PRIME_DIAGONAL_TRIG_PERIODICITY_NOT_MACHINE_BOUND',
                  'PRIME_SOURCE_SINE_DERIVATIVE_NOT_MACHINE_BOUND',
                  'ANALYTIC_POLE_NORMALIZATION_NOT_MACHINE_BOUND',
                  'ARCHIMEDEAN_ENTRY_IDENTITY_NOT_MACHINE_FORMALIZED',
                  'GUINAND_WEIL_EXPLICIT_FORMULA_NOT_MACHINE_BOUND',
                  'FORMULA_TO_WEIL_OPERATOR_IDENTITY_NOT_MACHINE_FORMALIZED',
              ],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = out / 'weil-prime-diagonal-receipt.json'
          target.write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))

          assert payload['theorem_count'] == 2
          assert payload['declared_assumptions'] == 0
          assert payload['prime_diagonal_sign_periodicity_bridge_formalized'] is True
          assert payload['prime_diagonal_weighted_contribution_bridge_formalized'] is True
          assert payload['prime_diagonal_trig_periodicity_machine_bound'] is False
          assert payload['prime_source_sine_derivative_machine_bound'] is False
          assert payload['prime_diagonal_dictionary_formalized'] is False
          assert payload['formula_to_weil_operator_identity_proven'] is False
          assert payload['global_weil_positivity_proven'] is False
          assert payload['rh_proven'] is False
          assert len(payload['receipt_sha256']) == 64
          PY

      - name: Upload prime diagonal evidence
        uses: actions/upload-artifact@v4
        with:
          name: weil-prime-diagonal-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-prime-diagonal-attestation/
          if-no-files-found: error
          retention-days: 30
