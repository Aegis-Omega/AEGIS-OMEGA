name: QP-PD V2 Biological Binding

on:
  pull_request:
  push:
    branches:
      - openai/qp-pd-v2-biological-binding

permissions:
  contents: read

jobs:
  v2-binding:
    name: aegis / qp-pd-v2-binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact schema validator
        run: pip install jsonschema==4.23.0
      - name: Run V2 biological-context falsification suite
        run: |
          python -m unittest -v \
            tests/test_quanphotonic_v2_binding.py \
            tests/test_quanphotonic_v2_join.py
      - name: Meta-validate V2 and biological binding schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          names = [
              'quanphotonic-biological-context-manifest.v1.schema.json',
              'quanphotonic-measurement-batch.v2.schema.json',
              'quanphotonic-raw-detector-manifest.v2.schema.json',
              'quanphotonic-classical-covariate-manifest.v1.schema.json',
              'quanphotonic-analysis-receipt.v2.schema.json',
              'quanphotonic-admission-receipt.v2.schema.json',
              'aegis-evidence-join.v2.biological.schema.json',
          ]
          for name in names:
              path = Path('schemas') / name
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              print(f'SCHEMA_OK {path}')
          PY
