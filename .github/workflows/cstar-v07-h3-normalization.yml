name: CSTAR v0.7 H3 Normalization Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/cstar-v07/**'
      - '.github/workflows/cstar-v07-h3-normalization.yml'

permissions:
  contents: read

jobs:
  probe-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.6 core and print generalized signatures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/verification/cstar-v07"
          docker pull coqorg/coq:8.20.1
          docker run --rm \
            -v "$ROOT:/work:ro" \
            coqorg/coq:8.20.1 \
            bash -lc 'set -euo pipefail; mkdir -p /tmp/cstar-v07; cp /work/*.v /tmp/cstar-v07/; cd /tmp/cstar-v07; coqc CStarAbelianGroupCohomology.v; coqc CStarV07SignatureProbe.v; coqc --version'
