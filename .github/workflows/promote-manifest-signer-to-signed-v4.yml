name: Promote Manifest Signer to Signed V4

on:
  push:
    branches:
      - control/promote-manifest-signer-to-signed-v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub-signed signer-fix commit on signed-v4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: hardening/mycorrhizal-structural-witness-security-signed-v4
          EXPECTED_PARENT: bfefa9a9b5f9714f5c711596a8763e00724844f0
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const branch = process.env.TARGET_BRANCH;
          const expectedParent = process.env.EXPECTED_PARENT;

          const refResponse = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${branch}`,
            {
              headers: {
                authorization: `bearer ${token}`,
                accept: 'application/vnd.github+json',
                'user-agent': 'aegis-signed-v4-promoter',
              },
            }
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== expectedParent) {
            console.error(`STALE_TARGET expected=${expectedParent} live=${refBody.commit.sha}`);
            process.exit(1);
          }

          const path = '.github/workflows/cognitive-manifest-refresh.yml';
          const additions = [{
            path,
            contents: fs.readFileSync(path).toString('base64'),
          }];
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: expectedParent,
              message: { headline: 'fix(ci): use GitHub-signed cognitive manifest commits' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-signed-v4-promoter',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_V4_FIX_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_V4_FIX_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
