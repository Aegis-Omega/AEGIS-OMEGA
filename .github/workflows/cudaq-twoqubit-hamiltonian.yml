name: CUDA-Q Coupled Two-Qubit Hamiltonian Benchmark

on:
  push:
    branches:
      - research/gravity-quantum-cudaq-twoqubit-v1
    paths:
      - 'gravity_quantum/cudaq_twoqubit_v1.py'
      - 'gravity_quantum/test_cudaq_twoqubit_v1.py'
      - '.github/workflows/cudaq-twoqubit-hamiltonian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cudaq-twoqubit-hamiltonian:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CUDA-Q
        run: python -m pip install --disable-pip-version-check 'cudaq==0.15.1'

      - name: Run preregistered coupled-Hamiltonian falsifiers
        run: python -m unittest gravity_quantum.test_cudaq_twoqubit_v1 -v

      - name: Emit exact-head computational receipt
        run: |
          mkdir -p artifacts/cudaq-twoqubit
          printf '%s\n' "${GITHUB_SHA}" > artifacts/cudaq-twoqubit/head-sha.txt
          python -m gravity_quantum.cudaq_twoqubit_v1 > artifacts/cudaq-twoqubit/receipt.json
          (
            cd artifacts/cudaq-twoqubit
            sha256sum head-sha.txt receipt.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload exact-head computational evidence
        uses: actions/upload-artifact@v4
        with:
          name: cudaq-twoqubit-hamiltonian-${{ github.sha }}
          path: artifacts/cudaq-twoqubit/
          if-no-files-found: error
