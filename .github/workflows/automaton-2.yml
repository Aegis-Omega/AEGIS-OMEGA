name: AEGIS Automaton-2

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  automaton-2:
    name: aegis / automaton-2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Test provider-neutral exact-head verifier
        run: python sovereign-omega-v2/python/tests/test_exact_head.py -v

      - name: Test provider-neutral workspace admission
        run: python sovereign-omega-v2/python/tests/test_provider_neutral_execution.py -v

      - name: Validate exact candidate and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-exact-head.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/EXACT_HEAD_RECEIPT.json"

      - name: Test deterministic skill factory
        run: python sovereign-omega-v2/python/tests/test_skill_factory.py -v

      - name: Build 2048-candidate provider-neutral skill registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-skill-factory.py \
            --taxonomy knowledge/skill-taxonomy.v1.json \
            --output "$RUNNER_TEMP/SKILL_REGISTRY_V1.json" \
            --expect-count 2048

      - name: Upload Automaton-2 provider-neutral evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-automaton-2-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/EXACT_HEAD_RECEIPT.json
            ${{ runner.temp }}/SKILL_REGISTRY_V1.json
          if-no-files-found: error
          retention-days: 90
