name: ParetoMod9 Lean Kernel Replay

on:
  push:
    branches:
      - research/paretomod9-lean-kernel-20260915
    paths:
      - 'research/formal-conjectures-pilot/paretomod9/**'
      - '.github/workflows/paretomod9-lean-kernel-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify and replay exact Lean source
        shell: bash
        run: |
          set -euo pipefail
          bash research/formal-conjectures-pilot/paretomod9/tools/run_hosted_kernel_replay.sh

      - name: Upload exact-source kernel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paretomod9-lean-kernel-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            research/formal-conjectures-pilot/paretomod9/PINS.json
            research/formal-conjectures-pilot/paretomod9/STATUS.json
            research/formal-conjectures-pilot/paretomod9/AEGIS_PARETOMOD9_ModeA_v01.lean
            research/formal-conjectures-pilot/paretomod9/evidence/
          if-no-files-found: error
