name: AEDR Multilayer DAG

on:
  pull_request:
    paths:
      - 'scripts/aedr/**'
      - 'tests/aedr/**'
      - '.github/workflows/aedr-multilayer-dag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install exact test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run AEDR fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/aedr/test_dag_consolidator.py \
            tests/aedr/test_live_acquisition.py
