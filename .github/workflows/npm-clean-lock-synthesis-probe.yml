name: NPM Clean Lock Synthesis Probe

on:
  push:
    branches:
      - hardening/mycorrhizal-structural-witness-v1
    paths:
      - .github/workflows/npm-clean-lock-synthesis-probe.yml

permissions:
  contents: read

jobs:
  synthesize-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite direct vulnerable ranges before installing node_modules
        working-directory: sovereign-omega-v2
        run: |
          test ! -d node_modules
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.ajv = '^8.20.0';
          p.devDependencies.postcss = '^8.5.28';
          p.devDependencies.vitest = '^4.1.11';
          p.devDependencies['@vitest/coverage-v8'] = '^4.1.11';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Resolve lock only from clean filesystem
        working-directory: sovereign-omega-v2
        run: npx --yes npm@10.9.9 install --package-lock-only --ignore-scripts
      - name: Refresh vulnerable transitive patches within existing ranges
        working-directory: sovereign-omega-v2
        run: |
          npx --yes npm@10.9.9 update --package-lock-only --ignore-scripts \
            baseline-browser-mapping brace-expansion browserslist fast-uri js-yaml postcss-selector-parser undici
      - name: Audit clean candidate
        working-directory: sovereign-omega-v2
        run: |
          npx --yes npm@10.9.9 audit --json > audit-clean-candidate.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a = JSON.parse(fs.readFileSync('audit-clean-candidate.json','utf8'));
          console.log('CLEAN_CANDIDATE_AUDIT=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          console.log('CLEAN_CANDIDATE_RESIDUAL=' + JSON.stringify(Object.fromEntries(Object.entries(a.vulnerabilities ?? {}).map(([k,v]) => [k,{severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}]))));
          if ((a.metadata?.vulnerabilities?.total ?? 0) !== 0) process.exit(2);
          NODE
      - name: Install candidate with repository npm
        working-directory: sovereign-omega-v2
        run: |
          npm --version
          npm ci
      - name: Verify frozen hashes
        working-directory: sovereign-omega-v2
        run: node scripts/verify-hashes.mjs
      - name: Focused tests
        working-directory: sovereign-omega-v2
        run: npx vitest run test/unit/mycorrhizal-contracts.test.ts test/unit/mycorrhizal-state.test.ts test/unit/mycorrhizal-routing.test.ts test/unit/mycorrhizal-1bna.test.ts test/unit/mycorrhizal-structural-witness-registry.test.ts
      - name: Full tests
        working-directory: sovereign-omega-v2
        run: npm run test
      - name: Typecheck
        working-directory: sovereign-omega-v2
        run: npm run typecheck
      - name: Build
        working-directory: sovereign-omega-v2
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: npm-clean-zero-vulnerability-candidate
          path: |
            sovereign-omega-v2/package.json
            sovereign-omega-v2/package-lock.json
            sovereign-omega-v2/audit-clean-candidate.json
