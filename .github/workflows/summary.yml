name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    if: vars.PROXY_URL != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Summarize through AEGIS constitutional proxy
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg number "$ISSUE_NUMBER" \
            --arg body "$ISSUE_BODY" \
            '{"event_type":"github_issue_opened","payload":{"title":$title,"number":$number,"body":$body}}')"

          response="$(curl -fsS -X POST "$PROXY_URL/agents/dispatch" \
            -H "Content-Type: application/json" \
            -d "$payload")"

          summary="$(printf '%s' "$response" | jq -r '
            [(.results // [])[] | select(.is_valid == true and (.output | type == "string") and (.output | length > 0))][0].output //
            [(.results // [])[] | select((.output | type == "string") and (.output | length > 0))][0].output //
            empty
          ')"

          if [ -z "$summary" ]; then
            echo "No admissible summary returned; leaving issue unchanged."
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" --body "$summary"
