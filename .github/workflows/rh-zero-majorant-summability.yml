name: RH Zero Majorant Summability

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroMajorantSummabilityV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_majorant_summability_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_majorant_summability_v1.py'
      - '.github/workflows/rh-zero-majorant-summability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: 4c100d1f84188deddd1e00dc6cb8aca851fc4eea
  PARENT_BRIDGE_SHA: a312ba0b7533e043ebc9c69083eb47a67ff8a716
  PARENT_BRIDGE_RECEIPT: 45ec057867b5635f061d420204ba8099273f240e27efda9e645eed9e26bac7c0
  PARENT_BRIDGE_ARTIFACT: 6b0414668fa49ef48616a4923513f413b08de9423eef314123679b9d56c87931
  PARENT_BRIDGE_SOURCE_BLOB: f72516a9ee50f8b5457f4a99c55ddc296d15d8dd
  LIMIT_CONTRACT_SOURCE_BLOB: 5d0d065113d9076db4eab6cf4be7a9868eec56a4
  FINITE_SUM_SOURCE_BLOB: 94415f65ae85e1e9993916a22891ca2248d65d4d
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  FORMAL_CONJECTURES_RH_BLOB_SHA: c8d38bef385eb15661c3daf7449625b66b019b2a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  INFINITE_SUM_BLOB_SHA: 9b88acb3c7b6034cb118bde2e1c34c5030d0f531

jobs:
  zero-majorant-summability:
    name: pinned zero majorant direct-comparison bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and local dependency sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroMajorantSummabilityV1.lean)" = "$SOURCE_BLOB_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightSummabilityBridgeV1.lean)" = "$PARENT_BRIDGE_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightLimitContractV1.lean)" = "$LIMIT_CONTRACT_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean)" = "$FINITE_SUM_SOURCE_BLOB"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zero_majorant_summability_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zero_majorant_summability_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZERO_MAJORANT_SUMMABILITY_V1'
          assert m['candidate']['formal_source_git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          p = m['verified_parent_evidence']['unconditional_summability_bridge']
          assert (p['aegis_revision'], p['receipt_sha256'], p['artifact_sha256'], p['formal_source_git_blob_sha']) == (
              os.environ['PARENT_BRIDGE_SHA'], os.environ['PARENT_BRIDGE_RECEIPT'],
              os.environ['PARENT_BRIDGE_ARTIFACT'], os.environ['PARENT_BRIDGE_SOURCE_BLOB'])
          d = m['local_dependency_sources']
          assert d['height_limit_contract_git_blob_sha'] == os.environ['LIMIT_CONTRACT_SOURCE_BLOB']
          assert d['finite_height_sum_git_blob_sha'] == os.environ['FINITE_SUM_SOURCE_BLOB']
          e = m['external_environment']
          assert e['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert e['formal_conjectures_rh_blob_sha'] == os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          u = m['upstream_mathlib'][0]
          assert u['path'] == 'Mathlib/Analysis/Normed/Group/InfiniteSum.lean'
          assert u['git_blob_sha'] == os.environ['INFINITE_SUM_BLOB_SHA']
          assert u['required_declaration'] == 'Summable.of_norm_bounded'
          s = m['scope']
          for key in ('majorant_certificate_definition','direct_comparison_summability','majorant_implies_height_limit_existence','majorant_height_limit_eq_tsum'):
              assert s[key] == 'CANDIDATE'
          for key in ('actual_majorant_construction','weil_class_majorant','conditional_symmetric_convergence','height_radial_equivalence','explicit_formula_theorem','critical_line_re_half','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['claim_promotion'] == 'BLOCKED'
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(git hash-object FormalConjectures/Millenium/RiemannHypothesis.lean)" = "$FORMAL_CONJECTURES_RH_BLOB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: lake exe cache get

      - name: Bind pinned direct-comparison source
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Normed/Group/InfiniteSum.lean)" = "$INFINITE_SUM_BLOB_SHA"
          grep -F 'theorem Summable.of_norm_bounded' .lake/packages/mathlib/Mathlib/Analysis/Normed/Group/InfiniteSum.lean

      - name: Compile parent chain and zero majorant bridge
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-majorant-lean-version.txt"
          cp "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean" ./ZeroHeightFiniteSumV1.lean
          cp "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroHeightLimitContractV1.lean" ./ZeroHeightLimitContractV1.lean
          cp "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroHeightSummabilityBridgeV1.lean" ./ZeroHeightSummabilityBridgeV1.lean
          cp "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroMajorantSummabilityV1.lean" ./ZeroMajorantSummabilityV1.lean
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ZeroHeightFiniteSumV1.olean ZeroHeightFiniteSumV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-majorant-parent-finite-sum.log"
          lake env lean -o .lake/build/lib/lean/ZeroHeightLimitContractV1.olean ZeroHeightLimitContractV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-majorant-parent-limit-contract.log"
          lake env lean -o .lake/build/lib/lean/ZeroHeightSummabilityBridgeV1.olean ZeroHeightSummabilityBridgeV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-majorant-parent-summability.log"
          lake env lean ZeroMajorantSummabilityV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-majorant-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-majorant-parent-finite-sum.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-majorant-parent-limit-contract.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-majorant-parent-summability.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-majorant-lean.log"

      - name: Emit fail-closed zero-majorant receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroMajorantSummabilityV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zero_majorant_summability_v1.json')
          log = Path('zero-majorant-lean.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZERO_MAJORANT_SUMMABILITY_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'parent_bridge_revision':os.environ['PARENT_BRIDGE_SHA'],
            'parent_bridge_receipt_sha256':os.environ['PARENT_BRIDGE_RECEIPT'],
            'formal_conjectures_revision':os.environ['FORMAL_CONJECTURES_SHA'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'majorant_certificate_definition':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'direct_comparison_summability':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'majorant_implies_height_limit_existence':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'majorant_height_limit_eq_tsum':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'actual_majorant_construction':'OPEN',
            'weil_class_majorant':'OPEN',
            'actual_zero_sum_summability':'OPEN',
            'conditional_symmetric_convergence':'OPEN',
            'height_radial_equivalence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'critical_line_re_half':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zero-majorant-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zero-majorant-receipt.json').read_text())
          PY

      - name: Upload zero-majorant evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-majorant-summability-${{ env.SOURCE_SHA }}
          path: |
            zero-majorant-lean-version.txt
            zero-majorant-parent-finite-sum.log
            zero-majorant-parent-limit-contract.log
            zero-majorant-parent-summability.log
            zero-majorant-lean.log
            zero-majorant-receipt.json
          if-no-files-found: error
          retention-days: 30
