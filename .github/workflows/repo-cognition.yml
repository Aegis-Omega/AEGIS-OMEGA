name: AEGIS Repository Cognition

on:
  push:
    branches: [main, 'claude/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-cognition:
    name: Repository Coverage [T1]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run RED/GREEN repository cognition contract
        run: python sovereign-omega-v2/python/tests/test_repo_cognition.py

      - name: Verify committed corpus is complete and current
        id: corpus_check
        continue-on-error: true
        run: python scripts/repo_cognition.py --check

      - name: Generate candidate corpus when committed corpus is stale
        if: steps.corpus_check.outcome != 'success'
        run: |
          rm -f .aegis/repo-cognition-v1.json
          python scripts/repo_cognition.py --write
          python scripts/repo_cognition.py --check
          python scripts/repo_cognition.py --check --receipt > repo-cognition-receipt.txt

      - name: Upload candidate corpus evidence
        if: steps.corpus_check.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: repo-cognition-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .aegis/repo-cognition-v1.json
            repo-cognition-receipt.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed if committed corpus was stale
        if: steps.corpus_check.outcome != 'success'
        run: |
          echo 'REPOSITORY_KNOWLEDGE_INCOMPLETE: candidate artifact generated; committed corpus must be updated.' >&2
          exit 1
