name: KG-005 Proof-Producing Refinement

on:
  pull_request:
    paths:
      - "harness/sdk/trace_refinement_witness.py"
      - "sovereign-omega-v2/python/tests/test_trace_refinement_witness.py"
      - "sovereign-omega-v2/formal/theories/Core/TraceRefinementWitness.v"
      - ".github/workflows/kg-005-proof-producing-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-005-proof-producing-refinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python-witness:
    name: python witness falsifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Bind exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact pytest
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Run KG-005 falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_trace_refinement_witness.py

  coq-witness:
    name: coqc proof-producing witness checker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Bind exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Require checker source
        shell: bash
        run: test -f sovereign-omega-v2/formal/theories/Core/TraceRefinementWitness.v
