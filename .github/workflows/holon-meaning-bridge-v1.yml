name: Holon Meaning Bridge V1

on:
  pull_request:
    paths:
      - 'harness/sdk/holon_meaning_bridge.py'
      - 'harness/sdk/holon_graph_verifier.py'
      - 'harness/tests/test_holon_meaning_bridge.py'
      - 'harness/tests/test_holon_graph_verifier.py'
      - 'docs/HOLON_MEANING_BRIDGE_V1.md'
      - '.github/workflows/holon-meaning-bridge-v1.yml'
  push:
    branches: [feat/holon-meaning-heritage-bridge-v1]
    paths:
      - 'harness/sdk/holon_meaning_bridge.py'
      - 'harness/sdk/holon_graph_verifier.py'
      - 'harness/tests/test_holon_meaning_bridge.py'
      - 'harness/tests/test_holon_graph_verifier.py'
      - '.github/workflows/holon-meaning-bridge-v1.yml'

permissions:
  contents: read

concurrency:
  group: holon-meaning-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: aegis / holon-meaning-bridge-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Compile exact source and tests
        run: |
          python -m py_compile \
            harness/sdk/meaning_heritage.py \
            harness/sdk/heritage_composition.py \
            harness/sdk/holon_meaning_bridge.py \
            harness/sdk/holon_graph_verifier.py \
            harness/tests/test_holon_meaning_bridge.py \
            harness/tests/test_holon_graph_verifier.py
      - name: Run bridge and inherited MHP falsifiers
        run: |
          python -m pytest -q \
            harness/tests/test_holon_meaning_bridge.py \
            harness/tests/test_holon_graph_verifier.py \
            harness/tests/test_meaning_heritage_morphisms.py \
            harness/tests/test_heritage_fingerprint_hardening.py \
            harness/tests/test_heritage_transitive_composition.py
