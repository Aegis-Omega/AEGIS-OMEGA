name: AEGIS RuntimePoP Cryptographic Verifier

on:
  pull_request:
    branches: [main, feat/runtime-pop-execution-principal-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-pop-crypto:
    name: aegis / runtime-pop-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4 resolved 2026-08-21
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved commit
        with:
          python-version: '3.12'

      - name: Install exact cryptographic verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0

      - name: Run cryptographic RuntimePoP falsifiers
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_runtime_pop_crypto.py
          python sovereign-omega-v2/python/tests/test_runtime_pop_authority_binding.py
