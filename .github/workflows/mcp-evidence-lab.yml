name: AEGIS MCP Evidence Lab Static Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'hub/public/labs/mcp/**'
      - 'hub/test/mcp-evidence.test.mjs'
      - 'hub/test/mcp-routing.test.mjs'
      - 'hub/vercel.json'
      - 'vercel.json'
      - 'hook-generator/vercel.json'
      - 'platform-picker/vercel.json'
      - '.github/workflows/mcp-evidence-lab.yml'

permissions:
  contents: read

jobs:
  mcp-evidence-static:
    name: aegis / mcp-evidence-static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify JS syntax and JSON validity
        shell: bash
        run: |
          set -euo pipefail
          node --check hub/public/labs/mcp/app.mjs
          node --check hub/public/labs/mcp/verify.mjs
          node -e 'for (const p of process.argv.slice(1)) JSON.parse(require("node:fs").readFileSync(p,"utf8"))' hub/public/labs/mcp/receipt.json hub/public/labs/mcp/trace.json hub/public/labs/mcp/friction-log.json
      - name: Run pinned archive verifier and MCP route tests
        shell: bash
        run: |
          set -euo pipefail
          node --test hub/test/mcp-evidence.test.mjs hub/test/mcp-routing.test.mjs
