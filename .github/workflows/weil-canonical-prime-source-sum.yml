name: Weil Canonical Prime Source Sum

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/tests/Weil/CanonicalPrimeSourceSumSpec.v"
      - "sovereign-omega-v2/formal/theories/Weil/CanonicalPrimeSourceSum.v"
      - "sovereign-omega-v2/formal/theories/Weil/VonMangoldtCanonicalBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimalityStdlibBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerArithmeticBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerWeightBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimeSourceDerivativeConstructive.v"
      - ".github/workflows/weil-canonical-prime-source-sum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-canonical-prime-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  A2B2_PARENT_SHA: 29853d7a719e850eaf42403ae09196adaaeb0223
  A2B2_GREEN_WORKFLOW_RUN_ID: '33551032983'

jobs:
  attest-canonical-prime-source:
    name: coqc / canonical prime source GREEN
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Reject declared assumptions in q-native source
        shell: bash
        run: |
          set -euo pipefail
          source=sovereign-omega-v2/formal/theories/Weil/CanonicalPrimeSourceSum.v
          test -f "$source"
          if grep -En '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted)[[:space:].]' "$source"; then
            echo "Declared assumption/admission forbidden: $source" >&2
            exit 1
          fi

      - name: Prepare writable evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-canonical-prime-source-attestation
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-canonical-prime-source-attestation

      - name: Compile q-native contract and assumptions
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTDIR="$ROOT/formal/tests/Weil"
            OUT="$ROOT/weil-canonical-prime-source-attestation"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"

            for f in PrimeSourceDerivativeConstructive PrimePowerWeightBridge \
                     FinitePrimeSourceSum PrimePowerArithmeticBridge \
                     PrimalityStdlibBridge VonMangoldtCanonicalBridge \
                     CanonicalPrimeSourceSum; do
              coqc -Q "$THEORY" "" "$THEORY/$f.v" 2>&1 | tee "$OUT/$f.log"
            done
            coqc -Q "$THEORY" "" -Q "$TESTDIR" "" \
              "$TESTDIR/CanonicalPrimeSourceSumSpec.v" 2>&1 \
              | tee "$OUT/canonical-prime-source-spec.log"

            for theorem in \
              prime_power_base_v1_none_iff \
              canonical_integer_q_v1_scope \
              canonical_integer_q_v1_injective \
              canonical_integer_q_v1_ge_2 \
              von_mangoldt_v1_zero_off_prime_powers \
              canonical_integer_parameters_certified_binding_v1 \
              canonical_von_mangoldt_amplitude_zero_off_prime_powers_v1 \
              canonical_von_mangoldt_finite_sum_shared_scale_derivative_constructive_v1
            do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              cat > "$query" <<EOF
            Set Coqtop Exit On Error.
            Require Import CanonicalPrimeSourceSum.
            Print Assumptions ${theorem}.
            EOF
              coqtop -quiet -batch -Q "$THEORY" "" -l "$query" > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for ${theorem}" >&2
                exit 1
              fi
            done

            cat > "$OUT/prime-source-checkpoint.txt" <<'EOF'
            CANONICAL_PRIME_SOURCE_CHECKPOINT_VERIFIED=true
            THEOREM_COUNT=8
            DECLARED_ASSUMPTIONS=0
            PRIME_POWER_NEGATIVE_SPECIFICATION_MACHINE_BOUND=true
            VON_MANGOLDT_ZERO_ON_NON_PRIME_POWERS_MACHINE_BOUND=true
            CANONICAL_ALL_INTEGER_Q_INDEX_MACHINE_BOUND=true
            CANONICAL_ALL_INTEGER_Q_INDEX_SCOPE=Q_EQUALS_2_THROUGH_COUNT_PLUS_1
            CERTIFICATE_PARAMETER_BINDING_MACHINE_BOUND=true
            NON_PRIME_POWER_AMPLITUDE_ZERO_MACHINE_BOUND=true
            CERTIFICATE_FREE_FINITE_SOURCE_DERIVATIVE_MACHINE_BOUND=true
            CANONICAL_PRIME_POWER_ENUMERATION_MACHINE_BOUND=false
            TOTAL_PRIME_FACTORIZATION_MACHINE_BOUND=false
            CORN_O0_TRIG_TRANSPORT_MACHINE_BOUND=false
            GUINAND_WEIL_EXPLICIT_FORMULA_MACHINE_BOUND=false
            FORMULA_TO_WEIL_OPERATOR_IDENTITY_PROVEN=false
            GLOBAL_WEIL_POSITIVITY_PROVEN=false
            RH_PROVEN=false
            EOF

      - name: Emit content-addressed canonical receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          out = Path('weil-canonical-prime-source-attestation')
          theory = Path('formal/theories/Weil')
          tests = Path('formal/tests/Weil')
          source = theory / 'CanonicalPrimeSourceSum.v'
          spec = tests / 'CanonicalPrimeSourceSumSpec.v'
          parent = theory / 'VonMangoldtCanonicalBridge.v'

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          checkpoint = (out / 'prime-source-checkpoint.txt').read_text(encoding='utf-8')
          theorem_names = [
              'prime_power_base_v1_none_iff',
              'canonical_integer_q_v1_scope',
              'canonical_integer_q_v1_injective',
              'canonical_integer_q_v1_ge_2',
              'von_mangoldt_v1_zero_off_prime_powers',
              'canonical_integer_parameters_certified_binding_v1',
              'canonical_von_mangoldt_amplitude_zero_off_prime_powers_v1',
              'canonical_von_mangoldt_finite_sum_shared_scale_derivative_constructive_v1',
          ]
          def closed(theorem):
              # Derived from the coqtop output the loop above recorded, never
              # from a literal: closed under the global context and no Axioms.
              text = (out / f'{theorem}.assumptions.txt').read_text(encoding='utf-8')
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              return (
                  bool(lines)
                  and any('Closed under the global context' in line for line in lines)
                  and not any(line.startswith('Axioms:') for line in lines)
              )

          closed_by_theorem = {name: closed(name) for name in theorem_names}
          scope_bound = (
              closed_by_theorem['canonical_integer_q_v1_scope']
              and closed_by_theorem['canonical_integer_q_v1_injective']
              and closed_by_theorem['canonical_integer_q_v1_ge_2']
          )
          payload = {
              'receipt_kind': 'AEGIS_A2B3_CANONICAL_PRIME_SOURCE_GREEN_RECEIPT_V1',
              'authority': 'FORMAL_MATH_EVIDENCE_ONLY',
              'source_commit': os.environ['SOURCE_SHA'],
              'admission_parent_commit': os.environ['A2B2_PARENT_SHA'],
              'a2b2_green_workflow_run_id': int(os.environ['A2B2_GREEN_WORKFLOW_RUN_ID']),
              'corn_version': (out / 'corn-version.txt').read_text(encoding='utf-8').strip(),
              'canonical_source_sha256': sha(source),
              'canonical_spec_sha256': sha(spec),
              'parent_canonical_source_sha256': sha(parent),
              'theorem_names': theorem_names,
              'theorem_count': len(theorem_names),
              'closed_by_theorem': closed_by_theorem,
              'declared_assumptions': sum(1 for ok in closed_by_theorem.values() if not ok),
              'canonical_prime_source_checkpoint_verified':
                  'CANONICAL_PRIME_SOURCE_CHECKPOINT_VERIFIED=true' in checkpoint,
              'prime_power_negative_specification_machine_bound':
                  closed_by_theorem['prime_power_base_v1_none_iff'],
              'von_mangoldt_zero_on_non_prime_powers_machine_bound':
                  closed_by_theorem['von_mangoldt_v1_zero_off_prime_powers'],
              'canonical_all_integer_q_index_machine_bound': scope_bound,
              'canonical_all_integer_q_index_scope':
                  'Q_EQUALS_2_THROUGH_COUNT_PLUS_1' if scope_bound else 'UNBOUND',
              'certificate_parameter_binding_machine_bound':
                  closed_by_theorem['canonical_integer_parameters_certified_binding_v1'],
              'non_prime_power_amplitude_zero_machine_bound':
                  closed_by_theorem['canonical_von_mangoldt_amplitude_zero_off_prime_powers_v1'],
              'certificate_free_finite_source_derivative_machine_bound':
                  closed_by_theorem['canonical_von_mangoldt_finite_sum_shared_scale_derivative_constructive_v1'],
              'canonical_prime_power_enumeration_machine_bound': False,
              'total_prime_factorization_machine_bound': False,
              'corn_o0_trig_transport_machine_bound': False,
              'guinand_weil_explicit_formula_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
          }
          target = out / 'A2B3_CANONICAL_PRIME_SOURCE_RECEIPT.json'
          target.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))

          assert payload['corn_version'] == '9.0.0'
          assert payload['canonical_prime_source_checkpoint_verified'] is True
          assert payload['theorem_count'] == 8
          assert all(payload['closed_by_theorem'].values()), payload['closed_by_theorem']
          assert payload['canonical_all_integer_q_index_scope'] == 'Q_EQUALS_2_THROUGH_COUNT_PLUS_1'
          assert payload['declared_assumptions'] == 0
          assert payload['prime_power_negative_specification_machine_bound'] is True
          assert payload['von_mangoldt_zero_on_non_prime_powers_machine_bound'] is True
          assert payload['canonical_all_integer_q_index_machine_bound'] is True
          assert payload['certificate_parameter_binding_machine_bound'] is True
          assert payload['non_prime_power_amplitude_zero_machine_bound'] is True
          assert payload['certificate_free_finite_source_derivative_machine_bound'] is True
          assert payload['canonical_prime_power_enumeration_machine_bound'] is False
          assert payload['total_prime_factorization_machine_bound'] is False
          assert payload['corn_o0_trig_transport_machine_bound'] is False
          assert payload['guinand_weil_explicit_formula_machine_bound'] is False
          assert payload['formula_to_weil_operator_identity_proven'] is False
          assert payload['global_weil_positivity_proven'] is False
          assert payload['rh_proven'] is False
          PY

      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-a2b3-canonical-prime-source-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-canonical-prime-source-attestation
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
