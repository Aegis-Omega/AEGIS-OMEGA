name: GCP Federation Probe

on:
  push:
    branches: [agent/gcp-ngs-census-v1]
    paths: ['.github/workflows/gcp-ngs-census.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  legacy-provider:
    name: Probe GCP_WIF_PROVIDER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate legacy provider
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aegisomegav1
      - name: Read-only project probe
        run: |
          gcloud storage buckets list --project aegisomegav1 --format='value(name)' | sed -n '1,20p'
          gcloud sql instances list --project aegisomegav1 --format='table(name,region,state,databaseVersion)'

  deploy-secret-provider:
    name: Probe GCP_WORKLOAD_IDENTITY_PROVIDER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate deploy provider
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aegisomegav1
      - name: Read-only project probe
        run: |
          mkdir -p census
          gcloud storage buckets list --project aegisomegav1 --format=json > census/buckets.json
          gcloud sql instances list --project aegisomegav1 --format=json > census/cloudsql.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('census/buckets.json').read_text() or '[]')
          s=json.loads(Path('census/cloudsql.json').read_text() or '[]')
          print('AUTH_PATH=GCP_WORKLOAD_IDENTITY_PROVIDER')
          print('BUCKET_COUNT='+str(len(b)))
          print('SQL_INSTANCE_COUNT='+str(len(s)))
          for x in b[:50]: print('BUCKET='+str(x.get('name') or x.get('url') or ''))
          for x in s[:50]: print('SQL='+str(x.get('name'))+'|'+str(x.get('region'))+'|'+str(x.get('state'))+'|'+str(x.get('databaseVersion')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gcp-deploy-secret-probe
          path: census/
          retention-days: 7

  vars-provider:
    name: Probe vars.WIF_PROVIDER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate vars provider
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aegisomegav1
      - name: Read-only project probe
        run: |
          mkdir -p census
          gcloud storage buckets list --project aegisomegav1 --format=json > census/buckets.json
          gcloud sql instances list --project aegisomegav1 --format=json > census/cloudsql.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('census/buckets.json').read_text() or '[]')
          s=json.loads(Path('census/cloudsql.json').read_text() or '[]')
          print('AUTH_PATH=vars.WIF_PROVIDER')
          print('BUCKET_COUNT='+str(len(b)))
          print('SQL_INSTANCE_COUNT='+str(len(s)))
          for x in b[:50]: print('BUCKET='+str(x.get('name') or x.get('url') or ''))
          for x in s[:50]: print('SQL='+str(x.get('name'))+'|'+str(x.get('region'))+'|'+str(x.get('state'))+'|'+str(x.get('databaseVersion')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gcp-vars-probe
          path: census/
          retention-days: 7
