name: Cognitive Manifest Refresh

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-manifest-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: aegis / cognitive-manifest-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve current main parent state
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          parent_hash="$(git show origin/main:.claude.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["state_hash"])' 2>/dev/null || true)"
          if [[ ! "$parent_hash" =~ ^[0-9a-f]{64}$ ]]; then
            parent_hash="$(printf '0%.0s' {1..64})"
          fi
          echo "state_hash=$parent_hash" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic anchors
        run: |
          python scripts/build-cognitive-manifest.py \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}"
          python scripts/build-cognitive-manifest.py \
            --check \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}"

      - name: Commit refreshed anchors through GitHub-signed API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude.json skill-hashes.sha256; then
            echo "Manifest already current."
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          const token = process.env.GH_TOKEN;
          const sourceSha = process.env.SOURCE_SHA;
          const branch = process.env.TARGET_BRANCH;

          const refResponse = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${branch}`,
            {
              headers: {
                authorization: `bearer ${token}`,
                accept: 'application/vnd.github+json',
                'user-agent': 'aegis-cognitive-manifest-refresh-v2',
              },
            }
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== sourceSha) {
            console.error(`STALE_HEAD expected=${sourceSha} live=${refBody.commit.sha}`);
            process.exit(1);
          }

          const additions = ['.claude.json', 'skill-hashes.sha256'].map(path => ({
            path,
            contents: fs.readFileSync(path).toString('base64'),
          }));
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: sourceSha,
              message: { headline: 'chore(manifest): refresh cognitive-state anchors' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-cognitive-manifest-refresh-v2',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_MANIFEST_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_MANIFEST_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
