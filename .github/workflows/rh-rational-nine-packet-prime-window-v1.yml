name: RH Rational Nine Packet Prime Window V1

on:
  push:
    branches:
      - 'research/rh-rational-nine-packet-prime-window-v1'
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RHRationalNinePacketPrimeWindowV1.lean'
      - '.github/workflows/rh-rational-nine-packet-prime-window-v1.yml'
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RHRationalNinePacketPrimeWindowV1.lean'
      - '.github/workflows/rh-rational-nine-packet-prime-window-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: compile rational nine-packet prime-window producer
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and module inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilFiniteSourceCalculusV1
            WeilArchSineKernelV1
            WeilArchSineKernelIntegerV1
            WeilArchFiniteQuadraticV1
            WeilArchTailIntegralV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilDiagonalKernelReductionV21
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
            WeilThreeBlockCrossPrimeWindowV29
            WeilThreeBlockPrimeEvaluationV30
            WeilThreeBlockCrossAssemblyV30
            WeilSeparatedArchBridgeV31
            RHNarrowDiagonalUpgradeV2
            WeilMomentKillerConstructionV1
            WeilLogTransportCanonicalV1
            RHFineMomentPacketV3
            RHRationalNinePacketPrimeWindowV1
            RHNineBlockComparisonV1
            RHNineBlockActualBridgeV1
            RHNineBlockActualExpansionV1
            RHRationalNinePacketConcreteV1
          )
          : > evidence/modules.txt
          : > evidence/exact-source.log
          for m in "${modules[@]}"; do
            test -f "$ROOT/$m.lean"
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n'             "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" >> evidence/exact-source.log

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Compile exact producer chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Audit producer axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > RHRationalNinePacketPrimeWindowAudit.lean <<'EOF'
          import RHRationalNinePacketPrimeWindowV1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gFine_width_one_one_twenty_eight_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.logCorrelation_zero_of_fine_width_abs_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_one_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_two_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_three_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_four_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_five_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_six_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_seven_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_eight_vonMangoldt_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_one_prime_sum_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_eight_prime_sum_zero_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_one_B_norm_v1
          #print axioms AEGIS.RHRationalNinePacketPrimeWindowV1.gap_eight_B_norm_v1
          #print axioms AEGIS.RHNineBlockComparisonV1.comparison_sos_identity_nine_v1
          #print axioms AEGIS.RHNineBlockComparisonV1.diagonal_32_over_25_margin_nine_v1
          #print axioms AEGIS.RHNineBlockActualBridgeV1.nine_value_bound_v1
          #print axioms AEGIS.RHNineBlockActualExpansionV1.actual_nine_block_expansion_v1
          #print axioms AEGIS.RHNineBlockActualExpansionV1.actual_nine_block_bound_v1
          #print axioms AEGIS.RHRationalNinePacketConcreteV1.nine_packet_coercive_v1
          #print axioms AEGIS.RHRationalNinePacketConcreteV1.canonical_nine_packet_coercive_v1
          #print axioms AEGIS.RHRationalNinePacketConcreteV1.canonical_nine_packet_sign_v1
          EOF
          lake env lean RHRationalNinePacketPrimeWindowAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit bounded disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PRODUCER=RHRationalNinePacketPrimeWindowV1
          SUPPORT_RADIUS=1/256
          CORRELATION_RADIUS=1/128
          SPACING_BASE=33/16
          VERIFIED_GAPS_TARGET=1..8
          NINE_PACKET_COERCIVITY=NOT_CLAIMED
          UNIVERSAL_FINAL_SIGN=NOT_CLAIMED
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-rational-nine-packet-prime-window-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
