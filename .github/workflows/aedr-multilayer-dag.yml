name: AEDR Multilayer DAG

on:
  pull_request:
    paths:
      - 'scripts/aedr/**'
      - 'tests/aedr/**'
      - '.github/workflows/aedr-multilayer-dag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install exact test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run AEDR fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/aedr

      - name: Produce exact-run AEDR falsification surface
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          AEDR_PR_NUMBER: ${{ github.event.pull_request.number }}
          AEDR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AEDR_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/aedr/surface_producer.py \
            --manifest scripts/aedr/falsification_manifest_v1.json \
            --pr-number "$AEDR_PR_NUMBER" \
            --head-sha "$AEDR_HEAD_SHA" \
            --run-id "$AEDR_RUN_ID" \
            --output "$RUNNER_TEMP/aedr-surface.json"

      - name: Upload exact-run AEDR falsification surface
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: aedr-surface-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/aedr-surface.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
