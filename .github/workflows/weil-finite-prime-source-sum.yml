name: Weil Finite Prime Source Sum

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/tests/Weil/FinitePrimeSourceSumSpec.v"
      - "sovereign-omega-v2/formal/theories/Weil/FinitePrimeSourceSum.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerWeightBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimeSourceDerivativeConstructive.v"
      - ".github/workflows/weil-finite-prime-source-sum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-finite-prime-source-sum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ADMISSION_PARENT_SHA: 41bc7e65d8ec8737cf32352ea60a878411e49f6c
  RED_CHECKPOINT_SOURCE_SHA: ae2a4052669c55de060b9b407ce2f86dd5c987c7
  RED_WORKFLOW_RUN_ID: '33393502940'
  RED_RECEIPT_SHA256: 1254c408876e9438492e82a7c09e1dfb6d5cb4ad6fd542f95d2124b88435415e
  RED_ARTIFACT_DIGEST: sha256:20de1f1ee44a90dece9fd6a0cc58aed6c9cfa37646a5c3903ab6dcce3e7058f8

jobs:
  attest-green:
    name: coqc / finite prime-source sum GREEN attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare writable evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-finite-prime-source-sum-attestation
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-finite-prime-source-sum-attestation

      - name: Compile GREEN theorem contract and assumptions
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTDIR="$ROOT/formal/tests/Weil"
            DERIV="$THEORY/PrimeSourceDerivativeConstructive.v"
            BRIDGE="$THEORY/PrimePowerWeightBridge.v"
            SOURCE="$THEORY/FinitePrimeSourceSum.v"
            TEST="$TESTDIR/FinitePrimeSourceSumSpec.v"
            OUT="$ROOT/weil-finite-prime-source-sum-attestation"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"
            opam show coq-corn.9.0.0 --field=version,license,depends \
              | tee "$OUT/corn-package-metadata.txt"

            test -f "$DERIV"
            test -f "$BRIDGE"
            test -f "$SOURCE"
            test -f "$TEST"

            coqc -Q "$THEORY" "" "$DERIV" 2>&1 \
              | tee "$OUT/prime-source-derivative.log"
            coqc -Q "$THEORY" "" "$BRIDGE" 2>&1 \
              | tee "$OUT/prime-power-weight-bridge.log"
            coqc -Q "$THEORY" "" "$SOURCE" 2>&1 \
              | tee "$OUT/finite-prime-source-sum.log"
            coqc -Q "$THEORY" "" -Q "$TESTDIR" "" "$TEST" 2>&1 \
              | tee "$OUT/finite-prime-source-sum-spec.log"

            grep -Fq 'finite_prime_source_sum_derivative_constructive_v1' \
              "$OUT/finite-prime-source-sum-spec.log"
            grep -Fq 'Closed under the global context' \
              "$OUT/finite-prime-source-sum-spec.log"
            if grep -Fq 'Axioms:' "$OUT/finite-prime-source-sum-spec.log"; then
              echo 'GREEN theorem unexpectedly carries global assumptions.' >&2
              exit 1
            fi
            if grep -Eq '^[[:space:]]*(Axiom|Parameter|Admitted)[[:space:]]' "$SOURCE"; then
              echo 'Production source declares forbidden assumption syntax.' >&2
              exit 1
            fi

            cat > "$OUT/green-checkpoint.txt" <<'EOF'
            GREEN_CHECKPOINT_VERIFIED=true
            PRODUCTION_SOURCE_PRESENT=true
            THEOREM=finite_prime_source_sum_derivative_constructive_v1
            DECLARED_ASSUMPTIONS=0
            FINITE_PRIME_SOURCE_SUM_MACHINE_BOUND=true
            FINITE_PRIME_SOURCE_SUM_SCOPE=SUPPLIED_ANALYTIC_DESCRIPTORS_ONLY
            PRIME_POWER_ARITHMETIC_SEMANTICS_MACHINE_BOUND=false
            CORN_O0_TRIG_TRANSPORT_MACHINE_BOUND=false
            GLOBAL_WEIL_POSITIVITY_PROVEN=false
            RH_PROVEN=false
            EOF

      - name: Emit content-addressed GREEN receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path('weil-finite-prime-source-sum-attestation')
          theory = Path('formal/theories/Weil')
          test = Path('formal/tests/Weil/FinitePrimeSourceSumSpec.v')
          derivative = theory / 'PrimeSourceDerivativeConstructive.v'
          bridge = theory / 'PrimePowerWeightBridge.v'
          source = theory / 'FinitePrimeSourceSum.v'
          spec_log = out / 'finite-prime-source-sum-spec.log'

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          version = (out / 'corn-version.txt').read_text(encoding='utf-8').strip()
          checkpoint = (out / 'green-checkpoint.txt').read_text(encoding='utf-8')
          assumptions_closed = 'Closed under the global context' in spec_log.read_text(
              encoding='utf-8'
          )

          payload = {
              'receipt_kind': 'AEGIS_A2A_GREEN_COMPLIANCE_RECEIPT_V1',
              'authority': 'FORMAL_MATH_EVIDENCE_ONLY',
              'source_commit': os.environ['SOURCE_SHA'],
              'admission_parent_commit': os.environ['ADMISSION_PARENT_SHA'],
              'red_checkpoint_source_commit': os.environ['RED_CHECKPOINT_SOURCE_SHA'],
              'red_workflow_run_id': int(os.environ['RED_WORKFLOW_RUN_ID']),
              'red_receipt_sha256': os.environ['RED_RECEIPT_SHA256'],
              'red_artifact_digest': os.environ['RED_ARTIFACT_DIGEST'],
              'red_checkpoint_verified': True,
              'coq_version_sha256': sha(out / 'coq-version.txt'),
              'corn_requested_version': '9.0.0',
              'corn_installed_version': version,
              'corn_package_metadata_sha256': sha(out / 'corn-package-metadata.txt'),
              'derivative_source_sha256': sha(derivative),
              'weight_bridge_source_sha256': sha(bridge),
              'finite_prime_source_sum_source_sha256': sha(source),
              'green_spec_sha256': sha(test),
              'derivative_compile_log_sha256': sha(out / 'prime-source-derivative.log'),
              'weight_bridge_compile_log_sha256': sha(out / 'prime-power-weight-bridge.log'),
              'finite_prime_source_sum_compile_log_sha256': sha(out / 'finite-prime-source-sum.log'),
              'green_spec_compile_log_sha256': sha(spec_log),
              'green_checkpoint_sha256': sha(out / 'green-checkpoint.txt'),
              'theorem': 'finite_prime_source_sum_derivative_constructive_v1',
              'theorem_assumptions_closed': assumptions_closed,
              'declared_assumptions': 0,
              'production_source_present': source.exists(),
              'finite_prime_source_sum_machine_bound': True,
              'finite_prime_source_sum_scope': 'SUPPLIED_ANALYTIC_DESCRIPTORS_ONLY',
              'prime_power_arithmetic_semantics_machine_bound': False,
              'canonical_von_mangoldt_binding_machine_bound': False,
              'canonical_log_prime_power_binding_machine_bound': False,
              'canonical_sqrt_prime_power_binding_machine_bound': False,
              'corn_o0_trig_transport_machine_bound': False,
              'guinand_weil_explicit_formula_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
              'open_obligations': [
                  'PRIME_POWER_ARITHMETIC_SEMANTICS_NOT_MACHINE_BOUND',
                  'CANONICAL_VON_MANGOLDT_BINDING_NOT_MACHINE_BOUND',
                  'CANONICAL_LOG_PRIME_POWER_BINDING_NOT_MACHINE_BOUND',
                  'CANONICAL_SQRT_PRIME_POWER_BINDING_NOT_MACHINE_BOUND',
                  'CORN_IR_TO_O0_TRIG_TRANSPORT_NOT_MACHINE_BOUND',
                  'GUINAND_WEIL_EXPLICIT_FORMULA_NOT_MACHINE_BOUND',
                  'FORMULA_TO_WEIL_OPERATOR_IDENTITY_NOT_MACHINE_BOUND',
                  'GLOBAL_WEIL_POSITIVITY_NOT_PROVEN',
              ],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = out / 'weil-finite-prime-source-sum-green-receipt.json'
          target.write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))

          assert version == '9.0.0'
          assert payload['admission_parent_commit'] == '41bc7e65d8ec8737cf32352ea60a878411e49f6c'
          assert payload['red_checkpoint_source_commit'] == 'ae2a4052669c55de060b9b407ce2f86dd5c987c7'
          assert payload['red_receipt_sha256'] == '1254c408876e9438492e82a7c09e1dfb6d5cb4ad6fd542f95d2124b88435415e'
          assert payload['red_checkpoint_verified'] is True
          assert payload['production_source_present'] is True
          assert payload['theorem_assumptions_closed'] is True
          assert payload['declared_assumptions'] == 0
          assert payload['finite_prime_source_sum_machine_bound'] is True
          assert payload['finite_prime_source_sum_scope'] == 'SUPPLIED_ANALYTIC_DESCRIPTORS_ONLY'
          assert payload['prime_power_arithmetic_semantics_machine_bound'] is False
          assert payload['corn_o0_trig_transport_machine_bound'] is False
          assert payload['global_weil_positivity_proven'] is False
          assert payload['rh_proven'] is False
          assert 'GREEN_CHECKPOINT_VERIFIED=true' in checkpoint
          assert len(payload['receipt_sha256']) == 64
          PY

      - name: Upload GREEN evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-finite-prime-source-sum-green-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-finite-prime-source-sum-attestation/
          if-no-files-found: error
          retention-days: 30
