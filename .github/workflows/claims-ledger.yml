# Claims Ledger enforcement — manuscript-governance gate.
# Orthogonal to the constitutional CEREMONY quorum in ci.yml: this workflow governs the
# evidence discipline of the manuscript claims ledger only, and is NOT part of the BFT
# quorum. It does not gate CEREMONY and CEREMONY does not gate it.
name: claims-ledger

on:
  pull_request:
    paths:
      - docs/claims.json
      - docs/CLAIMS_LEDGER.md
      - docs/claims.schema.json
      - docs/claim-promotions/**
      - docs/claim-admission-policy.v1.json
      - docs/research-control-baseline.v0.4.json
      - docs/claim-promotion.schema.json
      - scripts/validate-claims.mjs
      - scripts/lib/claim-promotion.mjs
      - scripts/validate-claim-promotion.mjs
      - test/claim-promotion-admission.test.mjs
      - .github/workflows/claims-ledger.yml
  push:
    paths:
      - docs/claims.json
      - docs/CLAIMS_LEDGER.md
      - docs/claims.schema.json
      - docs/claim-promotions/**
      - docs/claim-admission-policy.v1.json
      - docs/research-control-baseline.v0.4.json
      - docs/claim-promotion.schema.json
      - scripts/validate-claims.mjs
      - scripts/lib/claim-promotion.mjs
      - scripts/validate-claim-promotion.mjs
      - test/claim-promotion-admission.test.mjs
      - .github/workflows/claims-ledger.yml

permissions:
  contents: read

jobs:
  validate-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate claims ledger
        run: node scripts/validate-claims.mjs
      - name: Run claim promotion contract
        run: node --test test/claim-promotion-admission.test.mjs
      - name: Enforce fail-closed Verified-claim promotion
        if: github.event_name == 'pull_request'
        run: node scripts/validate-claim-promotion.mjs --base-sha "${{ github.event.pull_request.base.sha }}"
      - name: Validate bound promotion manifests on push
        if: github.event_name == 'push'
        run: node scripts/validate-claim-promotion.mjs
