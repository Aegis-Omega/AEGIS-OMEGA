name: Finite Cutoff State Space Boundary

on:
  pull_request:
    paths:
      - 'research/rh/finite_cutoff_state_space_boundary.py'
      - 'research/rh/test_finite_cutoff_state_space_boundary.py'
      - '.github/workflows/finite-cutoff-state-space.yml'
  push:
    branches:
      - integration/aegis-universal-intelligence-rh-v1
    paths:
      - 'research/rh/finite_cutoff_state_space_boundary.py'
      - 'research/rh/test_finite_cutoff_state_space_boundary.py'
      - '.github/workflows/finite-cutoff-state-space.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==8.4.1' 'numpy==2.3.2' 'scipy==1.16.1'

      - name: Run state-space boundary falsifiers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q research/rh/test_finite_cutoff_state_space_boundary.py
