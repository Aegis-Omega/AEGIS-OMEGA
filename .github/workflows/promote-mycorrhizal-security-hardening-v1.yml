name: Promote Mycorrhizal Security Hardening V1

on:
  push:
    branches:
      - hardening/mycorrhizal-structural-witness-v1
    paths:
      - .github/workflows/promote-mycorrhizal-security-hardening-v1.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: hardening/mycorrhizal-structural-witness-security-v1
      EXPECTED_TARGET_HEAD: 55e9e0a68067a892f3e0194d277f56595e22611c
      ARTIFACT_ID: '10481952340'
      ARTIFACT_SHA256: e3d0d338a09c7875674c517f98a83dde10147b7c09e1cce18cf31ea534cd87be
    steps:
      - name: Checkout signed-workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact zero-vulnerability candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o candidate.zip
          printf '%s  %s\n' "$ARTIFACT_SHA256" candidate.zip | sha256sum -c -
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -s candidate/package.json
          test -s candidate/package-lock.json
          test -s candidate/audit-fresh-lock.json

      - name: Validate candidate and build final Gate-8 workflow binding
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const audit = JSON.parse(fs.readFileSync('candidate/audit-fresh-lock.json', 'utf8'));
          if ((audit.metadata?.vulnerabilities?.total ?? -1) !== 0) {
            throw new Error('candidate audit is not zero');
          }

          const pkg = JSON.parse(fs.readFileSync('candidate/package.json', 'utf8'));
          const expected = {
            ajv: '^8.20.0',
            postcss: '^8.5.28',
            vitest: '^4.1.11',
            '@vitest/coverage-v8': '^4.1.11',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.devDependencies?.[name] !== version) {
              throw new Error(`unexpected ${name} version: ${pkg.devDependencies?.[name]}`);
            }
          }

          let gate = fs.readFileSync('.github/workflows/mycorrhizal-1bna-sync.yml', 'utf8');
          const branchNeedle = "      - feat/mycorrhizal-structural-witness-registry-v1\n";
          if (!gate.includes(branchNeedle)) throw new Error('Gate-8 branch anchor missing');
          gate = gate.replace(
            branchNeedle,
            branchNeedle + "      - hardening/mycorrhizal-structural-witness-security-v1\n",
          );

          const pushNeedle = "      - '.github/workflows/mycorrhizal-1bna-sync.yml'\n  pull_request:\n";
          if (!gate.includes(pushNeedle)) throw new Error('Gate-8 push path anchor missing');
          gate = gate.replace(
            pushNeedle,
            "      - '.github/workflows/mycorrhizal-1bna-sync.yml'\n" +
            "      - 'sovereign-omega-v2/package.json'\n" +
            "      - 'sovereign-omega-v2/package-lock.json'\n" +
            "      - '.github/workflows/cognitive-manifest-refresh.yml'\n" +
            "      - '.claude.json'\n" +
            "      - 'skill-hashes.sha256'\n" +
            "  pull_request:\n",
          );

          const prNeedle = "      - '.github/workflows/mycorrhizal-1bna-sync.yml'\n  workflow_dispatch:\n";
          if (!gate.includes(prNeedle)) throw new Error('Gate-8 PR path anchor missing');
          gate = gate.replace(
            prNeedle,
            "      - '.github/workflows/mycorrhizal-1bna-sync.yml'\n" +
            "      - 'sovereign-omega-v2/package.json'\n" +
            "      - 'sovereign-omega-v2/package-lock.json'\n" +
            "      - '.github/workflows/cognitive-manifest-refresh.yml'\n" +
            "      - '.claude.json'\n" +
            "      - 'skill-hashes.sha256'\n" +
            "  workflow_dispatch:\n",
          );
          fs.writeFileSync('candidate/mycorrhizal-1bna-sync.yml', gate);
          NODE

      - name: Create one GitHub-signed hardening commit on clean child branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const branch = process.env.TARGET_BRANCH;
          const expectedTargetHead = process.env.EXPECTED_TARGET_HEAD;

          const refResponse = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${branch}`,
            { headers: {
              authorization: `bearer ${token}`,
              accept: 'application/vnd.github+json',
              'user-agent': 'aegis-security-hardening-promoter-v1',
            } },
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== expectedTargetHead) {
            throw new Error(`STALE_TARGET expected=${expectedTargetHead} live=${refBody.commit.sha}`);
          }

          const sources = [
            ['.github/workflows/cognitive-manifest-refresh.yml', '.github/workflows/cognitive-manifest-refresh.yml'],
            ['candidate/mycorrhizal-1bna-sync.yml', '.github/workflows/mycorrhizal-1bna-sync.yml'],
            ['candidate/package.json', 'sovereign-omega-v2/package.json'],
            ['candidate/package-lock.json', 'sovereign-omega-v2/package-lock.json'],
          ];
          const additions = sources.map(([source, path]) => ({
            path,
            contents: fs.readFileSync(source).toString('base64'),
          }));

          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: expectedTargetHead,
              message: { headline: 'fix(security): signed manifest refresh and zero-vulnerability lock' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-security-hardening-promoter-v1',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_HARDENING_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_HARDENING_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
