name: Provenance Census Classification

on:
  pull_request:
    paths:
      - 'scripts/generate_provenance_census.py'
      - 'scripts/generate_provenance_census_with_cleanup_debt.py'
      - 'sovereign-omega-v2/python/tests/test_provenance_post_baseline_pr347.py'
      - '.github/workflows/provenance-census-classification.yml'
  push:
    branches:
      - integration/aegis-universal-intelligence-rh-v1
    paths:
      - 'scripts/generate_provenance_census.py'
      - 'scripts/generate_provenance_census_with_cleanup_debt.py'
      - 'sovereign-omega-v2/python/tests/test_provenance_post_baseline_pr347.py'
      - '.github/workflows/provenance-census-classification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused dependency
        run: python -m pip install 'pytest==8.4.1'

      - name: Run post-baseline classification regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q sovereign-omega-v2/python/tests/test_provenance_post_baseline_pr347.py
