name: Cognitive Manifest Refresh

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-manifest-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: aegis / cognitive-manifest-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve current main parent state
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          parent_hash="$(git show origin/main:.claude.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["state_hash"])' 2>/dev/null || true)"
          if [[ ! "$parent_hash" =~ ^[0-9a-f]{64}$ ]]; then
            parent_hash="$(printf '0%.0s' {1..64})"
          fi
          echo "state_hash=$parent_hash" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic anchors without mutating branch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cognitive-anchors"
          python scripts/build-cognitive-manifest.py \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}" \
            --output-dir "$out"
          python scripts/build-cognitive-manifest.py \
            --check \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}" \
            --output-dir "$out"

      - name: Upload proposed anchors for governed admission
        uses: actions/upload-artifact@v4
        with:
          name: aegis-cognitive-anchor-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-anchors
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
