name: Weil V2.1 Log Coordinate Isometry Replay

on:
  push:
    branches:
      - research/weil-v21-log-isometry-replay-20260915
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilLogCoordinateIsometryV21.lean'
      - '.github/workflows/weil-v21-log-isometry-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-v21-log-isometry-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  SOURCE_SHA256: d18cda6ed69bc3825272544fac63b5001e89ff498287b873bb0dd1319ef67b01

jobs:
  verify:
    name: log-coordinate L2 isometry; no analytic sign promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          persist-credentials: false

      - name: Bind exact source and parent modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"

          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          SRC="$ROOT/WeilLogCoordinateIsometryV21.lean"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$SOURCE_SHA256"

          mkdir -p evidence .lake/build/lib/lean
          for m in WeilCriterionCompactSmoothV1 WeilThreeBlockRationalV1 WeilThreeBlockComplexV2 WeilDisjointEnergyV2 WeilLogCoordinateIsometryV21; do
            cp "$ROOT/$m.lean" "$m.lean"
            cp "$m.lean" evidence/
            sha256sum "$m.lean" >> evidence/exact-source.log
          done
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\nSOURCE_SHA256=%s\n' \
            "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" "$SOURCE_SHA256" \
            >> evidence/exact-source.log
          sha256sum lake-manifest.json .aegis/.github/workflows/weil-v21-log-isometry-replay.yml \
            >> evidence/exact-source.log

      - name: Obtain exact Lean and targeted dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get \
            Mathlib/Analysis/MellinTransform.lean \
            Mathlib/NumberTheory/ArithmeticFunction/VonMangoldt.lean \
            Mathlib/NumberTheory/Harmonic/EulerMascheroni.lean \
            Mathlib/NumberTheory/LSeries/RiemannZeta.lean \
            Mathlib/Data/Real/Basic.lean \
            Mathlib/Tactic/NormNum.lean \
            Mathlib/Tactic/Ring.lean \
            Mathlib/Tactic/Positivity.lean \
            Mathlib/Tactic/Linarith.lean \
            Mathlib/Analysis/Complex/Basic.lean \
            Mathlib/Tactic.lean \
            Mathlib/MeasureTheory/Integral/Bochner/Basic.lean \
            Mathlib/MeasureTheory/Measure/Lebesgue/Basic.lean \
            Mathlib/MeasureTheory/Function/JacobianOneDim.lean \
            Mathlib/MeasureTheory/Integral/Bochner/Set.lean \
            Mathlib/Analysis/SpecialFunctions/Exp.lean
          lean --version | tee evidence/lean-version.log

      - name: Compile parent chain and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for m in WeilCriterionCompactSmoothV1 WeilThreeBlockRationalV1 WeilThreeBlockComplexV2 WeilDisjointEnergyV2; do
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" > "evidence/$m.log" 2>&1
          done
          /usr/bin/time -v lake env lean \
            -o .lake/build/lib/lean/WeilLogCoordinateIsometryV21.olean \
            WeilLogCoordinateIsometryV21.lean \
            > evidence/compile.log 2> evidence/compile-resource.log
          cat evidence/compile.log
          cat evidence/compile-resource.log
          sha256sum .lake/build/lib/lean/WeilLogCoordinateIsometryV21.olean > evidence/olean-sha256.txt

      - name: Audit theorem dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          source = Path('WeilLogCoordinateIsometryV21.lean').read_text()
          names = re.findall(r'^theorem ([A-Za-z0-9_]+)', source, re.M)
          if len(names) != 5 or len(set(names)) != 5:
              raise SystemExit(f'FAIL: expected 5 unique theorems, got {names!r}')
          fq = ['AEGIS.WeilLogCoordinateIsometryV21.' + n for n in names]
          Path('evidence/expected-theorems.json').write_text(json.dumps(fq, indent=2) + '\n')
          Path('Audit.lean').write_text(
              'import WeilLogCoordinateIsometryV21\n' +
              ''.join('#print axioms ' + n + '\n' for n in fq)
          )
          PY
          lake env lean Audit.lean 2>&1 | tee evidence/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          names = json.loads(Path('evidence/expected-theorems.json').read_text())
          log = Path('evidence/axioms.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          result = {}
          for name in names:
              none = "'" + name + "' does not depend on any axioms"
              found = re.findall(re.escape("'" + name + "' depends on axioms: ") + r'\[([^\]]*)\]', log, re.S)
              if none in log and not found:
                  axioms = set()
              elif none not in log and len(found) == 1:
                  axioms = {a.strip() for a in found[0].split(',') if a.strip()}
              else:
                  raise SystemExit('FAIL: incomplete axiom output for ' + name)
              if 'sorryAx' in axioms or not axioms <= allowed:
                  raise SystemExit('FAIL: unexpected theorem dependency for ' + name + ': ' + repr(axioms))
              result[name] = sorted(axioms)
          Path('evidence/axiom-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print('PASS: 5 theorem closures audited; DIAGONAL_KERNEL_REDUCTION=OPEN; SIX_ACTUAL_B_BOUNDS=OPEN; RH=NOT_PROVEN')
          PY

      - name: Emit fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          payload = {
              'schema': 'AEGIS_WEIL_V21_LOG_ISOMETRY_KERNEL_RECEIPT_V1',
              'source_commit': os.environ['SOURCE_SHA'],
              'source_sha256': os.environ['SOURCE_SHA256'],
              'mathlib_sha': os.environ['MATHLIB_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'theorem_count': 5,
              'compile_status': 'PASS',
              'axiom_audit_status': 'PASS',
              'olean_sha256': Path('evidence/olean-sha256.txt').read_text().split()[0],
              'axiom_log_sha256': sha('evidence/axioms.log'),
              'log_coordinate_isometry_machine_bound': True,
              'packet_positive_support_energy_restriction_machine_bound': True,
              'diagonal_kernel_reduction_machine_bound': False,
              'six_actual_B_bounds_machine_bound': False,
              'global_weil_sign': 'OPEN',
              'rh': 'NOT_PROVEN',
              'repository_admission': 'NOT_GRANTED',
              'merge': 'NONE',
              'authority_effect': 'NONE',
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('evidence/receipt.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(Path('evidence/receipt.json').read_text())
          PY

      - name: Upload exact-source replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-v21-log-isometry-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
