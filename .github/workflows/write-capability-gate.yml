name: Workflow Write Capability Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/write-capability-allowlist.yml'
      - 'scripts/audit-workflow-write-capabilities.py'
  push:
    branches:
      - feat/sol-cross-platform-control-plane
    paths:
      - '.github/workflows/**'
      - '.github/write-capability-allowlist.yml'
      - 'scripts/audit-workflow-write-capabilities.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-workflow-write-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit privileged workflows and branch writers
        run: python scripts/audit-workflow-write-capabilities.py
