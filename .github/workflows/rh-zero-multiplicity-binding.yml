name: RH Zero Multiplicity Binding

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZetaZeroMultiplicityBindingV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zeta_zero_multiplicity_binding_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zeta_zero_multiplicity_binding_v1.py'
      - '.github/workflows/rh-zero-multiplicity-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: 7f8ce7224615258a5aab52ac73ae18bcdc94bc36
  PARENT_HEIGHT_SHA: cef68b5fd8d98b4ad2144ae32ab1f5bfde742505
  PARENT_HEIGHT_RECEIPT: c742236ca9b5337affb02849489a50e540e2e2d4e3dcf201cc9d4d4f4bd35d36
  PARENT_HEIGHT_ARTIFACT: e59dacc4ba735d6c4b933c2fb8faf9526519379dce8599047a36437f7e4d0171
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  ANALYTIC_ORDER_BLOB_SHA: 43cc6d88cb0ecba9560d4c29a410b271d9432628
  ANALYTIC_UNIQUENESS_BLOB_SHA: 20fe97cfe84c8c26280250418f78ab8f317207e2
  ANALYTIC_CONSTRUCTIONS_BLOB_SHA: a4823d7cdda8e314158bb4b5aff320cf02499038
  RIEMANN_ZETA_BLOB_SHA: 3c92195fce20df7fda41cfd823b3266f83cf3070
  NONVANISHING_BLOB_SHA: 610bd56365d49c5ffa9ebeb29e0a383c768248e2

jobs:
  multiplicity-binding:
    name: pinned analytic zeta-zero multiplicity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZetaZeroMultiplicityBindingV1.lean)" = "$SOURCE_BLOB_SHA"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zeta_zero_multiplicity_binding_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zeta_zero_multiplicity_binding_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZETA_ZERO_MULTIPLICITY_BINDING_V1'
          p = m['verified_parent_evidence']['finite_height_truncation']
          assert (p['aegis_revision'], p['receipt_sha256'], p['artifact_sha256']) == (
              os.environ['PARENT_HEIGHT_SHA'], os.environ['PARENT_HEIGHT_RECEIPT'], os.environ['PARENT_HEIGHT_ARTIFACT'])
          e = m['external_environment']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          blobs = {x['path']: x['git_blob_sha'] for x in m['upstream_mathlib']}
          assert blobs['Mathlib/Analysis/Analytic/Order.lean'] == os.environ['ANALYTIC_ORDER_BLOB_SHA']
          assert blobs['Mathlib/Analysis/Analytic/Uniqueness.lean'] == os.environ['ANALYTIC_UNIQUENESS_BLOB_SHA']
          assert blobs['Mathlib/Analysis/Analytic/Constructions.lean'] == os.environ['ANALYTIC_CONSTRUCTIONS_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/RiemannZeta.lean'] == os.environ['RIEMANN_ZETA_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/Nonvanishing.lean'] == os.environ['NONVANISHING_BLOB_SHA']
          assert m['formal_source']['git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          s = m['scope']
          assert s['positive_finite_zero_multiplicity'] == 'CANDIDATE'
          for key in ('finite_height_multiplicity_sum','height_limit_existence','height_radial_equivalence','zero_sum_convergence','explicit_formula_theorem','critical_line_re_half','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['claim_promotion'] == 'BLOCKED'
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          path: .external/mathlib4
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Mathlib toolchain and source blobs
        working-directory: .external/mathlib4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          test "$(git hash-object Mathlib/Analysis/Analytic/Order.lean)" = "$ANALYTIC_ORDER_BLOB_SHA"
          test "$(git hash-object Mathlib/Analysis/Analytic/Uniqueness.lean)" = "$ANALYTIC_UNIQUENESS_BLOB_SHA"
          test "$(git hash-object Mathlib/Analysis/Analytic/Constructions.lean)" = "$ANALYTIC_CONSTRUCTIONS_BLOB_SHA"
          test "$(git hash-object Mathlib/NumberTheory/LSeries/RiemannZeta.lean)" = "$RIEMANN_ZETA_BLOB_SHA"
          test "$(git hash-object Mathlib/NumberTheory/LSeries/Nonvanishing.lean)" = "$NONVANISHING_BLOB_SHA"
          grep -F 'noncomputable def analyticOrderNatAt' Mathlib/Analysis/Analytic/Order.lean
          grep -F 'lemma analyticOrderAt_eq_top' Mathlib/Analysis/Analytic/Order.lean
          grep -F 'theorem eqOn_of_preconnected_of_eventuallyEq' Mathlib/Analysis/Analytic/Uniqueness.lean
          grep -F 'theorem analyticOnNhd_const' Mathlib/Analysis/Analytic/Constructions.lean
          grep -F 'lemma analyticOn_riemannZeta' Mathlib/NumberTheory/LSeries/RiemannZeta.lean
          grep -F 'riemannZeta_ne_zero_of_one_le_re' Mathlib/NumberTheory/LSeries/Nonvanishing.lean

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/mathlib4
        shell: bash
        run: lake exe cache get

      - name: Compile zeta-zero multiplicity binding
        working-directory: .external/mathlib4
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zeta-zero-multiplicity-lean-version.txt"
          lake env lean "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZetaZeroMultiplicityBindingV1.lean" 2>&1 | tee "$GITHUB_WORKSPACE/zeta-zero-multiplicity-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zeta-zero-multiplicity-lean.log"

      - name: Emit fail-closed multiplicity receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZetaZeroMultiplicityBindingV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zeta_zero_multiplicity_binding_v1.json')
          log = Path('zeta-zero-multiplicity-lean.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZETA_ZERO_MULTIPLICITY_BINDING_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'parent_height_revision':os.environ['PARENT_HEIGHT_SHA'],
            'parent_height_receipt_sha256':os.environ['PARENT_HEIGHT_RECEIPT'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'positive_finite_zero_multiplicity':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'finite_height_multiplicity_sum':'OPEN',
            'height_limit_existence':'OPEN',
            'height_radial_equivalence':'OPEN',
            'zero_sum_convergence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'critical_line_re_half':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zeta-zero-multiplicity-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zeta-zero-multiplicity-receipt.json').read_text())
          PY

      - name: Upload multiplicity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-zero-multiplicity-${{ env.SOURCE_SHA }}
          path: |
            zeta-zero-multiplicity-lean-version.txt
            zeta-zero-multiplicity-lean.log
            zeta-zero-multiplicity-receipt.json
          if-no-files-found: error
          retention-days: 30
