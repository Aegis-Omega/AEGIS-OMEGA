name: AEGIS Gravity Quantum Authority V1

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/python/cross_boundary_authority.py"
      - "sovereign-omega-v2/python/research_invariants.py"
      - "sovereign-omega-v2/python/gravity_quantum_authority.py"
      - "sovereign-omega-v2/python/gravity_quantum_policy.py"
      - "sovereign-omega-v2/python/gravity_quantum_discriminator.py"
      - "sovereign-omega-v2/python/tests/test_gravity_quantum_authority.py"
      - "sovereign-omega-v2/formal/bridges/lean/GravityQuantumPureProductV1.lean"
      - "docs/research/gravity-quantum-authority-v1.md"
      - ".github/workflows/gravity-quantum-authority-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gravity-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind execution to exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile gravity authority sources
        run: |
          python -m py_compile \
            sovereign-omega-v2/python/research_invariants.py \
            sovereign-omega-v2/python/cross_boundary_authority.py \
            sovereign-omega-v2/python/gravity_quantum_authority.py \
            sovereign-omega-v2/python/gravity_quantum_policy.py \
            sovereign-omega-v2/python/gravity_quantum_discriminator.py \
            sovereign-omega-v2/python/tests/test_gravity_quantum_authority.py
      - name: Re-run inherited cross-boundary regressions
        env:
          PYTHONPATH: sovereign-omega-v2/python
        run: python sovereign-omega-v2/python/tests/test_cross_boundary_authority.py -v
      - name: Run gravity fail-closed regressions
        env:
          PYTHONPATH: sovereign-omega-v2/python
        run: python sovereign-omega-v2/python/tests/test_gravity_quantum_authority.py -v

  f2b-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind execution to exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED"
      - name: Install exact Lean 4.33.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst \
            -o /tmp/lean.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  /tmp/lean.tar.zst" | sha256sum -c -
          mkdir -p /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean
          echo "/tmp/lean/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Pin Mathlib
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/leanprover-community/mathlib4.git /tmp/mathlib
          cd /tmp/mathlib
          git fetch --depth 1 origin 0df444a360eaa60ab8c11dca51a86af692955474
          git checkout --detach 0df444a360eaa60ab8c11dca51a86af692955474
          lake exe cache get
      - name: Kernel replay F2b and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean"
          cd /tmp/mathlib
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          mkdir -p /tmp/gq-olean
          export LEAN_PATH="/tmp/gq-olean:$SRC:$BASE_LEAN_PATH"
          lean -o /tmp/gq-olean/GravityQuantumPureProductV1.olean \
            "$SRC/GravityQuantumPureProductV1.lean" 2>&1 | tee /tmp/f2b.log
          ! grep -q "sorryAx" /tmp/f2b.log
          printf 'F2B_KERNEL_REPLAY=PASS\n'
