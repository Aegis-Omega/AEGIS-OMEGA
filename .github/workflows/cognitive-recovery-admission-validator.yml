name: Cognitive Recovery Admission Validator

on:
  push:
    branches:
      - repair/cognitive-recovery-admission-validator-v1
  pull_request:
    branches:
      - repair/cognitive-anchor-recovery-admission-v1
  workflow_dispatch:

# Candidate-controlled verification only. This lane cannot sign, mutate refs,
# deploy, attest, or grant production recovery authority.
# Intentional TDD RED commits must end their commit subject with ` RED`.
# Their expected test failure is recorded as EXPECTED_RED without turning the
# whole workflow red. Any failure on a non-RED commit remains a hard failure.
permissions:
  contents: read

jobs:
  recovery-admission-contract:
    name: aegis / cognitive-recovery-admission-validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact schema dependency
        run: pip install jsonschema==4.23.0

      - name: Run recovery admission contract tests
        id: contract_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_cognitive_recovery_admission.py
          python sovereign-omega-v2/python/tests/test_cognitive_recovery_admission_hardening.py

      - name: Classify contract result
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.contract_tests.outcome }}
        run: |
          set -euo pipefail
          if [[ "$TEST_OUTCOME" == "success" ]]; then
            echo "RECOVERY_ADMISSION_TEST_STATUS=GREEN"
            exit 0
          fi

          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == *" RED" ]]; then
            echo "::notice::EXPECTED_RED: focused recovery-admission tests failed on intentional TDD RED commit"
            echo "RECOVERY_ADMISSION_TEST_STATUS=EXPECTED_RED"
            exit 0
          fi

          echo "::error::Unexpected recovery-admission test failure on non-RED commit"
          exit 1

      - name: Assert authority-neutral workflow contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents:[[:space:]]*write|id-token:[[:space:]]*write|attestations:[[:space:]]*write|deployments:[[:space:]]*write' .github/workflows/cognitive-recovery-admission-validator.yml
