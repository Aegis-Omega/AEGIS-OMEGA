name: Validate PR 517 Signed Head V1

on:
  push:
    branches:
      - control/validate-pr517-signed-head-v1

permissions:
  contents: read
  id-token: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUSTED_MAIN_SHA: 495bfd85d79abcb2b4f6898fe9c156488492426a
      BASE_SHA: 083dceb535226c7dead4e74ce1d7791e076205b3
      CANDIDATE_SHA: fe00d040803feb2741fb989b18d1ac4dc1fa11a3
      CANDIDATE_REF: integration/cognitive-writer-phase2-pr508-v1
      PR_MERGE_SHA: 202269374adf77bdf108ea9a0133447fe350862d
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: 495bfd85d79abcb2b4f6898fe9c156488492426a
          path: trusted-main
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Checkout exact Phase1 base source/data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: 083dceb535226c7dead4e74ce1d7791e076205b3
          path: base
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Checkout exact signed Phase2 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: fe00d040803feb2741fb989b18d1ac4dc1fa11a3
          path: candidate
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Checkout exact PR517 merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: 202269374adf77bdf108ea9a0133447fe350862d
          path: merge-data
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Assert exact immutable identities and trusted evaluator bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted-main rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C merge-data rev-parse HEAD)" = "$PR_MERGE_SHA"
          for path in \
            scripts/validate-automaton2.py \
            scripts/build-cognitive-manifest.py \
            scripts/trusted-cognitive-admission-v2.py \
            schemas/cognitive-state.v1.schema.json; do
            cmp --silent "trusted-main/$path" "base/$path"
            cmp --silent "trusted-main/$path" "candidate/$path"
          done
          test "$(git -C candidate rev-parse HEAD^)" = "8edf12f29c36675bf08e50fc7f4bebca4ba6d98e"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact validator dependency
        run: pip install jsonschema==4.23.0

      - name: Require exact writer contract on signed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/scripts/test-cognitive-anchor-writer-boundary.py
          python3 candidate/scripts/test-cognitive-anchor-signed-writer-v1.py

      - name: Replay Automaton-2 against signed Phase2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-main/scripts/validate-automaton2.py \
            --root candidate \
            --schema ../trusted-main/schemas/cognitive-state.v1.schema.json \
            --generator ../trusted-main/scripts/build-cognitive-manifest.py \
            --skill-hashes skill-hashes.sha256 \
            --parent-manifest base/.claude.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --require-oidc \
            --output "$RUNNER_TEMP/AUTOMATON2_PR517_SIGNED.json"

      - name: Replay Trusted Cognitive Admission against signed Phase2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-main/scripts/trusted-cognitive-admission-v2.py \
            --candidate-root candidate \
            --base-root base \
            --source-ref "$CANDIDATE_REF" \
            --candidate-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            --workflow-sha "$TRUSTED_MAIN_SHA" \
            --output "$RUNNER_TEMP/TRUSTED_PR517_SIGNED.json"

      - name: Replay Phase1 base-owned writer merge gate on exact PR517 merge
        shell: bash
        run: |
          set -euo pipefail
          python3 base/scripts/test-cognitive-writer-merge-gate.py
          python3 base/scripts/check-cognitive-writer-merge.py \
            --repo merge-data \
            --base-sha "$BASE_SHA" \
            --head-sha "$CANDIDATE_SHA" \
            --merge-sha "$PR_MERGE_SHA" \
            --output "$RUNNER_TEMP/WRITER_MERGE_PR517_SIGNED.json"

      - name: Show bounded receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            "$RUNNER_TEMP/AUTOMATON2_PR517_SIGNED.json" \
            "$RUNNER_TEMP/TRUSTED_PR517_SIGNED.json" \
            "$RUNNER_TEMP/WRITER_MERGE_PR517_SIGNED.json"; do
            if [[ -f "$f" ]]; then
              echo "===== $f ====="
              cat "$f"
              echo
            fi
          done
