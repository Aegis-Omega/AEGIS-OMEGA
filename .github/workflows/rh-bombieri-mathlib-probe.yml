name: RH Bombieri Mathlib Probe

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/BombieriWeilTargetProbe.lean'
      - 'sovereign-omega-v2/formal/tests/test_bombieri_weil_target_probe_v1.py'
      - '.github/workflows/rh-bombieri-mathlib-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-bombieri-mathlib-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  PROBE_SHA256: 8dd629bf9449b1ea38b8e850650ec38255af55873570f0c6cee31dff92d6b252

jobs:
  probe:
    name: pinned Lean + Mathlib Bombieri capability
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact AEGIS candidate and probe digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s  %s\n' \
            "$PROBE_SHA256" \
            'sovereign-omega-v2/formal/bridges/lean/BombieriWeilTargetProbe.lean' \
            | sha256sum -c -
          python3 -m unittest \
            sovereign-omega-v2/formal/tests/test_bombieri_weil_target_probe_v1.py \
            -v

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external project, Mathlib and Lean pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('lake-manifest.json').read_text(encoding='utf-8'))
          packages = manifest.get('packages', [])
          mathlib = next((p for p in packages if p.get('name') == 'mathlib'), None)
          assert mathlib is not None, 'mathlib package missing from lake-manifest.json'
          rev = mathlib.get('rev') or mathlib.get('inputRev')
          assert rev == os.environ['MATHLIB_SHA'], (rev, os.environ['MATHLIB_SHA'])
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Compile concrete Bombieri Mathlib probe
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/bombieri-lean-version.txt"
          lake env lean \
            "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/BombieriWeilTargetProbe.lean" \
            2>&1 | tee "$GITHUB_WORKSPACE/bombieri-lean-probe.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/bombieri-lean-probe.log"

      - name: Emit bounded capability receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path('sovereign-omega-v2/formal/bridges/lean/BombieriWeilTargetProbe.lean')
          log = Path('bombieri-lean-probe.log').read_text(encoding='utf-8')
          version = Path('bombieri-lean-version.txt').read_text(encoding='utf-8').strip()
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == os.environ['PROBE_SHA256']
          assert os.environ['LEAN_TOOLCHAIN'].split(':v')[-1] in version, version
          assert 'sorryAx' not in log

          receipt = {
              'schema_version': 'AEGIS_BOMBIERI_MATHLIB_CAPABILITY_RECEIPT_V1',
              'source_commit': os.environ['SOURCE_SHA'],
              'probe_source_sha256': digest,
              'formal_conjectures_revision': os.environ['FORMAL_CONJECTURES_SHA'],
              'mathlib_revision': os.environ['MATHLIB_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'lean_version_output': version,
              'verified_capabilities': [
                  'COMPLEX_SMOOTH_COMPACT_SUPPORT_POSITIVE_REAL_TEST_FUNCTION_TYPE',
                  'MATHLIB_MELLIN_TRANSFORM_BOUND',
                  'GLOBAL_MELLIN_CONVERGENCE_FOR_COMPACT_POSITIVE_SUPPORT',
                  'MATHLIB_RIEMANN_ZETA_TARGET_BOUND',
                  'COMPLETED_ZETA_FUNCTIONAL_SYMMETRY_BOUND',
                  'NO_SORRYAX_IN_PROBE_AXIOM_OUTPUT',
              ],
              'bombieri_weil_criterion_proved': False,
              'rh_proved': False,
              'rh_disproved': False,
              'claim_promotion': 'BLOCKED',
              'authority_effect': 'NONE',
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          path = Path('bombieri-mathlib-capability-receipt.json')
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload Lean capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-bombieri-mathlib-probe-${{ env.SOURCE_SHA }}
          path: |
            bombieri-lean-version.txt
            bombieri-lean-probe.log
            bombieri-mathlib-capability-receipt.json
          if-no-files-found: error
          retention-days: 30
