name: AEGIS Bounded Dependency Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-repair.yml'

permissions:
  contents: write

concurrency:
  group: dependency-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Patch four authorized dependency files
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Assert branch identity and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate patched locked dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          (
            cd studio
            npm install --save-exact --package-lock-only postcss@8.5.18
            npm ci
            npm run build
            npm audit --omit=dev --audit-level=high
          )
          (
            cd sovereign-omega-v2/mcp-server
            npm install --save-exact --package-lock-only @modelcontextprotocol/sdk@1.30.0
            npm ci
            npm run test:resources
            npm run test:automaton3
            npm audit --omit=dev --audit-level=high
          )

      - name: Enforce exact four-file mutation set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            'sovereign-omega-v2/mcp-server/package-lock.json'
            'sovereign-omega-v2/mcp-server/package.json'
            'studio/package-lock.json'
            'studio/package.json'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Commit verified dependency repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aegis-verification[bot]'
          git config user.email 'aegis-verification[bot]@users.noreply.github.com'
          git add \
            studio/package.json \
            studio/package-lock.json \
            sovereign-omega-v2/mcp-server/package.json \
            sovereign-omega-v2/mcp-server/package-lock.json
          git commit -m 'fix(deps): patch production PostCSS and MCP graph'
          git push origin "HEAD:${HEAD_BRANCH}"
