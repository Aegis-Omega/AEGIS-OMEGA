name: RH Observable Contraction Exact

on:
  pull_request:
    paths:
      - "research/rh/observable_contraction_exact.py"
      - "research/rh/test_observable_contraction_exact.py"
      - "research/rh/CONDITIONING.md"
      - ".github/workflows/rh-observable-contraction-exact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-falsification-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact kernel and regressions
        working-directory: research/rh
        run: python -m py_compile observable_contraction_exact.py test_observable_contraction_exact.py
      - name: Run four exact falsifiers
        working-directory: research/rh
        run: python -m unittest -v test_observable_contraction_exact.py
