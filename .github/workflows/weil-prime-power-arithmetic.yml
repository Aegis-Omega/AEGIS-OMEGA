name: Weil Prime Power Arithmetic Bridge

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/tests/Weil/PrimePowerArithmeticBridgeSpec.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerArithmeticBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/FinitePrimeSourceSum.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerWeightBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimeSourceDerivativeConstructive.v"
      - ".github/workflows/weil-prime-power-arithmetic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-prime-power-arithmetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ADMISSION_PARENT_SHA: 4c734a45c98a0844776e6cf96b1129b553f3b8e6
  A2A_GREEN_RECEIPT_SHA256: c628ba9e17901fbdc283469d4458a87441a5ffed18846621d3fc8b08b5db81d5
  RED_CHECKPOINT_SOURCE_SHA: 877bc79e8cb9a6949ea327417abb49a4266497d4
  RED_WORKFLOW_RUN_ID: '33443462529'
  RED_RECEIPT_SHA256: 69e0395802206b7a4992ad342c96a84c79e1aee3fdcfcef97ecee8a3dad3705b
  RED_ARTIFACT_DIGEST: sha256:20dfb38a46c2e07dbd49fd4883df38e1ce37e8f8d0d6353bab78b540edf9b3d2

jobs:
  attest-green:
    name: coqc / proof-carrying prime-power arithmetic GREEN
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Reject declared assumptions in arithmetic source
        shell: bash
        run: |
          set -euo pipefail
          source=sovereign-omega-v2/formal/theories/Weil/PrimePowerArithmeticBridge.v
          test -f "$source"
          if grep -En '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted)[[:space:].]' "$source"; then
            echo "Declared assumption/admission forbidden: $source" >&2
            exit 1
          fi

      - name: Prepare writable evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-prime-power-arithmetic-attestation
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-prime-power-arithmetic-attestation

      - name: Compile GREEN arithmetic contract and assumptions
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTDIR="$ROOT/formal/tests/Weil"
            DERIV="$THEORY/PrimeSourceDerivativeConstructive.v"
            WEIGHT="$THEORY/PrimePowerWeightBridge.v"
            FINITE="$THEORY/FinitePrimeSourceSum.v"
            FINITE_TEST="$TESTDIR/FinitePrimeSourceSumSpec.v"
            SOURCE="$THEORY/PrimePowerArithmeticBridge.v"
            TEST="$TESTDIR/PrimePowerArithmeticBridgeSpec.v"
            OUT="$ROOT/weil-prime-power-arithmetic-attestation"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"
            opam show coq-corn.9.0.0 --field=version,license,depends \
              | tee "$OUT/corn-package-metadata.txt"

            test -f "$DERIV"
            test -f "$WEIGHT"
            test -f "$FINITE"
            test -f "$FINITE_TEST"
            test -f "$SOURCE"
            test -f "$TEST"

            coqc -Q "$THEORY" "" "$DERIV" 2>&1 \
              | tee "$OUT/prime-source-derivative.log"
            coqc -Q "$THEORY" "" "$WEIGHT" 2>&1 \
              | tee "$OUT/prime-power-weight-bridge.log"
            coqc -Q "$THEORY" "" "$FINITE" 2>&1 \
              | tee "$OUT/finite-prime-source-sum.log"
            coqc -Q "$THEORY" "" -Q "$TESTDIR" "" "$FINITE_TEST" 2>&1 \
              | tee "$OUT/finite-prime-source-sum-spec.log"
            coqc -Q "$THEORY" "" "$SOURCE" 2>&1 \
              | tee "$OUT/prime-power-arithmetic.log"
            coqc -Q "$THEORY" "" -Q "$TESTDIR" "" "$TEST" 2>&1 \
              | tee "$OUT/prime-power-arithmetic-spec.log"

            for theorem in \
              certified_prime_base_divisor_classification_v1 \
              certified_prime_power_ir_power_identity_v1 \
              certified_prime_power_log_identity_v1 \
              certified_prime_power_sqrt_square_identity_v1 \
              certified_prime_power_finite_sum_derivative_constructive_v1
            do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              cat > "$query" <<EOF
            Set Coqtop Exit On Error.
            Require Import PrimePowerArithmeticBridge.
            Print Assumptions ${theorem}.
            EOF
              coqtop -quiet -batch -Q "$THEORY" "" -l "$query" > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for ${theorem}" >&2
                exit 1
              fi
            done

            cat > "$OUT/green-checkpoint.txt" <<'EOF'
            GREEN_CHECKPOINT_VERIFIED=true
            PRODUCTION_SOURCE_PRESENT=true
            THEOREM_COUNT=5
            DECLARED_ASSUMPTIONS=0
            CERTIFIED_PRIME_BASE_PRIMALITY_MACHINE_BOUND=true
            PRIME_PREDICATE_SCOPE=BESPOKE_DIVISOR_CLASSIFICATION_V1
            STDLIB_PRIME_PREDICATE_BRIDGE_MACHINE_BOUND=false
            PRIME_POWER_ARITHMETIC_SEMANTICS_MACHINE_BOUND=true
            PRIME_POWER_ARITHMETIC_SEMANTICS_SCOPE=SUPPLIED_CERTIFICATES_UNDER_BESPOKE_DIVISOR_PRIMALITY_V1_ONLY
            SHARED_SCALE_L_MACHINE_BOUND=true
            DESCRIPTOR_LOG_BASE_POWER_BINDING_MACHINE_BOUND=true
            DESCRIPTOR_PRIME_WEIGHT_LOG_P_MACHINE_BOUND=false
            DESCRIPTOR_VON_MANGOLDT_BINDING_MACHINE_BOUND=false
            TOTAL_PRIME_FACTORIZATION_MACHINE_BOUND=false
            TOTAL_VON_MANGOLDT_FUNCTION_MACHINE_BOUND=false
            CORN_O0_TRIG_TRANSPORT_MACHINE_BOUND=false
            GLOBAL_WEIL_POSITIVITY_PROVEN=false
            RH_PROVEN=false
            EOF

      - name: Emit content-addressed A2b GREEN receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path('weil-prime-power-arithmetic-attestation')
          theory = Path('formal/theories/Weil')
          tests = Path('formal/tests/Weil')
          derivative = theory / 'PrimeSourceDerivativeConstructive.v'
          weight = theory / 'PrimePowerWeightBridge.v'
          finite = theory / 'FinitePrimeSourceSum.v'
          finite_test = tests / 'FinitePrimeSourceSumSpec.v'
          source = theory / 'PrimePowerArithmeticBridge.v'
          spec = tests / 'PrimePowerArithmeticBridgeSpec.v'
          theorem_names = [
              'certified_prime_base_divisor_classification_v1',
              'certified_prime_power_ir_power_identity_v1',
              'certified_prime_power_log_identity_v1',
              'certified_prime_power_sqrt_square_identity_v1',
              'certified_prime_power_finite_sum_derivative_constructive_v1',
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          version = (out / 'corn-version.txt').read_text(encoding='utf-8').strip()
          checkpoint = (out / 'green-checkpoint.txt').read_text(encoding='utf-8')
          payload = {
              'receipt_kind': 'AEGIS_A2B_PROOF_CARRYING_PRIME_POWER_GREEN_RECEIPT_V2',
              'authority': 'FORMAL_MATH_EVIDENCE_ONLY',
              'source_commit': os.environ['SOURCE_SHA'],
              'admission_parent_commit': os.environ['ADMISSION_PARENT_SHA'],
              'parent_a2a_green_receipt_sha256': os.environ['A2A_GREEN_RECEIPT_SHA256'],
              'red_checkpoint_source_commit': os.environ['RED_CHECKPOINT_SOURCE_SHA'],
              'red_workflow_run_id': int(os.environ['RED_WORKFLOW_RUN_ID']),
              'red_receipt_sha256': os.environ['RED_RECEIPT_SHA256'],
              'red_artifact_digest': os.environ['RED_ARTIFACT_DIGEST'],
              'red_checkpoint_verified': True,
              'coq_version_sha256': sha(out / 'coq-version.txt'),
              'corn_requested_version': '9.0.0',
              'corn_installed_version': version,
              'corn_package_metadata_sha256': sha(out / 'corn-package-metadata.txt'),
              'derivative_source_sha256': sha(derivative),
              'weight_bridge_source_sha256': sha(weight),
              'finite_sum_source_sha256': sha(finite),
              'finite_sum_spec_sha256': sha(finite_test),
              'prime_power_arithmetic_source_sha256': sha(source),
              'green_spec_sha256': sha(spec),
              'prime_power_arithmetic_compile_log_sha256': sha(
                  out / 'prime-power-arithmetic.log'
              ),
              'green_spec_compile_log_sha256': sha(
                  out / 'prime-power-arithmetic-spec.log'
              ),
              'theorem_assumption_log_sha256': {
                  name: sha(out / f'{name}.assumptions.txt')
                  for name in theorem_names
              },
              'green_checkpoint_sha256': sha(out / 'green-checkpoint.txt'),
              'theorem_names': theorem_names,
              'theorem_count': len(theorem_names),
              'declared_assumptions': 0,
              'production_source_present': source.exists(),
              'prime_power_certificate_machine_bound': True,
              'certified_prime_base_primality_machine_bound': True,
              'prime_predicate_scope': 'BESPOKE_DIVISOR_CLASSIFICATION_V1',
              'stdlib_prime_predicate_bridge_machine_bound': False,
              'prime_power_ir_power_identity_machine_bound': True,
              'constructive_log_base_power_identity_machine_bound': True,
              'constructive_sqrt_prime_power_square_identity_machine_bound': True,
              'certified_prime_power_finite_sum_machine_bound': True,
              'shared_scale_L_machine_bound': True,
              'prime_power_arithmetic_semantics_machine_bound': True,
              'prime_power_arithmetic_semantics_scope':
                  'SUPPLIED_CERTIFICATES_UNDER_BESPOKE_DIVISOR_PRIMALITY_V1_ONLY',
              'descriptor_log_base_power_binding_machine_bound': True,
              'descriptor_prime_weight_log_p_machine_bound': False,
              'descriptor_von_mangoldt_binding_machine_bound': False,
              'prime_power_base_uniqueness_machine_bound': False,
              'total_prime_factorization_machine_bound': False,
              'total_von_mangoldt_function_machine_bound': False,
              'canonical_prime_power_enumeration_machine_bound': False,
              'finite_prime_source_sum_machine_bound': True,
              'corn_o0_trig_transport_machine_bound': False,
              'guinand_weil_explicit_formula_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
              'open_obligations': [
                  'STDLIB_PRIME_PREDICATE_BRIDGE_NOT_MACHINE_BOUND',
                  'PRIME_POWER_BASE_UNIQUENESS_NOT_MACHINE_BOUND',
                  'DESCRIPTOR_PRIME_WEIGHT_LOG_P_NOT_MACHINE_BOUND',
                  'DESCRIPTOR_VON_MANGOLDT_BINDING_NOT_MACHINE_BOUND',
                  'TOTAL_PRIME_FACTORIZATION_NOT_MACHINE_BOUND',
                  'TOTAL_VON_MANGOLDT_FUNCTION_NOT_MACHINE_BOUND',
                  'CANONICAL_PRIME_POWER_ENUMERATION_NOT_MACHINE_BOUND',
                  'CORN_IR_TO_O0_TRIG_TRANSPORT_NOT_MACHINE_BOUND',
                  'GUINAND_WEIL_EXPLICIT_FORMULA_NOT_MACHINE_BOUND',
                  'FORMULA_TO_WEIL_OPERATOR_IDENTITY_NOT_MACHINE_BOUND',
                  'GLOBAL_WEIL_POSITIVITY_NOT_PROVEN',
              ],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = out / 'weil-prime-power-arithmetic-green-receipt.json'
          target.write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(target.read_text(encoding='utf-8'))

          assert version == '9.0.0'
          assert payload['admission_parent_commit'] == (
              '4c734a45c98a0844776e6cf96b1129b553f3b8e6'
          )
          assert payload['parent_a2a_green_receipt_sha256'] == (
              'c628ba9e17901fbdc283469d4458a87441a5ffed18846621d3fc8b08b5db81d5'
          )
          assert payload['red_checkpoint_verified'] is True
          assert payload['production_source_present'] is True
          assert payload['theorem_count'] == 5
          assert payload['declared_assumptions'] == 0
          assert payload['certified_prime_base_primality_machine_bound'] is True
          assert payload['stdlib_prime_predicate_bridge_machine_bound'] is False
          assert payload['prime_power_arithmetic_semantics_machine_bound'] is True
          assert payload['prime_power_arithmetic_semantics_scope'] == (
              'SUPPLIED_CERTIFICATES_UNDER_BESPOKE_DIVISOR_PRIMALITY_V1_ONLY'
          )
          assert payload['shared_scale_L_machine_bound'] is True
          assert payload['descriptor_log_base_power_binding_machine_bound'] is True
          assert payload['descriptor_prime_weight_log_p_machine_bound'] is False
          assert payload['descriptor_von_mangoldt_binding_machine_bound'] is False
          assert payload['total_prime_factorization_machine_bound'] is False
          assert payload['total_von_mangoldt_function_machine_bound'] is False
          assert payload['corn_o0_trig_transport_machine_bound'] is False
          assert payload['global_weil_positivity_proven'] is False
          assert payload['rh_proven'] is False
          assert 'GREEN_CHECKPOINT_VERIFIED=true' in checkpoint
          assert len(payload['receipt_sha256']) == 64
          PY

      - name: Upload A2b GREEN evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-prime-power-arithmetic-green-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-prime-power-arithmetic-attestation/
          if-no-files-found: error
          retention-days: 30
