name: Repository Enforcement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-enforcement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforcement:
    name: Main branch enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected base as trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Checkout PR head as untrusted data
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-data
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Run enforcement and independent review regressions
        working-directory: scripts
        run: python3 -m unittest test_check_repository_enforcement test_independent_review -v

      - name: Verify GitHub enforcement boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-enforcement"
          python3 scripts/check_repository_enforcement.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --json-output "$RUNNER_TEMP/repository-enforcement/result.json"

      - name: Reject unresolved overlapping pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/pr_overlap_guard.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --root candidate-data \
            | tee "$RUNNER_TEMP/repository-enforcement/overlap.txt"

      - name: Upload enforcement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-enforcement-${{ github.sha }}
          path: ${{ runner.temp }}/repository-enforcement
          if-no-files-found: error
          retention-days: 30
