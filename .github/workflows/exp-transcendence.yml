name: Exp Transcendence Proof
on:
  push:
    branches: ['codex/exp-transcendence-20260913']
    paths:
      - 'research/formal-conjectures-pilot/ExpTranscendence.lean'
      - '.github/workflows/exp-transcendence.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FORMAL_CONJECTURES_SHA: 02da1ad1288b4881ea1f8e575fbe84af7db04364
      MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
      LEAN_VERSION: 4.33.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact current Formal Conjectures sources and Lean
        run: |
          set -euo pipefail
          git init /tmp/benchmark
          git -C /tmp/benchmark remote add origin https://github.com/google-deepmind/formal-conjectures.git
          git -C /tmp/benchmark fetch --depth 1 origin "$FORMAL_CONJECTURES_SHA"
          git -C /tmp/benchmark checkout --detach FETCH_HEAD
          test "$(git -C /tmp/benchmark rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(cat /tmp/benchmark/lean-toolchain)" = "leanprover/lean4:v${LEAN_VERSION}"
          curl -fLsS "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst" -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo "/tmp/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/benchmark/.lake
            ~/.cache/mathlib
          key: aegis-exp-${{ env.FORMAL_CONJECTURES_SHA }}-lean4331-v1
      - name: Compile proof and bind exact current upstream theorem type
        run: |
          set -euo pipefail
          cd /tmp/benchmark
          lean --version | tee "$GITHUB_WORKSPACE/lean-version.log"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          cp "$GITHUB_WORKSPACE/research/formal-conjectures-pilot/ExpTranscendence.lean" ExpTranscendence.lean
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ExpTranscendence.olean ExpTranscendence.lean 2>&1 | tee "$GITHUB_WORKSPACE/exp-axioms.log"
          lake build FormalConjectures/Wikipedia/Transcendental.lean
          cat > ExpBenchmark.lean <<'LEAN'
          import ExpTranscendence
          import FormalConjectures.Wikipedia.Transcendental
          theorem AegisExp.exact_current_upstream_benchmark :
              type_of% Transcendental.exp_add_pi_or_exp_add_mul_transcendental :=
            AegisExp.pi_exp_sum_or_product
          #print axioms AegisExp.exact_current_upstream_benchmark
          LEAN
          cp ExpBenchmark.lean "$GITHUB_WORKSPACE/ExpBenchmark.lean"
          lake env lean ExpBenchmark.lean 2>&1 | tee "$GITHUB_WORKSPACE/benchmark-axioms.log"
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          w=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          targets={
            'exp-axioms.log':['AegisExp.transcendental_exp_one_complex','AegisExp.transcendental_exp_one_real','AegisExp.pi_exp_sum_or_product'],
            'benchmark-axioms.log':['AegisExp.exact_current_upstream_benchmark']}
          results={}
          for log,names in targets.items():
            text=(w/log).read_text()
            for name in names:
              matches=re.findall(re.escape("'"+name+"' depends on axioms:")+r'\s*\[([^\]]*)\]',text)
              if len(matches)!=1:
                raise SystemExit('Missing or duplicate axiom report: '+name)
              axioms=sorted(a.strip() for a in matches[0].split(',') if a.strip())
              if not set(axioms)<={'propext','Classical.choice','Quot.sound'}:
                raise SystemExit('Unexpected axioms: '+name+' '+repr(axioms))
              results[name]={'status':'KERNEL_CHECKED','axioms':axioms}
          paths=['ExpTranscendence.lean','ExpBenchmark.lean','lean-toolchain','lake-manifest.json']
          receipt={
            'schema':'AEGIS_EXP_TRANSCENDENCE_CURRENT_UPSTREAM_V2',
            'candidate_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'formal_conjectures_sha':os.environ['FORMAL_CONJECTURES_SHA'],
            'mathlib_sha':os.environ['MATHLIB_SHA'],
            'lean_version':os.environ['LEAN_VERSION'],
            'upstream_target':'Transcendental.exp_add_pi_or_exp_add_mul_transcendental',
            'statement_binding':'type_of% EXACT',
            'results':results,
            'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
            'log_sha256':{p:hashlib.sha256((w/p).read_bytes()).hexdigest() for p in [*targets,'lean-version.log']},
            'upstream_write':'NOT_PERFORMED_BY_THIS_WORKFLOW',
            'authority_effect':'NONE'
          }
          (w/'exp-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exp-transcendence-current-upstream-${{ github.sha }}
          path: |
            lean-version.log
            exp-axioms.log
            benchmark-axioms.log
            exp-receipt.json
            ExpBenchmark.lean
            research/formal-conjectures-pilot/ExpTranscendence.lean
          if-no-files-found: error
