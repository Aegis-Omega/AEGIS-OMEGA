name: Promote Main-Governed Manifest Signer V1

on:
  push:
    branches:
      - control/fix-main-governed-manifest-signer-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rewrite only manifest mutation step
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cognitive-manifest-refresh.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Commit refreshed anchors
        if: steps.admission.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude.json skill-hashes.sha256; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude.json skill-hashes.sha256
          git commit -m "chore(manifest): refresh cognitive-state anchors"
          git push origin "HEAD:refs/heads/$TARGET_REF"
'''
          new = '''      - name: Commit refreshed anchors through GitHub-signed API
        if: steps.admission.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude.json skill-hashes.sha256; then
            echo "Manifest already current."
            exit 0
          fi

          SOURCE_SHA="$(git rev-parse HEAD)" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const branch = process.env.TARGET_REF;
          const sourceSha = process.env.SOURCE_SHA;

          const refResponse = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${branch}`,
            {
              headers: {
                authorization: `bearer ${token}`,
                accept: 'application/vnd.github+json',
                'user-agent': 'aegis-main-governed-cognitive-manifest-refresh-v1',
              },
            }
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== sourceSha) {
            console.error(`STALE_HEAD expected=${sourceSha} live=${refBody.commit.sha}`);
            process.exit(1);
          }

          const additions = ['.claude.json', 'skill-hashes.sha256'].map(path => ({
            path,
            contents: fs.readFileSync(path).toString('base64'),
          }));
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: sourceSha,
              message: { headline: 'chore(manifest): refresh cognitive-state anchors' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-main-governed-cognitive-manifest-refresh-v1',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_MANIFEST_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_MANIFEST_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy mutation block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -q 'createCommitOnBranch' .github/workflows/cognitive-manifest-refresh.yml
          ! grep -q 'git commit -m "chore(manifest): refresh cognitive-state anchors"' .github/workflows/cognitive-manifest-refresh.yml

      - name: Create GitHub-signed workflow-fix commit on clean rebind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: rebind/mycorrhizal-1bna-registry-secure-main-signed-v1
          EXPECTED_PARENT: 6857aecf1af14e0315c10f2268fd233ed0a1ad7c
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const branch = process.env.TARGET_BRANCH;
          const expectedParent = process.env.EXPECTED_PARENT;

          const refResponse = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${branch}`,
            {
              headers: {
                authorization: `bearer ${token}`,
                accept: 'application/vnd.github+json',
                'user-agent': 'aegis-manifest-signer-promoter-v1',
              },
            }
          );
          const refBody = await refResponse.json();
          if (!refResponse.ok || !refBody?.commit?.sha) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.commit.sha !== expectedParent) {
            console.error(`STALE_TARGET expected=${expectedParent} live=${refBody.commit.sha}`);
            process.exit(1);
          }

          const filePath = '.github/workflows/cognitive-manifest-refresh.yml';
          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: expectedParent,
              message: { headline: 'fix(ci): preserve main gates with GitHub-signed manifest commits' },
              fileChanges: {
                additions: [{
                  path: filePath,
                  contents: fs.readFileSync(filePath).toString('base64'),
                }],
              },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `bearer ${token}`,
              'content-type': 'application/json',
              'user-agent': 'aegis-manifest-signer-promoter-v1',
            },
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          console.log(`SIGNED_WORKFLOW_FIX_COMMIT=${body.data.createCommitOnBranch.commit.oid}`);
          console.log(`SIGNED_WORKFLOW_FIX_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE
