name: AEGIS RH Restricted Weil Final Bridge V13

on:
  push:
    branches:
      - 'proof/rh-restricted-weil-final-bridge-v13'
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean'
      - '.github/workflows/rh-restricted-weil-final-bridge-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json

      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get

      - name: Compile exact producer and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean:$(lake env printenv LEAN_PATH)"
          lake env lean sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean 2>&1 | tee /tmp/final-v13.log
          ! grep -F 'sorryAx' /tmp/final-v13.log
