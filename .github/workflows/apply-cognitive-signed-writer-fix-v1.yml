name: Apply Cognitive Signed Writer Fix V1

on:
  push:
    branches:
      - fix/cognitive-manifest-github-signed-writer-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Transform writer and legacy boundary test
        run: python3 .github/scripts/apply-cognitive-signed-writer-fix-v1.py

      - name: Verify transformed source before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/test-cognitive-anchor-writer-boundary.py
          python3 scripts/test-cognitive-anchor-signed-writer-v1.py

      - name: Commit transformed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cognitive-manifest-refresh.yml \
                  scripts/test-cognitive-anchor-writer-boundary.py \
                  scripts/test-cognitive-anchor-signed-writer-v1.py \
                  .github/workflows/cognitive-anchor-signed-writer-v1.yml
          git rm --ignore-unmatch .github/workflows/apply-cognitive-signed-writer-fix-v1.yml \
                                 .github/scripts/apply-cognitive-signed-writer-fix-v1.py
          git commit -m "fix(cognitive): use GitHub-signed manifest writer"
          git push origin HEAD:refs/heads/fix/cognitive-manifest-github-signed-writer-v1
