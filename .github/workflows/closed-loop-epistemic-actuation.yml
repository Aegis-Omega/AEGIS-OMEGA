name: Closed Loop Epistemic Actuation

on:
  pull_request:
    paths:
      - 'harness/sdk/closed_loop_epistemic_actuation.py'
      - 'harness/sdk/evidence_replay_binding.py'
      - 'harness/sdk/fiber_refinement_authority.py'
      - 'harness/sdk/resident_runtime.py'
      - 'harness/sdk/resident_runtime_impl.py'
      - 'sovereign-omega-v2/python/tests/test_closed_loop_epistemic_actuation.py'
      - 'sovereign-omega-v2/python/tests/test_epistemic_receipt_separation.py'
      - 'sovereign-omega-v2/python/tests/test_evidence_replay_binding.py'
      - 'sovereign-omega-v2/python/tests/test_fiber_refinement_authority.py'
      - 'sovereign-omega-v2/python/tests/test_resident_learning_effect.py'
      - '.github/workflows/closed-loop-epistemic-actuation.yml'
  push:
    branches:
      - integration/aegis-universal-intelligence-rh-v1
    paths:
      - 'harness/sdk/closed_loop_epistemic_actuation.py'
      - 'harness/sdk/evidence_replay_binding.py'
      - 'harness/sdk/fiber_refinement_authority.py'
      - 'harness/sdk/resident_runtime.py'
      - 'harness/sdk/resident_runtime_impl.py'
      - 'sovereign-omega-v2/python/tests/test_closed_loop_epistemic_actuation.py'
      - 'sovereign-omega-v2/python/tests/test_epistemic_receipt_separation.py'
      - 'sovereign-omega-v2/python/tests/test_evidence_replay_binding.py'
      - 'sovereign-omega-v2/python/tests/test_fiber_refinement_authority.py'
      - 'sovereign-omega-v2/python/tests/test_resident_learning_effect.py'
      - '.github/workflows/closed-loop-epistemic-actuation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==8.4.1'

      - name: Run closed-loop epistemic falsifiers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            sovereign-omega-v2/python/tests/test_closed_loop_epistemic_actuation.py \
            sovereign-omega-v2/python/tests/test_epistemic_receipt_separation.py \
            sovereign-omega-v2/python/tests/test_evidence_replay_binding.py \
            sovereign-omega-v2/python/tests/test_resident_learning_effect.py \
            sovereign-omega-v2/python/tests/test_fiber_refinement_authority.py
