name: Frontier Dual Report Contract

on:
  push:
    branches:
      - feat/frontier-dual-report-contract-v1
    paths:
      - 'harness/sdk/dual_report.py'
      - 'harness/schemas/dual-report.v1.schema.json'
      - 'scripts/automaton3-authority.py'
      - 'sovereign-omega-v2/python/tests/test_dual_report.py'
      - 'docs/contracts/AEGIS_DUAL_REPORT_V1.md'
      - '.github/workflows/frontier-dual-report-contract.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'harness/sdk/dual_report.py'
      - 'harness/schemas/dual-report.v1.schema.json'
      - 'scripts/automaton3-authority.py'
      - 'sovereign-omega-v2/python/tests/test_dual_report.py'
      - 'docs/contracts/AEGIS_DUAL_REPORT_V1.md'
      - '.github/workflows/frontier-dual-report-contract.yml'

permissions:
  contents: read

concurrency:
  group: frontier-dual-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: aegis / frontier-dual-report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile reporting boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile harness/sdk/dual_report.py scripts/automaton3-authority.py

      - name: Run dual-report falsifiers
        shell: bash
        run: python sovereign-omega-v2/python/tests/test_dual_report.py

      - name: Replay parent Automaton-3 contract
        shell: bash
        run: python sovereign-omega-v2/python/tests/test_automaton3.py

      - name: Assert read-only workflow authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents:[[:space:]]*write|id-token:[[:space:]]*write|attestations:[[:space:]]*write|deployments:[[:space:]]*write' .github/workflows/frontier-dual-report-contract.yml
