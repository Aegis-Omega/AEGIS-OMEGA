name: Weil Width Prime Vanishing V2.3
on:
  push:
    branches: ['proof/weil-three-block-prime-windows-v23']
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilWidthPrimeVanishingV23.lean'
      - '.github/workflows/weil-width-prime-vanishing-v23.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weil-width-prime-vanishing-v23-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.sha }}
  PARENT_V22_SHA: 7e3c85664c65faf1e02f6887c22b4350386a1af8
  SOURCE_SHA256: 64572986800a9f6476a9e98b3e94e4dbb2df73e7dbb9d11e402690b5f2bfaedd
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
jobs:
  verify:
    name: width-1/32 diagonal prime vanishing exact-head replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis merge-base --is-ancestor "$PARENT_V22_SHA" "$SOURCE_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(WeilCriterionCompactSmoothV1 WeilPrimeSummabilityV1 WeilArchimedeanConvergenceV1 WeilAutocorrelationRealityV1 WeilAutocorrelationClosureV1 WeilThreeBlockRationalV1 WeilMixedClosureV2 WeilThreeBlockComplexV2 WeilMixedAlgebraV2 WeilDisjointEnergyV2 WeilThreeBlockAnalyticConstantsV21 WeilLogCoordinateIsometryV21 WeilThreeBlockNormBridgeV21 WeilThreeBlockTranslatedPacketsV22 WeilWidthPrimeVanishingV23)
          : > evidence/modules.txt
          : > evidence/exact-source.log
          for m in "${modules[@]}"; do
            cp "$ROOT/$m.lean" "$m.lean"
            cp "$m.lean" evidence/
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          printf '%s  %s\n' "$SOURCE_SHA256" WeilWidthPrimeVanishingV23.lean | sha256sum -c -
          printf 'SOURCE_SHA=%s\nPARENT_V22_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n' "$SOURCE_SHA" "$PARENT_V22_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" >> evidence/exact-source.log
          sha256sum lake-manifest.json .aegis/.github/workflows/weil-width-prime-vanishing-v23.yml >> evidence/exact-source.log
      - name: Obtain exact Lean and dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get \
            Mathlib/Analysis/MellinTransform.lean \
            Mathlib/NumberTheory/ArithmeticFunction/VonMangoldt.lean \
            Mathlib/NumberTheory/Harmonic/EulerMascheroni.lean \
            Mathlib/NumberTheory/LSeries/RiemannZeta.lean \
            Mathlib/Analysis/Complex/ExponentialBounds.lean \
            Mathlib/Analysis/Real/Pi/Bounds.lean \
            Mathlib/MeasureTheory/Function/JacobianOneDim.lean \
            Mathlib/MeasureTheory/Measure/Haar/Basic.lean \
            Mathlib/Analysis/SpecialFunctions/ExpDeriv.lean \
            Mathlib/Tactic.lean
          lean --version | tee evidence/lean-version.log
      - name: Compile exact module chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            /usr/bin/time -v lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" > "evidence/$m.log" 2> "evidence/$m.resources.log"
            sha256sum ".lake/build/lib/lean/$m.olean" >> evidence/exact-source.log
          done < evidence/modules.txt
      - name: Audit four new theorem closures
        shell: bash
        run: |
          set -euo pipefail
          cat > AuditPrimeV23.lean <<'EOF'
          import WeilWidthPrimeVanishingV23
          #print axioms AEGIS.WeilWidthPrimeVanishingV23.autocorrelation_zero_of_ge_two
          #print axioms AEGIS.WeilWidthPrimeVanishingV23.autocorrelation_inv_zero_of_ge_two
          #print axioms AEGIS.WeilWidthPrimeVanishingV23.diagonal_prime_term_zero
          #print axioms AEGIS.WeilWidthPrimeVanishingV23.diagonal_prime_sum_zero
          EOF
          sed -i 's/^          //' AuditPrimeV23.lean
          lake env lean AuditPrimeV23.lean 2>&1 | tee evidence/axioms-prime-v23.log
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          names=[
            'AEGIS.WeilWidthPrimeVanishingV23.autocorrelation_zero_of_ge_two',
            'AEGIS.WeilWidthPrimeVanishingV23.autocorrelation_inv_zero_of_ge_two',
            'AEGIS.WeilWidthPrimeVanishingV23.diagonal_prime_term_zero',
            'AEGIS.WeilWidthPrimeVanishingV23.diagonal_prime_sum_zero',
          ]
          log=Path('evidence/axioms-prime-v23.log').read_text(); allowed={'propext','Classical.choice','Quot.sound'}; out={}
          for name in names:
            none="'"+name+"' does not depend on any axioms"
            found=re.findall(re.escape("'"+name+"' depends on axioms: ")+r'\[([^\]]*)\]',log,re.S)
            if none in log and not found: axioms=set()
            elif none not in log and len(found)==1: axioms={a.strip() for a in found[0].split(',') if a.strip()}
            else: raise SystemExit('FAIL incomplete axiom output '+name)
            if 'sorryAx' in axioms or not axioms <= allowed: raise SystemExit('FAIL unexpected axioms '+name+' '+repr(axioms))
            out[name]=sorted(axioms)
          Path('evidence/axiom-audit-prime-v23.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('PASS: 4 V2.3 theorem closures audited')
          PY
      - name: Emit fail-closed disposition
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          PARENT_V22_SOURCE=$PARENT_V22_SHA
          V23_CANDIDATE_HEAD=$SOURCE_SHA
          WIDTH_1_32_AUTOCORRELATION_VANISHING=KERNEL_VERIFIED
          DIAGONAL_PRIME_TERM_VANISHING=KERNEL_VERIFIED
          DIAGONAL_PRIME_SUM_ZERO=KERNEL_VERIFIED
          ARCHIMEDEAN_DIAGONAL_KERNEL_BOUND=OPEN
          ANALYTIC_CROSS_TERM_MAJORANT_V1=OPEN
          CONCRETE_THREE_BLOCK_WEIL_COERCIVITY=NOT_YET_ESTABLISHED
          GLOBAL_WEIL_POSITIVITY=OPEN
          RH=NOT_PROVEN
          repository_admission=NOT_GRANTED
          merge=NONE
          authority_effect=NONE
          EOF
          sed -i 's/^          //' evidence/DISPOSITION.txt
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-width-prime-vanishing-v23-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
