name: Weil CoRN to O0 Derivative Image Bridge

on:
  push:
    branches:
      - proof/corn-o0-derivative-image-bridge-v1
    paths:
      - "sovereign-omega-v2/formal/theories/Weil/CornO0DerivativeImageBridge.v"
      - "sovereign-omega-v2/formal/tests/Weil/CornO0DerivativeImageBridgeSpec.v"
      - ".github/workflows/weil-corn-o0-derivative-image-bridge.yml"
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/theories/Weil/CornO0DerivativeImageBridge.v"
      - "sovereign-omega-v2/formal/tests/Weil/CornO0DerivativeImageBridgeSpec.v"
      - ".github/workflows/weil-corn-o0-derivative-image-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-corn-o0-derivative-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  attest:
    name: coqc / CoRN-to-O0 derivative remainder image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Reject declared assumptions
        shell: bash
        run: |
          set -euo pipefail
          src=sovereign-omega-v2/formal/theories/Weil/CornO0DerivativeImageBridge.v
          if grep -En '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Admitted)[[:space:].]' "$src"; then
            echo "Declared assumption/admission forbidden: $src" >&2
            exit 1
          fi

      - name: Prepare evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-corn-o0-derivative-image-attestation
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-corn-o0-derivative-image-attestation

      - name: Compile parent inventory and derivative-image contract
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTDIR="$ROOT/formal/tests/Weil"
            SOURCE="$THEORY/CornO0DerivativeImageBridge.v"
            SPEC="$TESTDIR/CornO0DerivativeImageBridgeSpec.v"
            OUT="$ROOT/weil-corn-o0-derivative-image-attestation"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"

            # Compile the already-registered parent corpus in deterministic
            # order.  The new source is intentionally not required to be in
            # the canonical inventory until theorem-level GREEN exists.
            python3 - <<'PY' > "$OUT/parent-compile-order.txt"
            import json
            from pathlib import Path
            p = Path("sovereign-omega-v2/formal/coq-inventory.json")
            data = json.loads(p.read_text(encoding="utf-8"))
            for rel in data["compile_order"]:
                print(rel)
            PY

            while IFS= read -r rel; do
              dir="$(dirname "$rel")"
              file="$(basename "$rel")"
              (cd "$ROOT/formal/theories/$dir" && coqc "$file")
            done < "$OUT/parent-compile-order.txt"

            if ! test -f "$SOURCE"; then
              echo "Expected RED boundary: production derivative-image source absent." >&2
              exit 1
            fi

            (cd "$THEORY" && coqc CornO0DerivativeImageBridge.v) 2>&1 \
              | tee "$OUT/derivative-image-source.log"
            (cd "$TESTDIR" && coqc -Q "$THEORY" "" CornO0DerivativeImageBridgeSpec.v) 2>&1 \
              | tee "$OUT/derivative-image-spec.log"

            for theorem in \
              corn_o0_derivative_I_remainder_image_v1 \
              corn_o0_derivative_realline_remainder_image_v1 \
              canonical_von_mangoldt_o0_remainder_image_v1
            do
              query="$OUT/${theorem}.v"
              log="$OUT/${theorem}.assumptions.txt"
              cat > "$query" <<EOF
            Set Coqtop Exit On Error.
            Require Import CornO0DerivativeImageBridge.
            Print Assumptions ${theorem}.
            EOF
              (cd "$THEORY" && coqtop -quiet -batch -l "$query") > "$log" 2>&1
              rm -f "$query"
              cat "$log"
              grep -q 'Closed under the global context' "$log"
              if grep -q '^Axioms:' "$log"; then
                echo "Unexpected assumptions for $theorem" >&2
                exit 1
              fi
            done

      - name: Emit fail-closed receipt
        if: success()
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path("weil-corn-o0-derivative-image-attestation")
          source = Path("formal/theories/Weil/CornO0DerivativeImageBridge.v")
          names = [
              "corn_o0_derivative_I_remainder_image_v1",
              "corn_o0_derivative_realline_remainder_image_v1",
              "canonical_von_mangoldt_o0_remainder_image_v1",
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload = {
              "receipt_kind": "AEGIS_CORN_O0_DERIVATIVE_IMAGE_BRIDGE_RECEIPT_V1",
              "authority": "FORMAL_MATH_EVIDENCE_ONLY",
              "source_commit": os.environ["SOURCE_SHA"],
              "source_sha256": sha(source),
              "coq_version_sha256": sha(out / "coq-version.txt"),
              "corn_requested_version": "9.0.0",
              "corn_installed_version": (out / "corn-version.txt").read_text(
                  encoding="utf-8"
              ).strip(),
              "theorem_names": names,
              "theorem_assumption_log_sha256": {
                  name: sha(out / f"{name}.assumptions.txt") for name in names
              },
              "declared_assumptions": 0,
              "derivative_I_remainder_image_to_o0_machine_bound": True,
              "realline_derivative_remainder_image_to_o0_machine_bound": True,
              "canonical_von_mangoldt_derivative_remainder_image_to_o0_machine_bound": True,
              "full_o0_derivative_correspondence_machine_bound": False,
              "independent_native_o0_trig_implementation_agreement_machine_bound": False,
              "guinand_weil_explicit_formula_machine_bound": False,
              "globalization_ready_concrete_weil_discharged": False,
              "global_weil_positivity_proven": False,
              "weil_criterion_machine_bound": False,
              "rh_proven": False,
              "authority_effect": "NONE",
              "open_obligations": [
                  "FULL_O0_DERIVATIVE_CORRESPONDENCE_NOT_MACHINE_BOUND",
                  "INDEPENDENT_NATIVE_O0_TRIG_AGREEMENT_NOT_MACHINE_BOUND",
                  "GUINAND_WEIL_EXPLICIT_FORMULA_NOT_MACHINE_BOUND",
                  "CONCRETE_GLOBALIZATION_PREMISES_NOT_DISCHARGED",
                  "WEIL_CRITERION_NOT_MACHINE_BOUND",
              ],
          }

          canonical = json.dumps(
              payload, sort_keys=True, separators=(",", ":")
          ).encode()
          payload["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()

          target = out / "corn-o0-derivative-image-bridge-receipt.json"
          target.write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))

          assert payload["derivative_I_remainder_image_to_o0_machine_bound"] is True
          assert payload["canonical_von_mangoldt_derivative_remainder_image_to_o0_machine_bound"] is True
          assert payload["full_o0_derivative_correspondence_machine_bound"] is False
          assert payload["guinand_weil_explicit_formula_machine_bound"] is False
          assert payload["global_weil_positivity_proven"] is False
          assert payload["rh_proven"] is False
          assert payload["authority_effect"] == "NONE"
          PY

      - name: Upload derivative-image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-corn-o0-derivative-image-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-corn-o0-derivative-image-attestation/
          if-no-files-found: warn
          retention-days: 30
