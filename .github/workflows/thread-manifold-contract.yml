name: Thread Manifold Contract

on:
  push:
    branches: [spec/thread-manifold-contract-v1]
    paths:
      - 'harness/policies/thread-manifold-contract.v1.json'
      - 'harness/sdk/thread_manifold_contract.py'
      - 'harness/sdk/quantummanifold_scheduler.py'
      - 'harness/tests/test_thread_manifold_contract.py'
      - '.github/workflows/thread-manifold-contract.yml'
  pull_request:
    paths:
      - 'harness/policies/thread-manifold-contract.v1.json'
      - 'harness/sdk/thread_manifold_contract.py'
      - 'harness/sdk/quantummanifold_scheduler.py'
      - 'harness/tests/test_thread_manifold_contract.py'
      - '.github/workflows/thread-manifold-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    name: aegis / thread-manifold-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile contract resolver and kernel
        run: |
          python -m py_compile \
            harness/sdk/thread_manifold_contract.py \
            harness/sdk/quantummanifold_scheduler.py \
            harness/tests/test_thread_manifold_contract.py

      - name: Run binding resolution and authority-separation suite
        run: |
          python -m pytest -q \
            harness/tests/test_thread_manifold_contract.py
