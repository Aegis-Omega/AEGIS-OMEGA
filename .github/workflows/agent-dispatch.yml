name: AEGIS Agent Dispatch

on:
  workflow_run:
    workflows: ["⊕ AEGIS-Ω Constitutional Automaton"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, review_requested, labeled]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  dispatch:
    name: Agent Dispatch Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout trusted default-branch control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Classify bounded event envelope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REQUEST_PATH: ${{ runner.temp }}/agent-dispatch-request.json
          AUDIENCE_PATH: ${{ runner.temp }}/agent-dispatch-audience.txt
          DECISION_PATH: ${{ runner.temp }}/agent-dispatch-classification.json
        shell: bash
        run: |
          set +e
          python3 scripts/agent_dispatch_payload.py \
            --event-name "$EVENT_NAME" \
            --event-path "$EVENT_PATH" \
            --output "$REQUEST_PATH" \
            --audience-output "$AUDIENCE_PATH" \
            --decision-output "$DECISION_PATH"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "actionable=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "actionable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Event classification failed closed (exit $status)." >&2
            exit "$status"
          fi
          echo "reason=$(jq -r '.reason' "$DECISION_PATH")" >> "$GITHUB_OUTPUT"

      - name: Decide whether an external effect is admissible
        id: admission
        env:
          ACTIONABLE: ${{ steps.classify.outputs.actionable }}
          CLASSIFICATION_REASON: ${{ steps.classify.outputs.reason }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATION_ENABLED: ${{ vars.AGENT_DISPATCH_AUTOMATION_ENABLED }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          decision=DEFER
          reason="$CLASSIFICATION_REASON"

          if [ "$ACTIONABLE" != "true" ]; then
            reason="${CLASSIFICATION_REASON:-EVENT_NOT_DISPATCHABLE}"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$AUTOMATION_ENABLED" != "true" ]; then
            reason=AUTOMATION_NOT_ENABLED
          elif [ -z "$GCP_PROJECT" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            reason=TOOLCHAIN_UNAVAILABLE
          else
            decision=EXECUTE
            reason=READY
          fi

          printf 'decision=%s\nreason=%s\n' "$decision" "$reason" >> "$GITHUB_OUTPUT"
          {
            echo '### AEGIS Agent Dispatch Admission'
            echo
            echo "- classification: \`${CLASSIFICATION_REASON:-UNKNOWN}\`"
            echo "- decision: \`$decision\`"
            echo "- reason: \`$reason\`"
            if [ "$decision" != EXECUTE ]; then
              echo '- effect: no external agent/model spend was attempted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud with keyless WIF
        id: auth
        if: steps.admission.outputs.decision == 'EXECUTE'
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Discover canonical proxy and broker execution key
        id: broker
        if: steps.admission.outputs.decision == 'EXECUTE' && steps.auth.outcome == 'success'
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          KEY_PATH: ${{ runner.temp }}/agent-dispatch-platform-key
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="$(gcloud run services describe aegis-platform \
            --region us-central1 \
            --project "$GCP_PROJECT" \
            --format='value(status.url)')"
          test -n "$proxy_url"
          case "$proxy_url" in https://*) ;; *) echo 'Canonical proxy URL is not HTTPS.' >&2; exit 2 ;; esac

          platform_key="$(gcloud secrets versions access latest \
            --secret=platform-api-key \
            --project "$GCP_PROJECT")"
          test -n "$platform_key"
          echo "::add-mask::$platform_key"
          printf '%s' "$platform_key" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "proxy_url=$proxy_url" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch through authenticated constitutional proxy
        id: effect
        if: steps.broker.outputs.ready == 'true'
        env:
          PROXY_URL: ${{ steps.broker.outputs.proxy_url }}
          REQUEST_PATH: ${{ runner.temp }}/agent-dispatch-request.json
          RESPONSE_PATH: ${{ runner.temp }}/agent-dispatch-response.json
          KEY_PATH: ${{ runner.temp }}/agent-dispatch-platform-key
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < "$REQUEST_PATH")" -le 8192
          platform_key="$(cat "$KEY_PATH")"
          echo "::add-mask::$platform_key"

          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "result=FAIL" >> "$GITHUB_OUTPUT"

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 5 \
            --max-time 30 \
            --max-filesize 65536 \
            --request POST "${PROXY_URL%/}/agents/dispatch" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $platform_key" \
            --data-binary "@$REQUEST_PATH" \
            --output "$RESPONSE_PATH"

          jq -e '
            (.results | type == "array") and
            all(.results[]; (.role | type == "string") and (.is_valid | type == "boolean"))
          ' "$RESPONSE_PATH" >/dev/null

          echo "result=SUCCESS" >> "$GITHUB_OUTPUT"
          echo "response_sha256=$(sha256sum "$RESPONSE_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "result_count=$(jq '.results | length' "$RESPONSE_PATH")" >> "$GITHUB_OUTPUT"

      - name: Emit decision and effect receipt
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          CLASSIFICATION_REASON: ${{ steps.classify.outputs.reason }}
          ADMISSION_DECISION: ${{ steps.admission.outputs.decision }}
          ADMISSION_REASON: ${{ steps.admission.outputs.reason }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          BROKER_OUTCOME: ${{ steps.broker.outcome }}
          EFFECT_STEP_OUTCOME: ${{ steps.effect.outcome }}
          EFFECT_ATTEMPTED: ${{ steps.effect.outputs.attempted }}
          EFFECT_RESULT: ${{ steps.effect.outputs.result }}
          RESPONSE_SHA256: ${{ steps.effect.outputs.response_sha256 }}
          RESULT_COUNT: ${{ steps.effect.outputs.result_count }}
          RECEIPT_PATH: ${{ runner.temp }}/AGENT_DISPATCH_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          receipt = {
              "schema": "aegis.agent-dispatch-receipt.v1",
              "candidate_sha": os.environ.get("CANDIDATE_SHA", ""),
              "event_name": os.environ.get("EVENT_NAME", ""),
              "classification_reason": os.environ.get("CLASSIFICATION_REASON") or "CLASSIFICATION_FAILED",
              "decision": os.environ.get("ADMISSION_DECISION") or "DENY",
              "reason": os.environ.get("ADMISSION_REASON") or "WORKFLOW_FAILED_BEFORE_ADMISSION",
              "auth_outcome": os.environ.get("AUTH_OUTCOME") or "not_run",
              "broker_outcome": os.environ.get("BROKER_OUTCOME") or "not_run",
              "effect": {
                  "attempted": os.environ.get("EFFECT_ATTEMPTED") == "true",
                  "result": os.environ.get("EFFECT_RESULT") or "NOT_ATTEMPTED",
                  "step_outcome": os.environ.get("EFFECT_STEP_OUTCOME") or "not_run",
                  "response_sha256": os.environ.get("RESPONSE_SHA256") or None,
                  "result_count": int(os.environ["RESULT_COUNT"]) if os.environ.get("RESULT_COUNT") else None,
              },
              "semantic_truth_proven": False,
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-dispatch-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AGENT_DISPATCH_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce configured-path failures
        if: always()
        env:
          DECISION: ${{ steps.admission.outputs.decision }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          BROKER_OUTCOME: ${{ steps.broker.outcome }}
          EFFECT_OUTCOME: ${{ steps.effect.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DECISION" = EXECUTE ]; then
            test "$AUTH_OUTCOME" = success
            test "$BROKER_OUTCOME" = success
            test "$EFFECT_OUTCOME" = success
          fi
