name: AEGIS Multi-Agent Conservative Consensus V1

on:
  pull_request:
    paths:
      - "governance/multi-agent-conservative-consensus-v1.json"
      - "sovereign-omega-v2/python/multi_agent_conservative_consensus.py"
      - "sovereign-omega-v2/python/tests/test_multi_agent_conservative_consensus.py"
      - "sovereign-omega-v2/formal/bridges/lean/NoFreeEpistemicGainV1.lean"
      - "sovereign-omega-v2/formal/bridges/lean/MultiAgentConservativeConsensusV1.lean"
      - "docs/research/multi-agent-conservative-consensus-v1.md"
      - ".github/workflows/multi-agent-conservative-consensus-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile \
            sovereign-omega-v2/python/multi_agent_conservative_consensus.py \
            sovereign-omega-v2/python/tests/test_multi_agent_conservative_consensus.py
      - name: Run finite-model consensus suite
        env:
          PYTHONPATH: sovereign-omega-v2/python
        run: python sovereign-omega-v2/python/tests/test_multi_agent_conservative_consensus.py -v

  lean-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact head and theorem bytes
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          SRC="$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean"
          PARENT_SHA="$(sha256sum "$SRC/NoFreeEpistemicGainV1.lean" | awk '{print $1}')"
          CHILD_SHA="$(sha256sum "$SRC/MultiAgentConservativeConsensusV1.lean" | awk '{print $1}')"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED"
          printf 'PARENT_SOURCE_SHA256=%s\n' "$PARENT_SHA"
          printf 'CHILD_SOURCE_SHA256=%s\n' "$CHILD_SHA"
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
          echo "child_sha=$CHILD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install exact Lean 4.33.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst \
            -o /tmp/lean.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  /tmp/lean.tar.zst" | sha256sum -c -
          mkdir -p /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean
          echo "/tmp/lean/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Pin Mathlib
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/leanprover-community/mathlib4.git /tmp/mathlib
          cd /tmp/mathlib
          git fetch --depth 1 origin 0df444a360eaa60ab8c11dca51a86af692955474
          git checkout --detach 0df444a360eaa60ab8c11dca51a86af692955474
          test "$(git rev-parse HEAD)" = "0df444a360eaa60ab8c11dca51a86af692955474"
          lake exe cache get
      - name: Copy exact parent and child theorem bytes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean"
          cp "$SRC/NoFreeEpistemicGainV1.lean" /tmp/mathlib/
          cp "$SRC/MultiAgentConservativeConsensusV1.lean" /tmp/mathlib/
          test "$(sha256sum /tmp/mathlib/NoFreeEpistemicGainV1.lean | awk '{print $1}')" = "${{ steps.bind.outputs.parent_sha }}"
          test "$(sha256sum /tmp/mathlib/MultiAgentConservativeConsensusV1.lean | awk '{print $1}')" = "${{ steps.bind.outputs.child_sha }}"
      - name: Kernel replay and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          mkdir -p /tmp/macc-olean
          export LEAN_PATH="/tmp/macc-olean:$BASE_LEAN_PATH"

          lean -o /tmp/macc-olean/NoFreeEpistemicGainV1.olean \
            /tmp/mathlib/NoFreeEpistemicGainV1.lean \
            2>&1 | tee /tmp/nfeg.log

          lean -o /tmp/macc-olean/MultiAgentConservativeConsensusV1.olean \
            /tmp/mathlib/MultiAgentConservativeConsensusV1.lean \
            2>&1 | tee /tmp/macc.log

          cat > /tmp/mathlib/MACCAudit.lean <<'LEAN'
          import NoFreeEpistemicGainV1
          import MultiAgentConservativeConsensusV1
          #print axioms AEGIS.MultiAgentConservativeConsensusV1.consensus_le_initial
          #print axioms AEGIS.MultiAgentConservativeConsensusV1.consensus_le_member
          #print axioms AEGIS.MultiAgentConservativeConsensusV1.consensus_greatest_lower_bound
          LEAN

          lean /tmp/mathlib/MACCAudit.lean 2>&1 | tee /tmp/macc-axioms.log
          ! grep -q "sorryAx" /tmp/nfeg.log
          ! grep -q "sorryAx" /tmp/macc.log
          ! grep -q "sorryAx" /tmp/macc-axioms.log
          printf 'MULTI_AGENT_CONSERVATIVE_CONSENSUS_LEAN=PASS\n'
