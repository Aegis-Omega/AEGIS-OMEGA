name: RH Zero Height Finite Sum

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_height_finite_sum_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_height_finite_sum_v1.py'
      - '.github/workflows/rh-zero-height-finite-sum.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: 94415f65ae85e1e9993916a22891ca2248d65d4d
  HEIGHT_PARENT_SHA: cef68b5fd8d98b4ad2144ae32ab1f5bfde742505
  HEIGHT_PARENT_RECEIPT: c742236ca9b5337affb02849489a50e540e2e2d4e3dcf201cc9d4d4f4bd35d36
  HEIGHT_PARENT_ARTIFACT: e59dacc4ba735d6c4b933c2fb8faf9526519379dce8599047a36437f7e4d0171
  MULTIPLICITY_PARENT_SHA: 20f030aa3e69bc95c7e247010096fbbe2a4c2dd9
  MULTIPLICITY_PARENT_RECEIPT: 29fc8be9b217a132a81130a3f3909f7ce5c1b27adac27ec83955c4ed632904e9
  MULTIPLICITY_PARENT_ARTIFACT: 2c7750c9000a28a0bd006681d423921e1238ee260653db04b52afc6e0b571645
  MULTIPLICITY_PARENT_SOURCE_BLOB: d6ae78f4f359bde8841ab254838ed4fedfbfcc29
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  FORMAL_CONJECTURES_RH_BLOB_SHA: c8d38bef385eb15661c3daf7449625b66b019b2a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  ORDER_BLOB_SHA: 43cc6d88cb0ecba9560d4c29a410b271d9432628
  MELLIN_BLOB_SHA: 665d618fa526c81b3606cb8fbadf27b5a7913d32
  ZETA_ZEROS_BLOB_SHA: 0b8046e67ae5d1e613366e86fdf6b205eea3a6b1
  COMPLEX_NORM_BLOB_SHA: 0898fb3ad035a87ee89ce2093780486e857cc5ff
  HURWITZ_VALUES_BLOB_SHA: 4bdfedf2cf474a721e0687852a5782f304781eb7
  NONVANISHING_BLOB_SHA: 610bd56365d49c5ffa9ebeb29e0a383c768248e2
  RIEMANN_ZETA_BLOB_SHA: 3c92195fce20df7fda41cfd823b3266f83cf3070

jobs:
  finite-height-sum:
    name: pinned multiplicity-safe finite height sum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean)" = "$SOURCE_BLOB_SHA"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zero_height_finite_sum_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zero_height_finite_sum_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZERO_HEIGHT_FINITE_SUM_V1'
          p = m['verified_parent_evidence']
          h, q = p['finite_height_carrier'], p['pointwise_multiplicity']
          assert (h['aegis_revision'], h['receipt_sha256'], h['artifact_sha256']) == (
              os.environ['HEIGHT_PARENT_SHA'], os.environ['HEIGHT_PARENT_RECEIPT'], os.environ['HEIGHT_PARENT_ARTIFACT'])
          assert (q['aegis_revision'], q['receipt_sha256'], q['artifact_sha256'], q['formal_source_git_blob_sha']) == (
              os.environ['MULTIPLICITY_PARENT_SHA'], os.environ['MULTIPLICITY_PARENT_RECEIPT'],
              os.environ['MULTIPLICITY_PARENT_ARTIFACT'], os.environ['MULTIPLICITY_PARENT_SOURCE_BLOB'])
          e = m['external_environment']
          assert e['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert e['formal_conjectures_rh_blob_sha'] == os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          blobs = {x['path']: x['git_blob_sha'] for x in m['upstream_mathlib']}
          assert blobs['Mathlib/Analysis/Analytic/Order.lean'] == os.environ['ORDER_BLOB_SHA']
          assert blobs['Mathlib/Analysis/MellinTransform.lean'] == os.environ['MELLIN_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/ZetaZeros.lean'] == os.environ['ZETA_ZEROS_BLOB_SHA']
          assert blobs['Mathlib/Analysis/Complex/Norm.lean'] == os.environ['COMPLEX_NORM_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/HurwitzZetaValues.lean'] == os.environ['HURWITZ_VALUES_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/Nonvanishing.lean'] == os.environ['NONVANISHING_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/RiemannZeta.lean'] == os.environ['RIEMANN_ZETA_BLOB_SHA']
          assert m['formal_source']['git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          s = m['scope']
          assert s['finite_height_multiplicity_sum'] == 'CANDIDATE'
          for key in ('height_limit_existence','zero_sum_convergence','height_radial_equivalence','explicit_formula_theorem','critical_line_re_half','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['claim_promotion'] == 'BLOCKED'
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(git hash-object FormalConjectures/Millenium/RiemannHypothesis.lean)" = "$FORMAL_CONJECTURES_RH_BLOB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: lake exe cache get

      - name: Bind pinned Mathlib sources
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Analytic/Order.lean)" = "$ORDER_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/MellinTransform.lean)" = "$MELLIN_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/ZetaZeros.lean)" = "$ZETA_ZEROS_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Complex/Norm.lean)" = "$COMPLEX_NORM_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/HurwitzZetaValues.lean)" = "$HURWITZ_VALUES_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/Nonvanishing.lean)" = "$NONVANISHING_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/RiemannZeta.lean)" = "$RIEMANN_ZETA_BLOB_SHA"
          grep -F 'lemma Nat.cast_analyticOrderNatAt' .lake/packages/mathlib/Mathlib/Analysis/Analytic/Order.lean
          grep -F 'def mellin' .lake/packages/mathlib/Mathlib/Analysis/MellinTransform.lean
          grep -F 'lemma IsCompact.inter_riemannZetaZeros_finite' .lake/packages/mathlib/Mathlib/NumberTheory/LSeries/ZetaZeros.lean

      - name: Compile multiplicity-safe finite height sum
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-height-finite-sum-lean-version.txt"
          lake env lean "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean" 2>&1 | tee "$GITHUB_WORKSPACE/zero-height-finite-sum-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-height-finite-sum-lean.log"

      - name: Emit fail-closed finite-height-sum receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zero_height_finite_sum_v1.json')
          log = Path('zero-height-finite-sum-lean.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZERO_HEIGHT_FINITE_SUM_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'height_parent_revision':os.environ['HEIGHT_PARENT_SHA'],
            'height_parent_receipt_sha256':os.environ['HEIGHT_PARENT_RECEIPT'],
            'multiplicity_parent_revision':os.environ['MULTIPLICITY_PARENT_SHA'],
            'multiplicity_parent_receipt_sha256':os.environ['MULTIPLICITY_PARENT_RECEIPT'],
            'formal_conjectures_revision':os.environ['FORMAL_CONJECTURES_SHA'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'finite_height_multiplicity_sum':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'height_limit_existence':'OPEN',
            'zero_sum_convergence':'OPEN',
            'height_radial_equivalence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'critical_line_re_half':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zero-height-finite-sum-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zero-height-finite-sum-receipt.json').read_text())
          PY

      - name: Upload finite-height-sum evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-height-finite-sum-${{ env.SOURCE_SHA }}
          path: |
            zero-height-finite-sum-lean-version.txt
            zero-height-finite-sum-lean.log
            zero-height-finite-sum-receipt.json
          if-no-files-found: error
          retention-days: 30
