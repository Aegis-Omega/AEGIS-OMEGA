name: PR679 RH Restricted Weil Exact-Head Replay

on:
  push:
    branches:
      - 'verify/pr679-rh-restricted-weil-bridge-v13-exact-head'
    paths:
      - '.github/workflows/rh-pr679-restricted-weil-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PARENT_SOURCE_SHA: 559e2a7f897bd48fe4559e8405ca5f6f9d6c3b3a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  TARGET_MODULE: RHRestrictedWeilBridgeV13

jobs:
  exact-head:
    name: compile PR679 restricted-Weil RH producer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout verification candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ github.sha }}
          path: .aegis
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source parent and pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD^)" = "$PARENT_SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis diff --exit-code "$PARENT_SOURCE_SHA" HEAD --             sovereign-omega-v2/formal/bridges/lean/RHRestrictedWeilBridgeV13.lean             sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionFinalV13.lean
          mkdir -p evidence .lake/build/lib/lean
          printf 'VERIFICATION_SHA=%s\nPARENT_SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n'             "$(git -C .aegis rev-parse HEAD)" "$PARENT_SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN"             > evidence/exact-source.log

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Resolve local dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re

          root = Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          target = os.environ["TARGET_MODULE"]
          files = {p.stem: p for p in root.glob("*.lean")}
          if target not in files:
              raise SystemExit(f"missing target module: {target}")

          pat = re.compile(r"^\s*import\s+(.+?)\s*$")
          imports = {}
          for name, src in files.items():
              deps = []
              for line in src.read_text().splitlines():
                  m = pat.match(line)
                  if not m:
                      continue
                  for token in m.group(1).split():
                      leaf = token.split(".")[-1]
                      if leaf in files:
                          deps.append(leaf)
              imports[name] = deps

          temp, done, order = set(), set(), []
          def visit(name):
              if name in done:
                  return
              if name in temp:
                  raise RuntimeError(f"local import cycle at {name}")
              temp.add(name)
              for dep in imports.get(name, []):
                  visit(dep)
              temp.remove(name)
              done.add(name)
              order.append(name)

          visit(target)
          Path("evidence/modules.txt").write_text("\n".join(order) + "\n")
          for name in order:
              src = files[name]
              dst = Path(f"{name}.lean")
              data = src.read_bytes()
              dst.write_bytes(data)
              with Path("evidence/exact-source.log").open("a") as out:
                  out.write(f"{hashlib.sha256(data).hexdigest()}  {name}.lean\n")
          print(f"dependency closure: {len(order)} modules")
          print("\n".join(order))
          PY

      - name: Compile exact dependency closure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Audit RH producer axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > RHRestrictedWeilBridgeV13Audit.lean <<'EOF'
          import RHRestrictedWeilBridgeV13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.zero_re_le_half_of_final_sign_v13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.final_sign_implies_rh_v13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.restricted_weil_criterion_kernel_bridge_v13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.millennium_moment_iff_universal_v13
          EOF
          lake env lean RHRestrictedWeilBridgeV13Audit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          PARENT_SOURCE_SHA=$PARENT_SOURCE_SHA
          TARGET=RHRestrictedWeilBridgeV13
          FINAL_SIGN_TO_RH=TARGETED
          UNIVERSAL_ZERO_QUADRATIC_PRODUCER=SEPARATE_OPEN_FIELD
          RIEMANN_HYPOTHESIS=NOT_PROMOTED_WITHOUT_UNIVERSAL_PRODUCER
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr679-rh-restricted-weil-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
