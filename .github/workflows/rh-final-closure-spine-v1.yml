name: RH Final Closure Spine V1

on:
  push:
    branches:
      - 'integration/rh-final-closure-v1'
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RHFinalClosureSpineV1.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/Weil*.lean'
      - '.github/workflows/rh-final-closure-spine-v1.yml'
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RHFinalClosureSpineV1.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/Weil*.lean'
      - '.github/workflows/rh-final-closure-spine-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-final-closure-spine-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: compile unified sign spine at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and module inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilFiniteSourceCalculusV1
            WeilArchSineKernelV1
            WeilArchSineKernelIntegerV1
            WeilArchFiniteQuadraticV1
            WeilArchTailIntegralV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilDiagonalKernelReductionV21
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
            WeilThreeBlockCrossPrimeWindowV29
            WeilThreeBlockPrimeEvaluationV30
            WeilThreeBlockCrossAssemblyV30
            WeilSeparatedArchBridgeV31
            RHFinalClosureSpineV1
            RHFourBlockBoundObstructionV1
          )
          : > evidence/modules.txt
          : > evidence/exact-source.log
          for m in "${modules[@]}"; do
            test -f "$ROOT/$m.lean"
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n'             "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" >> evidence/exact-source.log

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Compile unified sign chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Set up Python for inherited RKHS exact kernels
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Replay inherited RKHS dominance and same-span congruence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.1
          python -m pytest -q research/rh/test_rkhs_dominance_kernel.py

      - name: Audit final spine
        shell: bash
        run: |
          set -euo pipefail
          cat > RHFinalClosureAudit.lean <<'EOF'
          import RHFinalClosureSpineV1
          #print AEGIS.RHFinalClosureV1.FinalSignResidualV1
          #print AEGIS.WeilSeparatedArchBridgeV31.CorrelationSupportDifferenceWidthV31
          #print axioms AEGIS.WeilSeparatedArchBridgeV31.twice_packet_width_eq_correlation_width_v31
          #print axioms AEGIS.RHFinalClosureV1.final_sign_residual_iff_weil_negativity_v1
          #print axioms AEGIS.RHFinalClosureV1.retained_three_block_sign_v1
          #print axioms AEGIS.RHFourBlockBoundObstructionV1.four_block_absolute_budget_fails_v1
          #print axioms AEGIS.RHFourBlockBoundObstructionV1.four_block_missing_margin_v1
          #print axioms AEGIS.WeilSeparatedArchBridgeV31.three_block_bound_of_moments
          EOF
          lake env lean RHFinalClosureAudit.lean 2>&1 | tee evidence/final-spine-axioms.log
          ! grep -F 'sorryAx' evidence/final-spine-axioms.log

      - name: Emit bounded disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          UNION_TREE=V8_FIXED_LINE_PLUS_RESTRICTED_CRITERION_PLUS_V31_SIGN_STACK
          FINAL_SIGN_RESIDUAL_EQ_WEIL_NEGATIVITY=TARGETED
          FINITE_RKHS_DOMINANCE_KERNEL=IMPORTED_EXISTING
          SAME_SPAN_CONGRUENCE_KERNEL=IMPORTED_EXISTING
          CONCRETE_FINITE_SEMANTICS_499=IMPORTED_EXISTING
          FINITE_SOURCE_CALCULUS_523=IMPORTED_EXISTING
          PACKET_LOG_SUPPORT_WIDTH=1/32
          CORRELATION_SUPPORT_DIFFERENCE_WIDTH=1/16
          RETAINED_THREE_BLOCK_SIGN=TARGETED
          UNIVERSAL_FINAL_SIGN=NOT_CLAIMED
          RIEMANN_HYPOTHESIS=NOT_CLAIMED
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-final-closure-spine-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
