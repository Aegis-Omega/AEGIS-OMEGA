name: RH Cumulative Mellin Bridge

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/*.lean'
      - 'sovereign-omega-v2/formal/tests/test_zero_counting_mellin_summability_v1.py'
      - '.github/workflows/rh-cumulative-mellin-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MELLIN_PARENT_SHA: 6ec8bb0ee39c462a5b544620b5ad2648c52ecb1e
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11

jobs:
  cumulative-mellin:
    name: verify multiplicity Mellin summability at exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact external proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS candidate as evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Rebind external source to AEGIS Lean and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          rm -f lake-manifest.json

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve AEGIS-pinned Mathlib and cache
        shell: bash
        run: |
          set -euo pipefail
          lake update mathlib
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get

      - name: Compile multiplicity zero-count and xi-growth providers
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake build Hadamard.OrderOne.TailEstimates Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge

      - name: Audit exact provider theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > AegisZeroCountProviderAudit.lean <<'EOF'
          import Hadamard.OrderOne.TailEstimates
          import Lc.LiCriterion.HadamardSummabilityBridge
          import Lc.LiCriterion.XiGrowth
          #print axioms Hadamard.ZeroCounting.sum_zeros_multiplicity_le_of_max_one_maxModulus
          #print axioms Hadamard.OrderOne.sum_multiplicity_zeros_le_rpow_of_order_le
          #print axioms LiCriterion.XiGrowth.riemannXi_hasFiniteOrder
          #print axioms LiCriterion.XiGrowth.riemannXi_order_le_one
          #print axioms LiCriterion.xi_weighted_genus_one_of_hadamard_order_one
          #print axioms LiCriterion.xi_entire
          #print axioms LiCriterion.xi_zeros_are_nontrivial_zeros
          EOF
          lake env lean AegisZeroCountProviderAudit.lean 2>&1 | tee provider-axioms.log
          ! grep -F 'sorryAx' provider-axioms.log

      - name: Compile AEGIS parent chain and Mellin summability bridge
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            WeilCriterionCompactSmoothV1 \
            ZeroCriticalStripV1 \
            ZeroHeightFiniteSumV1 \
            ZeroHeightLimitContractV1 \
            ZeroHeightSummabilityBridgeV1 \
            ZeroMajorantSummabilityV1 \
            ZeroHeightShellMassV1 \
            ZeroShellQuadraticBoundV1 \
            ZeroShellAnalyticSynthesisV1 \
            ZeroCountingBoundV1 \
            MellinDecayEstimateV1 \
            ZeroCountingMellinSummabilityV1; do
            cp ".aegis/sovereign-omega-v2/formal/bridges/lean/$f.lean" "./$f.lean"
          done
          mkdir -p .lake/build/lib/lean
          for f in \
            WeilCriterionCompactSmoothV1 \
            ZeroCriticalStripV1 \
            ZeroHeightFiniteSumV1 \
            ZeroHeightLimitContractV1 \
            ZeroHeightSummabilityBridgeV1 \
            ZeroMajorantSummabilityV1 \
            ZeroHeightShellMassV1 \
            ZeroShellQuadraticBoundV1 \
            ZeroShellAnalyticSynthesisV1 \
            ZeroCountingBoundV1 \
            MellinDecayEstimateV1; do
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean" \
              2>&1 | tee "$f-zero-count-parent.log"
          done
          lake env lean ZeroCountingMellinSummabilityV1.lean 2>&1 | tee zero-counting-mellin.log
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import re
          log = Path('zero-counting-mellin.log').read_text()
          expected = [
              'weighted_summable_of_inverse_square_and_height_decay_v1',
              'riemann_zeta_weighted_inverse_square_summable_v1',
              'zero_summable_of_uniform_mellin_quadratic_decay_v1',
              'weil_compact_smooth_zero_summable_v1',
              'weil_compact_smooth_zero_norm_summable_v1',
              'weil_compact_smooth_height_limit_tsum_v1',
              'weil_compact_smooth_height_limit_eq_tsum_v1',
          ]
          assert 'sorryAx' not in log
          for theorem in expected:
              match = re.search(re.escape("'" + theorem + "' depends on axioms: ") + r"\[([^\]]*)\]", log, re.S)
              assert match, theorem
              actual = {x.strip() for x in match[1].split(',') if x.strip()}
              assert actual <= {'propext', 'Classical.choice', 'Quot.sound'}, (theorem, actual)
          print('PASS: seven theorem dependency closures audited; authority_effect=NONE')
          PY_AUDIT

      - name: Upload exact-head formal log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-cumulative-mellin-${{ env.SOURCE_SHA }}
          path: |
            zero-counting-mellin.log
            provider-axioms.log
            *-zero-count-parent.log
          if-no-files-found: warn
          retention-days: 30
