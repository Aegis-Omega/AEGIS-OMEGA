name: Archive Runtime Bridge

on:
  pull_request:
    branches:
      - main
      - feat/archive-runtime-read-surface-v1
    paths:
      - "sovereign-omega-v2/Dockerfile"
      - "sovereign-omega-v2/cloudbuild.yaml"
      - "sovereign-omega-v2/python/archive_runtime_api.py"
      - "sovereign-omega-v2/python/bridge.py"
      - "sovereign-omega-v2/python/requirements.txt"
      - "sovereign-omega-v2/python/tests/test_archive_runtime_api.py"
      - "scripts/test-archive-runtime-image-contract.py"
      - ".github/workflows/archive-runtime-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-runtime-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded runtime test dependencies
        run: python -m pip install --disable-pip-version-check pytest "numpy>=1.26,<3"
      - name: Compile bridge and dispatcher
        run: python -m py_compile sovereign-omega-v2/python/bridge.py sovereign-omega-v2/python/archive_runtime_api.py
      - name: Execute recovered runtime API contract
        run: |
          cd sovereign-omega-v2
          PYTHONPATH=python:.. pytest -q python/tests/test_archive_runtime_api.py
      - name: Verify image and GET-only bridge contract
        run: python scripts/test-archive-runtime-image-contract.py
      - name: Authority boundary
        run: |
          echo "deployment=NOT_PERFORMED"
          echo "mutation_surface=false"
          echo "authority_effect=NONE"
