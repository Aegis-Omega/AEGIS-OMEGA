name: Weil Sign Orientation Provenance V1

on:
  pull_request:
    paths:
      - 'tests/test_weil_sign_orientation_provenance_v1.py'
      - 'sovereign-omega-v2/formal/theories/Weil/ConcreteFiniteGuinandWeilSemanticsV1.v'
      - 'sovereign-omega-v2/formal/specs/FINITE_GUINAND_WEIL_SPEC_V1.json'
      - '.github/workflows/weil-sign-orientation-provenance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATH_PROOF_SHA: ec6ce36278c99bbfb40c8200dbc09ec3c0b95faa
  LEAN_POLE_SHA: d88587788630a5bafa12fdeb0619f3806f89d035

jobs:
  provenance-binding:
    name: bind sign orientation without claim promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Coq candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned mathematical identity proof note
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.MATH_PROOF_SHA }}
          path: .math-proof
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned Lean pole-cancellation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.LEAN_POLE_SHA }}
          path: .lean-pole
          fetch-depth: 1
          persist-credentials: false

      - name: Assert all exact source heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .math-proof rev-parse HEAD)" = "$MATH_PROOF_SHA"
          test "$(git -C .lean-pole rev-parse HEAD)" = "$LEAN_POLE_SHA"

      - name: Execute sign-orientation provenance contract
        shell: bash
        env:
          AEGIS_WEIL_IDENTITY_PROOF_NOTE: ${{ github.workspace }}/.math-proof/sovereign-omega-v2/formal/proofs/WeilPairedHadamardIdentityV1.md
          AEGIS_LEAN_POLE_AGGREGATION_SOURCE: ${{ github.workspace }}/.lean-pole/sovereign-omega-v2/formal/bridges/lean/WeilAutocorrelationPoleAggregationV1.lean
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_weil_sign_orientation_provenance_v1.py
