name: Epistemic Lineage Preflight

on:
  pull_request:
    paths:
      - 'docs/LINEAGE_*'
      - 'docs/DRIVE_TRIAGE.v1.json'
      - 'docs/DRIVE_TRIAGE_CONTINUATION_*.json'
      - 'scripts/lineage_preflight.py'
      - 'tests/test_lineage_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Parse machine-readable lineage documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in (
            Path('docs/LINEAGE_PRECHECK.json'),
            Path('docs/LINEAGE_CONFLICTS.json'),
            Path('docs/LINEAGE_MANIFEST.v1.json'),
            Path('docs/LINEAGE_TIMELINE_PHASE1.v1.json'),
            Path('docs/DRIVE_TRIAGE.v1.json'),
            Path('docs/DRIVE_TRIAGE_CONTINUATION_2026-08-23.v1.json'),
          ):
            json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Run lineage preflight regression tests
        run: python -m pytest -q tests/test_lineage_preflight.py
      - name: Exercise P0 VCG semantic collision
        run: |
          if python scripts/lineage_preflight.py --proposed-name VCG --semantic-role 'new metric'; then
            echo 'Expected VCG semantic collision to fail closed' >&2
            exit 1
          fi
