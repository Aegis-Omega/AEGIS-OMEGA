name: Apply Cognitive Signed Writer Fix V1

on:
  push:
    branches:
      - fix/cognitive-manifest-github-signed-writer-v1

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Transform writer and legacy boundary test
        run: python3 .github/scripts/apply-cognitive-signed-writer-fix-v1.py

      - name: Verify transformed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/test-cognitive-anchor-writer-boundary.py
          python3 scripts/test-cognitive-anchor-signed-writer-v1.py

      - name: Stage transformed files for artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed-writer-artifact/workflow" "$RUNNER_TEMP/signed-writer-artifact/scripts"
          cp .github/workflows/cognitive-manifest-refresh.yml "$RUNNER_TEMP/signed-writer-artifact/workflow/"
          cp scripts/test-cognitive-anchor-writer-boundary.py "$RUNNER_TEMP/signed-writer-artifact/scripts/"
          cp scripts/test-cognitive-anchor-signed-writer-v1.py "$RUNNER_TEMP/signed-writer-artifact/scripts/"

      - name: Upload transformed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-signed-writer-green-visible
          path: ${{ runner.temp }}/signed-writer-artifact
          if-no-files-found: error
