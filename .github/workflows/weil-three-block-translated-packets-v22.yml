name: Weil Three-Block Translated Packets V2.2

on:
  push:
    branches:
      - proof/weil-three-block-translated-packets-v22
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilThreeBlockTranslatedPacketsV22.lean'
      - '.github/workflows/weil-three-block-translated-packets-v22.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-three-block-translated-packets-v22-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  PARENT_V21_SHA: f86af1f59c3095ee13877dae7f91b3c5a8b637f4
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: translated packets; moments energy disjointness only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source, ancestry and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis merge-base --is-ancestor "$PARENT_V21_SHA" "$SOURCE_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
          )
          : > evidence/exact-source.log
          : > evidence/modules.txt
          for m in "${modules[@]}"; do
            cp "$ROOT/$m.lean" "$m.lean"
            cp "$m.lean" evidence/
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          printf 'SOURCE_SHA=%s\nPARENT_V21_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n' \
            "$SOURCE_SHA" "$PARENT_V21_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" \
            >> evidence/exact-source.log
          sha256sum lake-manifest.json .aegis/.github/workflows/weil-three-block-translated-packets-v22.yml \
            >> evidence/exact-source.log

      - name: Obtain exact Lean and targeted dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get \
            Mathlib/Analysis/MellinTransform.lean \
            Mathlib/NumberTheory/ArithmeticFunction/VonMangoldt.lean \
            Mathlib/NumberTheory/Harmonic/EulerMascheroni.lean \
            Mathlib/NumberTheory/LSeries/RiemannZeta.lean \
            Mathlib/MeasureTheory/Function/JacobianOneDim.lean \
            Mathlib/MeasureTheory/Measure/Haar/Basic.lean \
            Mathlib/Analysis/SpecialFunctions/ExpDeriv.lean \
            Mathlib/Tactic.lean
          lean --version | tee evidence/lean-version.log

      - name: Compile exact module chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            /usr/bin/time -v lake env lean \
              -o ".lake/build/lib/lean/$m.olean" "$m.lean" \
              > "evidence/$m.log" 2> "evidence/$m.resources.log"
            sha256sum ".lake/build/lib/lean/$m.olean" >> evidence/exact-source.log
          done < evidence/modules.txt

      - name: Audit all V2.2 theorem dependency closures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          src = Path('WeilThreeBlockTranslatedPacketsV22.lean').read_text()
          names = re.findall(r'^theorem\s+([A-Za-z0-9_]+)', src, re.M)
          if len(names) != 21 or len(set(names)) != 21:
              raise SystemExit(f'FAIL theorem census: {len(names)} {names!r}')
          fq = ['AEGIS.WeilThreeBlockTranslatedPacketsV22.' + n for n in names]
          Path('evidence/expected-v22-theorems.json').write_text(json.dumps(fq, indent=2) + '\n')
          Path('AuditV22.lean').write_text(
              'import WeilThreeBlockTranslatedPacketsV22\n' +
              ''.join('#print axioms ' + n + '\n' for n in fq))
          PY
          lake env lean AuditV22.lean 2>&1 | tee evidence/axioms-v22.log
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          names = json.loads(Path('evidence/expected-v22-theorems.json').read_text())
          log = Path('evidence/axioms-v22.log').read_text()
          allowed = {'propext','Classical.choice','Quot.sound'}
          out = {}
          for name in names:
              none = "'" + name + "' does not depend on any axioms"
              found = re.findall(re.escape("'" + name + "' depends on axioms: ") + r'\[([^\]]*)\]', log, re.S)
              if none in log and not found:
                  axioms = set()
              elif none not in log and len(found) == 1:
                  axioms = {a.strip() for a in found[0].split(',') if a.strip()}
              else:
                  raise SystemExit('FAIL incomplete axiom output: ' + name)
              if 'sorryAx' in axioms or not axioms <= allowed:
                  raise SystemExit('FAIL unexpected axioms: ' + name + ' ' + repr(axioms))
              out[name] = sorted(axioms)
          Path('evidence/axiom-audit-v22.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print('PASS: 21 V2.2 theorem closures audited')
          PY

      - name: Emit fail-closed disposition
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          PARENT_V21_SOURCE=$PARENT_V21_SHA
          V22_CANDIDATE_HEAD=$SOURCE_SHA
          TRANSLATED_PACKET_CARRIER=KERNEL_VERIFIED
          LOG_LIFT_TRANSLATION=KERNEL_VERIFIED
          REPOSITORY_MOMENT_PRESERVATION=KERNEL_VERIFIED
          TRANSLATED_ENERGY_PRESERVATION=KERNEL_VERIFIED
          WIDTH_1_32_PAIRWISE_DISJOINTNESS=KERNEL_VERIFIED
          ANALYTIC_DIAGONAL_LOWER_V1=OPEN
          ANALYTIC_CROSS_TERM_MAJORANT_V1=OPEN
          CONCRETE_THREE_BLOCK_WEIL_COERCIVITY=NOT_YET_ESTABLISHED
          GLOBAL_WEIL_POSITIVITY=OPEN
          RH=NOT_PROVEN
          repository_admission=NOT_GRANTED
          merge=NONE
          authority_effect=NONE
          EOF
          sed -i 's/^          //' evidence/DISPOSITION.txt

      - name: Upload exact-source replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-translated-packets-v22-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30