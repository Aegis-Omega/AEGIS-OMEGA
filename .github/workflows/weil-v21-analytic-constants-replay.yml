name: Weil V2.1 Analytic Constants Replay

on:
  push:
    branches:
      - research/weil-v21-analytic-constants-replay-20260915
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilThreeBlockAnalyticConstantsV21.lean'
      - '.github/workflows/weil-v21-analytic-constants-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-v21-analytic-constants-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  SOURCE_SHA256: e0959d18194dc072336c943029977cb1e723773a89d0a1fbe9af9b531fb00311

jobs:
  verify:
    name: constants kernel replay; no analytic sign promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          persist-credentials: false

      - name: Bind exact source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"

          SRC=.aegis/sovereign-omega-v2/formal/bridges/lean/WeilThreeBlockAnalyticConstantsV21.lean
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$SOURCE_SHA256"

          mkdir -p evidence .lake/build/lib/lean
          cp "$SRC" WeilThreeBlockAnalyticConstantsV21.lean
          cp "$SRC" evidence/
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\nSOURCE_SHA256=%s\n' \
            "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" "$SOURCE_SHA256" \
            > evidence/exact-source.log
          sha256sum WeilThreeBlockAnalyticConstantsV21.lean lake-manifest.json \
            .aegis/.github/workflows/weil-v21-analytic-constants-replay.yml \
            >> evidence/exact-source.log

      - name: Obtain exact Lean and targeted dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get \
            Mathlib/Analysis/Complex/ExponentialBounds.lean \
            Mathlib/Analysis/Real/Pi/Bounds.lean \
            Mathlib/NumberTheory/Harmonic/EulerMascheroni.lean \
            Mathlib/Tactic.lean
          lean --version | tee evidence/lean-version.log

      - name: Compile exact candidate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v lake env lean \
            -o .lake/build/lib/lean/WeilThreeBlockAnalyticConstantsV21.olean \
            WeilThreeBlockAnalyticConstantsV21.lean \
            > evidence/compile.log 2> evidence/compile-resource.log
          cat evidence/compile.log
          cat evidence/compile-resource.log
          sha256sum .lake/build/lib/lean/WeilThreeBlockAnalyticConstantsV21.olean \
            > evidence/olean-sha256.txt

      - name: Audit theorem dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          source = Path('WeilThreeBlockAnalyticConstantsV21.lean').read_text()
          names = re.findall(r'^theorem ([A-Za-z0-9_]+)', source, re.M)
          if len(names) != 14 or len(set(names)) != 14:
              raise SystemExit(f'FAIL: expected 14 unique theorems, got {names!r}')
          fq = ['AEGIS.WeilThreeBlockAnalyticConstantsV21.' + n for n in names]
          Path('evidence/expected-theorems.json').write_text(json.dumps(fq, indent=2) + '\n')
          Path('Audit.lean').write_text(
              'import WeilThreeBlockAnalyticConstantsV21\n' +
              ''.join('#print axioms ' + n + '\n' for n in fq)
          )
          PY

          lake env lean Audit.lean 2>&1 | tee evidence/axioms.log

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          names = json.loads(Path('evidence/expected-theorems.json').read_text())
          log = Path('evidence/axioms.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          result = {}
          for name in names:
              none = "'" + name + "' does not depend on any axioms"
              found = re.findall(re.escape("'" + name + "' depends on axioms: ") + r'\[([^\]]*)\]', log, re.S)
              if none in log and not found:
                  axioms = set()
              elif none not in log and len(found) == 1:
                  axioms = {a.strip() for a in found[0].split(',') if a.strip()}
              else:
                  raise SystemExit('FAIL: incomplete axiom output for ' + name)
              if 'sorryAx' in axioms or not axioms <= allowed:
                  raise SystemExit('FAIL: unexpected theorem dependency for ' + name + ': ' + repr(axioms))
              result[name] = sorted(axioms)
          Path('evidence/axiom-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print('PASS: 14 theorem closures audited; ANALYTIC_KERNEL_REDUCTION=OPEN; GLOBAL_WEIL_SIGN=OPEN; RH=NOT_PROVEN')
          PY

      - name: Emit fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          payload = {
              'schema': 'AEGIS_WEIL_V21_ANALYTIC_CONSTANTS_KERNEL_RECEIPT_V1',
              'source_commit': os.environ['SOURCE_SHA'],
              'source_sha256': os.environ['SOURCE_SHA256'],
              'mathlib_sha': os.environ['MATHLIB_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'theorem_count': 14,
              'compile_status': 'PASS',
              'axiom_audit_status': 'PASS',
              'olean_sha256': Path('evidence/olean-sha256.txt').read_text().split()[0],
              'axiom_log_sha256': sha('evidence/axioms.log'),
              'elementary_analytic_constants_machine_bound': True,
              'harmonic_256_exact_machine_bound': True,
              'euler_mascheroni_upper_machine_bound': True,
              'diagonal_constant_floor_machine_bound': True,
              'prime_scalar_bounds_machine_bound': True,
              'diagonal_kernel_reduction_machine_bound': False,
              'six_actual_B_bounds_machine_bound': False,
              'global_weil_sign': 'OPEN',
              'rh': 'NOT_PROVEN',
              'repository_admission': 'NOT_GRANTED',
              'merge': 'NONE',
              'authority_effect': 'NONE',
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('evidence/receipt.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(Path('evidence/receipt.json').read_text())
          PY

      - name: Upload exact-source replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-v21-analytic-constants-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
