name: AEGIS Production Dependency Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    name: Production audit · ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - surface: sovereign-runtime
            directory: sovereign-omega-v2
            lockfile: sovereign-omega-v2/package-lock.json
          - surface: studio
            directory: studio
            lockfile: studio/package-lock.json
          - surface: mcp-server
            directory: sovereign-omega-v2/mcp-server
            lockfile: sovereign-omega-v2/mcp-server/package-lock.json
          - surface: hub
            directory: hub
            lockfile: hub/package-lock.json
          - surface: cockpit
            directory: cockpit
            lockfile: cockpit/package-lock.json
          - surface: cockpit-server
            directory: cockpit/server
            lockfile: cockpit/server/package-lock.json
          - surface: enterprise
            directory: enterprise
            lockfile: enterprise/package-lock.json
          - surface: platform-picker
            directory: platform-picker
            lockfile: platform-picker/package-lock.json
          - surface: hook-generator
            directory: hook-generator
            lockfile: hook-generator/package-lock.json
          - surface: content-calendar
            directory: content-calendar
            lockfile: content-calendar/package-lock.json
          - surface: tactical
            directory: tactical
            lockfile: tactical/package-lock.json
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install locked graph
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Audit production dependencies
        id: audit
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > production-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('production-audit.json', 'utf8'))
          const vulnerabilities = report.metadata?.vulnerabilities ?? {}
          console.log(JSON.stringify({
            dependencies: report.metadata?.dependencies ?? null,
            vulnerabilities,
          }, null, 2))
          NODE
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # This diagnostic never commits to the repository. It proposes only a
      # package-lock update in the ephemeral GitHub runner and remains fail-closed
      # against the original, source-bound production-audit result.
      - name: Prepare non-executing lockfile remediation candidate
        if: ${{ steps.audit.outputs.status != '0' }}
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress > production-audit-candidate.log 2>&1
          fix_status=$?
          cp package-lock.json production-audit-candidate-lock.json
          npm audit --omit=dev --audit-level=high --json > production-audit-candidate-result.json
          candidate_status=$?
          printf 'audit_fix_exit=%s\ncandidate_audit_exit=%s\n' "$fix_status" "$candidate_status" > production-audit-candidate-status.txt

          # Refuse any proposal that edits the package manifest. No forced
          # major changes or new permissions are authorized by this workflow.
          if ! git diff --quiet -- package.json; then
            echo 'INVALID_CANDIDATE: npm changed package.json' | tee -a production-audit-candidate-status.txt
          fi
          exit 0

      - name: Upload exact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-${{ matrix.surface }}-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ matrix.directory }}/production-audit.json
            ${{ matrix.directory }}/production-audit-candidate-lock.json
            ${{ matrix.directory }}/production-audit-candidate-result.json
            ${{ matrix.directory }}/production-audit-candidate-status.txt
            ${{ matrix.directory }}/production-audit-candidate.log
          if-no-files-found: error
          retention-days: 90

      - name: Fail on high or critical production vulnerability
        if: ${{ steps.audit.outputs.status != '0' }}
        run: exit 1
