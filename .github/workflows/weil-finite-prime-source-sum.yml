name: Weil Finite Prime Source Sum

on:
  pull_request:
    paths:
      - "sovereign-omega-v2/formal/tests/Weil/FinitePrimeSourceSumSpec.v"
      - "sovereign-omega-v2/formal/theories/Weil/FinitePrimeSourceSum.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimePowerWeightBridge.v"
      - "sovereign-omega-v2/formal/theories/Weil/PrimeSourceDerivativeConstructive.v"
      - ".github/workflows/weil-finite-prime-source-sum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weil-finite-prime-source-sum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ADMISSION_PARENT_SHA: 41bc7e65d8ec8737cf32352ea60a878411e49f6c

jobs:
  attest-red:
    name: coqc / validated finite prime-source sum RED checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare writable evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sovereign-omega-v2/weil-finite-prime-source-sum-attestation
          chmod -R a+rwX \
            sovereign-omega-v2/formal/theories/Weil \
            sovereign-omega-v2/formal/tests/Weil \
            sovereign-omega-v2/weil-finite-prime-source-sum-attestation

      - name: Validate parent chain and RED failure boundary
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            set -euo pipefail
            ROOT="$PWD/sovereign-omega-v2"
            THEORY="$ROOT/formal/theories/Weil"
            TESTDIR="$ROOT/formal/tests/Weil"
            DERIV="$THEORY/PrimeSourceDerivativeConstructive.v"
            BRIDGE="$THEORY/PrimePowerWeightBridge.v"
            SOURCE="$THEORY/FinitePrimeSourceSum.v"
            TEST="$TESTDIR/FinitePrimeSourceSumSpec.v"
            OUT="$ROOT/weil-finite-prime-source-sum-attestation"

            coqc --version | tee "$OUT/coq-version.txt"
            opam install -y coq-corn.9.0.0
            opam var coq-corn:version | tee "$OUT/corn-version.txt"
            test "$(tr -d '[:space:]' < "$OUT/corn-version.txt")" = "9.0.0"
            opam show coq-corn.9.0.0 --field=version,license,depends \
              | tee "$OUT/corn-package-metadata.txt"

            test -f "$DERIV"
            test -f "$BRIDGE"
            test -f "$TEST"

            coqc -Q "$THEORY" "" "$DERIV" 2>&1 \
              | tee "$OUT/prime-source-derivative.log"
            coqc -Q "$THEORY" "" "$BRIDGE" 2>&1 \
              | tee "$OUT/prime-power-weight-bridge.log"

            if test -f "$SOURCE"; then
              echo 'RED checkpoint invalid: FinitePrimeSourceSum.v already exists.' >&2
              echo 'Transition the harness to an explicit GREEN theorem contract.' >&2
              exit 1
            fi

            set +e
            coqc -Q "$THEORY" "" -Q "$TESTDIR" "" "$TEST" \
              > "$OUT/finite-prime-source-sum-spec.log" 2>&1
            rc=$?
            set -e
            cat "$OUT/finite-prime-source-sum-spec.log"

            if test "$rc" -eq 0; then
              echo 'RED contract unexpectedly compiled without production source.' >&2
              exit 1
            fi

            error_count="$(grep -c '^Error:' "$OUT/finite-prime-source-sum-spec.log" || true)"
            if test "$error_count" -ne 1; then
              echo "Expected exactly one Coq Error line; observed $error_count." >&2
              exit 1
            fi

            normalized="$(
              tr '\n' ' ' < "$OUT/finite-prime-source-sum-spec.log" \
                | sed -E 's/[[:space:]]+/ /g'
            )"
            expected='Error: Cannot find a physical path bound to logical path FinitePrimeSourceSum.'
            if ! printf '%s\n' "$normalized" | grep -Fq "$expected"; then
              echo 'RED failure was not the exact FinitePrimeSourceSum module-resolution error.' >&2
              exit 1
            fi

            cat > "$OUT/red-checkpoint.txt" <<'EOF'
            RED_CHECKPOINT_VERIFIED=true
            PRODUCTION_SOURCE_PRESENT=false
            EXPECTED_FAILURE_KIND=MISSING_LOGICAL_MODULE
            EXPECTED_MISSING_MODULE=FinitePrimeSourceSum
            ERROR_CARDINALITY=1
            FINITE_PRIME_SOURCE_SUM_MACHINE_BOUND=false
            EOF

      - name: Emit content-addressed RED receipt
        working-directory: sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          out = Path('weil-finite-prime-source-sum-attestation')
          theory = Path('formal/theories/Weil')
          test = Path('formal/tests/Weil/FinitePrimeSourceSumSpec.v')
          derivative = theory / 'PrimeSourceDerivativeConstructive.v'
          bridge = theory / 'PrimePowerWeightBridge.v'
          source = theory / 'FinitePrimeSourceSum.v'
          red_log = out / 'finite-prime-source-sum-spec.log'

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          version = (out / 'corn-version.txt').read_text(encoding='utf-8').strip()
          checkpoint = (out / 'red-checkpoint.txt').read_text(encoding='utf-8')
          error_cardinality = sum(
              1
              for line in red_log.read_text(encoding='utf-8').splitlines()
              if line.startswith('Error:')
          )

          payload = {
              'receipt_kind': 'AEGIS_WEIL_FINITE_PRIME_SOURCE_SUM_RED_RECEIPT_V1',
              'authority': 'FORMAL_TEST_HARNESS_EVIDENCE_ONLY',
              'source_commit': '${{ env.SOURCE_SHA }}',
              'admission_parent_commit': '${{ env.ADMISSION_PARENT_SHA }}',
              'coq_version_sha256': sha(out / 'coq-version.txt'),
              'corn_requested_version': '9.0.0',
              'corn_installed_version': version,
              'corn_package_metadata_sha256': sha(out / 'corn-package-metadata.txt'),
              'derivative_source_sha256': sha(derivative),
              'weight_bridge_source_sha256': sha(bridge),
              'red_spec_sha256': sha(test),
              'derivative_compile_log_sha256': sha(out / 'prime-source-derivative.log'),
              'weight_bridge_compile_log_sha256': sha(out / 'prime-power-weight-bridge.log'),
              'red_compile_log_sha256': sha(red_log),
              'red_checkpoint_sha256': sha(out / 'red-checkpoint.txt'),
              'parent_derivative_compile_passed': True,
              'parent_weight_bridge_compile_passed': True,
              'production_source_present': source.exists(),
              'red_checkpoint_verified': 'RED_CHECKPOINT_VERIFIED=true' in checkpoint,
              'expected_failure_kind': 'MISSING_LOGICAL_MODULE',
              'expected_missing_module': 'FinitePrimeSourceSum',
              'error_cardinality': error_cardinality,
              'finite_prime_source_sum_machine_bound': False,
              'corn_o0_trig_transport_machine_bound': False,
              'guinand_weil_explicit_formula_machine_bound': False,
              'formula_to_weil_operator_identity_proven': False,
              'global_weil_positivity_proven': False,
              'rh_proven': False,
              'open_obligations': [
                  'FINITE_PRIME_SOURCE_SUM_NOT_MACHINE_BOUND',
                  'CORN_IR_TO_O0_TRIG_TRANSPORT_NOT_MACHINE_BOUND',
                  'GUINAND_WEIL_EXPLICIT_FORMULA_NOT_MACHINE_BOUND',
                  'FORMULA_TO_WEIL_OPERATOR_IDENTITY_NOT_MACHINE_BOUND',
                  'GLOBAL_WEIL_POSITIVITY_NOT_PROVEN',
              ],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          target = out / 'weil-finite-prime-source-sum-red-receipt.json'
          target.write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))

          assert version == '9.0.0'
          assert payload['admission_parent_commit'] == '41bc7e65d8ec8737cf32352ea60a878411e49f6c'
          assert payload['parent_derivative_compile_passed'] is True
          assert payload['parent_weight_bridge_compile_passed'] is True
          assert payload['production_source_present'] is False
          assert payload['red_checkpoint_verified'] is True
          assert payload['error_cardinality'] == 1
          assert payload['finite_prime_source_sum_machine_bound'] is False
          assert payload['global_weil_positivity_proven'] is False
          assert payload['rh_proven'] is False
          assert len(payload['receipt_sha256']) == 64
          PY

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-finite-prime-source-sum-red-${{ env.SOURCE_SHA }}
          path: sovereign-omega-v2/weil-finite-prime-source-sum-attestation/
          if-no-files-found: warn
          retention-days: 30
