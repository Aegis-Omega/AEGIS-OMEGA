name: RH Zero Height Shell Mass

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroHeightShellMassV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_height_shell_mass_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_height_shell_mass_v1.py'
      - '.github/workflows/rh-zero-height-shell-mass.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: e7af2be4e5f0b1bbb1f605bbee19e919b92e5bd0
  MAJORANT_PARENT_SHA: d23cb372232f7033f33f248e30e760f3839a916f
  MAJORANT_PARENT_RECEIPT: e2b011452f646b9836b5be5bb7216514c769b745453ac049265737cc1b2e4d5a
  MAJORANT_PARENT_ARTIFACT: cdb8fc621e525153c3e58c2eaf9d33b02892635700c51b47fa35c9b2bc50c7b1
  MAJORANT_SOURCE_BLOB: 4c100d1f84188deddd1e00dc6cb8aca851fc4eea
  CRITICAL_STRIP_SHA: fb49502c3ec558e47fe62218288a3f86d5288a6e
  CRITICAL_STRIP_RECEIPT: 7431124210ac182204612e4edf5af46e11b1c30bc876fd39377ebd3251e2fd4a
  CRITICAL_STRIP_ARTIFACT: 5c3f0f25c110eb93fc14373b339cd21db95d4a5595043d38a491dbd69e0d9fe9
  CRITICAL_STRIP_SOURCE_BLOB: 8dd25b1e5bf55d902fe5b57e8572e8e564d4c983
  HEIGHT_SUMMABILITY_SOURCE_BLOB: f72516a9ee50f8b5457f4a99c55ddc296d15d8dd
  LIMIT_CONTRACT_SOURCE_BLOB: 5d0d065113d9076db4eab6cf4be7a9868eec56a4
  FINITE_SUM_SOURCE_BLOB: 94415f65ae85e1e9993916a22891ca2248d65d4d
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  FORMAL_CONJECTURES_RH_BLOB_SHA: c8d38bef385eb15661c3daf7449625b66b019b2a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  REAL_INFINITE_SUM_BLOB_SHA: 32b87fa4ac3121786c310fa7b31ef263de567d13
  FLOOR_SEMIRING_BLOB_SHA: 8af0bf21b086d4dd5ae3c92c52e6b2d5c5ae9235
  ZETA_ZEROS_BLOB_SHA: 0b8046e67ae5d1e613366e86fdf6b205eea3a6b1

jobs:
  shell-mass:
    name: pinned finite height shell mass reduction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and local formal sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightShellMassV1.lean)" = "$SOURCE_BLOB_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroMajorantSummabilityV1.lean)" = "$MAJORANT_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroCriticalStripV1.lean)" = "$CRITICAL_STRIP_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightSummabilityBridgeV1.lean)" = "$HEIGHT_SUMMABILITY_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightLimitContractV1.lean)" = "$LIMIT_CONTRACT_SOURCE_BLOB"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightFiniteSumV1.lean)" = "$FINITE_SUM_SOURCE_BLOB"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zero_height_shell_mass_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zero_height_shell_mass_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZERO_HEIGHT_SHELL_MASS_V1'
          assert m['candidate']['formal_source_git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          p = m['verified_parent_evidence']
          a = p['majorant_summability_bridge']
          assert (a['aegis_revision'], a['receipt_sha256'], a['artifact_sha256'], a['formal_source_git_blob_sha']) == (
              os.environ['MAJORANT_PARENT_SHA'], os.environ['MAJORANT_PARENT_RECEIPT'],
              os.environ['MAJORANT_PARENT_ARTIFACT'], os.environ['MAJORANT_SOURCE_BLOB'])
          c = p['critical_strip']
          assert (c['aegis_revision'], c['receipt_sha256'], c['artifact_sha256'], c['formal_source_git_blob_sha']) == (
              os.environ['CRITICAL_STRIP_SHA'], os.environ['CRITICAL_STRIP_RECEIPT'],
              os.environ['CRITICAL_STRIP_ARTIFACT'], os.environ['CRITICAL_STRIP_SOURCE_BLOB'])
          d = m['local_dependency_sources']
          assert d['height_summability_bridge_git_blob_sha'] == os.environ['HEIGHT_SUMMABILITY_SOURCE_BLOB']
          assert d['height_limit_contract_git_blob_sha'] == os.environ['LIMIT_CONTRACT_SOURCE_BLOB']
          assert d['finite_height_sum_git_blob_sha'] == os.environ['FINITE_SUM_SOURCE_BLOB']
          e = m['external_environment']
          assert e['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert e['formal_conjectures_rh_blob_sha'] == os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          blobs = {x['path']: x['git_blob_sha'] for x in m['upstream_mathlib']}
          assert blobs['Mathlib/Topology/Algebra/InfiniteSum/Real.lean'] == os.environ['REAL_INFINITE_SUM_BLOB_SHA']
          assert blobs['Mathlib/Algebra/Order/Floor/Semiring.lean'] == os.environ['FLOOR_SEMIRING_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/ZetaZeros.lean'] == os.environ['ZETA_ZEROS_BLOB_SHA']
          s = m['scope']
          for key in ('height_shell_index','height_shell_finiteness','shell_mass_definition','norm_summability_shell_equivalence','shell_mass_implies_zero_summability','shell_mass_implies_height_limit_existence'):
              assert s[key] == 'CANDIDATE'
          for key in ('actual_shell_mass_summability','shell_mass_decay_bound','weil_class_shell_mass_summability','conditional_symmetric_convergence','height_radial_equivalence','explicit_formula_theorem','critical_line_re_half','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['claim_promotion'] == 'BLOCKED'
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(git hash-object FormalConjectures/Millenium/RiemannHypothesis.lean)" = "$FORMAL_CONJECTURES_RH_BLOB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: lake exe cache get

      - name: Bind pinned shell-reduction sources
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Topology/Algebra/InfiniteSum/Real.lean)" = "$REAL_INFINITE_SUM_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Algebra/Order/Floor/Semiring.lean)" = "$FLOOR_SEMIRING_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/ZetaZeros.lean)" = "$ZETA_ZEROS_BLOB_SHA"
          grep -F 'lemma summable_partition' .lake/packages/mathlib/Mathlib/Topology/Algebra/InfiniteSum/Real.lean
          grep -F 'theorem le_ceil' .lake/packages/mathlib/Mathlib/Algebra/Order/Floor/Semiring.lean
          grep -F 'lemma IsCompact.inter_riemannZetaZeros_finite' .lake/packages/mathlib/Mathlib/NumberTheory/LSeries/ZetaZeros.lean

      - name: Compile dependency chain and shell mass reduction
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-shell-mass-lean-version.txt"
          for f in ZeroCriticalStripV1 ZeroHeightFiniteSumV1 ZeroHeightLimitContractV1 ZeroHeightSummabilityBridgeV1 ZeroMajorantSummabilityV1 ZeroHeightShellMassV1; do
            cp "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/$f.lean" "./$f.lean"
          done
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ZeroCriticalStripV1.olean ZeroCriticalStripV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-critical-strip.log"
          lake env lean -o .lake/build/lib/lean/ZeroHeightFiniteSumV1.olean ZeroHeightFiniteSumV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-finite-sum.log"
          lake env lean -o .lake/build/lib/lean/ZeroHeightLimitContractV1.olean ZeroHeightLimitContractV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-limit-contract.log"
          lake env lean -o .lake/build/lib/lean/ZeroHeightSummabilityBridgeV1.olean ZeroHeightSummabilityBridgeV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-summability-bridge.log"
          lake env lean -o .lake/build/lib/lean/ZeroMajorantSummabilityV1.olean ZeroMajorantSummabilityV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-majorant.log"
          lake env lean ZeroHeightShellMassV1.lean 2>&1 | tee "$GITHUB_WORKSPACE/zero-shell-mass.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-shell-mass.log"

      - name: Emit fail-closed shell-mass receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroHeightShellMassV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zero_height_shell_mass_v1.json')
          log = Path('zero-shell-mass.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZERO_HEIGHT_SHELL_MASS_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'majorant_parent_revision':os.environ['MAJORANT_PARENT_SHA'],
            'majorant_parent_receipt_sha256':os.environ['MAJORANT_PARENT_RECEIPT'],
            'critical_strip_revision':os.environ['CRITICAL_STRIP_SHA'],
            'critical_strip_receipt_sha256':os.environ['CRITICAL_STRIP_RECEIPT'],
            'formal_conjectures_revision':os.environ['FORMAL_CONJECTURES_SHA'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'height_shell_index':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'height_shell_finiteness':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'shell_mass_definition':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'norm_summability_shell_equivalence':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'shell_mass_implies_zero_summability':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'shell_mass_implies_height_limit_existence':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'actual_shell_mass_summability':'OPEN',
            'shell_mass_decay_bound':'OPEN',
            'weil_class_shell_mass_summability':'OPEN',
            'conditional_symmetric_convergence':'OPEN',
            'height_radial_equivalence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'critical_line_re_half':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zero-height-shell-mass-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zero-height-shell-mass-receipt.json').read_text())
          PY

      - name: Upload shell-mass evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-height-shell-mass-${{ env.SOURCE_SHA }}
          path: |
            zero-shell-mass-lean-version.txt
            zero-shell-critical-strip.log
            zero-shell-finite-sum.log
            zero-shell-limit-contract.log
            zero-shell-summability-bridge.log
            zero-shell-majorant.log
            zero-shell-mass.log
            zero-height-shell-mass-receipt.json
          if-no-files-found: error
          retention-days: 30
