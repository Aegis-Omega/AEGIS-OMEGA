name: Promote Mycorrhizal Security Hardening V1

on:
  push:
    branches:
      - hardening/mycorrhizal-structural-witness-v1
    paths:
      - .github/workflows/promote-mycorrhizal-security-hardening-v1.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: hardening/mycorrhizal-structural-witness-security-signed-v3
      BASE_SHA: 55e9e0a68067a892f3e0194d277f56595e22611c
      ARTIFACT_ID: '10481952340'
      ARTIFACT_SHA256: e3d0d338a09c7875674c517f98a83dde10147b7c09e1cce18cf31ea534cd87be
    steps:
      - name: Checkout promoter source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact #502 tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target-tree
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact zero-vulnerability candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o candidate.zip
          printf '%s  %s\n' "$ARTIFACT_SHA256" candidate.zip | sha256sum -c -
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -s candidate/package.json
          test -s candidate/package-lock.json
          test -s candidate/audit-fresh-lock.json

      - name: Validate zero-vulnerability candidate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('candidate/audit-fresh-lock.json', 'utf8'));
          if ((audit.metadata?.vulnerabilities?.total ?? -1) !== 0) {
            throw new Error('candidate audit is not zero');
          }
          const pkg = JSON.parse(fs.readFileSync('candidate/package.json', 'utf8'));
          const expected = {
            ajv: '^8.20.0',
            postcss: '^8.5.28',
            vitest: '^4.1.11',
            '@vitest/coverage-v8': '^4.1.11',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.devDependencies?.[name] !== version) {
              throw new Error(`unexpected ${name} version: ${pkg.devDependencies?.[name]}`);
            }
          }
          NODE

      - name: Precompute target-specific cognitive anchors
        working-directory: target-tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          parent_hash="$(git show origin/main:.claude.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["state_hash"])' 2>/dev/null || true)"
          if [[ ! "$parent_hash" =~ ^[0-9a-f]{64}$ ]]; then
            parent_hash="$(printf '0%.0s' {1..64})"
          fi
          python scripts/build-cognitive-manifest.py \
            --ref "$TARGET_BRANCH" \
            --parent-state-hash "$parent_hash"
          python scripts/build-cognitive-manifest.py \
            --check \
            --ref "$TARGET_BRANCH" \
            --parent-state-hash "$parent_hash"
          test -s .claude.json
          test -s skill-hashes.sha256

      - name: Atomically create branch and GitHub-signed hardening commit
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GH_TOKEN;
          const branch = process.env.TARGET_BRANCH;
          const baseSha = process.env.BASE_SHA;
          const headers = {
            authorization: `bearer ${token}`,
            accept: 'application/vnd.github+json',
            'content-type': 'application/json',
            'user-agent': 'aegis-security-hardening-promoter-v3',
          };

          const createRef = await fetch(
            'https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/git/refs',
            {
              method: 'POST',
              headers,
              body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: baseSha }),
            },
          );
          const refBody = await createRef.json();
          if (!createRef.ok) {
            console.error(JSON.stringify(refBody));
            process.exit(1);
          }
          if (refBody.object?.sha !== baseSha) {
            throw new Error(`BRANCH_SEED_MISMATCH expected=${baseSha} got=${refBody.object?.sha}`);
          }

          const additions = [
            ['candidate/package.json', 'sovereign-omega-v2/package.json'],
            ['candidate/package-lock.json', 'sovereign-omega-v2/package-lock.json'],
            ['target-tree/.claude.json', '.claude.json'],
            ['target-tree/skill-hashes.sha256', 'skill-hashes.sha256'],
          ].map(([source, path]) => ({
            path,
            contents: fs.readFileSync(source).toString('base64'),
          }));

          const query = `mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }`;
          const variables = {
            input: {
              branch: {
                repositoryNameWithOwner: 'Aegis-Omega/AEGIS-OMEGA',
                branchName: branch,
              },
              expectedHeadOid: baseSha,
              message: { headline: 'fix(security): signed zero-vulnerability dependency rebind' },
              fileChanges: { additions },
            },
          };
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers,
            body: JSON.stringify({ query, variables }),
          });
          const body = await response.json();
          if (!response.ok || body.errors || !body.data?.createCommitOnBranch?.commit?.oid) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          const oid = body.data.createCommitOnBranch.commit.oid;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `signed_sha=${oid}\n`);
          console.log(`SIGNED_HARDENING_COMMIT=${oid}`);
          console.log(`SIGNED_HARDENING_URL=${body.data.createCommitOnBranch.commit.url}`);
          NODE

      - name: Verify GitHub signature
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ steps.promote.outputs.signed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/commits/${process.env.SIGNED_SHA}`, {
            headers: {
              authorization: `bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'user-agent': 'aegis-security-hardening-promoter-v3',
            },
          });
          const body = await response.json();
          if (!response.ok) throw new Error(JSON.stringify(body));
          if (body?.commit?.verification?.verified !== true) {
            throw new Error(`SIGNED_COMMIT_NOT_VERIFIED reason=${body?.commit?.verification?.reason}`);
          }
          console.log(`SIGNATURE_VERIFIED=${body.sha}`);
          NODE

      - name: Allow manifest workflows to settle
        run: sleep 20

      - name: Fail closed on branch drift before verification
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ steps.promote.outputs.signed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${process.env.TARGET_BRANCH}`,
            { headers: {
              authorization: `bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'user-agent': 'aegis-security-hardening-promoter-v3',
            } },
          );
          const body = await response.json();
          if (!response.ok || !body?.commit?.sha) throw new Error(JSON.stringify(body));
          if (body.commit.sha !== process.env.SIGNED_SHA) {
            throw new Error(`PRE_VERIFY_HEAD_DRIFT expected=${process.env.SIGNED_SHA} live=${body.commit.sha}`);
          }
          NODE

      - name: Checkout exact signed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.promote.outputs.signed_sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact signed candidate
        working-directory: verification
        env:
          SIGNED_SHA: ${{ steps.promote.outputs.signed_sha }}
        run: test "$(git rev-parse HEAD)" = "$SIGNED_SHA"

      - name: Install signed candidate
        working-directory: verification/sovereign-omega-v2
        run: npm ci

      - name: Verify npm audit is clean
        working-directory: verification/sovereign-omega-v2
        run: npm audit --audit-level=low

      - name: Verify frozen hashes
        working-directory: verification/sovereign-omega-v2
        run: node scripts/verify-hashes.mjs

      - name: Run focused Mycorrhizal tests
        working-directory: verification/sovereign-omega-v2
        run: >-
          npx vitest run
          test/unit/mycorrhizal-contracts.test.ts
          test/unit/mycorrhizal-state.test.ts
          test/unit/mycorrhizal-routing.test.ts
          test/unit/mycorrhizal-1bna.test.ts
          test/unit/mycorrhizal-structural-witness-registry.test.ts

      - name: Run full test corpus
        working-directory: verification/sovereign-omega-v2
        run: npm run test

      - name: TypeScript strict check
        working-directory: verification/sovereign-omega-v2
        run: npm run typecheck

      - name: Production build
        working-directory: verification/sovereign-omega-v2
        run: npm run build

      - name: Fail closed on final branch drift
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ steps.promote.outputs.signed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/Aegis-Omega/AEGIS-OMEGA/branches/${process.env.TARGET_BRANCH}`,
            { headers: {
              authorization: `bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'user-agent': 'aegis-security-hardening-promoter-v3',
            } },
          );
          const body = await response.json();
          if (!response.ok || !body?.commit?.sha) throw new Error(JSON.stringify(body));
          if (body.commit.sha !== process.env.SIGNED_SHA) {
            throw new Error(`FINAL_HEAD_DRIFT expected=${process.env.SIGNED_SHA} live=${body.commit.sha}`);
          }
          console.log(`FINAL_EXACT_SIGNED_HEAD=${body.commit.sha}`);
          NODE
