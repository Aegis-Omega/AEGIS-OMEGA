name: AEGIS Universal Intelligence RH Gate

on:
  pull_request:
    paths:
      - 'harness/sdk/universal_intelligence_evidence.py'
      - 'harness/sdk/rh_obligation_gate.py'
      - 'harness/sdk/rkhs_dominance_kernel.py'
      - 'harness/sdk/weil_spectral_inertia_probe.py'
      - 'harness/sdk/weil_levy_gap_probe.py'
      - 'sovereign-omega-v2/python/tests/test_universal_intelligence_rh_gates.py'
      - 'scripts/generate_provenance_census.py'
      - 'docs/audits/provenance_census_v1.json'
      - 'research/rh/finite_to_global_counterexample.py'
      - 'research/rh/run_phi_spectral_probe.py'
      - 'research/rh/test_finite_to_global_counterexample.py'
      - 'research/rh/test_phi_spectral_probe_cli.py'
      - 'research/rh/test_rh_status_ledger.py'
      - 'research/rh/test_rkhs_dominance_kernel.py'
      - 'research/rh/test_weil_spectral_inertia_probe.py'
      - 'research/rh/proof-obligations-v1.json'
      - 'research/rh/receipts/finite_to_global_counterexample_v1.json'
      - 'research/rh/phi_spectral_probe_reference_v1.json'
      - '.github/workflows/universal-intelligence-rh.yml'
  push:
    branches:
      - integration/aegis-universal-intelligence-rh-v1
    paths:
      - 'harness/sdk/universal_intelligence_evidence.py'
      - 'harness/sdk/rh_obligation_gate.py'
      - 'harness/sdk/rkhs_dominance_kernel.py'
      - 'harness/sdk/weil_spectral_inertia_probe.py'
      - 'harness/sdk/weil_levy_gap_probe.py'
      - 'sovereign-omega-v2/python/tests/test_universal_intelligence_rh_gates.py'
      - 'scripts/generate_provenance_census.py'
      - 'docs/audits/provenance_census_v1.json'
      - 'research/rh/finite_to_global_counterexample.py'
      - 'research/rh/run_phi_spectral_probe.py'
      - 'research/rh/test_finite_to_global_counterexample.py'
      - 'research/rh/test_phi_spectral_probe_cli.py'
      - 'research/rh/test_rh_status_ledger.py'
      - 'research/rh/test_rkhs_dominance_kernel.py'
      - 'research/rh/test_weil_spectral_inertia_probe.py'
      - 'research/rh/proof-obligations-v1.json'
      - 'research/rh/receipts/finite_to_global_counterexample_v1.json'
      - 'research/rh/phi_spectral_probe_reference_v1.json'
      - '.github/workflows/universal-intelligence-rh.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install 'pytest==8.4.1' 'numpy==2.3.2' 'scipy==1.16.1'

      - name: Compile gates
        run: |
          python -m py_compile \
            harness/sdk/universal_intelligence_evidence.py \
            harness/sdk/rh_obligation_gate.py \
            harness/sdk/rkhs_dominance_kernel.py \
            harness/sdk/weil_spectral_inertia_probe.py \
            harness/sdk/weil_levy_gap_probe.py \
            research/rh/finite_to_global_counterexample.py \
            scripts/generate_provenance_census.py

      - name: Run fail-closed falsifiers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            sovereign-omega-v2/python/tests/test_universal_intelligence_rh_gates.py \
            research/rh/test_finite_to_global_counterexample.py \
            research/rh/test_phi_spectral_probe_cli.py \
            research/rh/test_rh_status_ledger.py \
            research/rh/test_rkhs_dominance_kernel.py \
            research/rh/test_weil_spectral_inertia_probe.py

      - name: Run canonical phi spectral replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python research/rh/run_phi_spectral_probe.py --output /tmp/phi-spectral-probe.json
          cat /tmp/phi-spectral-probe.json

      - name: Verify deterministic refutation receipt
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from research.rh.finite_to_global_counterexample import build_refutation_receipt
          expected = build_refutation_receipt()
          actual = json.load(open('research/rh/receipts/finite_to_global_counterexample_v1.json', encoding='utf-8'))
          assert actual == expected
          assert actual['receipt_sha256'] == '646b5b0a9f6dfa48b310562bfefd750b065fce56bd6e36cc62c11b46506d09a3'
          assert actual['rh_proven'] is False
          print('FTG_REFUTATION_RECEIPT_PASS')
          PY

      - name: Regenerate live branch census
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_provenance_census.py --output /tmp/provenance_census_v1.json

      - name: Assert census invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/provenance_census_v1.json'))
          s=p['census_summary']
          assert s['total_remote_heads'] == 150
          assert s['live_remote_heads_total'] == 153
          assert s['open_prs_total'] == 95
          assert s['open_prs_draft'] == 73
          assert s['open_prs_nondraft'] == 22
          assert s['live_open_prs_total'] == 96
          assert s['live_open_prs_draft'] == 74
          assert s['live_open_prs_nondraft'] == 22
          assert len(p['remote_heads']) == 150
          assert p['integration_head']['name'] == 'integration/aegis-universal-intelligence-rh-v1'
          assert p['integration_pr']['number'] == 342
          assert {x['name'] for x in p['post_baseline_heads']} == {
              'integration/aegis-universal-intelligence-rh-v1',
              'research/phi-finite-section-congruence-v1',
              'research/weil-levy-gap-v1',
          }
          assert {x['number'] for x in p['post_baseline_prs']} == {342}
          assert p['critical_dispositions']['PR_344']['disposition'] == 'CLOSED_SUPERSEDED_BY_CURRENT_BASE'
          assert p['critical_dispositions']['PR_345']['disposition'] == 'CLOSED_VERIFIED_SUPERSEDED_BY_INTEGRATION'
          assert p['critical_dispositions']['PR_345']['exact_head'] == '62ccb4318100d6618a5a242983fa753dd7ed5a18'
          assert p['critical_dispositions']['PR_345']['authority'] == 'T1_NUMERICAL_DIAGNOSTIC_ONLY'
          assert p['authority_boundary']['model_output_can_mint_authority'] is False
          print('CENSUS_PASS baseline=150/95 live=153/96 levy_research_verified_and_closed=345')
          PY

      - name: Confirm RH remains fail-closed from machine ledger
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from harness.sdk.rh_obligation_gate import RHObligationLedger
          ledger = RHObligationLedger.from_json_file('research/rh/proof-obligations-v1.json')
          result = ledger.verify_final_closure()
          assert result['verdict'] == 'RH_NOT_PROVEN'
          assert result['gate_status'] == 'FAIL_CLOSED'
          assert result['open_obligations']
          print('RH_MACHINE_LEDGER_BOUNDARY_PASS')
          PY
