name: Proof Trace SDK

on:
  pull_request:
    paths:
      - "harness/sdk/proof_trace.py"
      - "docs/TRACE_SDK_CONTRACT.md"
      - "sovereign-omega-v2/python/tests/test_proof_trace_sdk.py"
      - ".github/workflows/proof-trace-sdk.yml"
      - "harness/sdk/transition_receipts.py"
      - "harness/sdk/effect_verifier.py"
      - "harness/sdk/atomic_admission.py"
      - "harness/sdk/collective_memory.py"
      - "harness/sdk/weekly_research_falsifiers.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-trace-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  proof-trace:
    name: aegis / proof-trace-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Assert exact candidate head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Compile proof trace contract
        run: python -m py_compile harness/sdk/proof_trace.py sovereign-omega-v2/python/tests/test_proof_trace_sdk.py

      - name: Run proof trace falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_proof_trace_sdk.py

      - name: Re-run weekly research boundary falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_weekly_research_falsifiers.py

      - name: Re-run receipt separation falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py

      - name: Re-run effect verifier falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_effect_verifier_pr3.py

      - name: Re-run atomic admission falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py

      - name: Re-run collective memory falsifiers
        run: pytest -q sovereign-omega-v2/python/tests/test_uci6_collective_memory.py
