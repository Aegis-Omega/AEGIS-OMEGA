name: Cognitive Manifest Refresh

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-manifest-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: aegis / cognitive-manifest-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve current main parent state
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          parent_hash="$(git show origin/main:.claude.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["state_hash"])' 2>/dev/null || true)"
          if [[ ! "$parent_hash" =~ ^[0-9a-f]{64}$ ]]; then
            parent_hash="$(printf '0%.0s' {1..64})"
          fi
          echo "state_hash=$parent_hash" >> "$GITHUB_OUTPUT"

      - name: Converge cognitive anchors locally
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-cognitive-manifest.py \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}"
          python scripts/build-cognitive-manifest.py \
            --check \
            --ref "$GITHUB_REF_NAME" \
            --parent-state-hash "${{ steps.parent.outputs.state_hash }}"

          if ! git diff --quiet -- .claude.json skill-hashes.sha256; then
            git add .claude.json skill-hashes.sha256
            git commit -m "chore(manifest): refresh cognitive-state anchors"
          else
            echo "Cognitive anchors already current."
          fi

      - name: Converge complete repository cognition corpus locally
        shell: bash
        run: |
          set -euo pipefail

          # The manifest excludes itself from the source corpus. On the first
          # ever run it is not tracked yet, so one seed commit changes only the
          # tracked-file accounting. Regenerate from that new local HEAD and
          # require a fixed point before anything is pushed.
          for pass in 1 2 3; do
            echo "repository-cognition convergence pass $pass"
            python scripts/repo_cognition.py --write

            # git diff ignores untracked files. Use status so the first-ever
            # untracked cognition manifest is treated as dirty and committed
            # before the second pass checks the post-seed fixed point.
            if [ -z "$(git status --porcelain -- .aegis/repo-cognition-v1.json)" ]; then
              echo "Repository cognition fixed point reached."
              break
            fi

            git add .aegis/repo-cognition-v1.json
            git commit -m "chore(cognition): refresh repository corpus"

            if [ "$pass" -eq 3 ]; then
              echo "REPOSITORY_KNOWLEDGE_INCOMPLETE: corpus did not converge in 3 passes" >&2
              exit 1
            fi
          done

          python scripts/repo_cognition.py --check --receipt
          test -z "$(git status --porcelain -- .aegis/repo-cognition-v1.json .claude.json skill-hashes.sha256)"

      - name: Push converged generated state once
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$remote_sha" = "$local_sha" ]; then
            echo "Generated state already current; no push required."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Emit exact generated-state receipt
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
          python scripts/repo_cognition.py --check --receipt
