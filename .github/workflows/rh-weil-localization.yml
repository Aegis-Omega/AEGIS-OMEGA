name: RH Weil Localization Algebra

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/WeilLocalizationAlgebraV1.lean'
      - 'sovereign-omega-v2/formal/proofs/WeilLocalizationDefectV1.md'
      - '.github/workflows/rh-weil-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  localization-algebra:
    name: verify exact finite-frame localization algebra
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git -C .aegis rev-parse HEAD > exact-source.log
          git rev-parse HEAD >> exact-source.log
          sha256sum lake-manifest.json >> exact-source.log
      - name: Install pinned elan and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version >> exact-source.log
      - name: Compile exact localization source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          cp .aegis/sovereign-omega-v2/formal/bridges/lean/WeilLocalizationAlgebraV1.lean .
          sha256sum WeilLocalizationAlgebraV1.lean >> exact-source.log
          lake env lean -o .lake/build/lib/lean/WeilLocalizationAlgebraV1.olean WeilLocalizationAlgebraV1.lean 2>&1 | tee localization-compile.log
      - name: Audit all six theorem dependency closures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import json, re
          names = re.findall(r'^theorem ([a-zA-Z0-9_]+)', Path('WeilLocalizationAlgebraV1.lean').read_text(), re.M)
          assert len(names) == 6, names
          assert 'weil_frame_localization_identity_v1' in names
          Path('expected-theorems.json').write_text(json.dumps(names, indent=2) + '\n')
          Path('WeilLocalizationAudit.lean').write_text('import WeilLocalizationAlgebraV1\n' + '\n'.join('#print axioms ' + name for name in names) + '\n')
          PY_SOURCE
          lake env lean WeilLocalizationAudit.lean 2>&1 | tee localization-axioms.log
          python3 - <<'PY_LOG'
          from pathlib import Path
          import json, re
          names = json.loads(Path('expected-theorems.json').read_text())
          log = Path('localization-axioms.log').read_text()
          assert 'sorryAx' not in log
          for name in names:
              match = re.search(re.escape("'" + name + "' depends on axioms: ") + r"\[([^\]]*)\]", log, re.S)
              assert match, name
              axioms = {x.strip() for x in match[1].split(',') if x.strip()}
              assert axioms <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, axioms)
          print('PASS: 6 finite-frame theorem closures; integrated_identity_formal=OPEN; RH=NOT_PROVEN; authority_effect=NONE')
          PY_LOG
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-localization-${{ env.SOURCE_SHA }}
          path: |
            exact-source.log
            WeilLocalizationAlgebraV1.lean
            WeilLocalizationAudit.lean
            expected-theorems.json
            localization-compile.log
            localization-axioms.log
          if-no-files-found: warn
          retention-days: 30
