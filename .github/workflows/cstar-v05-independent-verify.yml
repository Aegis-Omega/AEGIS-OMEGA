name: CSTAR v0.5 Independent Coq Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/cstar-v05/**'
      - '.github/workflows/cstar-v05-independent-verify.yml'

permissions:
  contents: read

jobs:
  verify-cstar-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source binding by Git blob identity and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          scope=json.loads(Path('verification/cstar-v05/verification_scope.json').read_text())
          if scope['mode'] != 'SOURCE_PR_EXACT_HEAD_GIT_BLOB_BOUND':
              raise SystemExit('FAIL_VERIFIER_MODE')
          if not scope['source_candidate_head']:
              raise SystemExit('FAIL_SOURCE_HEAD_MISSING')
          if scope['authority_effect'] != 'NONE':
              raise SystemExit('FAIL_AUTHORITY_EFFECT')
          for binding in scope['bindings']:
              path=Path(binding['verifier_path'])
              actual_sha256=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_sha256 != binding['sha256']:
                  raise SystemExit(f"FAIL_SHA256 {path} expected={binding['sha256']} actual={actual_sha256}")
              actual_blob=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              if actual_blob != binding['source_git_blob_sha']:
                  raise SystemExit(f"FAIL_GIT_BLOB {path} expected={binding['source_git_blob_sha']} actual={actual_blob}")
              print(f"PASS_SOURCE_CONTENT_ID {binding['source_path']} sha256={actual_sha256} git_blob={actual_blob}")
          print(f"CSTAR_V05_SOURCE_HEAD_CONTENT_BOUND {scope['source_repo']}@{scope['source_candidate_head']}")
          PY

      - name: Compile Coq 8.20.1 theorem candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/verification/cstar-v05"
          mkdir -p "$ROOT/artifacts"
          docker pull coqorg/coq:8.20.1
          docker run --rm \
            -v "$ROOT:/work:ro" \
            coqorg/coq:8.20.1 \
            bash -lc 'set -euo pipefail; mkdir -p /tmp/cstar-v05; cp /work/CStarTwistedGroupCohomology.v /work/CStarZ2SignPostnikov.v /tmp/cstar-v05/; cd /tmp/cstar-v05; coqc CStarTwistedGroupCohomology.v; coqc CStarZ2SignPostnikov.v; coqc --version' \
            2>&1 | tee "$ROOT/artifacts/coq_compile.log"

      - name: Emit exact-head bounded verification receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('verification/cstar-v05')
          scope=json.loads((root/'verification_scope.json').read_text())
          receipt={
            'schema':'AEGIS_CSTAR_V0_5_SOURCE_BOUND_COQ_RECEIPT_V2',
            'verifier_repository':'Aegis-Omega/AEGIS-OMEGA',
            'verifier_github_sha':os.environ['GITHUB_SHA'],
            'mode':scope['mode'],
            'source_repository':scope['source_repo'],
            'source_pr':scope['source_pr'],
            'source_candidate_head':scope['source_candidate_head'],
            'coq_version_requested':'8.20.1',
            'formal_source_sha256':{b['source_path']:b['sha256'] for b in scope['bindings']},
            'formal_source_git_blob_sha':{b['source_path']:b['source_git_blob_sha'] for b in scope['bindings']},
            'required_theorems':scope['required_theorems'],
            'decision':'FORMAL_TWISTED_INTEGER_ACTION_CORE_VERIFIED_SOURCE_HEAD_BOUND',
            'claim_promotion':'BOUNDED_TO_DECLARED_FORMAL_THEOREMS_ONLY',
            'arbitrary_abelian_group_coefficients':'OPEN_V0_6',
            'historical_trace_phase_proxy':'NOT_IDENTIFIED_WITH_POSTNIKOV_INVARIANT',
            'infinity_cstar_sheaf_equivalence':'NOT_ESTABLISHED',
            'physical_quantum_claim':'NOT_ESTABLISHED',
            'merge_authority':'NONE',
            'authority_effect':'NONE'
          }
          out=root/'artifacts'/'source_bound_formal_verification_receipt.json'
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          (root/'artifacts'/'source_bound_formal_verification_receipt.json.sha256').write_text(digest+'  source_bound_formal_verification_receipt.json\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          print('receipt_sha256='+digest)
          PY

      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cstar-v05-source-bound-${{ github.event.pull_request.head.sha }}
          path: verification/cstar-v05/artifacts/
          if-no-files-found: warn
          retention-days: 14
