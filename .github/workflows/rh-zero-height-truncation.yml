name: RH Zero Height Truncation

on:
  pull_request:
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/ZeroHeightTruncationV1.lean'
      - 'sovereign-omega-v2/formal/bridges/zero_height_truncation_v1.json'
      - 'sovereign-omega-v2/formal/tests/test_zero_height_truncation_v1.py'
      - '.github/workflows/rh-zero-height-truncation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BLOB_SHA: 0da2436be4602a9b9423a77f115ad36726f0489b
  PARENT_CRITICAL_STRIP_SHA: fb49502c3ec558e47fe62218288a3f86d5288a6e
  PARENT_CRITICAL_STRIP_RECEIPT: 7431124210ac182204612e4edf5af46e11b1c30bc876fd39377ebd3251e2fd4a
  PARENT_CRITICAL_STRIP_ARTIFACT: 5c3f0f25c110eb93fc14373b339cd21db95d4a5595043d38a491dbd69e0d9fe9
  FORMAL_CONJECTURES_SHA: 74b736b53ce688f57bad186b5dd862daaeeb708e
  FORMAL_CONJECTURES_RH_BLOB_SHA: c8d38bef385eb15661c3daf7449625b66b019b2a
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  ZETA_ZEROS_BLOB_SHA: 0b8046e67ae5d1e613366e86fdf6b205eea3a6b1
  COMPLEX_NORM_BLOB_SHA: 0898fb3ad035a87ee89ce2093780486e857cc5ff
  HURWITZ_VALUES_BLOB_SHA: 4bdfedf2cf474a721e0687852a5782f304781eb7
  NONVANISHING_BLOB_SHA: 610bd56365d49c5ffa9ebeb29e0a383c768248e2
  RIEMANN_ZETA_BLOB_SHA: 3c92195fce20df7fda41cfd823b3266f83cf3070

jobs:
  height-truncation:
    name: pinned finite height truncation carrier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Bind exact candidate and source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object sovereign-omega-v2/formal/bridges/lean/ZeroHeightTruncationV1.lean)" = "$SOURCE_BLOB_SHA"
          python3 -m unittest sovereign-omega-v2/formal/tests/test_zero_height_truncation_v1.py -v

      - name: Verify parent evidence and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('sovereign-omega-v2/formal/bridges/zero_height_truncation_v1.json').read_text())
          assert m['schema_version'] == 'AEGIS_ZERO_HEIGHT_TRUNCATION_V1'
          p = m['verified_parent_evidence']['critical_strip']
          assert (p['aegis_revision'], p['receipt_sha256'], p['artifact_sha256']) == (
              os.environ['PARENT_CRITICAL_STRIP_SHA'],
              os.environ['PARENT_CRITICAL_STRIP_RECEIPT'],
              os.environ['PARENT_CRITICAL_STRIP_ARTIFACT'])
          e = m['external_environment']
          assert e['formal_conjectures_revision'] == os.environ['FORMAL_CONJECTURES_SHA']
          assert e['formal_conjectures_rh_blob_sha'] == os.environ['FORMAL_CONJECTURES_RH_BLOB_SHA']
          assert e['mathlib_revision'] == os.environ['MATHLIB_SHA']
          assert e['lean_toolchain'] == os.environ['LEAN_TOOLCHAIN']
          blobs = {x['path']: x['git_blob_sha'] for x in m['upstream_mathlib']}
          assert blobs['Mathlib/NumberTheory/LSeries/ZetaZeros.lean'] == os.environ['ZETA_ZEROS_BLOB_SHA']
          assert blobs['Mathlib/Analysis/Complex/Norm.lean'] == os.environ['COMPLEX_NORM_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/HurwitzZetaValues.lean'] == os.environ['HURWITZ_VALUES_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/Nonvanishing.lean'] == os.environ['NONVANISHING_BLOB_SHA']
          assert blobs['Mathlib/NumberTheory/LSeries/RiemannZeta.lean'] == os.environ['RIEMANN_ZETA_BLOB_SHA']
          assert m['formal_source']['git_blob_sha'] == os.environ['SOURCE_BLOB_SHA']
          s = m['scope']
          assert s['finite_height_truncation_carrier'] == 'CANDIDATE'
          for key in ('height_limit_existence','height_radial_equivalence','zero_sum_convergence','explicit_formula_theorem','critical_line_re_half','weil_criterion_bridge','rh_equivalence'):
              assert s[key] == 'OPEN'
          assert m['promotion_requested'] is False
          assert m['declared_disposition']['claim_promotion'] == 'BLOCKED'
          assert m['declared_disposition']['merge'] == 'NOT_PERFORMED'
          assert m['declared_disposition']['authority_effect'] == 'NONE'
          PY

      - name: Checkout pinned Formal Conjectures project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          path: .external/formal-conjectures
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pins
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(git hash-object FormalConjectures/Millenium/RiemannHypothesis.lean)" = "$FORMAL_CONJECTURES_RH_BLOB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('lake-manifest.json').read_text())
          p = next(x for x in m['packages'] if x['name'] == 'mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get pinned Mathlib cache
        working-directory: .external/formal-conjectures
        shell: bash
        run: lake exe cache get

      - name: Bind pinned Mathlib sources
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/ZetaZeros.lean)" = "$ZETA_ZEROS_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/Analysis/Complex/Norm.lean)" = "$COMPLEX_NORM_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/HurwitzZetaValues.lean)" = "$HURWITZ_VALUES_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/Nonvanishing.lean)" = "$NONVANISHING_BLOB_SHA"
          test "$(git -C .lake/packages/mathlib hash-object Mathlib/NumberTheory/LSeries/RiemannZeta.lean)" = "$RIEMANN_ZETA_BLOB_SHA"
          grep -F 'lemma IsCompact.inter_riemannZetaZeros_finite' .lake/packages/mathlib/Mathlib/NumberTheory/LSeries/ZetaZeros.lean
          grep -F 'theorem norm_le_abs_re_add_abs_im' .lake/packages/mathlib/Mathlib/Analysis/Complex/Norm.lean

      - name: Compile finite height truncation carrier
        working-directory: .external/formal-conjectures
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$GITHUB_WORKSPACE/zero-height-truncation-lean-version.txt"
          lake env lean "$GITHUB_WORKSPACE/sovereign-omega-v2/formal/bridges/lean/ZeroHeightTruncationV1.lean" 2>&1 | tee "$GITHUB_WORKSPACE/zero-height-truncation-lean.log"
          ! grep -F 'sorryAx' "$GITHUB_WORKSPACE/zero-height-truncation-lean.log"

      - name: Emit fail-closed height-truncation receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('sovereign-omega-v2/formal/bridges/lean/ZeroHeightTruncationV1.lean')
          manifest = Path('sovereign-omega-v2/formal/bridges/zero_height_truncation_v1.json')
          log = Path('zero-height-truncation-lean.log').read_text()
          assert 'sorryAx' not in log
          receipt = {
            'schema_version':'AEGIS_ZERO_HEIGHT_TRUNCATION_RECEIPT_V1',
            'source_commit':os.environ['SOURCE_SHA'],
            'formal_source_git_blob_sha':os.environ['SOURCE_BLOB_SHA'],
            'formal_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'parent_critical_strip_revision':os.environ['PARENT_CRITICAL_STRIP_SHA'],
            'parent_critical_strip_receipt_sha256':os.environ['PARENT_CRITICAL_STRIP_RECEIPT'],
            'formal_conjectures_revision':os.environ['FORMAL_CONJECTURES_SHA'],
            'mathlib_revision':os.environ['MATHLIB_SHA'],
            'lean_toolchain':os.environ['LEAN_TOOLCHAIN'],
            'finite_height_truncation_carrier':'VERIFIED_WITHIN_DECLARED_SCOPE',
            'height_limit_existence':'OPEN',
            'height_radial_equivalence':'OPEN',
            'zero_sum_convergence':'OPEN',
            'explicit_formula_theorem':'OPEN',
            'critical_line_re_half':'OPEN',
            'weil_criterion_bridge':'OPEN',
            'rh_equivalence':'OPEN',
            'rh_proved':False,
            'rh_disproved':False,
            'claim_promotion':'BLOCKED',
            'decision':'HOLD_RESEARCH_ONLY',
            'merge':'NOT_PERFORMED',
            'authority_effect':'NONE'
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('zero-height-truncation-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          print(Path('zero-height-truncation-receipt.json').read_text())
          PY

      - name: Upload height-truncation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rh-zero-height-truncation-${{ env.SOURCE_SHA }}
          path: |
            zero-height-truncation-lean-version.txt
            zero-height-truncation-lean.log
            zero-height-truncation-receipt.json
          if-no-files-found: error
          retention-days: 30
