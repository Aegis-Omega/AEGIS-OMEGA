name: QuantumManifold Phase 1

on:
  pull_request:
    branches:
      - feat/qm-scheduler-v0.1-impl
    paths:
      - "configs/scheduler_policy_v1.json"
      - "agents/quantummanifold/**"
      - "sovereign-omega-v2/python/tests/test_quantummanifold_*.py"
      - "sovereign-omega-v2/src/core/canonicalize.ts"
      - "sovereign-omega-v2/test/unit/jcs.test.ts"
      - "sovereign-omega-v2/src/quantummanifold/**"
      - "sovereign-omega-v2/test/unit/quantummanifold-*.test.ts"
      - "aegis-cl-psi/tests/quantummanifold_*.rs"
      - ".github/workflows/quantummanifold-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantummanifold-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qm-red-anchor:
    name: aegis / qm-red-anchor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run QM-RED-001 anchor
        run: pytest -q sovereign-omega-v2/python/tests/test_quantummanifold_red_contract.py::test_qm_red_001_scheduler_production_module_exists
