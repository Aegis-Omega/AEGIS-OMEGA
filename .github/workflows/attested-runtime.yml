name: AEGIS Attested Runtime Binding

on:
  pull_request:
    paths:
      - "harness/sdk/attested_runtime.py"
      - "harness/sdk/runtime_pop_authority.py"
      - "harness/sdk/authority_client.py"
      - "scripts/automaton3-authority.py"
      - "sovereign-omega-v2/python/tests/test_attested_runtime_binding.py"
      - "sovereign-omega-v2/python/tests/test_runtime_pop_crypto.py"
      - "sovereign-omega-v2/python/tests/test_runtime_pop_authority_binding.py"
      - ".github/workflows/attested-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attested-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact cryptographic dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0

      - name: Run inherited RuntimePoP regressions
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_runtime_pop_crypto.py
          python sovereign-omega-v2/python/tests/test_runtime_pop_authority_binding.py

      - name: Run attested runtime falsifiers
        run: python sovereign-omega-v2/python/tests/test_attested_runtime_binding.py
