name: RH Window 7-over-32 Exact-Head Replay

on:
  push:
    branches:
      - 'proof/rh-window-nine-over-64-globalization-v14'
    paths:
      - 'sovereign-omega-v2/formal/bridges/lean/RHHalfCapV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHThreeCellV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHHalfCapGainV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHThresholdGainV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHBonusGainV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHThreeCellGainV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHThresholdClassV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHThreeCellClassV13.lean'
      - 'sovereign-omega-v2/formal/bridges/lean/RHWindowSevenOver32V1.lean'
      - '.github/workflows/rh-window-seven-over32-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474

jobs:
  exact-head:
    name: compile source-exact 7/32 and audit axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout candidate at event HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ github.sha }}
          path: .aegis
          persist-credentials: false
          fetch-depth: 1
      - name: Assert toolchain and SHA bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          root=".aegis/sovereign-omega-v2/formal/bridges/lean"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/RHWindowSevenOver32V1.lean)" = "83c8682c8c98cd43a7caf8b63cd859c48e05748e"
          mkdir -p evidence .lake/build/lib/lean
          printf 'HEAD=%s\nMATHLIB=%s\nLEAN=%s\nWINDOW=7/32\n' "$GITHUB_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" > evidence/provenance.txt
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.txt
      - name: Extract existing exact dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          base=Path('.aegis/sovereign-omega-v2/formal/bridges/lean')
          files={p.stem:p for p in base.glob('*.lean')}
          expected={
            'RHHalfCapV13':'802bd2f1112d4a0b727417738eb77422d2dd579a',
            'RHThreeCellV13':'a17c5b8a76d0618ed1736729ab63243e6486cece',
            'RHHalfCapGainV13':'7c5fd4671941d61cf3be9945a22a00a0f52d10d8',
            'RHThresholdGainV13':'32e1e1dae8bd7da8f2af1e3afdbcd526460e75b1',
            'RHBonusGainV13':'566640692bab3175998271f4b94b8c3dbab992d0',
            'RHThreeCellGainV13':'03263c914df499a62cb8b7b08b53c93957694265',
            'RHThresholdClassV13':'ce80ca2afdb85d2047c82a293e0cc586524a0603',
            'RHThreeCellClassV13':'babdf3a671ea7a2cfcbacc693059ed38f11cb396',
            'RHWindowSevenOver32V1':'83c8682c8c98cd43a7caf8b63cd859c48e05748e'
          }
          for name,sha in expected.items():
            assert name in files, 'MISSING_'+name
            data=files[name].read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert actual==sha, 'SHA_MISMATCH_'+name
          imports={}
          for name,p in files.items():
            deps=[]
            for line in p.read_text().splitlines():
              if re.match(r'^\s*import\s+',line):
                deps += [n.split('.')[-1] for n in line.strip().split()[1:] if n.split('.')[-1] in files]
            imports[name]=deps
          active=set();seen=set();order=[]
          def visit(name):
            if name in seen:return
            if name in active:raise RuntimeError('IMPORT_CYCLE_'+name)
            active.add(name)
            for dep in imports[name]: visit(dep)
            active.remove(name);seen.add(name);order.append(name)
          visit('RHWindowSevenOver32V1')
          Path('evidence/ordered-modules.txt').write_text('\n'.join(order)+'\n')
          for name in order:
            data=files[name].read_bytes()
            Path(name+'.lean').write_bytes(data)
          print('EXACT_BLOB_BINDING=PASS; dependency closure modules='+str(len(order)))
          PY
      - name: Compile source-exact modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence/$m.log"
          done < evidence/ordered-modules.txt
      - name: Print and restrict proof axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > ProofAudit.lean <<'LEAN'
          import RHWindowSevenOver32V1
          #check AEGIS.RHWindowSevenOver32V1.window_seven_over_32_arithmetic_nonpositive_v1
          #print axioms AEGIS.RHWindowSevenOver32V1.window_seven_over_32_arithmetic_nonpositive_v1
          #print axioms AEGIS.RHWindowSevenOver32V1.window_le_seven_over_32_arithmetic_nonpositive_v1
          LEAN
          lake env lean ProofAudit.lean 2>&1 | tee evidence/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          s=Path('evidence/axioms.log').read_text()
          assert 'sorryAx' not in s and 'error:' not in s
          p=s.split('depends on axioms:')
          assert len(p)==3, 'MISSING_AXIOM_PRINT'
          for v in p[1:]:
            values=set(t.strip() for t in v.split(']',1)[0].lstrip('[').split(','))
            assert values=={'propext','Classical.choice','Quot.sound'},values
          Path('evidence/verified.txt').write_text('SOURCE_EXACT_KERNEL_PASS\nAXIOMS_STANDARD_ONLY\nRH_NOT_PROVED\n')
          PY
      - name: Record mathematical boundary
        if: always()
        shell: bash
        run: |
          printf 'HEAD=%s\nWINDOW_7_OVER_32=REPLAY_REQUIRED\nUNIVERSAL_ZERO_QUADRATIC=OPEN\nRIEMANN_HYPOTHESIS=NOT_PROMOTED\nAUTHORITY_EFFECT=NONE\n' "$GITHUB_SHA" > evidence/BOUNDARY.txt
      - name: Upload provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-window-seven-over32-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
